<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="assets/js/core/page-shell.js"></script>
<script>UT.PageShell.renderBase();</script>
<script src="assets/js/renderers/scene-bg.js" data-auto data-preset="soft" data-image="assets/images/background/lobby-kastel.webp" data-lights="lobby"></script>
<title>Lobby</title><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any"><link rel="stylesheet" id="ut-vt" href="assets/css/pages/lobby-2.css"><link rel="stylesheet" href="assets/components/tile-button/tile-button.css"><link rel="stylesheet" href="assets/components/collapse-button/collapse-button.css"><link rel="stylesheet" href="assets/css/pages/lobby-legacy.css"><link rel="stylesheet" href="assets/css/pages/lobby.css"><link rel="stylesheet" href="assets/css/scene-bg.css"><link rel="stylesheet" href="assets/components/modal/modal-kit.css">


</head>
<body>
<canvas id="gl3d" aria-label="Karakter pemain di atas pulau voxel"></canvas>
<div id="wrap">
<div id="stage">

  <!-- ===== profil kiri atas: foto (rata kiri dengan tombol kiri, tanpa frame); nama, di bawahnya Shield level + bar progres level (emerald) ===== -->
  <div id="profile" data-act="profil" role="button" aria-label="Profil">
    <div id="pbar"><span id="ht-name" aria-hidden="true"></span><div id="pxrow"><div id="lvl" aria-label="Level"><svg viewBox="0 0 64 74" aria-hidden="true"><defs><linearGradient id="lvg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#2a63d6"/></linearGradient></defs><path d="M32 3 L59 12 V37 C59 55 46 67 32 72 C18 67 5 55 5 37 V12 Z" fill="url(#lvg)" stroke="#ffd45a" stroke-width="4" stroke-linejoin="round"/><path d="M32 10 L53 17 V37 C53 51 43 60 32 65 C21 60 11 51 11 37 V17 Z" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/></svg><b class="t-title" id="lvnum">1</b></div><span id="ht-xp" role="progressbar" aria-label="Progres level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="ht-xpf"></i></span></div></div>
    <div id="avatar"><span id="ava"></span></div><img id="avf" alt="" draggable="false">
    <span class="nbadge" hidden id="profDot"><img src="assets/images/ui/missions/lencana-notifikasi-merah-segi-delapan.webp" alt=""><b></b></span>
  </div>

  <!-- ===== kiri: Pet (tepat di bawah profil), Dadu + Aura di bawah Pet, Guild (tengah-bawah); Chest dihapus sementara ===== -->
  <button class="lbt sm ut-tile ut-tile-k" id="b-pet" data-act="pet" aria-label="Pet"><div class="ico"><img src="assets/images/ui/lobby/pet.webp" alt=""></div><div class="lb">PET</div></button>
  <button class="lbt sm ut-tile ut-tile-k" id="b-dice" data-act="dadu" aria-label="Dadu"><div class="ico"><img src="assets/images/ui/feature-icons/dadu.webp" alt=""></div><div class="lb">DADU</div></button>
  <button class="lbt sm ut-tile ut-tile-k" id="b-aura" data-act="efek" aria-label="Aura"><div class="ico"><img src="assets/images/ui/gem-medal-icons/kristal-api.webp" alt=""></div><div class="lb">AURA</div></button>
  <button class="lbt locked ut-tile ut-tile-k" id="b-guild" data-act="guild" aria-label="Guild (terkunci)"><div class="ico"><img src="assets/images/ui/item-icons/panji-pedang.webp" alt=""></div><div class="lb">GUILD</div><img class="lk" src="assets/images/ui/white-glyphs/gembok.webp" alt=""></button>

  <!-- ===== kanan atas: Emerald, Coin, Hati (ikon + angka + tombol +) ===== -->
  <!-- Emerald & Coin = komponen bersama UT.Hud 'resource-bar' (assets/components/resource-bar); isi dibangun lewat hydrate -->
  <div id="cur-em" data-rbar="gem" data-value-id="v-em" data-act="tambang" aria-label="Emerald, buka Tambang"></div>
  <div id="cur-co" data-rbar="coin" data-value-id="v-co" data-act="beliCoin" aria-label="Coin, buka Toko"></div>
  <div class="cur" id="cur-ht" role="status" aria-label="Nyawa">
    <div class="v" id="v-ht" aria-hidden="true"></div><b id="htime" class="t-title"></b>
  </div>

  <!-- ===== kanan tengah: Shop ===== -->
  <button class="lbt ut-tile ut-tile-y" id="b-shop" data-act="toko" aria-label="Toko"><div class="ico"><img src="assets/images/ui/item-icons/toko.webp" alt=""></div><div class="lb">TOKO</div></button>

  <!-- ===== kiri bawah: Karakter, Misi, grup lipat (Tambang, Mancing, Ranking) ===== -->
  <button class="lbt ut-tile ut-tile-y" id="b-char" data-act="karakter" aria-label="Karakter"><div class="ico"><img src="assets/images/ui/item-icons/helm-ksatria.webp" alt=""></div><div class="lb">KARAKTER</div></button>
  <button class="lbt sm ut-tile ut-tile-k" id="b-misi" data-act="hadiahMisi" aria-label="Misi &amp; Hadiah"><div class="ico"><img src="assets/images/ui/item-icons/gulungan-misi.webp" alt=""></div><div class="lb">MISI</div><span class="nbadge" hidden id="questDot"><img src="assets/images/ui/missions/lencana-notifikasi-merah-segi-delapan.webp" alt=""><b></b></span></button>
  <div id="grp" class="ut-collapse ut-collapse-k flip">
    <div class="gset ut-collapse-body">
      <button class="gbtn ut-collapse-item" data-act="tambang" aria-label="Tambang"><img class="gi" src="assets/images/ui/gem-medal-icons/berlian-hijau.webp" alt=""><span class="nbadge" hidden id="mineDot"><img src="assets/images/ui/missions/lencana-notifikasi-merah-segi-delapan.webp" alt=""><b></b></span></button>
      <button class="gbtn ut-collapse-item locked" data-act="mancing" aria-label="Mancing (terkunci)"><img class="gi" src="assets/images/ui/item-icons/ikan-biru.webp" alt=""><img class="mlk" src="assets/images/ui/white-glyphs/gembok.webp" alt=""></button>
      <button class="gbtn ut-collapse-item" data-act="leaderboard" aria-label="Ranking"><img class="gi" src="assets/images/ui/item-icons/podium.webp" alt=""></button>
    </div>
    <span class="ut-collapse-div" aria-hidden="true"></span>
    <button id="grpt" class="ut-collapse-toggle" type="button" aria-label="Tutup menu" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="8,3 17,12 8,21"/><polyline points="8,3 17,12 8,21"/></svg></button>
  </div>

  <!-- ===== kanan bawah: Inventory + Battle (MULAI) ===== -->
  <button class="lbt ut-tile ut-tile-k" id="b-chest" data-act="chest" aria-label="Chest"><div class="ico"><img src="assets/images/ui/gem-medal-icons/peti-biru-gem.webp" alt=""></div><div class="lb">CHEST</div><span class="nbadge" hidden id="chestDot"><img src="assets/images/ui/missions/lencana-notifikasi-merah-segi-delapan.webp" alt=""><b></b></span></button>
  <button class="lbt ut-tile ut-tile-k" id="b-inv" data-act="inventory" aria-label="Inventory"><div class="ico"><img class="bag" src="assets/images/icon/lobby/inventory.webp" alt=""></div><div class="lb">INVENTORY</div></button>
  <button id="go" data-act="mulai" aria-label="Mulai">
    <img src="assets/images/buttons/tombol-play-lobby.webp" alt="">
    <span>MULAI!</span><i class="shc" aria-hidden="true"><b></b></i>
  </button>

  <div id="toast"></div>
  
</div>
</div>

<!-- ===== modal Chest (panel + tutup + KLAIM = CSS murni, tanpa gambar aset): timeline progres game harian (Kayu -> Silver -> Gold) + tombol KLAIM; chest hasil klaim masuk Inventory.
     Di LUAR #stage (yang di-scale): backdrop fixed menutup lebar penuh layar; kotak diskalakan lewat zoom:var(--ls). ===== -->
<div id="chestMd" hidden><div id="cbox" class="ut-mk" role="dialog" aria-modal="true" aria-labelledby="cm-t">
  <h3 id="cm-t" class="ut-mk-t">Chest Harian</h3>
  <button id="cm-x" class="ut-mk-x ut-gl ut-c-r" type="button" aria-label="Tutup"></button>
  <div id="cm-body"></div>
  <div id="cm-toast" role="status"></div>
</div></div>
<div id="fade"></div>

<script src="assets/js/core/item-registry.js"></script><script src="data/inventory/aura/nature/manifest.js"></script><script src="data/inventory/aura/stone/manifest.js"></script><script src="data/inventory/aura/flame/manifest.js"></script><script src="data/inventory/aura/frost/manifest.js"></script><script src="data/inventory/aura/electric/manifest.js"></script><script src="data/inventory/aura/emerald/manifest.js"></script><script src="data/inventory/aura/ender/manifest.js"></script><script src="data/inventory/aura/nether/manifest.js"></script><script src="data/inventory/aura/amethyst/manifest.js"></script><script src="data/inventory/aura/ocean/manifest.js"></script><script src="data/inventory/aura/solar/manifest.js"></script><script src="data/inventory/aura/shadow/manifest.js"></script><script src="data/inventory/aura/sculk/manifest.js"></script><script src="data/inventory/aura/dragon/manifest.js"></script><script src="data/inventory/aura/celestial/manifest.js"></script><script src="data/inventory/aura/index.js"></script><script src="data/inventory/character/steve/manifest.js"></script><script src="data/inventory/character/alex/manifest.js"></script><script src="data/inventory/character/creeper/manifest.js"></script><script src="data/inventory/character/zombie/manifest.js"></script><script src="data/inventory/character/skeleton/manifest.js"></script><script src="data/inventory/character/ender/manifest.js"></script><script src="data/inventory/character/index.js"></script><script src="assets/js/item-catalog.js"></script>
<script src="data/inventory/frame/_shared/js/frame-fx.js"></script>
<script src="data/inventory/character/_shared/js/character-data.js"></script>
<script src="assets/js/renderers/item-art.js"></script>
<script src="assets/js/player-data.js"></script>
<script src="assets/js/vendor/three.min.js"></script>
<script src="assets/js/floating-island.js"></script>
<script src="assets/js/renderers/blocky-character.js"></script>
<script src="assets/js/renderers/character-face.js"></script>
<script src="assets/js/renderers/aura-fx.js"></script><script src="assets/js/renderers/aura-view.js"></script>
<script src="assets/js/services/wallet-service.js"></script>
<script src="assets/js/services/hearts-service.js"></script><script src="assets/js/systems/game-dialog.js"></script><script src="assets/js/systems/update-service.js"></script><script src="assets/js/services/tos-service.js"></script>
<script src="assets/js/hearts-gate.js"></script>
<script src="assets/js/services/mail-service.js"></script>
<script src="assets/js/data/achievement-data.js"></script>
<script src="tambang-world/js/tambang-service.js"></script>
<script src="assets/js/services/appearance-service.js"></script>
<script src="assets/js/core/app.js"></script>
<script src="assets/components/ui-core.js"></script>
<script src="assets/components/plus-button/plus-button.js"></script>
<script src="assets/components/resource-bar/resource-bar.js"></script>
<script src="assets/js/core/live-sync.js"></script>
<script>UT.App.init({page:'lobby'});</script>
<script src="assets/js/core/shared-gl.js"></script>
<script src="assets/js/core/page-module.js"></script>
<script src="data/lobby/js/lobby.js"></script>
</body></html>
