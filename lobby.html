<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="assets/js/core/page-shell.js"></script>
<script>UT.PageShell.renderBase();</script>
<script src="assets/js/renderers/scene-bg.js" data-auto data-preset="soft" data-image="assets/images/background/lobby-kastel.webp" data-lights="lobby"></script>
<title>Lobby</title><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any"><link rel="stylesheet" id="ut-vt" href="assets/css/pages/lobby-2.css"><link rel="stylesheet" href="assets/css/pages/lobby-legacy.css"><link rel="stylesheet" href="assets/css/pages/lobby.css"><link rel="stylesheet" href="assets/css/scene-bg.css">


</head>
<body>
<canvas id="gl3d" aria-label="Karakter pemain di atas pulau voxel"></canvas>
<div id="wrap">
<div id="stage">

  <!-- ===== profil kiri atas: frame + foto saja; level = Shield ===== -->
  <div id="profile" data-act="profil" role="button" aria-label="Profil">
    <div id="pbar" aria-hidden="true"><span id="ht-name"></span><span id="ht-id"></span></div>
    <div id="avatar"><span id="ava"></span></div><img id="avf" alt="" draggable="false">
    <div id="lvl" aria-label="Level"><svg viewBox="0 0 64 74" aria-hidden="true"><defs><linearGradient id="lvg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#2a63d6"/></linearGradient></defs><path d="M32 3 L59 12 V37 C59 55 46 67 32 72 C18 67 5 55 5 37 V12 Z" fill="url(#lvg)" stroke="#ffd45a" stroke-width="4" stroke-linejoin="round"/><path d="M32 10 L53 17 V37 C53 51 43 60 32 65 C21 60 11 51 11 37 V17 Z" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/></svg><b class="t-title" id="lvnum">1</b></div>
    <span class="nbadge" hidden id="profDot"><img src="assets/images/ui/missions/lencana-notifikasi-merah-segi-delapan.webp" alt=""><b></b></span>
  </div>

  <!-- ===== kiri: Pet (tepat di bawah profil), Dadu + Aura di bawah Pet, Guild (tengah-bawah); Chest dihapus sementara ===== -->
  <button class="lbt sm" id="b-pet" data-act="pet" aria-label="Pet"><div class="ico"><img src="assets/images/ui/lobby/pet.webp" alt=""></div><div class="lb">PET</div></button>
  <button class="lbt sm" id="b-dice" data-act="dadu" aria-label="Dadu"><div class="ico"><img src="assets/images/ui/feature-icons/dadu.webp" alt=""></div><div class="lb">DADU</div></button>
  <button class="lbt sm" id="b-aura" data-act="efek" aria-label="Aura"><div class="ico"><img src="assets/images/ui/gem-medal-icons/kristal-api.webp" alt=""></div><div class="lb">AURA</div></button>
  <button class="lbt locked" id="b-guild" data-act="guild" aria-label="Guild (terkunci)"><div class="ico"><img src="assets/images/ui/item-icons/panji-pedang.webp" alt=""></div><div class="lb">GUILD</div><img class="lk" src="assets/images/ui/white-glyphs/gembok.webp" alt=""></button>

  <!-- ===== kanan atas: Emerald, Coin, Hati (ikon + angka + tombol +) ===== -->
  <div class="cur" id="cur-em" data-act="tambang" role="button" aria-label="Emerald, buka Tambang">
    <img src="assets/images/ui/gem-medal-icons/berlian-hijau.webp" alt=""><div class="v" id="v-em">—</div><div class="plus">+</div>
  </div>
  <div class="cur" id="cur-co" data-act="beliCoin" role="button" aria-label="Coin, buka Toko">
    <img src="assets/images/ui/hud/ikon-koin-emas.webp" alt=""><div class="v" id="v-co">—</div><div class="plus">+</div>
  </div>
  <div class="cur" id="cur-ht" role="status" aria-label="Nyawa">
    <img src="assets/images/ui/white-glyphs/hati-garis.webp" alt=""><div class="v" id="v-ht">5/5</div><b id="htime" class="t-title"></b>
  </div>

  <!-- ===== kanan tengah: Shop ===== -->
  <button class="lbt" id="b-shop" data-act="toko" aria-label="Toko"><div class="ico"><img src="assets/images/ui/item-icons/toko.webp" alt=""></div><div class="lb">TOKO</div></button>

  <!-- ===== kiri bawah: Karakter, Misi, grup lipat (Tambang, Mancing, Ranking) ===== -->
  <button class="lbt" id="b-char" data-act="karakter" aria-label="Karakter"><div class="ico"><img src="assets/images/ui/item-icons/helm-ksatria.webp" alt=""></div><div class="lb">KARAKTER</div></button>
  <button class="lbt sm" id="b-misi" data-act="hadiahMisi" aria-label="Misi &amp; Hadiah"><div class="ico"><img src="assets/images/ui/item-icons/gulungan-misi.webp" alt=""></div><div class="lb">MISI</div><span class="nbadge" hidden id="questDot"><img src="assets/images/ui/missions/lencana-notifikasi-merah-segi-delapan.webp" alt=""><b></b></span></button>
  <div id="grp">
    <div class="gset">
      <button class="gbtn" data-act="tambang" aria-label="Tambang"><img class="gi" src="assets/images/ui/gem-medal-icons/berlian-hijau.webp" alt=""><span class="lb">Tambang</span><span class="nbadge" hidden id="mineDot"><img src="assets/images/ui/missions/lencana-notifikasi-merah-segi-delapan.webp" alt=""><b></b></span></button>
      <button class="gbtn locked" data-act="mancing" aria-label="Mancing (terkunci)"><img class="gi" src="assets/images/ui/item-icons/ikan-biru.webp" alt=""><span class="lb">Mancing</span><img class="mlk" src="assets/images/ui/white-glyphs/gembok.webp" alt=""></button>
      <button class="gbtn" data-act="leaderboard" aria-label="Ranking"><img class="gi" src="assets/images/ui/item-icons/podium.webp" alt=""><span class="lb">Ranking</span></button>
    </div>
    <button id="grpt" type="button" aria-label="Tutup menu" aria-expanded="true"><img src="assets/images/ui/navigation-icons/panah-kembali.webp" alt=""></button>
  </div>

  <!-- ===== kanan bawah: Inventory + Battle (MULAI) ===== -->
  <button class="lbt" id="b-chest" data-act="chest" aria-label="Chest"><div class="ico"><img src="assets/images/ui/gem-medal-icons/peti-biru-gem.webp" alt=""></div><div class="lb">CHEST</div><span class="nbadge" hidden id="chestDot"><img src="assets/images/ui/missions/lencana-notifikasi-merah-segi-delapan.webp" alt=""><b></b></span></button>
  <button class="lbt" id="b-inv" data-act="inventory" aria-label="Inventory"><div class="ico"><img class="bag" src="assets/images/icon/lobby/inventory.webp" alt=""></div><div class="lb">INVENTORY</div></button>
  <button id="go" data-act="mulai" aria-label="Mulai">
    <img src="assets/images/buttons/tombol-play-lobby.webp" alt="">
    <span>MULAI!</span><i class="shc" aria-hidden="true"><b></b></i>
  </button>

  <div id="toast"></div>
  
</div>
</div>

<div id="fade"></div>

<script src="assets/js/core/item-registry.js"></script><script src="data/inventory/aura/nature/manifest.js"></script><script src="data/inventory/aura/stone/manifest.js"></script><script src="data/inventory/aura/flame/manifest.js"></script><script src="data/inventory/aura/frost/manifest.js"></script><script src="data/inventory/aura/electric/manifest.js"></script><script src="data/inventory/aura/emerald/manifest.js"></script><script src="data/inventory/aura/ender/manifest.js"></script><script src="data/inventory/aura/nether/manifest.js"></script><script src="data/inventory/aura/amethyst/manifest.js"></script><script src="data/inventory/aura/ocean/manifest.js"></script><script src="data/inventory/aura/solar/manifest.js"></script><script src="data/inventory/aura/shadow/manifest.js"></script><script src="data/inventory/aura/sculk/manifest.js"></script><script src="data/inventory/aura/dragon/manifest.js"></script><script src="data/inventory/aura/celestial/manifest.js"></script><script src="data/inventory/aura/index.js"></script><script src="data/inventory/character/steve/manifest.js"></script><script src="data/inventory/character/alex/manifest.js"></script><script src="data/inventory/character/creeper/manifest.js"></script><script src="data/inventory/character/zombie/manifest.js"></script><script src="data/inventory/character/skeleton/manifest.js"></script><script src="data/inventory/character/ender/manifest.js"></script><script src="data/inventory/character/index.js"></script><script src="assets/js/item-catalog.js"></script>
<script src="data/inventory/frame/_shared/js/frame-fx.js"></script>
<script src="data/inventory/character/_shared/js/character-data.js"></script>
<script src="assets/js/renderers/item-art.js"></script>
<script src="assets/js/player-data.js"></script>
<script src="assets/js/vendor/three.min.js"></script>
<script src="assets/js/floating-island.js"></script>
<script src="assets/js/renderers/blocky-character.js"></script>
<script src="assets/js/renderers/character-face.js"></script>
<script src="assets/js/renderers/aura-fx.js"></script><script src="assets/js/renderers/aura-view.js"></script>
<script src="assets/js/services/wallet-service.js"></script>
<script src="assets/js/services/hearts-service.js"></script><script src="assets/js/systems/game-dialog.js"></script><script src="assets/js/systems/update-service.js"></script><script src="assets/js/services/tos-service.js"></script>
<script src="assets/js/hearts-gate.js"></script>
<script src="assets/js/services/mail-service.js"></script>
<script src="assets/js/data/achievement-data.js"></script>
<script src="data/mining/js/mine-service.js"></script>
<script src="assets/js/services/appearance-service.js"></script>
<script src="assets/js/core/app.js"></script>
<script src="assets/components/ui-core.js"></script>
<script src="assets/js/core/live-sync.js"></script>
<script>UT.App.init({page:'lobby'});</script>
<script src="assets/js/core/shared-gl.js"></script>
<script src="assets/js/core/page-module.js"></script>
<script src="data/lobby/js/lobby.js"></script>
</body></html>
