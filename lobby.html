<style>
/* GUI baru di dragonroll: avatar = wajah karakter asli + frame yang dipakai; karakter 3D di atas pedestal */
#avatar{overflow:hidden}
#avatar #ava,#avatar #ava img{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;object-fit:cover;display:block}
#avf{position:absolute;left:12px;top:-6px;width:164px;height:164px;object-fit:contain;pointer-events:none;z-index:1}

.cur .v.bump{animation:bump .5s ease-out}

      <path d="M37 2 L70 12 V44 C70 62 54 76 37 84 C20 76 4 62 4 44 V12 Z" fill="#cfd5e3" stroke="#222a45" stroke-width="3"/>
      <path d="M37 9 L63 17 V44 C63 58 50 69 37 76 C24 69 11 58 11 44 V17 Z" fill="url(#gs)" stroke="#12285e" stroke-width="2"/>

  </div>

  <!-- ===== MAIL, LEADERBOARD, SETTINGS ===== -->
  <button class="round" id="b-mail" data-act="mail" aria-label="Mail">
    <img class="bg" src="assets/ng/komponen/tombol-dan-kontrol/tombol-rumah-abu.webp" alt=""><img class="ic" src="assets/ng/komponen/ikon-item/surat-segel.webp" alt="">
    <span class="dot sm" id="mailDot" hidden></span>
  </button>
  <button class="round" id="b-lead" data-act="leaderboard" aria-label="Leaderboard">
    <img class="bg" src="assets/ng/komponen/tombol-dan-kontrol/tombol-rumah-abu.webp" alt=""><img class="ic" src="assets/ng/komponen/ikon-item/podium.webp" alt="">
  </button>
  <button class="round" id="b-set" data-act="settings" aria-label="Pengaturan">
    <img class="bg" src="assets/ng/komponen/tombol-dan-kontrol/tombol-rumah-abu.webp" alt=""><img class="ic" src="assets/ng/komponen/ikon-item/gir.webp" alt="">
  </button>

  <!-- ===== misi harian ===== -->

    <img src="assets/ng/komponen/ikon-item/gulungan-misi.webp" alt="">
    <div><div class="q1">Misi Harian</div><div class="q2" id="q2">Buka untuk lihat progres</div></div>
    <div class="qb"><i></i></div>
  </div>

  <!-- ===== grup koleksi ===== -->
  <div class="panel" id="koleksi">
    <h3>KOLEKSI</h3>
    <button class="tile small" data-act="karakter"><div class="ico"><img src="assets/ng/komponen/ikon-item/helm-ksatria.webp" alt=""></div><div class="lb">Karakter</div></button>
    <button class="tile small" data-act="frame"><div class="ico"><img src="assets/ng/komponen/new-icon/frame.webp" alt=""></div><div class="lb">Frame</div></button>

    <button class="tile small" data-act="efek"><div class="ico"><img src="assets/ng/komponen/ikon-gem-medali/kristal-api.webp" alt=""></div><div class="lb">Efek</div></button>
    <button class="tile small" data-act="powerup"><div class="ico"><img src="assets/ng/komponen/ikon-gem-medali/petir-ungu.webp" alt=""></div><div class="lb">Power-up</div></button>
    <button class="tile small" data-act="pet"><div class="ico"><img class="glyph" src="assets/ng/komponen/glyph-putih/telapak-kaki.webp" alt=""></div><div class="lb">Pet</div></button>

    </div>

    </div>
    <div class="sidecard soon" data-act="babi" role="button">

      <img src="assets/ng/komponen/ikon-gem-medali/celengan-babi.webp" alt=""><div class="tm">Celengan<br><b>Segera hadir</b></div>

  <!-- ===== navigasi bawah ===== -->
  <div id="nav">
    <button class="tile big" data-act="toko"><div class="ico"><img src="assets/ng/komponen/ikon-item/toko.webp" alt=""></div><div class="lb">TOKO</div></button>
    <button class="tile big" data-act="teman"><div class="ico"><img class="fr" src="assets/ng/komponen/new-icon/freinds.webp" alt=""></div><div class="lb">TEMAN</div><span class="dot sm" id="friendDot" hidden></span></button>
    <button class="tile big" data-act="hadiahMisi"><div class="ico"><img src="assets/ng/komponen/ikon-item/gulungan-misi.webp" alt=""></div><div class="lb" style="font-size:22px">HADIAH &amp; MISI</div><span class="dot sm" hidden id="questDot"></span></button>
    <button class="tile big" data-act="tambang"><div class="ico"><img src="assets/ng/komponen/ikon-gem-medali/berlian-hijau.webp" alt=""></div><div class="lb">TAMBANG</div></button>
    <button class="tile big locked" data-act="guild"><div class="ico"><img src="assets/ng/komponen/ikon-item/panji-pedang.webp" alt=""></div><div class="lb">GUILD</div><img class="lk" src="assets/ng/komponen/glyph-putih/gembok.webp" alt=""></button>
  </div>

  <!-- ===== MULAI! ===== -->
  <button id="go" data-act="mulai" aria-label="Mulai">
    <img src="assets/ng/komponen/tombol-dan-kontrol/tombol-play-lobby.webp" alt="">
    <span>MULAI!</span>
  </button>

  <div id="toast"></div>
  
</div>
</div>

<div id="fade"></div>

<script>
const $=s=>document.querySelector(s),fmt=n=>Number(n).toLocaleString('id-ID');
const PD=window.PlayerData,AR=window.ItemArt;
const SET=()=>PD.settings();
const buzz=()=>{try{if(SET().vibration&&navigator.vibrate)navigator.vibrate(15)}catch(e){}};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1900)}

/* ---------- data: SEMUA dari PlayerData (single source of truth); saldo "—" sampai server membalas ---------- */
let SRV_XP=0;
function lvInfo(xp){let L=1,left=Math.max(0,Math.floor(+xp)||0);while(left>=400+100*(L-1)&&L<999){left-=400+100*(L-1);L++}return{level:L,xpIn:left,xpMax:400+100*(L-1)}}
function renderAvatar(){const fb=()=>(AR&&(AR.face(PD.equippedId('skin'))||AR.face('skin.steve')))||'';if(UT.CharacterFace)UT.CharacterFace.mount($('#ava'),fb);else $('#ava').innerHTML=fb()}
function applyFrame(){const f=window.ItemCatalog.byId(PD.equippedId('frame')),im=$('#avf');if(im)im.src=(f&&f.image)||'data/frame/frame-default.webp'}
function setNum(id,txt){const e=$(id);if(!e||e.textContent===txt)return;const had=e.textContent&&e.textContent!=='—';e.textContent=txt;if(had){e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}}
function renderCurrency(){const ok=PD.walletReady();setNum('#v-em',ok?fmt(PD.gems()):'—');setNum('#v-co',ok?fmt(PD.coins()):'—')}
function renderName(){const n=(PD.profile()&&PD.profile().name)||'Pemain';$('#nm').textContent=n;const h=$('#ht-name');if(h)h.textContent=n}
function renderXp(){const i=lvInfo(Math.max(PD.xp?PD.xp():0,SRV_XP)),pct=Math.min(100,i.xpIn/i.xpMax*100);
 $('#lvnum').textContent=i.level;$('#xptxt').textContent=fmt(i.xpIn)+' / '+fmt(i.xpMax);$('#xpfill').style.width=pct+'%';
 $('#xpnote').textContent='Butuh '+fmt(i.xpMax-i.xpIn)+' XP lagi ke Level '+Math.min(999,i.level+1);
 const l=$('#ht-lv'),p=$('#ht-pct'),f=$('#ht-fill');if(l)l.textContent=i.level;if(p)p.textContent=pct.toFixed(1)+'%';if(f)f.setAttribute('width',Math.max(0,326*pct/100))}
/* event: UI ikut berubah tanpa reload halaman */
UT.Events.on('currencyChanged',()=>{renderCurrency();renderXp()});
if(PD.subscribe)PD.subscribe(()=>{renderName();renderXp();renderCurrency()});
UT.Events.on('skinChanged',()=>{renderAvatar();buildHero()});
UT.Events.on('frameChanged',applyFrame);

/* ---------- navigasi (peta ACT) ---------- */
const ACT={profil:'profile.html',karakter:'karakter.html',frame:'frame.html',dadu:'dadu.html',efek:'efek.html',powerup:'powerup.html',leaderboard:'leaderboard.html',toko:'shop.html',beliCoin:'shop.html?coin=1',teman:'friendship.html',hadiahMisi:'hadiah-misi.html',tambang:'tambang.html?from=lobby.html',settings:'settings.html',mulai:'mode.html'};
/* halaman GUI baru yang datanya belum disambung ke server: tetap "segera hadir" */
const SOON={guild:'Guild segera hadir',babi:'Celengan segera hadir',hadiahGratis:'Hadiah gratis segera hadir',mail:'Mail segera hadir',pet:'Pet segera hadir',chest:'Chest segera hadir'};
function go(act){if(SOON[act]){toast(SOON[act]);return}const url=ACT[act];if(!url)return;const f=$('#fade');f.classList.add('on');setTimeout(()=>{location.href=url},330)}
document.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',()=>{buzz();go(el.dataset.act)}));
addEventListener('pageshow',e=>{if(e.persisted)$('#fade').classList.remove('on')});

/* ---------- skala kanvas ---------- */
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform='scale('+s+')';fit3d(s)}

/* ---- pulau voxel melayang (SVG isometrik) ---- */
const NS='http://www.w3.org/2000/svg';
const isl=document.getElementById('island');
function poly(pts,fill,extra){const p=document.createElementNS(NS,'polygon');p.setAttribute('points',pts.map(q=>q.join(',')).join(' '));p.setAttribute('fill',fill);
  p.setAttribute('stroke','rgba(20,30,10,.35)');p.setAttribute('stroke-width','2');p.setAttribute('stroke-linejoin','round');if(extra)for(const k in extra)p.setAttribute(k,extra[k]);isl.appendChild(p)}
function slab(cx,cy,w,d,c){ // cy = pusat diamond atas
  const h=w/2,N=[cx,cy-h/2],E=[cx+w/2,cy],S=[cx,cy+h/2],W=[cx-w/2,cy];
  poly([W,S,[S[0],S[1]+d],[W[0],W[1]+d]],c.l);
  poly([S,E,[E[0],E[1]+d],[S[0],S[1]+d]],c.r);
  poly([N,E,S,W],c.t);
}
const DIRT={t:'#8d6038',l:'#9b6a40',r:'#7b5230'}, STONE={t:'#7d808c',l:'#8a8d99',r:'#666975'}, DEEP={t:'#5d606c',l:'#6a6d79',r:'#4e515c'};
const GRASS={t:'#78cc4e',l:'#58a33a',r:'#478a2e'};
slab(960,872,150,70,DEEP);
slab(960,800,290,76,DEEP);
slab(960,728,430,76,STONE);
slab(960,654,560,80,DIRT);
// sisi tanah + pita rumput di atas
{const cx=960,cy=580,w=640,h=w/2,d=84,g=28;
  const W=[cx-w/2,cy],S=[cx,cy+h/2],E=[cx+w/2,cy],N=[cx,cy-h/2];
  poly([W,S,[S[0],S[1]+d],[W[0],W[1]+d]],DIRT.l);
  poly([S,E,[E[0],E[1]+d],[S[0],S[1]+d]],DIRT.r);
  poly([W,S,[S[0],S[1]+g],[W[0],W[1]+g]],GRASS.l);
  poly([S,E,[E[0],E[1]+g],[S[0],S[1]+g]],GRASS.r);
  poly([N,E,S,W],GRASS.t);
  // petak kotak-kotak di permukaan
  for(let i=1;i<8;i++){const a=i/8;
    const l=document.createElementNS(NS,'line');l.setAttribute('x1',W[0]+(N[0]-W[0])*a);l.setAttribute('y1',W[1]+(N[1]-W[1])*a);
    l.setAttribute('x2',S[0]+(E[0]-S[0])*a);l.setAttribute('y2',S[1]+(E[1]-S[1])*a);l.setAttribute('stroke','rgba(40,100,20,.22)');isl.appendChild(l);
    const m=document.createElementNS(NS,'line');m.setAttribute('x1',W[0]+(S[0]-W[0])*a);m.setAttribute('y1',W[1]+(S[1]-W[1])*a);
    m.setAttribute('x2',N[0]+(E[0]-N[0])*a);m.setAttribute('y2',N[1]+(E[1]-N[1])*a);m.setAttribute('stroke','rgba(40,100,20,.22)');isl.appendChild(m);}
}
// pohon & semak voxel (urut dari belakang ke depan)
const LEAF={t:'#4caf3a',l:'#368a2a',r:'#2b7222'}, LEAF2={t:'#5cc443',l:'#3f9a30',r:'#318028'}, WOOD={t:'#a8794a',l:'#7e5530',r:'#684526'};
function tree(x,y,s){slab(x,y,34*s,64*s,WOOD);slab(x,y-58*s,120*s,46*s,LEAF);slab(x,y-100*s,80*s,40*s,LEAF2)}
tree(830,545,1);
tree(1090,525,.85);
slab(1180,600,70,30,LEAF);
slab(760,622,56,24,LEAF2);
// batu kecil
slab(1115,650,56,26,STONE);


/* nama + level + bar XP di bawah pedestal (tidak ikut melompat) */
{const tag=document.createElementNS(NS,'g');tag.id='herotag';tag.setAttribute('pointer-events','none');
 const ty=608+96,bw=330;
 tag.innerHTML=`
 <text id="ht-name" x="960" y="${ty}" text-anchor="middle" class="svt" font-size="54"></text>
 <text id="ht-lv" x="${960-bw/2-16}" y="${ty+58}" text-anchor="end" class="svt" font-size="64">1</text>
 <text x="${960-bw/2}" y="${ty+30}" class="svb" font-size="26">Level</text>
 <text id="ht-pct" x="${960+bw/2}" y="${ty+30}" text-anchor="end" class="svb" font-size="22">0.0%</text>
 <rect x="${960-bw/2}" y="${ty+38}" width="${bw}" height="18" rx="3" fill="#1c1730" stroke="#0e0a1c" stroke-width="2"/>
 <rect id="ht-fill" x="${960-bw/2+2}" y="${ty+40}" width="0" height="14" rx="2" fill="#b9c3ff"/>`;
 isl.appendChild(tag)}
/* pedestal batu */
function cyl(cx,cy,rx,ry,h,top,side,line){
  return `<path d="M${cx-rx},${cy} v${h} a${rx},${ry} 0 0 0 ${rx*2},0 v${-h} Z" fill="${side}" stroke="${line}" stroke-width="3" stroke-linejoin="round"/>`+
         `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${top}" stroke="${line}" stroke-width="3"/>`;
}
{const FEET=608,ped=document.createElementNS(NS,'g');ped.setAttribute('transform','translate(960,0)');
 ped.innerHTML=`<ellipse cx="0" cy="${FEET+32}" rx="190" ry="36" fill="rgba(10,25,50,.28)"/>
  ${cyl(0,FEET+12,162,39,24,'#4b4370','#2f2949','#17122b')}${cyl(0,FEET+1,128,31,20,'#5d5486','#3b3459','#17122b')}${cyl(0,FEET-8,95,23,16,'#6f66a0','#463e6b','#17122b')}
  <ellipse cx="0" cy="${FEET-8}" rx="74" ry="17" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/>`;
 isl.appendChild(ped)}

/* ================= 3D: karakter ASLI pemain (UT.BlockyCharacter, sama dengan halaman Karakter) di atas pedestal =================
   Kanvas 560x560 (satuan stage), kaki di y~600. Kamera perspektif sempit ~ ortografis: 1 satuan model = 200 px. */
const cv=$('#gl3d');let G3=false,renderer=null,scene,cam,hero,bc=null,bcW=null,AUR=null,auraQ=false;
try{
 if(typeof THREE!=='undefined'&&UT.BlockyCharacter&&cv){
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});renderer.setClearColor(0x000000,0);
  scene=new THREE.Scene();scene.add(new THREE.AmbientLight(0xffffff,.8),new THREE.HemisphereLight(0xcfeaff,0x7a9a60,.55));
  const sun=new THREE.DirectionalLight(0xfff2d8,.9);sun.position.set(2,4,5);scene.add(sun);
  cam=new THREE.PerspectiveCamera(2*Math.atan(1.4/12)*180/Math.PI,1,.1,100);cam.position.set(0,1.2,12);cam.lookAt(0,1.2,0);
  hero=new THREE.Group();hero.rotation.y=-.2;scene.add(hero);G3=true;
 }
}catch(e){G3=false;renderer=null}
function fit3d(s){if(!G3)return;renderer.setPixelRatio(Math.min(2,Math.max(1,(devicePixelRatio||1)*s)));renderer.setSize(560,560,false)}
function buildHero(){if(!G3)return;if(bcW)hero.remove(bcW);bc=UT.BlockyCharacter.create(THREE);bc.loadFromPlayer();bc.tick(.016);bcW=new THREE.Group();bcW.add(bc.root);hero.add(bcW);auraQ=true}
/* Aura yang dipakai (slot 'aura', dipilih di halaman Efek) menempel ke karakter lobby; dipasang di loop setelah hero ada di scene */
function syncAura(){try{if(!(UT.AuraView&&UT.AuraFX))return;if(!AUR)AUR=UT.AuraView.create(scene,cam);scene.updateMatrixWorld(true);AUR.only(bc.root,UT.AuraView.equippedKey())}catch(e){}}
buildHero();
PD.subscribe&&PD.subscribe(r=>{if(r==='equip'||r==='pageshow'||r==='storage')buildHero();else if(r==='server-appearance'||r==='server-outfits'){renderAvatar();buildHero()}});
addEventListener('pageshow',e=>{if(e.persisted)buildHero()});

/* ---------- animasi lobby: mata berkedip otomatis; saat diam 6-13 dtk karakter beraksi sendiri, tap karakter = aksi acak ---------- */
const LOBBY_ACTS=[ /* tiap aksi = urutan [detik, fungsi] */
 [[0,()=>bc.setMode('run')],[1.5,()=>bc.act('flip')],[2.5,()=>bc.setMode('idle')]],
 [[0,()=>bc.setMode('run')],[1.3,()=>bc.jump()],[2.2,()=>bc.act('roll')],[3.1,()=>bc.setMode('idle')]],
 [[0,()=>bc.act('backflip')]],
 [[0,()=>bc.act('spin')]],
 [[0,()=>bc.act('wave')]],
 [[0,()=>bc.act('cheer')]]
];
const calmMotion=matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let lq=null,lqT=0,lqI=0,lqIdle=5+Math.random()*4,lqLast=-1;
const lobbyBusy=()=>!!lq||!!bc.acting||bc.airborne;
function lobbyRandom(){let i;do{i=Math.floor(Math.random()*LOBBY_ACTS.length)}while(i===lqLast);lqLast=i;lq=LOBBY_ACTS[i];lqT=0;lqI=0;lqIdle=6+Math.random()*7}
function lobbyStep(dt){
 if(lq){lqT+=dt;while(lqI<lq.length&&lqT>=lq[lqI][0]){lq[lqI][1]();lqI++}if(lqI>=lq.length&&!bc.acting&&!bc.airborne)lq=null;return}
 if(calmMotion||document.hidden||lobbyBusy())return;
 lqIdle-=dt;if(lqIdle<=0)lobbyRandom()}
function lobbyTap(){if(lobbyBusy())return;if(Math.random()<.25){bc.jump();lqIdle=6+Math.random()*7}else lobbyRandom();const h=$('#hint');if(h)h.style.display='none'}
cv.addEventListener('pointerdown',e=>{if(!G3)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;if(x>.25&&x<.75&&y>.08&&y<.95){lobbyTap();buzz()}});
if(G3){const clock=new THREE.Clock();let lastT=0;
 (function loop(){requestAnimationFrame(loop);if(document.hidden)return;const t=clock.getElapsedTime(),dt=Math.min(t-lastT,.05);lastT=t;
  bc.tick(dt);lobbyStep(dt);if(auraQ){auraQ=false;syncAura()}if(AUR)AUR.update(dt);renderer.render(scene,cam)})()}
else{const h=$('#hint');if(h)h.style.display='none'}

/* ---- kilau ---- */
{const st=document.getElementById('stage');
 for(let i=0;i<14;i++){const e=document.createElement('i');e.className='spark';
  e.style.left=(560+Math.random()*800)+'px';e.style.top=(300+Math.random()*520)+'px';e.style.animationDelay=(Math.random()*4)+'s';
  e.style.scale=.5+Math.random();st.insertBefore(e,document.getElementById('hint'))}}

addEventListener('resize',fit);fit();

/* ---------- init + sinkron server ---------- */
renderAvatar();if(UT.CharacterFace)UT.CharacterFace.watch(renderAvatar);applyFrame();renderName();renderCurrency();renderXp();
const SRV=!!(PD.serverMode&&PD.serverMode());
/* B5: akun login + flag -> saldo & inventory dari server */
if(SRV&&UT.WalletService&&UT.WalletService.get())UT.WalletService.get().refresh();
/* Karakter di lobi = tampilan aktif akun di SERVER, tanpa harus membuka halaman Karakter dulu (maks 1x/20 dtk). */
(function(){const A=PD.serverMode&&PD.serverMode()&&UT.AppearanceService&&UT.AppearanceService.get();if(A)A.refreshThrottled().catch(()=>{})})();
/* login harian + XP server (tanpa membuat sesi baru; gagal/offline -> tetap data lokal) */
const loadProgress=()=>import('./assets/js/multiplayer/progress-service.js').then(()=>UT.Multiplayer.Progress);
loadProgress().then(P=>P.dailyLogin&&P.dailyLogin()).catch(()=>{});
const pullXp=()=>loadProgress().then(P=>P.getMyProfile()).then(pr=>{const x=pr&&+pr.xp;if(x>0&&Math.floor(x)!==SRV_XP){SRV_XP=Math.floor(x);renderXp()}return {ok:true}}).catch(()=>({ok:false}));
pullXp();
/* titik merah Teman = ada permintaan pertemanan masuk */
const pullFriends=()=>import('./assets/js/multiplayer/room-service.js').then(()=>UT.Multiplayer.RoomService.listRequests()).then(r=>{const d=$('#friendDot');if(d)d.hidden=!(r&&r.length);return {ok:true}}).catch(()=>({ok:false}));
pullFriends();

/* ---------- LIVE: data tetap mutakhir tanpa refresh (live-sync.js: timer ~20 dtk saat tab terlihat + saat tab aktif lagi/online) ---------- */
if(SRV&&UT.LiveSync){const LS=UT.LiveSync;
 LS.add('wallet',()=>{const W=UT.WalletService&&UT.WalletService.get();return W?W.refresh():{ok:true}});
 LS.add('xp',pullXp);
 LS.add('appearance',()=>{const A=UT.AppearanceService&&UT.AppearanceService.get();return A?A.refreshThrottled().then(()=>({ok:true}),()=>({ok:false})):{ok:true}},{minGap:20000});
 LS.add('friends',pullFriends,{minGap:40000});
 LS.start({interval:20000});
}
</script>
</body></html>
