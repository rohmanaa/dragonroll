<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="assets/js/core/page-shell.js"></script>
<script>UT.PageShell.renderBase();</script>
<script src="assets/js/renderers/scene-bg.js" data-auto data-preset="soft" data-image="assets/images/background/lobby-kastel.webp" data-lights="lobby"></script>
<title>Lobby</title><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any"><link rel="stylesheet" id="ut-vt" href="assets/css/pages/lobby-2.css"><link rel="stylesheet" href="assets/css/pages/lobby-legacy.css"><link rel="stylesheet" href="assets/css/pages/lobby.css"><link rel="stylesheet" href="assets/css/scene-bg.css">


</head>
<body>
<canvas id="gl3d" aria-label="Karakter pemain di atas pulau voxel"></canvas>
<div id="wrap">
<div id="stage">

  <!-- ===== profil ===== -->
  <div id="profile" data-act="profil" role="button" aria-label="Profil">
    <img id="hudbg" src="assets/images/ui/lobby/hud-profil.webp" alt="" draggable="false">
    <div id="avatar"><span id="ava"></span></div><img id="avf" alt="" draggable="false">
    <div id="lvl" style="pointer-events:none"><b class="t-title" id="lvnum">1</b></div>
    <div id="pname" class="t-title"><span id="nm">Pemain</span><img src="assets/images/ui/language-flags/bendera-inggris.webp" alt="bendera"></div>
    <div id="xp"><div id="xpfill"></div><div id="xptxt">—</div></div>
    <div id="hearts" aria-label="Nyawa"><i id="hbk"></i><span id="hslots"></span><b id="htime" class="t-title"></b></div>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <linearGradient id="lv-hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a8a"/><stop offset=".55" stop-color="#e3263f"/><stop offset="1" stop-color="#a00f2a"/></linearGradient>
      <symbol id="lv-heart" viewBox="0 0 32 29"><path d="M16 27.5C6 20 1.5 14.6 1.5 8.9 1.5 4.6 4.8 1.5 8.9 1.5c3 0 5.5 1.7 7.1 4.4 1.6-2.7 4.1-4.4 7.1-4.4 4.1 0 7.4 3.1 7.4 7.4 0 5.7-4.5 11.1-14.5 18.6z" fill="url(#lv-hg)" stroke="#5a0615" stroke-width="2" stroke-linejoin="round"/><path d="M7.5 6.2c-2.1.6-3.2 2.4-3.2 4.3" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="lv-heart-off" viewBox="0 0 32 29"><path d="M16 27.5C6 20 1.5 14.6 1.5 8.9 1.5 4.6 4.8 1.5 8.9 1.5c3 0 5.5 1.7 7.1 4.4 1.6-2.7 4.1-4.4 7.1-4.4 4.1 0 7.4 3.1 7.4 7.4 0 5.7-4.5 11.1-14.5 18.6z" fill="#202020" stroke="#3b3b3b" stroke-width="2" stroke-linejoin="round"/></symbol>
    </defs></svg>
  </div>

  <!-- ===== Emerald & Coin ===== -->
  <div class="cur" id="cur-em" data-act="tambang" role="button" aria-label="Emerald, buka Tambang">
    <img src="assets/images/ui/gem-medal-icons/berlian-hijau.webp" alt=""><div class="v" id="v-em">—</div><div class="plus">+</div>
  </div>
  <div class="cur" id="cur-co" data-act="beliCoin" role="button" aria-label="Coin, buka Toko">
    <img src="assets/images/ui/hud/ikon-koin-emas.webp" alt=""><div class="v" id="v-co">—</div><div class="plus">+</div>
  </div>

  <!-- ===== misi harian ===== -->
  <div class="panel" id="quest" data-act="hadiahMisi" role="button">
    <img src="assets/images/ui/item-icons/gulungan-misi.webp" alt="">
    <div><div class="q1">Misi Harian</div><div class="q2" id="q2">Buka untuk lihat progres</div></div>
    <div class="qb"><i></i></div>
  </div>

  <!-- ===== menu ikon (kotak abu transparan) ===== -->
  <div id="menu">
    <button class="mbtn" data-act="leaderboard" aria-label="Ranking"><img src="assets/images/ui/item-icons/podium.webp" alt=""><span>Ranking</span></button>
    <button class="mbtn" data-act="hadiahMisi" aria-label="Misi & Hadiah"><img src="assets/images/ui/item-icons/gulungan-misi.webp" alt=""><span>Misi &amp; Hadiah</span><span class="nbadge" hidden id="questDot"><img src="assets/images/ui/missions/lencana-notifikasi-merah-segi-delapan.webp" alt=""><b></b></span></button>
    <button class="mbtn" data-act="mail" aria-label="Pesan"><img src="assets/images/ui/item-icons/surat-segel.webp" alt=""><span>Pesan</span><span class="nbadge" id="mailDot" hidden><img src="assets/images/ui/missions/lencana-notifikasi-merah-segi-delapan.webp" alt=""><b></b></span></button>
    <button class="mbtn" data-act="teman" aria-label="Teman"><img src="assets/images/ui/feature-icons/friends.webp" alt=""><span>Teman</span><span class="dot sm" id="friendDot" hidden></span></button>
    <button class="mbtn" data-act="settings" aria-label="Pengaturan"><img src="assets/images/ui/item-icons/gir.webp" alt=""><span>Pengaturan</span></button>
    <button class="mbtn" data-act="chest" aria-label="Chest"><img src="assets/images/ui/gem-medal-icons/peti-biru-gem.webp" alt=""><span>Chest</span><span class="nbadge" id="chestDot" hidden><img src="assets/images/ui/missions/lencana-notifikasi-merah-segi-delapan.webp" alt=""><b></b></span></button>
    <button class="mbtn" data-act="tambang" aria-label="Tambang"><img src="assets/images/ui/gem-medal-icons/berlian-hijau.webp" alt=""><span>Tambang</span><span class="nbadge" id="mineDot" hidden><img src="assets/images/ui/missions/lencana-notifikasi-merah-segi-delapan.webp" alt=""><b></b></span></button>
    <button class="mbtn locked" data-act="mancing" aria-label="Mancing (terkunci)"><img src="assets/images/ui/item-icons/ikan-biru.webp" alt=""><span>Mancing</span><img class="mlk" src="assets/images/ui/white-glyphs/gembok.webp" alt=""></button>
  </div>

  <!-- ===== hadiah gratis (kanan) ===== -->
  <div id="side">
    <div class="sidecard soon" data-act="hadiahGratis" role="button">
      <span class="tag sn">SOON</span>
      <img src="assets/images/ui/gem-medal-icons/televisi.webp" alt=""><div class="tm">Hadiah gratis<br><b>Segera hadir</b></div>
    </div>
    <div class="sidecard chcard" data-act="chest" role="button">
      <img id="chImg" src="assets/images/ui/chest-packs/peti-kayu.webp" alt=""><div class="tm">Chest harian</div>
      <div class="chp" id="chProg"><b id="chTx">—</b></div>
      <button class="chclaim" id="chClaim" type="button" hidden><img src="assets/images/ui/buttons-and-controls/tombol-hijau-polos.webp" alt=""><span>KLAIM</span></button>
    </div>    <div class="sidecard soon" data-act="babi" role="button">
      <span class="tag pk">FULL</span><span class="tag sn">SOON</span>
      <img src="assets/images/ui/gem-medal-icons/celengan-babi.webp" alt=""><div class="tm">Celengan<br><b>Segera hadir</b></div>
    </div>
  </div>

  <!-- ===== navigasi bawah ===== -->
  <div id="nav">
    <button class="tile big" data-act="toko"><div class="ico"><img src="assets/images/ui/item-icons/toko.webp" alt=""></div><div class="lb">TOKO</div></button>
    <button class="tile big" data-act="karakter"><div class="ico"><img src="assets/images/ui/item-icons/helm-ksatria.webp" alt=""></div><div class="lb">KARAKTER</div></button>
    <button class="tile big" data-act="inventory"><div class="ico"><img class="bag" src="assets/images/icon/lobby/inventory.webp" alt=""></div><div class="lb">INVENTORY</div></button>
        <button class="tile big locked" data-act="guild"><div class="ico"><img src="assets/images/ui/item-icons/panji-pedang.webp" alt=""></div><div class="lb">GUILD</div><img class="lk" src="assets/images/ui/white-glyphs/gembok.webp" alt=""></button>
  </div>

  <!-- ===== MULAI! ===== -->
  <button id="go" data-act="mulai" aria-label="Mulai">
    <img src="assets/images/buttons/tombol-play-lobby.webp" alt="">
    <span>MULAI!</span><i class="shc" aria-hidden="true"><b></b></i>
  </button>

  <div id="toast"></div>
  
</div>
</div>

<div id="fade"></div>

<script src="assets/js/core/item-registry.js"></script><script src="data/inventory/aura/nature/manifest.js"></script><script src="data/inventory/aura/stone/manifest.js"></script><script src="data/inventory/aura/flame/manifest.js"></script><script src="data/inventory/aura/frost/manifest.js"></script><script src="data/inventory/aura/electric/manifest.js"></script><script src="data/inventory/aura/emerald/manifest.js"></script><script src="data/inventory/aura/ender/manifest.js"></script><script src="data/inventory/aura/nether/manifest.js"></script><script src="data/inventory/aura/amethyst/manifest.js"></script><script src="data/inventory/aura/ocean/manifest.js"></script><script src="data/inventory/aura/solar/manifest.js"></script><script src="data/inventory/aura/shadow/manifest.js"></script><script src="data/inventory/aura/sculk/manifest.js"></script><script src="data/inventory/aura/dragon/manifest.js"></script><script src="data/inventory/aura/celestial/manifest.js"></script><script src="data/inventory/aura/index.js"></script><script src="data/inventory/character/steve/manifest.js"></script><script src="data/inventory/character/alex/manifest.js"></script><script src="data/inventory/character/creeper/manifest.js"></script><script src="data/inventory/character/zombie/manifest.js"></script><script src="data/inventory/character/skeleton/manifest.js"></script><script src="data/inventory/character/ender/manifest.js"></script><script src="data/inventory/character/index.js"></script><script src="assets/js/item-catalog.js"></script>
<script src="data/inventory/frame/_shared/js/frame-fx.js"></script>
<script src="data/inventory/character/_shared/js/character-data.js"></script>
<script src="assets/js/renderers/item-art.js"></script>
<script src="assets/js/player-data.js"></script>
<script src="assets/js/vendor/three.min.js"></script>
<script src="assets/js/floating-island.js"></script>
<script src="assets/js/renderers/blocky-character.js"></script>
<script src="assets/js/renderers/character-face.js"></script>
<script src="assets/js/renderers/aura-fx.js"></script><script src="assets/js/renderers/aura-view.js"></script>
<script src="assets/js/services/wallet-service.js"></script>
<script src="assets/js/services/hearts-service.js"></script>
<script src="assets/js/hearts-gate.js"></script>
<script src="assets/js/services/mail-service.js"></script>
<script src="assets/js/data/achievement-data.js"></script>
<script src="data/mining/js/mine-service.js"></script>
<script src="assets/js/services/appearance-service.js"></script>
<script src="assets/js/core/app.js"></script>
<script src="assets/components/ui-core.js"></script>
<script src="assets/js/core/live-sync.js"></script>
<script>UT.App.init({page:'lobby'});</script>
<script src="assets/js/core/shared-gl.js"></script>
<script src="assets/js/core/page-module.js"></script>
<script src="data/lobby/js/lobby.js"></script>
</body></html>
