<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script src="assets/js/core/page-shell.js"></script>
<script>UT.PageShell.renderBase();</script>
<title>Dragon Roll — Tambang</title>
<link rel="stylesheet" href="assets/components/button/button.css">
<link rel="stylesheet" href="assets/components/tabs/tabs.css">
<link rel="stylesheet" href="tambang-world/css/tambang-hud.css">
<link rel="stylesheet" href="tambang-world/css/tambang-world.css">
<link rel="stylesheet" href="tambang-world/css/tambang-coc.css">
</head>
<body>
<div id="tambang-wrap"><div id="tambang-stage" data-layer="0">
  <canvas id="tambang-gl"></canvas>
  <div id="tambang-lock" aria-hidden="true"><img src="tambang-world/images/tambang-gembok-besar.webp" alt=""><b id="tambang-lock-t">TAMBANG 1</b><span>Terkunci · buka untuk melihat isinya</span><button class="ut-gl ut-c-y tambang-btn" id="tambang-lock-btn"><img src="tambang-world/images/tambang-tombol-kuning-polos.webp" alt=""><span>BUKA</span></button></div>
  <div class="tambang-scrim"></div><div class="tambang-scrim b"></div>
  <button id="tambang-back" aria-label="Kembali"><img src="tambang-world/images/tambang-panah-kembali.webp" alt=""></button>
  <div id="tambang-title" class="tambang-ttl">Tambang</div>
  <div id="tambang-sum"></div>
  <nav id="tambang-nav" aria-label="Layer tambang">
    <button class="tambang-arr up" id="tambang-up" aria-label="Layer atas"><img src="tambang-world/images/tambang-panah-kembali.webp" alt=""></button>
    <button class="ut-tabv tambang-tile" data-i="0" aria-label="Base Camp"><img src="tambang-world/images/tambang-tile-stage-biasa.webp" alt=""><span>B</span></button>
    <button class="ut-tabv tambang-tile" data-i="1" aria-label="Mine 1"><img src="tambang-world/images/tambang-tile-stage-biasa.webp" alt=""><span>1</span></button>
    <button class="ut-tabv tambang-tile" data-i="2" aria-label="Mine 2"><img src="tambang-world/images/tambang-tile-stage-biasa.webp" alt=""><span>2</span></button>
    <button class="ut-tabv tambang-tile" data-i="3" aria-label="Mine 3"><img src="tambang-world/images/tambang-tile-stage-biasa.webp" alt=""><span>3</span></button>
    <button class="ut-tabv tambang-tile" data-i="4" aria-label="Mine 4"><img src="tambang-world/images/tambang-tile-stage-biasa.webp" alt=""><span>4</span></button>
    <button class="ut-tabv tambang-tile" data-i="5" aria-label="Mine 5"><img src="tambang-world/images/tambang-tile-stage-biasa.webp" alt=""><span>5</span></button>
    <button class="tambang-arr dn" id="tambang-down" aria-label="Layer bawah"><img src="tambang-world/images/tambang-panah-kembali.webp" alt=""></button>
  </nav>
  <div class="tambang-cur" id="tambang-cur-em"><img src="tambang-world/images/tambang-berlian-hijau.webp" alt=""><div class="v" id="tambang-v-em">—</div><div class="plus">+</div></div>
  <div class="tambang-cur" id="tambang-cur-co"><img src="tambang-world/images/tambang-ikon-koin-emas.webp" alt=""><div class="v" id="tambang-v-co">—</div><div class="plus">+</div></div>
  <button id="tambang-home" aria-label="Lobby"><img src="tambang-world/images/tambang-ikon-home.webp" alt=""></button>
  <div id="tambang-tools">
    <button class="ut-gl ut-c-t tambang-btn" id="tambang-liftb" aria-expanded="false"><img src="tambang-world/images/tambang-tombol-mint.webp" alt=""><span>LIFT</span></button>
    <button class="ut-gl ut-c-r tambang-btn x0" id="tambang-furn"><img src="tambang-world/images/tambang-tombol-merah-polos.webp" alt=""><span>🔥 FURNACE</span></button>
    <button class="ut-gl ut-c-g tambang-btn x0" id="tambang-forest"><img src="tambang-world/images/tambang-tombol-hijau-polos.webp" alt=""><span>🌲 HUTAN</span></button>
    <button class="ut-gl ut-c-y tambang-btn" id="tambang-prod" aria-expanded="false"><img src="tambang-world/images/tambang-tombol-kuning-polos.webp" alt=""><span>PRODUKSI</span></button>
    <button class="ut-gl ut-c-b tambang-btn" id="tambang-boostall"><img src="tambang-world/images/tambang-tombol-biru-polos.webp" alt=""><span>⚡ BOOST SEMUA</span></button>
    <button class="ut-gl ut-c-n tambang-btn" id="tambang-gudang"><img src="tambang-world/images/tambang-tombol-coklat-polos.webp" alt=""><span><img src="tambang-world/images/tambang-tas-kulit.webp" alt="">GUDANG <b id="tambang-gcnt">0</b></span></button>
    <button class="ut-gl ut-c-n tambang-btn x0" id="tambang-inv"><img src="tambang-world/images/tambang-tombol-coklat-polos.webp" alt=""><span>🎒 INVENTORI</span></button>
    <button class="ut-gl ut-c-p tambang-btn x0" id="tambang-gup"><img src="tambang-world/images/tambang-tombol-ungu-polos.webp" alt=""><span>⬆ UPGRADE</span></button>
  </div>

  <section id="tambang-card" class="tambang-slot" hidden></section>
  <div id="tambang-bubs"><button class="tambang-bub b" id="tambang-bub-b" aria-label="Boost tambang ini">⚡</button><button class="tambang-bub u" id="tambang-bub-u" aria-label="Upgrade tambang ini"><img src="tambang-world/images/tambang-panah-kembali.webp" alt=""></button></div>

  <div id="tambang-dock" aria-label="Taruh objek di tambang">
    <button class="tambang-chip" data-spec="chest:wooden" style="--c:#8a5a2b" title="Peti kayu"><img src="tambang-world/images/tambang-peti-harta.webp" alt=""><em>Kayu</em></button>
    <button class="tambang-chip" data-spec="chest:stone" style="--c:#8d8d96" title="Peti batu"><img src="tambang-world/images/tambang-peti-harta.webp" alt=""><em>Batu</em></button>
    <button class="tambang-chip" data-spec="chest:crystal" style="--c:#33d6ff" title="Peti kristal"><img src="tambang-world/images/tambang-peti-harta.webp" alt=""><em>Kristal</em></button>
    <button class="tambang-chip" data-spec="chest:deep" style="--c:#ff7a2a" title="Peti deep"><img src="tambang-world/images/tambang-peti-harta.webp" alt=""><em>Deep</em></button>
    <button class="tambang-chip" data-spec="chest:ancient" style="--c:#d0a22a" title="Peti ancient"><img src="tambang-world/images/tambang-peti-harta.webp" alt=""><em>Ancient</em></button>
    <button class="tambang-chip" data-spec="chest:mystery" style="--c:#a05cff" title="Peti mystery"><img src="tambang-world/images/tambang-peti-harta.webp" alt=""><em>Mystery</em></button>
    <div class="tambang-sep"></div>
    <button class="tambang-chip" data-spec="worker" style="--c:#d9732a" title="Pekerja"><img src="tambang-world/images/tambang-pengguna.webp" alt=""><em>Pekerja</em></button>
    <button class="tambang-chip" data-spec="cart" style="--c:#5a5f69" title="Kereta tambang"><img src="tambang-world/images/tambang-koin-tumpuk.webp" alt=""><em>Kereta</em></button>
    <button class="tambang-chip" data-spec="decor:torch" style="--c:#ffa630" title="Obor"><img src="tambang-world/images/tambang-api.webp" alt=""><em>Obor</em></button>
    <button class="tambang-chip" data-spec="decor:crates" style="--c:#8a5a2b" title="Kotak kayu"><img src="tambang-world/images/tambang-tas-kulit.webp" alt=""><em>Kotak</em></button>
    <button class="tambang-chip" data-spec="decor:rocks" style="--c:#8d8d96" title="Batu hias"><img src="tambang-world/images/tambang-batu-rune.webp" alt=""><em>Batu</em></button>
    <button class="tambang-chip" data-spec="mineral" style="--c:#4dd8ff" title="Mineral"><img src="tambang-world/images/tambang-kristal-heksagon.webp" alt=""><em>Mineral</em></button>
    <div class="tambang-sep"></div>
    <div class="tambang-tgwrap" id="tambang-slotwrap" role="switch" aria-checked="false" tabindex="0"><span>Slot</span><div class="tambang-tg" id="tambang-tg"></div></div>
    <button class="ut-gl ut-c-p tambang-btn" id="tambang-reset" aria-label="Reset tambang"><img src="tambang-world/images/tambang-tombol-ungu-polos.webp" alt=""><img class="ic" src="tambang-world/images/tambang-ulang.webp" alt=""></button>
  </div>

  <div id="tambang-md"><div class="tambang-panel" id="tambang-box">
    <button class="tambang-x" id="tambang-mclose" aria-label="Tutup"></button><h3 id="tambang-mt">Reset Tambang</h3><p id="tambang-mx">Semua objek kembali ke susunan awal. Lanjutkan?</p>
    <div id="tambang-mbtns">
      <button class="ut-gl ut-c-r tambang-btn" id="tambang-m-no"><img src="tambang-world/images/tambang-tombol-merah-polos.webp" alt=""><span>Batal</span></button>
      <button class="ut-gl ut-c-g tambang-btn" id="tambang-m-ok"><img src="tambang-world/images/tambang-tombol-hijau-polos.webp" alt=""><span>Reset</span></button>
    </div>
  </div></div>
  <div id="tambang-toast"></div>
</div></div>
<div id="tambang-fade"></div>
<!-- dompet & data pemain asli (sama seperti Lobby/Toko): saldo Koin/Emerald dan RPC tambang_* lewat server -->
<script src="assets/js/core/item-registry.js"></script><script src="data/inventory/character/steve/manifest.js"></script><script src="data/inventory/character/alex/manifest.js"></script><script src="data/inventory/character/creeper/manifest.js"></script><script src="data/inventory/character/zombie/manifest.js"></script><script src="data/inventory/character/skeleton/manifest.js"></script><script src="data/inventory/character/ender/manifest.js"></script><script src="data/inventory/character/index.js"></script><script src="assets/js/item-catalog.js"></script><script src="data/inventory/character/_shared/js/character-data.js"></script><script src="assets/js/player-data.js"></script><script src="assets/js/services/wallet-service.js"></script><script src="tambang-world/js/tambang-service.js"></script>
<script src="tambang-world/js/tambang-bridge.js"></script>
<script src="tambang-world/js/tambang-three.min.js"></script>
<script src="tambang-world/js/tambang-core.js"></script>
<script src="tambang-world/js/tambang-voxel.js"></script>
<script src="tambang-world/js/tambang-props.js"></script>
<script src="tambang-world/js/tambang-rig.js"></script>
<script src="tambang-world/js/tambang-workers.js"></script>
<script src="tambang-world/js/tambang-data.js"></script>
<script src="tambang-world/js/tambang-layer-surface-stone.js"></script>
<script src="tambang-world/js/tambang-layer-crystal-deep.js"></script>
<script src="tambang-world/js/tambang-layer-ancient-soon.js"></script>
<script src="tambang-world/js/tambang-lift.js"></script>
<script src="tambang-world/js/tambang-snap.js"></script>
<script src="tambang-world/js/tambang-top-layer.js"></script>
<script src="tambang-world/js/tambang-logistics.js"></script>
<script src="tambang-world/js/tambang-world.js"></script>
<script src="tambang-world/js/tambang-ui.js"></script>
</body></html>
