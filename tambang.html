<!DOCTYPE html>
<html lang="id" class="stage16">
<head><script src="assets/js/frame-guard.js"></script>
<script src="assets/js/session.js"></script><script src="assets/js/boot-guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tambang — Voxel Game</title><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/base.css"><script src="assets/js/prefs.js"></script><script src="assets/js/prefs-sync.js"></script><script src="assets/js/ambience.js"></script>
<style>
:root{--ol:#08112b;--nv1:#2d62c8;--nv2:#173c94;--g1:#6fd45a;--g2:#3f9d3a;--y1:#ffc83a;--y2:#f08215;--curbar-top:0;--cur-h:4.2rem;--cur-icon:5rem;--cur-plus:2.8rem;--cur-fs:2.2rem;--cur-minw:11rem;--cur-gap:2.4rem}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{font-size:min(1vw,1.78vh)}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2','Fredoka','Nunito',system-ui,sans-serif;font-weight:800;color:#fff;background:radial-gradient(ellipse at 50% 30%,#2b3a63,#141b33 70%,#0b1020)}
button{font:inherit;color:inherit;cursor:pointer}
#page{position:absolute;inset:0;display:flex;flex-direction:column;padding:1.6rem 2rem 2rem;gap:1.2rem}
#bar{display:flex;align-items:center;gap:1.4rem;flex:none;min-height:5rem}
.ib{width:4.8rem;height:4.8rem;padding:0;border-radius:1.4rem;display:grid;place-items:center;border:.25rem solid var(--ol);background:linear-gradient(#4a8cf0,#2255c0);box-shadow:0 .35rem 0 var(--ol),inset 0 .2rem .2rem rgba(255,255,255,.35);flex:none}
.ib:active{translate:0 .2rem;box-shadow:0 .15rem 0 var(--ol)}
.ib img{width:3.4rem;height:3.4rem;object-fit:contain;pointer-events:none}
.ib svg{width:3rem;height:3rem}
#title{display:flex;align-items:center;gap:1rem;font-size:2.8rem;line-height:1;padding:.7rem 2rem;border-radius:1.4rem;border:.25rem solid var(--ol);background:linear-gradient(#3d7be0,#1d4aae);box-shadow:0 .35rem 0 var(--ol);text-shadow:0 .18rem 0 var(--ol)}
#title img{width:3.6rem;height:3.6rem}
#sum{font-size:1.8rem;padding:.5rem 1.6rem;border-radius:1.2rem;background:rgba(8,17,43,.55);border:.18rem solid rgba(255,255,255,.18);white-space:nowrap}
#sum b{color:#7dff9a}
#sp{flex:1}
html body #bar .ut-curbar{position:static;translate:none;pointer-events:auto;margin-right:.6rem}
#main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.8rem}
.slot{min-width:0;min-height:0;display:flex;flex-direction:column;gap:.8rem;position:relative}
.bay{position:relative;flex:1;min-height:12rem;border-radius:1.6rem;overflow:hidden;border:.3rem solid var(--ol);background:linear-gradient(#27304a,#171d33);box-shadow:0 .4rem 0 var(--ol)}
.bay canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bay .lkv{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;background:rgba(6,10,24,.55);text-shadow:0 .15rem 0 #000;z-index:3}
.slot.locked .bay .lkv{display:flex}
.lkv img{width:7rem;height:7rem;object-fit:contain;filter:drop-shadow(0 .3rem .3rem rgba(0,0,0,.5))}
.lkv span{font-size:2rem}
.fx{position:absolute;width:0;height:0;pointer-events:none;z-index:2;display:none}
.slot.work .fx.w,.slot.full .fx.z{display:block}
.fx.w img{position:absolute;left:0;bottom:0;width:2.6rem;height:2.6rem;opacity:0;object-fit:contain;animation:rise 2.2s ease-out infinite;filter:drop-shadow(0 .2rem .2rem rgba(0,0,0,.4))}
.fx.w img:nth-child(2){animation-delay:.73s;--dx:1.6rem}.fx.w img:nth-child(3){animation-delay:1.46s;--dx:-1.4rem}.fx.w img:nth-child(1){--dx:.2rem}
.slot.boost .fx.w img{animation-duration:1.1s}
@keyframes rise{0%{transform:translate(-50%,0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translate(calc(-50% + var(--dx,0)),-6.5rem) scale(1.15) rotate(24deg);opacity:0}}
.fx.z b{position:absolute;left:0;bottom:0;font-size:2.6rem;color:#cfe3ff;text-shadow:0 .18rem 0 var(--ol);opacity:0;animation:zz 2.6s ease-in-out infinite}
.fx.z b:nth-child(2){animation-delay:.9s;font-size:2rem}.fx.z b:nth-child(3){animation-delay:1.8s;font-size:1.6rem}
@keyframes zz{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(2.4rem,-5rem);opacity:0}}
.pop{position:absolute;z-index:4;pointer-events:none;font-size:3rem;color:#7dff9a;text-shadow:0 .2rem 0 var(--ol);animation:pop 1.3s ease-out forwards;display:flex;align-items:center;gap:.4rem;translate:-50% 0}
.pop img{width:3.2rem;height:3.2rem}
@keyframes pop{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-1.2rem) scale(1.15)}100%{transform:translateY(-8rem) scale(1);opacity:0}}
.card{flex:none;border-radius:1.6rem;border:.3rem solid var(--ol);background:linear-gradient(var(--nv1),var(--nv2));box-shadow:0 .4rem 0 var(--ol),inset 0 .2rem .2rem rgba(255,255,255,.3);padding:1.1rem 1.3rem 1.3rem;display:flex;flex-direction:column;gap:.7rem;min-height:18rem}
.hd{display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:2rem;line-height:1;white-space:nowrap}
.hd small{font-size:1.3rem;opacity:.85;text-align:right}
.rt{display:flex;align-items:center;gap:.7rem;font-size:2.2rem;line-height:1}
.rt img{width:3rem;height:3rem}
.rt small{font-size:1.5rem;opacity:.85}
.bst{margin-left:auto;font-size:1.5rem;padding:.2rem .9rem;border-radius:.9rem;background:linear-gradient(var(--y1),var(--y2));border:.16rem solid var(--ol);text-shadow:0 .1rem 0 rgba(0,0,0,.4);display:none}
.slot.boost .bst{display:block;animation:bs .9s ease-in-out infinite}
@keyframes bs{50%{scale:1.1}}
.bar{position:relative;height:3rem;border-radius:1.5rem;background:#0a1740;border:.2rem solid var(--ol);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(#6fe86f,#2ea82e);transition:width .4s}
.slot.full .bar i{background:linear-gradient(#ffd24d,#f08215)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:1.7rem;text-shadow:0 .12rem 0 rgba(0,0,0,.6)}
.eta{font-size:1.4rem;opacity:.9;text-align:center;line-height:1;white-space:nowrap}
.btn{border:.25rem solid var(--ol);border-radius:1.1rem;padding:.5rem .6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;line-height:1;text-shadow:0 .14rem 0 rgba(0,0,0,.4);box-shadow:0 .3rem 0 var(--ol),inset 0 .15rem .15rem rgba(255,255,255,.4)}
.btn:active:not(:disabled){translate:0 .2rem;box-shadow:0 .1rem 0 var(--ol)}
.btn b{font-size:1.6rem}.btn small{font-size:1.4rem;display:flex;align-items:center;gap:.3rem}.btn small img{width:1.8rem;height:1.8rem}
.take{height:4.8rem;font-size:2.2rem;flex-direction:row;gap:.8rem;background:linear-gradient(var(--g1),var(--g2))}
.take img{width:3rem;height:3rem}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.row .btn{height:5.6rem}
.y{background:linear-gradient(var(--y1),var(--y2))}.bl{background:linear-gradient(#5aa0ff,#2b62d4)}
.btn:disabled{filter:grayscale(.85) brightness(.8);cursor:default}
.btn.poor:not(:disabled) small{color:#ffb3b3}
.opn{height:5.4rem;font-size:2rem;flex-direction:row;gap:.8rem;background:linear-gradient(var(--y1),var(--y2))}
.opn img{width:2.8rem;height:2.8rem}
.msg{text-align:center;font-size:1.9rem;line-height:1.3;padding:1rem}
#toast{position:fixed;left:50%;bottom:2.5rem;translate:-50% 2rem;background:linear-gradient(var(--nv1),var(--nv2));padding:.7rem 2rem;border-radius:.9rem;border:.25rem solid var(--ol);font-size:2.2rem;opacity:0;transition:opacity .3s,translate .35s;pointer-events:none;z-index:50;white-space:nowrap}
#toast.on{opacity:1;translate:-50% 0}
@media (max-aspect-ratio:1/1){
  html{font-size:2.5vw}
  html,body{overflow:auto}
  #page{position:relative;inset:auto;min-height:100%}
  #bar{flex-wrap:wrap}#sp{display:none}#sum{order:9;width:100%;text-align:center}
  #main{grid-template-columns:1fr;flex:none}
  .bay{flex:none;aspect-ratio:10/7.4;min-height:0}
}
@media (prefers-reduced-motion:reduce){.fx.w img,.fx.z b,.bst{animation:none!important}}
</style>

<body>
<div id="page">
  <header id="bar">
    <button class="ib" id="back" aria-label="Kembali"><img src="assets/Images/icon/ui/back.webp" alt="" draggable="false"></button>
    <div id="title"><img src="assets/Images/icon/currency/emerald.webp" alt="" draggable="false">Tambang</div>
    <div id="sum" aria-live="polite">Memuat…</div>
    <div id="sp"></div>
    <div class="ut-curbar">
      <div class="ab cur" id="gem"><img class="ci" src="assets/Images/icon/currency/emerald.webp" alt="" draggable="false"><span id="gemV"></span></div>
      <div class="ab cur" id="coin"><img class="ci" src="assets/Images/icon/currency/coin.webp" alt="" draggable="false"><span id="coinV"></span><button class="plus" id="plusCoin" aria-label="Tambah coin"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg></button></div>
    </div>
    <button class="ib" id="home" aria-label="Beranda (lobby)"><svg viewBox="0 0 24 24" fill="none"><path d="M3.6 11.4 12 4l8.4 7.4" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.4V19a1 1 0 0 0 1 1h3.4v-5.2h3.2V20H17a1 1 0 0 0 1-1v-8.6" fill="#fff"/></svg></button>
  </header>
  <main id="main"></main>
</div>
<div id="toast" role="status"></div>

<script src="assets/js/landscape.js"></script>
<script src="assets/js/vendor/three.min.js"></script>
<script src="assets/js/character-data.js"></script>
<script src="assets/js/character-view.js"></script>
<script src="assets/js/item-catalog.js"></script>
<script src="assets/js/player-data.js"></script>
<script src="assets/js/mine-service.js"></script>
<script src="assets/js/app.js"></script>
<script src="hud/ui-core.js"></script>
<script>UT.App.init({page:'tambang'});</script>
<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const PD=window.PlayerData,MS=()=>window.UT&&UT.MineService&&UT.MineService.get();
const fmt=n=>Number(n).toLocaleString('id-ID');
const f1=n=>Number(n).toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1});
const f2=n=>Number(n).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
const SET=()=>{try{return PD.settings()}catch(e){return {}}};
const buzz=()=>{if(SET().vibration&&navigator.vibrate)navigator.vibrate(15)};
function playSound(){if(!SET().sound)return;try{UT.Audio.play('button')}catch(e){}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1900)}
const MSG={'saldo-kurang':'Coin tidak cukup.','sudah-dibuka':'Tambang sudah dibuka.','level-maks':'Sudah level maksimum.','boost-aktif':'Percepat masih aktif.','batas-harian':'Batas Percepat hari ini habis.','peti-kosong':'Peti belum ada isinya.','terkunci':'Buka tambang dulu.','jaringan':'Tidak dapat terhubung ke server.','belum-login':'Silakan login ulang.','sedang-diproses':'Sedang diproses…','mode-lokal':'Tambang butuh akun login.','slot-tidak-valid':'Slot tidak valid.'};
const say=r=>toast(MSG[r&&r.reason]||'Gagal. Coba lagi.');

/* ---------- navigasi: Back ke halaman asal (?from=), Home ke lobby ---------- */
const FROM_OK=['lobby','karakter','frame','dadu','efek','powerup','profile','leaderboard','friendship','shop','mode','misi','hadiah-misi','dailyreward','settings'];
const FROM=(()=>{const f=new URLSearchParams(location.search).get('from')||'',m=/^([a-z-]+)\.html$/.exec(f);return m&&FROM_OK.indexOf(m[1])>=0?f:'lobby.html'})();
$('#back').addEventListener('click',()=>{playSound();location.href=FROM});
$('#home').addEventListener('click',()=>{playSound();location.href='lobby.html'});
$('#plusCoin').addEventListener('click',()=>{playSound();location.href='shop.html?coin=1'});

/* ---------- saldo ---------- */
function renderCurrency(){$('#gemV').textContent=(PD.walletReady()?fmt(PD.gems()):'—');$('#coinV').textContent=(PD.walletReady()?fmt(PD.coins()):'—')}
try{if(!window.__curSub){window.__curSub=1;PD.subscribe(r=>{if(r==='server-wallet'||r==='storage'||r==='pageshow')try{renderCurrency();tick(true)}catch(e){}})}}catch(e){}
renderCurrency();

/* ---------- state dari SERVER (tidak ada angka ekonomi di sini) ---------- */
let ST=null;                       /* hasil mine_get(): slots[], config */
const cheer=[0,0,0,0];             /* detik performance.now() sampai emote senang selesai */
const dur=s=>{s=Math.max(0,Math.round(s));if(s<60)return s<=1?'<1m':s+'d';const m=Math.floor(s/60),h=Math.floor(m/60);return h>=24?Math.floor(h/24)+' hr '+(h%24)+'j':h?h+'j '+(m%60)+'m':m+'m'};
function stamp(s){s.at=performance.now();return s}
/* Perkiraan TAMPILAN antar-sinkronisasi (server tetap sumber kebenaran saat Ambil/Upgrade). */
function est(s){if(!s.unlocked)return 0;const el=(performance.now()-s.at)/1000,b=Math.min(el,s.boost.left_secs);return Math.min(s.cap,s.stock+s.rate*(el+b*(ST.config.boost_mult-1))/3600)}
const boostLeft=s=>Math.max(0,s.boost.left_secs-(performance.now()-s.at)/1000);
function status(i){const s=ST.slots[i-1];if(!s.unlocked)return 'locked';if(cheer[i]>performance.now())return 'cheer';return est(s)>=s.cap-1e-6?'full':'work'}

async function load(){
  const r=await MS().get();
  if(!r||!r.ok){showErr(r&&r.reason);return false}
  r.slots.forEach(stamp);ST=r;buildAll();renderCurrency();return true
}
function showErr(reason){
  $('#sum').textContent='—';
  $('#main').innerHTML='<div class="card" style="grid-column:1/-1;align-items:center"><div class="msg">'+(MSG[reason]||'Gagal memuat tambang.')+'</div><button class="btn y" id="retry" style="height:5rem;padding:0 2.4rem;font-size:2rem">Coba lagi</button></div>';
  $('#retry').onclick=()=>{$('#sum').textContent='Memuat…';load()};
}

/* ---------- UI slot ---------- */
const EM='assets/Images/icon/currency/emerald.webp',CN='assets/Images/icon/currency/coin.webp',LK='assets/Images/icon/ui/lock.webp';
function slotHTML(i){
  const s=ST.slots[i-1];
  const fx='<div class="fx w">'+('<img src="'+EM+'" alt="">').repeat(3)+'</div><div class="fx z"><b>Z</b><b>z</b><b>z</b></div>';
  if(!s.unlocked)return '<div class="bay"><canvas></canvas><div class="lkv"><img src="'+LK+'" alt=""><span>Tambang '+i+' terkunci</span></div></div>'
    +'<div class="card"><div class="hd"><b>Penambang '+i+'</b><small>'+f2(s.base_rate)+' /jam (Lv1)</small></div><div class="msg" style="padding:.4rem">Buka supaya penambang mulai menggali.</div>'
    +'<button class="btn opn" data-a="unlock"><span>Buka</span><img src="'+CN+'" alt=""><span>'+fmt(s.unlock_cost)+'</span></button></div>';
  const mx=ST.config,b=s.boost;
  const up=(a,label,lv,cost)=>cost==null?'<button class="btn bl" data-a="'+a+'" disabled><b>'+label+' MAX</b><small>Lv '+lv+'/5</small></button>'
    :'<button class="btn bl" data-a="'+a+'"><b>'+label+' Lv '+(lv+1)+'</b><small><img src="'+CN+'" alt="">'+fmt(cost)+'</small></button>';
  return '<div class="bay"><canvas></canvas>'+fx+'</div>'
    +'<div class="card"><div class="hd"><b>Penambang '+i+'</b><small>Kec. Lv '+s.speed_lv+' · Peti Lv '+s.cap_lv+'</small></div>'
    +'<div class="rt"><img src="'+EM+'" alt=""><b class="rv"></b><small>/jam</small><span class="bst">⚡ x'+mx.boost_mult+'</span></div>'
    +'<div class="bar"><i></i><span class="bt"></span></div><div class="eta"></div>'
    +'<button class="btn take" data-a="collect"><img src="'+EM+'" alt=""><span class="tk"></span></button>'
    +'<div class="row"><button class="btn y" data-a="boost"><b class="bl2">Percepat</b><small class="bs"></small></button>'+up('speed','Kecepatan',s.speed_lv,s.next_speed_cost)+up('cap','Peti',s.cap_lv,s.next_cap_cost)+'</div></div>';
}
function buildAll(){
  const m=$('#main');m.innerHTML='';
  disposeBays();
  [1,2,3].forEach(i=>{const e=document.createElement('section');e.className='slot';e.dataset.s=i;e.innerHTML=slotHTML(i);m.appendChild(e)});
  $$('.slot').forEach(e=>{
    e.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(b&&!b.disabled)act(+e.dataset.s,b.dataset.a,b)});
  });
  mountBays();tick(true);
}
function tick(force){
  if(!ST)return;
  const now=performance.now();let total=0;
  [1,2,3].forEach(i=>{
    const s=ST.slots[i-1],e=$('.slot[data-s="'+i+'"]');if(!e)return;
    const st=status(i);
    e.classList.toggle('locked',st==='locked');e.classList.toggle('work',st==='work'||st==='cheer');e.classList.toggle('full',st==='full');
    if(!s.unlocked)return;
    const bl=boostLeft(s),bOn=bl>0;
    if(s.boost.active&&!bOn&&!tick.re){tick.re=1;load().finally(()=>{tick.re=0})}   /* boost habis: sinkron ulang dari server */
    e.classList.toggle('boost',bOn);
    const rate=bOn?s.rate*ST.config.boost_mult:s.rate;total+=rate;
    const v=est(s),fill=v/s.cap;
    $('.rv',e).textContent=f2(rate);
    $('.bar i',e).style.width=Math.min(100,fill*100)+'%';
    $('.bt',e).textContent=f1(v)+' / '+fmt(s.cap);
    const full=v>=s.cap-1e-6;
    $('.eta',e).textContent=full?'Peti penuh! Ambil dulu.':'Penuh dalam '+dur(Math.max(0,s.full_in_secs-(now-s.at)/1000));
    const n=Math.floor(v),tk=$('.tk',e),tb=$('.take',e);tk.textContent=n>=1?'Ambil +'+n:'Belum ada';tb.disabled=n<1;
    const bb=$('[data-a="boost"]',e);
    if(bOn){bb.disabled=true;$('.bl2',e).textContent='Aktif';$('.bs',e).textContent='⚡ '+dur(bl)}
    else if(s.boost.left_today<=0){bb.disabled=true;$('.bl2',e).textContent='Percepat';$('.bs',e).textContent='Habis hari ini'}
    else{bb.disabled=false;$('.bl2',e).textContent='Percepat';$('.bs',e).innerHTML='<img src="'+CN+'" alt="">'+fmt(s.boost.cost)}
    const co=PD.walletReady()?PD.coins():Infinity;
    $$('.btn.y,.btn.bl',e).forEach(b=>{const a=b.dataset.a,c=a==='boost'?s.boost.cost:a==='speed'?s.next_speed_cost:s.next_cap_cost;b.classList.toggle('poor',c!=null&&co<c)});
    if(bays[i])bays[i].setFill(fill);
  });
  const open=ST.slots.filter(s=>s.unlocked).length;
  $('#sum').innerHTML=open?'Total <b>'+f2(total)+'</b>/jam · ≈ <b>'+f1(total*24)+'</b>/hari':'Buka tambang pertamamu';
}

async function act(i,a,btn){
  playSound();buzz();
  const M=MS();if(!M)return;
  let r;
  if(a==='collect')r=await M.collect(i);
  else if(a==='unlock')r=await M.unlock(i);
  else if(a==='boost')r=await M.boost(i);
  else r=await M.upgrade(i,a);
  if(!r||!r.ok){
    if(r&&r.reason==='peti-kosong'&&r.slot_data){ST.slots[i-1]=stamp(r.slot_data);buildAll()}
    say(r);return;
  }
  if(r.slot_data){ST.slots[i-1]=stamp(r.slot_data)}
  buildAll();
  const e=$('.slot[data-s="'+i+'"]');
  if(a==='collect'){cheer[i]=performance.now()+3200;popAt(e,'+'+fmt(r.collected));toast('+'+fmt(r.collected)+' Emerald');bays[i]&&bays[i].burst('emerald')}
  else if(a==='unlock'){cheer[i]=performance.now()+3000;toast('Tambang '+i+' dibuka!');bays[i]&&bays[i].burst('emerald')}
  else if(a==='boost'){toast('Percepat aktif ⚡')}
  else toast('Upgrade berhasil!');
  renderCurrency();tick(true);
}
function popAt(slotEl,txt){const bay=$('.bay',slotEl),p=document.createElement('div');p.className='pop';p.innerHTML='<img src="'+EM+'" alt=""><b>'+txt+'</b>';p.style.left='50%';p.style.top='38%';bay.appendChild(p);setTimeout(()=>p.remove(),1400)}

/* ================= ADEGAN 3D per slot ================= */
const bays={};let rafId=0,clock=null;
function disposeBays(){for(const k in bays){try{bays[k].dispose()}catch(e){}delete bays[k]}}
const NPC=['alex','zombie','skeleton'];     /* skin berbeda dari skin pemain; wajah tiap penambang berbeda */
function mountBays(){
  if(typeof THREE==='undefined'||!UT.CharacterView)return;
  [1,2,3].forEach(i=>{
    const e=$('.slot[data-s="'+i+'"]');if(!e)return;
    try{bays[i]=makeBay(i,$('canvas',e),e)}catch(err){console.warn('[tambang] 3D gagal slot',i,err)}
  });
  if(!rafId){clock=new THREE.Clock();loop()}
}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function vox(list,color0){
  const g=new THREE.BoxGeometry(1,1,1),m=new THREE.MeshLambertMaterial({color:0xffffff}),im=new THREE.InstancedMesh(g,m,list.length),d=new THREE.Object3D(),c=new THREE.Color();
  list.forEach((v,k)=>{d.position.set(v[0],v[1],v[2]);d.scale.set(v[4]||1,v[5]||v[4]||1,v[6]||v[4]||1);d.updateMatrix();im.setMatrixAt(k,d.matrix);c.set(v[3]);im.setColorAt(k,c)});
  im.instanceMatrix.needsUpdate=true;if(im.instanceColor)im.instanceColor.needsUpdate=true;return im;
}
function box(w,h,d,color,emissive){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color,emissive:emissive||0x000000}))}
function makeBay(i,canvas,slotEl){
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setClearColor(0,0);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  const scene=new THREE.Scene();scene.add(new THREE.AmbientLight(0xffffff,.78));const dl=new THREE.DirectionalLight(0xffffff,.85);dl.position.set(-4,8,7);scene.add(dl);
  const cam=new THREE.PerspectiveCamera(30,1.4,.1,100);
  const G=new THREE.Group();G.rotation.set(.1,-.34,0);scene.add(G);
  const disposables=[];
  /* dinding gua, lantai, tiang kayu */
  const wall=[],stone=['#6b7280','#5b6270','#4b5563','#737a88','#565d6c'];
  for(let x=-5;x<=5;x++)for(let y=0;y<=8;y++)wall.push([x,y,-3,stone[(rnd()*stone.length)|0]]);
  G.add(vox(wall));
  const floor=[],dirt=['#7a5a3a','#6b4f33','#5d4630','#6f6f78','#5f5f68'];
  for(let x=-5;x<=5;x++)for(let z=-2;z<=2;z++)floor.push([x,-.5,z,dirt[(rnd()*dirt.length)|0]]);
  G.add(vox(floor));
  [-4.6,4.6].forEach(x=>{const p=box(.7,7.6,.7,0x7b5330);p.position.set(x,3.8,-1.8);G.add(p)});
  const top=box(10.2,.7,.7,0x8a5d36);top.position.set(0,7.5,-1.8);G.add(top);
  const chain=box(.08,1,.08,0x333844);chain.position.set(-2.6,6.9,-1.8);G.add(chain);
  const lamp=box(.5,.6,.5,0xffd25a,0xffb020);lamp.position.set(-2.6,6.2,-1.8);G.add(lamp);
  /* batu + bijih emerald */
  const rock=new THREE.Group();rock.position.set(3.1,0,-.9);G.add(rock);
  const rs=[];for(let x=0;x<3;x++)for(let y=0;y<3-(x===2?1:0);y++)rs.push([(x-1)*1.05,y*1.05+.52,0,stone[(rnd()*stone.length)|0],1.02]);
  rock.add(vox(rs));
  const ore=[[-.55,.55,.55],[.35,1.5,.55],[-.2,1.75,.4],[1.05,.45,.5],[.4,.5,.55],[-.7,1.6,.5]].map(p=>{const o=box(.46,.46,.3,0x2ee86a,0x16b84a);o.position.set(p[0],p[1],p[2]);rock.add(o);return o});
  /* peti: isi bertambah mengikuti stok */
  const chest=new THREE.Group();chest.position.set(-3.6,0,.5);chest.rotation.y=.35;G.add(chest);
  const cb=box(1.9,1.1,1.3,0x8a5a2b);cb.position.y=.55;chest.add(cb);const band=box(2,.2,1.4,0xd9a520);band.position.y=1.0;chest.add(band);const lock=box(.3,.35,.15,0xffd24d);lock.position.set(0,.8,.7);chest.add(lock);
  const pile=[];const pileG=new THREE.Group();pileG.position.set(0,1.15,0);chest.add(pileG);
  for(let k=0;k<15;k++){const gm=box(.34,.34,.34,0x2ee86a,0x12a844);gm.position.set(((k%5)-2)*.34,Math.floor(k/10)*.3+Math.floor((k%10)/5)*.0,(Math.floor(k/5)%2)*.34-.17);gm.rotation.y=rnd()*1.2;gm.visible=false;pileG.add(gm);pile.push(gm)}
  /* palang penutup saat terkunci */
  const bar=new THREE.Group();bar.position.set(0,2.6,1.5);G.add(bar);
  [.5,-.5].forEach(a=>{const p=box(9,.7,.3,0x9a6a3a);p.rotation.z=a;bar.add(p)});bar.visible=false;
  /* penambang */
  const miner=UT.CharacterView.make(THREE,NPC[i-1],'mine');miner.position.set(-1.0,0,.5);miner.rotation.y=1.35;G.add(miner);
  const bb=new THREE.Box3().setFromObject(miner),H=Math.max(1,bb.max.y-bb.min.y);
  const pivot=new THREE.Group();pivot.position.set(0,H*.74,H*.16);miner.add(pivot);
  const hd=box(.2,H*.62,.2,0x9a6a3a);hd.position.y=-H*.31;pivot.add(hd);
  const ph=box(H*.5,.28,.28,0xc9d1de);ph.position.y=-H*.62;pivot.add(ph);const pt=box(.16,.34,.3,0x8995a8);pt.position.set(H*.27,-H*.62,0);pivot.add(pt);const pt2=pt.clone();pt2.position.x=-H*.27;pivot.add(pt2);
  /* partikel */
  const NP=22,P=[];const pg=new THREE.BoxGeometry(.22,.22,.22);
  for(let k=0;k<NP;k++){const m=new THREE.Mesh(pg,new THREE.MeshLambertMaterial({color:0x2ee86a,emissive:0x12a844}));m.visible=false;G.add(m);P.push({m,vx:0,vy:0,vz:0,life:0})}
  function burst(kind,n){let c=0;for(const p of P){if(p.life>0)continue;p.life=.7+rnd()*.4;p.m.position.set(2.1+(rnd()-.5)*.4,1.5+rnd()*.5,.7);p.vx=1+rnd()*2.6;p.vy=2+rnd()*3;p.vz=(rnd()-.4)*2.2;
    const g=kind==='emerald'||rnd()<.55;p.m.material.color.set(g?0x2ee86a:0x8b93a3);p.m.material.emissive.set(g?0x12a844:0x000000);p.m.visible=true;if(++c>=(n||8))break}}
  const B={i,miner,pivot,lastC:0,t:0,angle:0,emote:'mine',fill:0,boost:false,hitFlash:0,
    setFill(f){B.fill=f;const n=Math.min(15,Math.round(f*15));pile.forEach((p,k)=>p.visible=k<n)},
    burst,
    resize(){const w=canvas.clientWidth||300,h=canvas.clientHeight||200;renderer.setSize(w,h,false);cam.aspect=w/h;const th=Math.tan(cam.fov*Math.PI/360),d=Math.max(4.7/th,5.7/(th*cam.aspect))+1.2;cam.position.set(0,3.4,d);cam.lookAt(0,3.3,0);cam.updateProjectionMatrix();placeFx()},
    frame(dt,sp){
      const st=status(i),locked=st==='locked';
      miner.visible=!locked;bar.visible=locked;
      if(!locked){
        const em=st==='cheer'?'cheer':st==='full'?'sit':'mine';
        if(em!==B.emote){B.emote=em;miner.userData.setEmote(em)}
        B.t+=dt*sp;miner.userData.anim(B.t);
        pivot.visible=em==='mine';
        if(em==='mine'){
          const c=(B.t*2.4)%1,sw=c<.55?Math.pow(c/.55,2):Math.max(0,1-(c-.55)/.2),tgt=-(.3+2.1*sw);
          B.angle+=(tgt-B.angle)*(1-Math.exp(-dt*14));pivot.rotation.x=B.angle;
          if(B.lastC<.74&&c>=.74){burst('mix',5);B.hitFlash=.12}
          B.lastC=c;
        }
        miner.position.y=em==='mine'?0:miner.position.y;
      }
      rock.position.x=3.1+(B.hitFlash>0?Math.sin(B.t*80)*.035:0);B.hitFlash=Math.max(0,B.hitFlash-dt);
      ore.forEach(o=>o.material.emissiveIntensity=1+(B.hitFlash>0?1.4:0)+Math.sin(B.t*3+o.position.x*4)*.25);
      lamp.material.emissiveIntensity=.9+Math.sin(B.t*5)*.15;
      P.forEach(p=>{if(p.life<=0)return;p.life-=dt;if(p.life<=0){p.m.visible=false;return}p.vy-=9*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;p.m.rotation.x+=dt*6;p.m.scale.setScalar(Math.max(.2,p.life))});
      renderer.render(scene,cam);
    },
    dispose(){renderer.dispose();scene.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose&&o.material.dispose()})}
  };
  /* posisi efek DOM (ikon emerald / Zzz) tepat di atas kepala penambang */
  function placeFx(){
    const w=canvas.clientWidth,h=canvas.clientHeight;if(!w)return;
    G.updateMatrixWorld(true);cam.updateMatrixWorld(true);
    const v=new THREE.Vector3(-1.0,H*1.02,.5);G.localToWorld(v);v.project(cam);
    $$('.fx',slotEl).forEach(f=>{f.style.left=((v.x+1)/2*w)+'px';f.style.top=((1-v.y)/2*h)+'px';f.style.transform='translateY(-100%)'});
  }
  B.resize();
  if(window.ResizeObserver){const ro=new ResizeObserver(()=>B.resize());ro.observe(canvas);const od=B.dispose;B.dispose=()=>{ro.disconnect();od()}}
  return B;
}
function loop(){
  rafId=requestAnimationFrame(loop);
  if(document.hidden)return;
  const dt=Math.min(.1,clock.getDelta());
  for(const k in bays){const s=ST&&ST.slots[k-1];bays[k].frame(dt,s&&s.unlocked&&boostLeft(s)>0?1.7:1)}
}
addEventListener('pagehide',()=>{cancelAnimationFrame(rafId);disposeBays()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ST)load()});
setInterval(()=>{if(!document.hidden&&ST)load()},30000);
setInterval(()=>tick(),500);

if(!MS()){showErr('mode-lokal')}else load();
})();
</script>
</body>
</html>
