<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview tema Fantasy Gold</title>
<link rel="stylesheet" href="fantasy.css">
<style>
html{font-size:min(1vw,1.78vh)}body{margin:0;height:100vh;overflow:hidden;font-family:'Fredoka','Nunito',system-ui,sans-serif;background:#1b2a5a url(../../assets/Images/background/mode-bg.webp) center/cover}
.top{position:absolute;left:2rem;right:2rem;top:1.6rem;display:flex;align-items:center;gap:1.6rem}.top .sp{flex:1}
.stage{position:absolute;left:2rem;right:2rem;top:9.4rem;bottom:2rem;display:grid;grid-template-columns:1.9fr 1fr;gap:2rem}
.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;margin-top:1rem}
.amt{font-size:3rem;font-weight:900;color:var(--ft-gold-text);text-shadow:0 .2rem 0 rgba(0,0,0,.6);margin:.4rem 0 .8rem}
.coinbig{width:9rem;height:9rem;margin:.6rem auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c0,#f6c944 40%,#b3750f 80%);box-shadow:0 0 0 .4rem #c58a1c,0 0 0 .65rem #080c26,0 .8rem .8rem rgba(0,0,0,.5);position:relative}
.coinbig::after{content:"";position:absolute;inset:1.6rem;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6c0,#ffd54a 55%,#d9962a);box-shadow:inset 0 0 0 .4rem #b3750f}
.gembig{width:11rem;height:11rem;margin:1.2rem auto;clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);background:linear-gradient(135deg,#c5ffe0,#2fe08a 45%,#0b8a4a);filter:drop-shadow(0 .6rem .6rem rgba(0,0,0,.5))}
.hot-tag{position:absolute;top:-1.2rem;right:-.6rem;rotate:6deg}
.row2{display:flex;flex-direction:column;gap:1rem;margin-top:1rem}.row2 .ft-row b{flex:1}
</style></head><body>
<div class="top"><span class="ft-back"></span><span class="ft-title"><span>Toko</span></span><span class="sp"></span>
<span class="ft-pill"><i class="gem"></i><span>1.250</span><b class="plus">+</b></span><span class="ft-pill"><i class="coin"></i><span>48.300</span><b class="plus">+</b></span></div>
<div class="stage">
 <div class="ft-panel"><h2 class="ft-h" style="font-size:2.6rem">Beli Coin</h2><div class="ft-sub" style="font-size:1.7rem">Tukar Emerald dengan Coin untuk membeli item.</div>
  <div class="offers">
   <div class="ft-card"><div class="coinbig"></div><div class="amt">+500</div><span class="ft-btn green"><i class="gem" style="display:inline-block;width:2rem;height:2rem;clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);background:#c5ffe0"></i> 10</span></div>
   <div class="ft-card"><div class="coinbig"></div><div class="amt">+2.500</div><span class="ft-btn green"><i style="display:inline-block;width:2rem;height:2rem;clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);background:#c5ffe0"></i> 40</span></div>
   <div class="ft-card hot"><span class="ft-badge legend hot-tag">HEMAT</span><div class="coinbig"></div><div class="amt">+10.000</div><span class="ft-btn green"><i style="display:inline-block;width:2rem;height:2rem;clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);background:#c5ffe0"></i> 120</span></div>
  </div>
  <div class="row2"><div class="ft-row"><b>Level 7 — 340 / 400 XP</b><span class="ft-badge rare">RARE</span></div><div class="ft-bar" style="--v:84%"><i></i></div></div>
 </div>
 <div class="ft-panel"><h2 class="ft-h" style="font-size:2.6rem">Emerald</h2><div class="ft-sub" style="font-size:1.7rem">Didapat dengan menonton iklan berhadiah.</div>
  <div class="gembig"></div><div style="text-align:center"><span class="ft-btn orange" style="font-size:2.2rem">▶ Tonton Iklan</span></div>
  <div style="text-align:center;margin-top:2rem"><span class="ft-btn blue">Teman</span> <span class="ft-btn off">Belum dijual</span></div></div>
</div></body></html>
