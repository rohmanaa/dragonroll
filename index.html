<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DRAGON ROLL</title><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<script>
/* PWA terpasang (standalone/fullscreen): langsung ke layar loading, dijalankan paling awal agar halaman ini tidak sempat tampil. */
(function(){try{var s=(window.matchMedia&&(matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches))||navigator.standalone===true;if(s){location.replace('splash.html');}}catch(e){}})();
</script>
<script src="assets/js/landscape.js"></script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#000000"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dragon Roll"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
/* Tata letak landscape di semua orientasi: logo kiri, teks + tombol kanan */
main{width:min(600px,100%);display:grid;grid-template-columns:auto 1fr;column-gap:clamp(16px,4vw,28px);align-items:center;text-align:left}
.logo{grid-row:1/4;width:clamp(96px,26vw,150px);height:auto;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25)) drop-shadow(0 14px 22px rgba(0,0,0,.3))}
h1{margin:0 0 4px;font-size:clamp(24px,6vw,32px);letter-spacing:.3px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
p{margin:0 0 14px;opacity:.95;font-size:clamp(11px,2.8vw,14px);font-weight:700;letter-spacing:.08em}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:13px 18px;font:inherit;font-weight:800;font-size:17px;color:#fff;cursor:pointer;text-decoration:none;text-align:center}
.play{background:linear-gradient(#ffd24d,#f4a81f);color:#5a3500;box-shadow:0 5px 0 #b9740c}
.btn:active{transform:translateY(3px);box-shadow:none}
</style></head>
<body>
<main>
<img class="logo" src="assets/icons/icon-192.png" width="150" height="150" alt="">
<h1>DRAGON ROLL</h1>
<p>ROLL • ADVENTURE • CONQUER</p>
<a class="btn play" id="play" href="splash.html">Main Sekarang</a>
</main>
<script>
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){}); });
}
</script>
</body></html>
