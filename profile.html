<style id="profile-pixel">
/* Profil: restyle gaya pixel Minecraft mengikuti redesign-hud/profil.webp (selaras dengan Toko/Inventory/Lobby/Mode).
   HANYA tampilan. Markup, id, class, dan JS tidak berubah (tombol tidak ditambah/dihapus). Dimuat paling akhir. */
:root{--ol:#0b1838;--rb1:#3f7ce8;--rb2:#2a5bc8;--rb-hi:#74a4f7;--nv1:#2a4478;--nv2:#1b305f}

/* tombol biru (Back, Gear, kamera/pose/360) */
html body .blue{background:linear-gradient(var(--rb1),var(--rb2));border:.3rem solid var(--ol);border-radius:.9rem;box-shadow:inset 0 0 0 .15rem var(--rb-hi),inset 0 -.3rem 0 rgba(8,25,90,.45),0 .35rem 0 var(--ol)}
html body #title{border-radius:.9rem;text-shadow:none;background:linear-gradient(var(--nv1),var(--nv2))}
html body #sbs button{border-radius:.8rem}

/* currency: disamakan dengan Lobby */
:root{--cur-h:4.2rem;--cur-icon:5rem;--cur-plus:2.8rem;--cur-fs:2.4rem;--cur-minw:17.1rem;--cur-gap:1.2rem}
html body .ut-curbar .cur{background:linear-gradient(#3f506b,#26344c);border:0;box-shadow:inset 0 0 0 .2rem #8696ad,inset 0 0 0 .35rem #172033,0 .3rem 0 #0b1220,0 .8rem 1.2rem rgba(10,30,90,.35);border-radius:1rem;color:#f4d36e;text-shadow:0 .15rem 0 #0b1220}
html body .ut-curbar .plus{border-radius:.6rem;background:linear-gradient(#7af07a,#2cb02c);border:.2rem solid #145a14}

/* panel utama (kartu pemain, Informasi Akun, Progress) */
html body .pn{border-radius:1rem;border:.3rem solid var(--ol);background:linear-gradient(#3a76e0,#2a58c4);box-shadow:inset 0 0 0 .25rem #5e90f0,0 .35rem 0 var(--ol)}
html body .in{border-radius:.7rem;border:.25rem solid var(--ol);background:linear-gradient(#2a58c4,#2250b4);box-shadow:inset 0 0 0 .12rem rgba(120,160,235,.3)}
html body .hd.big{border-radius:.6rem;border:.2rem solid var(--ol);background:linear-gradient(var(--nv1),var(--nv2))}

/* avatar, bar XP, tombol ikon */
html body .av{border-radius:.5rem;border:.25rem solid var(--ol);background:linear-gradient(#bfe6ff,#6cb8f0);box-shadow:inset 0 0 0 .12rem #fff}
/* frame profil (data/frame/frame-default.webp): lubang frame = 61.9% lebar gambar -> gambar 108% dari kotak avatar (lubang = 67% = area wajah), diposisi -4% */
html body .av.fr{position:relative;overflow:visible;border:0;background:none;box-shadow:none;padding:16.5%}
html body .av.fr::before{content:"";position:absolute;inset:15%;border-radius:.3rem;background:linear-gradient(#bfe6ff,#6cb8f0)}
html body .av.fr svg{position:relative}
html body .av.fr .frm{position:absolute;left:-4%;top:-4%;width:108%;height:108%;max-width:none;pointer-events:none;user-select:none;filter:drop-shadow(0 .15rem 0 rgba(11,18,32,.5))}
html body .bar{border-radius:.4rem;border:.2rem solid var(--ol);background:#0e1b3d;box-shadow:none}
html body .bar i{border-radius:.2rem}
html body .ib,html body .ti{border-radius:.5rem;border:.2rem solid var(--ol);background:linear-gradient(var(--nv1),var(--nv2))}
html body .ib.sm{border:0;background:none}
html body .flag{border-radius:0;box-shadow:0 0 0 .15rem var(--ol)}
html body .bd{border:.2rem solid var(--ol);border-radius:.6rem;box-shadow:inset 0 .12rem 0 rgba(255,255,255,.35)}
html body .gr{border:.2rem solid var(--ol);border-radius:.6rem;background:linear-gradient(#3fc545,#23952c);box-shadow:inset 0 .15rem 0 rgba(255,255,255,.4),0 .15rem 0 var(--ol)}

const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString('id-ID'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---- data: player state dari PlayerData (nama, skin terpasang, currency, settings).
// Level/XP = PlayerData lokal. Menang/main/streak, peringkat, counter achievement, misi, dan riwayat = server (get_my_profile, butuh sesi Supabase);
// bila server belum tersedia (offline / belum pernah main) menang/main/streak memakai PlayerData lokal, sisanya 0 atau '—'. Tidak ada angka contoh.
const PD=window.PlayerData,IC=window.ItemCatalog,AR=window.ItemArt;
const SV=()=>PD.serverMode(),WS=()=>window.UT&&UT.WalletService&&UT.WalletService.get();   /* B5: akun login + flag = dompet server */
const WMSG={'saldo-kurang':'Coin tidak cukup.','gem-kurang':'Gem tidak cukup.','jaringan':'Tidak dapat terhubung ke server.','belum-login':'Silakan login ulang.','sedang-diproses':'Sedang diproses...'};
const RN={common:'COMMON',rare:'RARE',epic:'EPIC',legendary:'LEGENDARY'},RB={common:['#4ad04a','#2a9a2a'],rare:['#4aa8ff','#2a78e0'],epic:['#b45cf0','#7a2ad0'],legendary:['#ffb02e','#e07a10']};

function sparkle(el,n=12){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;for(let i=0;i<n;i++){const s=document.createElement('i');s.className='sp';s.style.left=cx+'px';s.style.top=cy+'px';const a=Math.random()*6.28,d=30+Math.random()*60;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}

async function claimAch(id){const a=achInfo().find(x=>x.id===id);if(!a||a.pend<1||claimAch.busy)return;claimAch.busy=1;
 try{
  const cl0=CL.get(id);
  await import('./assets/js/multiplayer/progress-service.js');
  const r=await UT.Multiplayer.Progress.claimAchievement(id,(id==='skin'||id==='emerald')?a.v:null),stars=Math.min(3,+r.stars||0);
  if(!r.ok){CL.set(id,Math.max(cl0,+r.claimed||0));render();toast('Belum ada reward untuk diklaim');return}
  CL.set(id,stars);
  PD.applyServerWallet({coins:r.wallet_coins,gems:r.wallet_gems});
  const rw=REW.slice(cl0,stars).reduce((t,x)=>[t[0]+x[0],t[1]+x[1]],[0,0]);
  const al=$('#alist'),sc=al?al.scrollTop:0;render();const n=$('#alist');if(n)n.scrollTop=sc;renderCurrency();
  pulse('#coin');pulse('#gem');playSound('coin');buzz();sparkle($('#pg'),14);toast('+'+fmt(rw[0])+' Coin  +'+fmt(rw[1])+' Emerald')
 }catch(e){console.warn('[achievement] klaim gagal',e);toast('Butuh koneksi untuk klaim.');playSound('error')}finally{claimAch.busy=0}}

window.openShop=()=>{$('#ui').style.display=''};window.closeShop=()=>{$('#ui').style.display='none'};
// ---- 3D
const M=(c,r=.7)=>new THREE.MeshStandardMaterial({color:new THREE.Color(c),roughness:r});
const bx=(w,h,d,m,x=0,y=0,z=0,p)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p&&p.add(o);return o};
function character(sk,emote){return UT.CharacterView.make(THREE,sk,emote)} /* model = UT.CharacterData (sama dengan gameplay), bukan rig lama */
function diceTex(c,p){const cv=document.createElement('canvas');cv.width=cv.height=128;const x=cv.getContext('2d');x.fillStyle=c;x.fillRect(0,0,128,128);x.fillStyle=p;[[32,32],[96,32],[64,64],[32,96],[96,96]].forEach(a=>{x.beginPath();x.arc(a[0],a[1],12,0,6.3);x.fill()});return new THREE.CanvasTexture(cv)}
/* model hanya skin canonical (preview profil); palet dari ItemArt */
function model(c,it){let g;
 if(c==='skin')g=character(AR.palette(it.id)||{hood:'#00a8a8',hair:'#4a2e13',pants:'#3b4fd8'},pose);
 return g}
function island(){return UT.FloatingIsland.create(THREE,{seed:5,bob:0,scale:.92})} /* komponen bersama: assets/js/floating-island.js */
let ok=true;const rigs=[];
function rig(cv,withIsland,cy,dist,fov){if(!ok)return null;try{const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
 const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(fov,1,.1,100);scene.add(new THREE.AmbientLight(0xffffff,.6),new THREE.HemisphereLight(0xcfeaff,0x6a9a50,.6));
 const sun=new THREE.DirectionalLight(0xfff2d8,.9);sun.position.set(6,12,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-8,right:8,top:10,bottom:-6});scene.add(sun);
 const holder=new THREE.Group();scene.add(holder);if(withIsland)holder.add(island());
 const R={r,scene,cam,holder,cv,cy,dist,rot:0,vel:0,cur:null,drag:false,fov};
 cv.addEventListener('pointerdown',e=>{R.drag=true;R.lx=e.clientX;cv.setPointerCapture(e.pointerId)});
 cv.addEventListener('pointermove',e=>{if(R.drag){R.vel=(e.clientX-R.lx)*.012;R.rot+=R.vel;R.lx=e.clientX}});
 const up=()=>R.drag=false;cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.style.touchAction='pan-y';
 rigs.push(R);return R}catch(e){ok=false;console.warn('WebGL unavailable',e);return null}}
let main,pv,spin=0;
function setModel(R,c,it,y){if(!R)return;if(R.cur)R.holder.remove(R.cur);const m=model(c,it);R.holder.add(m);R.cur=m;R.mc=c}
function buildModels(){const png=!!sel&&sel.renderer==='png';$('#show').classList.toggle('art',png);$('#art').innerHTML=png?AR.forItem(sel.id):'';if(png)return; /* skin PNG: preview texture, bukan model 3D baru */
 setModel(main,'skin',sel);spin=1}
function fit(){const hi=SET().graphics==='high';rigs.forEach(R=>{const w=R.cv.clientWidth,h=R.cv.clientHeight;if(!w||!h)return;R.r.setPixelRatio(hi?Math.min(devicePixelRatio,1.5):1);R.r.setSize(w,h,false);R.cam.aspect=w/h;R.cam.fov=R.fov*(w/h<.8?1.15:1);R.cam.updateProjectionMatrix()})}
const clock=typeof THREE!=='undefined'?new THREE.Clock():null;
function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();
 rigs.forEach(R=>{if(!R.cur||!R.cv.offsetParent)return;const el=R.cv.getBoundingClientRect();if(!el.width)return;
  if(!R.drag){R.vel*=.95;R.rot+=R.vel+.004}if(spin>0&&R===main){}R.holder.rotation.y=R.rot+(spin>0?(1-spin)*6.28:0);
  R.cur.userData.anim&&R.cur.userData.anim(t);R.cam.position.set(0,R.cy+1,R.dist);R.cam.lookAt(0,R.cy,0);R.r.render(R.scene,R.cam)});
 if(spin>0)spin=Math.max(0,spin-.012)}
if(typeof THREE==='undefined')ok=false;
/* event: profil ikut memperbarui UI saat currency/skin berubah (tanpa reload halaman) */
UT.Events.on('currencyChanged',renderCurrency);
UT.Events.on('skinChanged',()=>{sel=eqSkin();render();buildModels()});
UT.Events.on('frameChanged',render);
init();
if(ok){main=rig($('#gl'),true,1.8,19,36);if(ok){buildModels();new ResizeObserver(fit).observe(document.body);new ResizeObserver(fit).observe($('#show'));fit();requestAnimationFrame(loop)}}
if(!ok){$('#show').innerHTML='<div style="height:100%;display:grid;place-items:center;font-size:3rem">3D tidak tersedia</div>'}
document.documentElement.classList.add('ut-ready'); /* 4.1.17B: render awal selesai -> tampilkan halaman */
})();
</script>
</body></html>
