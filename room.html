<style>
[hidden]{display:none!important}
.btn:disabled{filter:grayscale(1) brightness(.7);pointer-events:none}
.btn.sent{filter:saturate(.7)}
/* equipment & modal pilih item: gambar item (SVG/IMG/canvas) mengisi kotak */
.slot .art,.it .art{display:block;flex:none}.slot .art{width:96px;height:96px}.it .art{width:92px;height:92px}
.slot .art>*,.it .art>*{display:block;width:100%;height:100%}.slot .art img,.it .art img{object-fit:contain;filter:none;max-width:none;height:100%}
.slot .chg{font-size:16px}
.it:disabled{cursor:default}
/* power loadout: kartu dari ItemCatalog (stok & jumlah dibawa dari PlayerData) */
#power{padding-bottom:14px}
#pcnt{position:absolute;right:26px;top:8px;font-weight:800;font-size:20px;color:#ddd7f7}
#psc{display:flex;flex-wrap:nowrap;gap:12px;height:100%;padding:4px 4px 8px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;touch-action:pan-x;scroll-snap-type:x proximity;scrollbar-width:thin}
.pc{position:relative;flex:0 0 128px;height:100%;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border-radius:14px;text-align:center;cursor:pointer;scroll-snap-align:start;
  background:linear-gradient(180deg,#5b5288,#40386a);border:3px solid #8077ad;box-shadow:0 4px 0 rgba(20,12,45,.55)}
.pc.sel{border-color:var(--gold);box-shadow:0 0 0 2px #7a4a00,0 0 14px rgba(255,212,90,.5),0 4px 0 rgba(20,12,45,.55)}
.pc.dis{opacity:.5;filter:grayscale(.75);cursor:not-allowed}
.pc img{width:58px;height:58px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
.pc .ck{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:16px;line-height:1;color:transparent;background:rgba(11,21,48,.5);border:2px solid rgba(255,255,255,.6)}
.pc.sel .ck{color:#fff;background:#2cb02c;border-color:#0b3a0b}
.pwn{font-size:15px;line-height:1.05;min-height:32px;display:grid;place-items:center;padding:0 2px}
.pmn{font-size:12px;line-height:1;color:#ffd9a0}
.pin{font-size:13px;line-height:1.1;color:#d8ecff}.pin.zero{color:#ffb4a0}
.pst{display:flex;align-items:center;justify-content:center;gap:6px}.pst b{min-width:34px;font-size:18px}
.pst button{width:30px;height:30px;border-radius:8px;background:linear-gradient(#ffb02e,#e07a10);box-shadow:0 3px 0 #7a3d08;font:800 20px/1 var(--font-body)}
/* peta */
#mapi .pic img{width:100%;height:100%;object-fit:cover}#mapi .pic svg{width:100%;height:100%;display:block}
/* pemain: avatar asli (wajah karakter + frame), lencana, tombol kecil */
.av{background:#5a5180;border-color:#fff}.av img{width:80%;height:80%;object-fit:contain}.av.av-face{background:none;border:0;box-shadow:none}.av.av-face img{width:100%;height:100%}
.fa .av{border:0;box-shadow:none;font-size:inherit}
.pl .nm{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge svg{width:26px;height:26px;vertical-align:-5px;margin-right:6px}
.team .tc{font-size:20px;opacity:.8}
.af{padding:6px 16px;border-radius:10px;background:linear-gradient(#ff9fba,#d4506f);border:3px solid #7a2540;font:400 22px var(--font-title);text-shadow:0 2px 0 #7a2540;white-space:nowrap}
.af.sent{background:#5a5180;border-color:#2b2550;text-shadow:none;color:#d4cef0}
button.pl.empty{width:100%;cursor:pointer;font:400 30px var(--font-title);color:#e5defc}button.pl.empty:active{transform:scale(.98)}
.pl.lock.static{cursor:default}
#code>span{flex:none}#code b{margin-left:auto;margin-right:16px}
#list{max-height:560px;overflow-y:auto;scrollbar-width:none}#list::-webkit-scrollbar{display:none}
.emp{text-align:center;padding:24px;color:#cfc8ee;font-weight:800;font-size:24px;line-height:1.3}
.on_{color:#7be04a}.wt_{color:#ffc857}
.fr .btn.inv{flex:none}.fr .btn.inv:disabled{filter:grayscale(1) brightness(.7)}
#dr{display:none}.dro #dr{display:grid}
#dr .box{width:900px}#dr .fl{max-height:520px}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <div id="sun"></div><div id="vig"></div>

  <button id="back" aria-label="Kembali ke Mode"><img class="bg" src="assets/ng/komponen/tombol-dan-kontrol/tombol-rumah-abu.webp" alt=""></button>
  <div id="title" class="ttl">GAME ROOM</div>
  <div id="chips"></div>
  <button class="btn" id="leave" aria-label="Keluar ke lobby"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-merah-polos.webp" alt=""><span>KELUAR</span></button>

  <section class="panel" id="equip"><h3>EQUIPMENT</h3><div class="grid" id="eq"></div></section>
  <section class="panel" id="power"><h3>POWER LOADOUT</h3><div id="pcnt"></div><div id="psc"></div></section>
  <section class="panel" id="mapi"><h3>MAP INFORMATION</h3><div class="pic" id="mArt"></div><div class="txt" id="mTxt"></div></section>

  <section class="panel" id="players"><h3>PLAYER ROOM</h3>
    <div id="bar">
      <div id="code"><span id="codeLbl"></span><b id="codeV">------</b><button id="cp1" hidden>SALIN</button></div>
      <button class="btn bsm" id="invB" hidden><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-ungu-polos.webp" alt=""><span>AKSES</span></button>
      <button class="btn bsm" id="invD" hidden><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-biru-polos.webp" alt=""><span>INVITE</span></button>
    </div>
    <div id="list"></div>
    <div id="foot"><div id="why"></div>
      <div id="acts">
        <button class="btn" id="rdy"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-hijau-polos.webp" alt=""><span>READY</span></button>
        <button class="btn gold" id="start"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-kuning-polos.webp" alt=""><span>START GAME</span></button>
      </div></div>
    <span id="cnt" hidden></span>
  </section>

  <div class="modal" id="cm"><div class="box" role="dialog" aria-modal="true" aria-label="Pilih item"><h2 class="ttl" id="cmT"></h2><div class="igrid" id="cmL"></div>
    <div class="mfoot"><button class="btn" id="cmX" style="width:240px;height:84px"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-abu-polos.webp" alt=""><span>TUTUP</span></button></div></div></div>

  <div class="modal" id="inv"><div class="box" role="dialog" aria-modal="true" aria-label="Akses room" style="width:900px"><h2 class="ttl">AKSES ROOM</h2>
    <div class="sw"><button id="sPriv">PRIVAT</button><button id="sPub">PUBLIK</button></div>
    <div class="row2"><div class="field" id="icode"></div><button class="btn cp" id="cCode"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-ungu-polos.webp" alt=""><span>KODE</span></button></div>
    <div class="row2"><div class="field">Link undangan</div><button class="btn cp" id="cLink"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-ungu-polos.webp" alt=""><span>LINK</span></button></div>
    <div class="fl" id="fl"></div>
    <div class="mfoot"><span class="hint" id="slotInfo"></span><button class="btn" id="invX" style="width:240px;height:84px"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-abu-polos.webp" alt=""><span>TUTUP</span></button></div></div></div>

  <div class="modal" id="dr" aria-hidden="true"><div class="box" role="dialog" aria-modal="true" aria-label="Undang Teman"><h2 class="ttl">UNDANG TEMAN</h2>
    <div class="sw"><button id="dTf">TEMAN ONLINE</button><button id="dTp">PEMAIN ONLINE</button></div>
    <div class="fl" id="drL"></div>
    <div class="mfoot"><span class="hint" id="drCnt"></span><button class="btn" id="drX" style="width:240px;height:84px"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-abu-polos.webp" alt=""><span>TUTUP</span></button></div></div></div>

  <div id="toast"></div>
</div>
</div>

<script src="assets/js/item-catalog.js"></script><script src="assets/js/frame-fx.js"></script>
<link rel="stylesheet" href="gameplay/particle-fx.css"><script src="gameplay/particle-fx.js"></script><script src="data/power/power-fx.js"></script>

<script src="assets/js/character-view.js"></script>
<script src="assets/js/player-data.js"></script>
<script src="assets/js/wallet-service.js"></script>
<script src="assets/js/appearance-service.js"></script>

<script>UT.App.init({page:'room'});</script>
<script>
(()=>{
const $=s=>document.querySelector(s),PD=window.PlayerData,IC=window.ItemCatalog,RF=UT.RoomFlow;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1900)}
/* ---------- URL -> konfigurasi room (URL tidak valid -> Mode Selection) ---------- */
const q=new URLSearchParams(location.search),MODE=q.get('mode');
if(RF.MODES.indexOf(MODE)<0){location.replace('mode.html');return}
const ONLINE=MODE==='online',FORMAT=(ONLINE&&q.get('format')==='team')?'team':'solo',TEAM=ONLINE&&FORMAT==='team';
const COUNT=ONLINE?4:Math.min(4,Math.max(2,parseInt(q.get('count'),10)||2));
let HOST=!(ONLINE&&q.get('role')==='guest');
const jc=(q.get('code')||'').toUpperCase(),JOIN=(!HOST&&/^[A-Z0-9]{6,8}$/.test(jc))?jc:null;
const MAP=RF.getMap(),TILES=100;
const MODE_LABEL={vsc:'VS Computer',local:'Multi Player',online:TEAM?'Create Room • Team':'Create Room • Solo'};
const cap=()=>ONLINE?((S.room&&S.room.max)||(TEAM?4:2)):COUNT;
const myName=()=>PD.profile().name||'Kamu',myLevel=()=>PD.levelInfo().level; /* satu rumus dengan profil (PlayerData.levelInfo) */
const eqItem=slot=>IC.byId(PD.equippedId(slot));
const S={invTab:'online',timers:[],room:{privacy:'private',code:'',players:[]},hostT:null,mpIdentity:null,mpRoomId:null,drTab:'friends',sent:{},friends:[],reqSent:{},mpUnsub:null,gameLaunched:false};
const art=it=>it.kind==='skin'?ItemArt.character(it.id):it.kind==='frame'?`<img src="${it.image}" alt="" draggable="false">`:ItemArt.dice(it.id);
function clearT(){S.timers.forEach(clearTimeout);S.timers=[];clearTimeout(S.hostT);S.hostT=null}
/* ---------- navigasi ---------- */
const leave=async to=>{clearT();if(ONLINE&&S.mpRoomId&&S.mpIdentity&&UT.Multiplayer.RoomService){try{await UT.Multiplayer.RoomService.leaveRoom(S.mpRoomId)}catch(e){if(String(e.message||'').includes('GAME_IN_PROGRESS')){toast('Selesaikan permainan sebelum meninggalkan room.');return}console.warn('[multiplayer] leave failed',e)}}if(S.mpUnsub)S.mpUnsub();try{sessionStorage.removeItem('ut-multiplayer-room')}catch(_){}RF.navigate(to)};
$('#back').onclick=()=>leave('mode');$('#leave').onclick=()=>leave('home');
/* ---------- setup room ---------- */
function setup(){
 if(ONLINE){renderRoomHeader();return;}
 const P=[{id:'me',name:myName(),level:myLevel(),ready:true,team:0,kind:'host'}];
 if(MODE==='vsc')for(let i=1;i<COUNT;i++)P.push({id:'b'+i,name:'Bot '+i,level:rand(4,20),ready:true,team:0,kind:'bot'});
 if(MODE==='local')for(let i=1;i<COUNT;i++)P.push({id:'p'+i,name:'Pemain '+(i+1),level:1,ready:true,team:0,kind:'local'});
 S.room={privacy:'private',code:'',players:P}; renderRoomHeader();
}
function randomRoomCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',bytes=new Uint8Array(6);crypto.getRandomValues(bytes);return Array.from(bytes,b=>chars[b%chars.length]).join('')}
function renderRoomHeader(){
 document.documentElement.classList.toggle('mp-online',ONLINE);
 const t=MODE==='vsc'?'VS COMPUTER':MODE==='local'?'MULTI PLAYER':(TEAM?'ROOM TEAM':'ROOM SOLO');
 $('#chips').innerHTML=`<span class="chip">${t}</span><span class="chip">${esc(MAP?MAP.name.replace(/^Map /,''):'-')}</span><span class="chip">${cap()} pemain</span>`+(ONLINE?`<span class="chip on">● ${HOST?'HOST':'TAMU'}</span>`:'<span class="chip">OFFLINE</span>');
 $('#invB').hidden=!(ONLINE&&HOST);$('#invD').hidden=!(ONLINE&&HOST);
 const code=S.room.code||'------';
 $('#codeV').hidden=!ONLINE;$('#cp1').hidden=!ONLINE;
 $('#codeLbl').textContent=ONLINE?'KODE ROOM':(MODE==='vsc'?'Lawan bot — bot otomatis siap':'Satu perangkat, bermain bergantian');
 $('#codeV').textContent=code;$('#icode').textContent='Kode: '+code;
}
function applyRemoteRoom(row){
 if(!row)return;S.mpRoomId=row.id;const wasHost=HOST;HOST=!!(S.mpIdentity&&row.host_id===S.mpIdentity.id);
 if(HOST&&!wasHost&&S.room){toast('Host keluar. Kamu sekarang menjadi host');closeDrawer()} /* host baru dipilih acak oleh server; UI langsung berganti lewat realtime, tanpa refresh */
 S.room={id:row.id,max:Number(row.max_players)||0,status:row.status,privacy:row.is_public?'public':'private',code:row.code,players:(row.players||[]).map(p=>({id:p.id,name:p.name,level:1,ready:!!p.ready,team:Number(p.team)||0,kind:p.id===row.host_id?'host':'player',pub:p.public_profile||null}))};
 renderRoomHeader();
 $('#rdy').hidden=HOST||row.status!=='waiting';$('#start').hidden=!HOST||row.status!=='waiting';
 $('#sPriv').classList.toggle('on',!row.is_public);$('#sPub').classList.toggle('on',!!row.is_public);
 renderPlayers();renderBottom();loadLooks();
 if(row.status==='playing'&&row.game_state&&row.game_state.roomConfig&&!S.gameLaunched&&!(sessionStorage.getItem('ut-mp-exited')===String(row.id))){S.gameLaunched=true;const gameCfg=Object.assign({},row.game_state.roomConfig,{host:HOST,code:row.code,roomId:row.id,roomRevision:row.revision,initialSnapshot:row.game_state.snapshot||null});RF.launch(gameCfg)}
}
/* Profil publik (flexing): hanya ID kosmetik yang sedang dipakai. Gagal = diabaikan (kosmetik, tidak boleh mengganggu room). */
function pubProfile(){const o={};[['characterSkinId','skin'],['diceId','dice'],['frameId','frame'],['effectId','effect']].forEach(([k,slot])=>{try{const v=PD.equippedId(slot);if(typeof v==='string'&&v&&v.length<=48)o[k]=v}catch(e){}});return o}
function publishProfile(){try{if(ONLINE&&S.mpRoomId&&UT.Multiplayer.RoomService&&UT.Multiplayer.RoomService.setPublicProfile)UT.Multiplayer.RoomService.setPublicProfile(S.mpRoomId,pubProfile()).catch(()=>{})}catch(e){}}
async function setupOnline(){
 try{
  const MP=UT.Multiplayer.RoomService;if(!MP)throw new Error('Modul multiplayer belum siap');
  S.mpIdentity=await MP.ensurePlayer();loadFriends();let row;
  try{const AS0=window.UT&&UT.AppearanceService&&UT.AppearanceService.get&&UT.AppearanceService.get();if(AS0&&AS0.pushAppearance)AS0.pushAppearance().catch(()=>{})}catch(e){} /* pastikan tampilan kita ada di server sebelum game dimulai */
  if(HOST){
   let saved=null;try{saved=JSON.parse(sessionStorage.getItem('ut-multiplayer-room')||'null')}catch(_){}
   if(saved&&saved.id){try{row=await MP.getRoom(saved.id);if(!row||row.status!=='waiting'||row.host_id!==S.mpIdentity.id)row=null}catch(_){row=null} }
   if(!row)row=await MP.createRoom({code:randomRoomCode(),name:S.mpIdentity.name,isPublic:false,format:FORMAT,maxPlayers:TEAM?4:2,config:{mode:MODE,format:FORMAT,map:MAP&&MAP.gameKey}});
  }else{if(!JOIN)throw new Error('Kode room tidak valid atau tidak tersedia');row=await MP.joinRoom({code:JOIN,name:S.mpIdentity.name})}
  try{sessionStorage.setItem('ut-multiplayer-room',JSON.stringify({id:row.id,code:row.code}))}catch(_){}
  applyRemoteRoom(row);S.mpUnsub=MP.subscribe(row.id,applyRemoteRoom);publishProfile();
  try{const PR=UT.Multiplayer.Presence;if(PR){const INV=HOST?q.get('invite'):null;PR.start({status:'room'}).then(()=>{if(INV&&/^[0-9a-f-]{36}$/i.test(INV)&&row.code)return PR.invite(INV,{code:row.code,format:FORMAT}).then(()=>toast('Undangan terkirim'))}).catch(()=>{});PR.onChange(()=>{if(root.classList.contains('dro'))renderDrawer()})}}catch(_){}
 }catch(e){console.error('[multiplayer] room setup failed',e);toast('Gagal masuk room: '+(e.message||'Periksa koneksi'));$('#why').textContent='Tidak dapat terhubung ke room. Kembali dan coba lagi.';$('#rdy').disabled=true;$('#start').disabled=true}
}
/* ---------- EQUIPMENT (Dice / Skin / Frame milik pemain; CHANGE -> daftar item yang dimiliki) ---------- */
const EQ=[['dice','DICE','DADU'],['skin','KARAKTER','KARAKTER'],['frame','FRAME','FRAME'],['effect','EFEK','EFEK']];
/* Efek: belum ada item efek di katalog (Shop/Inventory masih "segera"), jadi slot ini baru placeholder */
const EFFECT_ICON='assets/Images/icon/items/efek.webp';
/* Slot KARAKTER = karakter baru (halaman Karakter): gambar kepala dari BlockyCharacter, dimuat malas (three.js hanya dipakai untuk ini). CHANGE -> karakter.html */
let FACE_DONE=false;
function skinArt(it){if(window.UT&&UT.CharacterFace){const h=UT.CharacterFace.html();if(h)return h}return FACE_DONE&&it?art(it):''}
function loadFace(){const L=u=>new Promise(r=>{const e=document.createElement('script');e.src=u;e.onload=e.onerror=()=>r();document.head.appendChild(e)});
 return L('assets/js/vendor/three.min.js').then(()=>L('assets/js/blocky-character.js')).then(()=>L('assets/js/character-face.js')).then(()=>{FACE_DONE=true;renderEq();renderPlayers();loadLooks();try{if(root.classList.contains('dro'))renderDrawer()}catch(e){}if(UT.CharacterFace)UT.CharacterFace.watch(()=>{renderEq();renderPlayers()})})}
function skinGo(){if(ONLINE){toast('Ubah karakter lewat menu Karakter di lobby sebelum masuk room.');return}leave('karakter.html')}
function renderEq(){
 $('#eq').innerHTML=EQ.map(([k,l])=>{const it=k==='effect'?null:eqItem(k);
  const ar=k==='effect'?`<img src="${EFFECT_ICON}" alt="" draggable="false">`:k==='skin'?skinArt(it):(it?art(it):'');
  const nm=k==='effect'?'Segera':k==='skin'?'Kustom':(it?esc(it.name.replace(/^(Frame|Dadu) /,'')):'-');
  return `<button class="slot" data-k="${k}" aria-label="Ganti ${l}"><span class="chg">✎</span><div class="k">${l}</div><span class="art">${ar}</span><div class="v">${nm}</div></button>`}).join('');
}
$('#eq').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;if(b.dataset.k==='skin')return skinGo();openChoice(b.dataset.k)};
let CK=null;
function openChoice(k){if(k==='effect')return toast('Efek segera hadir');CK=k;renderChoice();$('#cm').classList.add('on')}
const closeChoice=()=>$('#cm').classList.remove('on');
function renderChoice(){
 const cur=PD.equippedId(CK),own=IC.items.filter(i=>i.kind===CK&&PD.owns(i.id));
 $('#cmT').textContent='PILIH '+EQ.find(x=>x[0]===CK)[2];
 $('#cmL').innerHTML=own.map(it=>`<button class="it ${cur===it.id?'sel':''}" data-id="${it.id}" ${cur===it.id?'disabled':''}><span class="art">${art(it)}</span><div class="n">${esc(it.name)}</div>${cur===it.id?'<div class="u">DIPAKAI</div>':''}</button>`).join('')||'<div class="emp">Belum ada item.</div>';
}
$('#cmL').onclick=e=>{const b=e.target.closest('[data-id]');if(!b||b.disabled)return;const r=PD.equip(b.dataset.id);if(!r.ok)return toast('Tidak bisa dipakai');renderEq();publishProfile();closeChoice();toast(IC.byId(b.dataset.id).name+' dipakai')};
$('#cmX').onclick=closeChoice;$('#cm').onclick=e=>{if(e.target.id==='cm')closeChoice()};
/* ---------- POWER LOADOUT (koleksi permanen, pilih maks. 5 jenis) ---------- */
const POWERS=IC.items.filter(i=>i.kind==='powerup'&&!i.off),PK='roomPowers'; /* off:true = takedown sementara */
const TMAX=IC.POWER_TYPES_MAX||5,CMAX=IC.POWER_CARRY_MAX||3; /* maks. jenis per match; maks. unit per jenis yang DIBAWA */
function loadP(){try{const d=UT.Prefs.get(PK,{}),eq=(d.equipped||[]).filter((id,i,a)=>POWERS.some(p=>p.id===id)&&a.indexOf(id)===i).slice(0,TMAX),cy={};eq.forEach(id=>{const n=Math.floor(Number(d.carry&&d.carry[id]));cy[id]=n>=1?n:1});return{equipped:eq,carry:cy}}catch(e){return{equipped:[],carry:{}}}}
const MAPKEY=MAP&&MAP.gameKey,pOk=id=>IC.powerOnMap(id,MAPKEY);/* Power per map: tidak cocok dengan map = tidak bisa dipilih/dibawa (stok tidak berkurang) */
const PW=loadP();const saveP=()=>{try{UT.Prefs.set(PK,PW)}catch(e){}};
/* Stok Power = Inventory akun yang sedang bergabung (server). Loadout hanya MEMILIH jumlah yang dibawa: stok TIDAK berkurang di sini,

$('#invD').onclick=()=>openDrawer('friends');$('#drX').onclick=closeDrawer;
addEventListener('keydown',e=>{if(e.key==='Escape'){closeInvite();closeChoice();closeDrawer()}});
addEventListener('pagehide',clearT);
/* ---------- init ---------- */
setup();renderEq();renderPower();renderMap();renderPlayers();renderBottom();loadFace();
try{UT.Events.on('inventoryChanged',()=>renderPower())}catch(e){} /* stok Power ikut terbarui saat Inventory server selesai dimuat / berubah */
if(ONLINE){addEventListener('ut:multiplayer-ready',()=>setupOnline(),{once:true});if(UT.Multiplayer&&UT.Multiplayer.RoomService)setupOnline();}
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform='scale('+s+')'}
addEventListener('resize',fit);fit();
/* stok Power = Inventory server: segarkan & ikut berubah tanpa refresh (pola sama dengan lobby/mode) */
try{if(PD.serverMode&&PD.serverMode()&&UT.WalletService&&UT.WalletService.get()){UT.WalletService.get().refresh();if(UT.LiveSync){UT.LiveSync.add('wallet',()=>UT.WalletService.get().refresh());UT.LiveSync.start({interval:20000})}}}catch(e){}
document.documentElement.classList.add('ut-ready');
})();

</script>
<script type="module">
import './assets/js/multiplayer/room-service.js';
import './assets/js/multiplayer/presence.js';
window.dispatchEvent(new Event('ut:multiplayer-ready'));
</script>
