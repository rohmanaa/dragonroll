<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="assets/js/core/page-shell.js"></script>
<script>UT.PageShell.renderBase();</script>
<title>Game Room</title><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any">

<link rel="stylesheet" href="assets/css/pages/room-legacy.css"><link rel="stylesheet" href="assets/css/pages/room.css"><link rel="stylesheet" href="assets/css/bg.css">

</head>
<body class="dm">
<div id="wrap">
<div id="stage">
  <div id="sun"></div><div id="vig"></div>

  <button id="back" aria-label="Kembali ke Mode"><img class="bg" src="assets/images/buttons/tombol-rumah-abu.webp" alt=""></button>
  <div id="title" class="ttl">GAME ROOM</div>
  <div id="chips"></div>
  <button class="btn" id="leave" aria-label="Keluar ke lobby"><img src="assets/images/ui/buttons-and-controls/tombol-merah-polos.webp" alt=""><span>KELUAR</span></button>

  <section class="panel" id="equip"><h3>EQUIPMENT</h3><div class="grid" id="eq"></div></section>
  <section class="panel" id="power"><h3>POWER <button type="button" id="powerPage" aria-label="Buka Power-up" title="Power-up"><img src="assets/images/ui/gem-medal-icons/petir-ungu.webp" alt=""></button></h3><div id="pcnt"></div><div class="row" id="prow" aria-label="Lima slot Power"></div><div class="info" id="pinfo"></div></section>
  <section class="panel" id="mapi"><h3>MAP INFORMATION</h3><div class="pic" id="mArt"></div><div class="txt" id="mTxt"></div></section>

  <section class="panel" id="players"><h3>PLAYER ROOM</h3>
    <div id="bar">
      <div id="code"><span id="codeLbl"></span><b id="codeV">------</b><button id="cp1" hidden>SALIN</button></div>
      <button class="btn bsm" id="invB" hidden><img src="assets/images/buttons/tombol-ungu-polos.webp" alt=""><span>AKSES</span></button>
      <button class="btn bsm" id="invD" hidden><img src="assets/images/ui/buttons-and-controls/tombol-biru-polos.webp" alt=""><span>INVITE</span></button>
    </div>
    <div id="list"></div>
    <div id="foot"><div id="why"></div>
      <div id="acts">
        <button class="btn" id="rdy"><img src="assets/images/ui/buttons-and-controls/tombol-hijau-polos.webp" alt=""><span>READY</span></button>
        <button class="btn gold" id="start"><img src="assets/images/ui/buttons-and-controls/tombol-kuning-polos.webp" alt=""><span>START GAME</span></button>
      </div></div>
    <span id="cnt" hidden></span>
  </section>

  <div class="modal" id="inv"><div class="box" role="dialog" aria-modal="true" aria-label="Akses room" style="width:900px"><h2 class="ttl">AKSES ROOM</h2>
    <div class="sw"><button id="sPriv">PRIVAT</button><button id="sPub">PUBLIK</button></div>
    <div class="row2"><div class="field" id="icode"></div><button class="btn cp" id="cCode"><img src="assets/images/buttons/tombol-ungu-polos.webp" alt=""><span>KODE</span></button></div>
    <div class="row2"><div class="field">Link undangan</div><button class="btn cp" id="cLink"><img src="assets/images/buttons/tombol-ungu-polos.webp" alt=""><span>LINK</span></button></div>
    <div class="fl" id="fl"></div>
    <div class="mfoot"><span class="hint" id="slotInfo"></span><button class="btn" id="invX" style="width:240px;height:84px"><img src="assets/images/buttons/tombol-abu-polos.webp" alt=""><span>TUTUP</span></button></div></div></div>

  <div class="modal" id="dr" aria-hidden="true"><div class="box" role="dialog" aria-modal="true" aria-label="Undang Teman"><h2 class="ttl">UNDANG TEMAN</h2>
    <div class="sw"><button id="dTf">TEMAN ONLINE</button><button id="dTp">PEMAIN ONLINE</button></div>
    <div class="fl" id="drL"></div>
    <div class="mfoot"><span class="hint" id="drCnt"></span><button class="btn" id="drX" style="width:240px;height:84px"><img src="assets/images/buttons/tombol-abu-polos.webp" alt=""><span>TUTUP</span></button></div></div></div>

  <div id="toast"></div>
</div>
<div id="pageModal" role="dialog" aria-modal="true" aria-label="Halaman equipment" aria-hidden="true" aria-busy="false">
  <div id="pageModalLoading" role="status" aria-label="Memuat"><img src="assets/images/ui/hud/efek-titik-berputar.webp" alt=""></div>
  <iframe id="pageModalFrame" title="Equipment" tabindex="0" allow="fullscreen; autoplay"></iframe>
</div>
<div class="fw" id="pm" role="dialog" aria-modal="true" aria-labelledby="pmT" aria-hidden="true"><div class="fwin">
  <button type="button" class="fwx" id="pmX" aria-label="Tutup">✕</button>
  <h2 class="ttl" id="pmT">PILIH POWER</h2><div class="igrid" id="pmL"></div>
  <div class="mfoot"><span class="hint" id="pmHint"></span><button class="btn" id="pdone" style="width:240px;height:84px"><img src="assets/images/ui/buttons-and-controls/tombol-hijau-polos.webp" alt=""><span>SELESAI</span></button></div></div></div>
<div class="fw" id="em" role="dialog" aria-modal="true" aria-labelledby="emT" aria-hidden="true"><div class="fwin">
  <button type="button" class="fwx" id="emX" aria-label="Tutup">✕</button>
  <h2 class="ttl" id="emT">PILIH DADU</h2><div class="igrid" id="emL"></div>
  <div class="mfoot"><span class="hint" id="emHint"></span></div></div></div>
</div>

ory/power/diamond_sword/manifest.js"></script><script src="data/inventory/power/netherite_sword/manifest.js"></script><script src="data/inventory/power/wooden_shield/manifest.js"></script><script src="data/inventory/power/golden_apple/manifest.js"></script><script src="data/inventory/power/fire_charge/manifest.js"></script><script src="data/inventory/power/ice_crystal/manifest.js"></script><script src="data/inventory/power/blaze_core/manifest.js"></script><script src="data/inventory/power/trident/manifest.js"></script><script src="data/inventory/power/dragon_crystal/manifest.js"></script><script src="data/inventory/power/nether_star/manifest.js"></script><script src="data/inventory/power/index.js"></script><script src="data/inventory/character/steve/manifest.js"></script><script src="data/inventory/character/alex/manifest.js"></script><script src="data/inventory/character/creeper/manifest.js"></script><script src="data/inventory/character/zombie/manifest.js"></script><script src="data/inventory/character/skeleton/manifest.js"></script><script src="data/inventory/character/ender/manifest.js"></script><script src="data/inventory/character/index.js"></script><script src="assets/js/item-catalog.js"></script><script src="data/inventory/frame/_shared/js/frame-fx.js"></script>

<script src="assets/js/room-flow.js"></script>

<script type="module" src="data/inventory/dice/_shared/js/room-dice-art.js"></script>
