<!doctype html>
<html lang="id"><head><base href="/"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script type="module" src="src/boot/splash-boot.js"></script>
<title>DRAGON ROLL</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any">

<link rel="stylesheet" href="src/components/button/button.css"><link rel="stylesheet" href="src/components/modal/modal-kit.css"><link rel="stylesheet" href="src/styles/splash.css"><link rel="stylesheet" href="src/styles/night-fog.css">
<style>
/* tambahan data asli: mode cepat (guard mengalihkan di tengah sesi), tombol sibuk */
body.quick #loadbox,body.quick #spin{visibility:hidden}
.btn[disabled]{opacity:.6;pointer-events:none}
</style>

</head>
<body class="splash">
<div id="scene">
  <div id="cave"><i id="beam"></i><i id="floor"></i></div>
  <canvas id="splashfx" aria-hidden="true"></canvas>
  <img id="spin" src="assets/images/ui/hud/efek-titik-berputar.webp" alt="">
  <div id="vig"></div>

  <div id="loadbox" class="pb green">
    <div id="lbl" class="pb-label">Loading… 0%</div>
    <div id="bar" class="pb-bar"><i id="fill" class="fill"></i></div>
    <!-- SYSTEM LOG: satu baris di atas bar loading (kategori yang sedang dimuat), diisi splash.js dari UT_Preload.onFile -->
    <div id="syslog" aria-hidden="true"></div>
  </div>
  <!-- TAP TO START: muncul setelah loading selesai & sudah login -->
  <div id="intro">
    <div id="lg"><div class="rb"><img src="assets/images/ui/logo/pita-merah-kosong.webp" alt=""><b>DRAGON ROLL</b></div></div>
    <button id="tapbox" aria-label="Tap to start"><span>TAP TO START</span></button>
    <div id="hi"></div>
  </div>
  <button class="btn ut-gl ut-c-y" id="loginbtn" hidden><img src="assets/images/ui/buttons-and-controls/tombol-biru-polos.webp" alt=""><span>Login</span></button>

  <!-- LOGIN (username + password; akun asli lewat UT.Auth) -->
  <div class="amodal" id="m-login"><div class="dlg ut-mk" role="dialog" aria-modal="true" aria-labelledby="t-login">
    <h3 class="ut-mk-t" id="t-login">Login</h3><button class="ut-mk-x ut-gl ut-c-r" type="button" data-close aria-label="Tutup"></button>
    <div class="df">
      <label class="inp"><img src="assets/images/ui/white-glyphs/pengguna.webp" alt=""><input id="li-id" maxlength="16" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="inp"><img src="assets/images/ui/white-glyphs/gembok.webp" alt=""><input id="li-pw" type="password" placeholder="Password" autocomplete="current-password"></label>
      <div class="err" id="li-err"></div>
      <button class="btn blue ut-gl ut-c-y" id="li-ok"><img src="assets/images/ui/buttons-and-controls/tombol-biru-polos.webp" alt=""><span>Login</span></button>
      <div class="foot c">Belum punya akun? <a id="to-signup" href="#">Sign up</a></div>
    </div>
  </div></div>

  <!-- SIGN UP -->
  <div class="amodal" id="m-signup"><div class="dlg ut-mk" role="dialog" aria-modal="true" aria-labelledby="t-signup">
    <h3 class="ut-mk-t" id="t-signup">Sign up</h3><button class="ut-mk-x ut-gl ut-c-r" type="button" data-close aria-label="Tutup"></button>
    <div class="df">
      <label class="inp"><img src="assets/images/ui/white-glyphs/pengguna.webp" alt=""><input id="su-us" maxlength="16" placeholder="Username (3–16: huruf, angka, _)" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="inp"><img src="assets/images/ui/white-glyphs/gembok.webp" alt=""><input id="su-pw" type="password" placeholder="Password (min. 6 karakter)" autocomplete="new-password"></label>
      <label class="rem tos" for="su-tos"><input type="checkbox" id="su-tos"><span class="cb"></span><span class="tt">Saya setuju dengan <a href="tos.html" target="_blank" rel="noopener">Ketentuan Layanan</a> dan <a href="tos.html#privasi" target="_blank" rel="noopener">Kebijakan Privasi</a></span></label>
      <div class="err" id="su-err"></div>
      <button class="btn blue ut-gl ut-c-y" id="su-ok"><img src="assets/images/ui/buttons-and-controls/tombol-biru-polos.webp" alt=""><span>Sign up</span></button>
      <div class="foot c">Sudah punya akun? <a id="to-login" href="#">Log in</a></div>
    </div>
  </div></div>
  <div id="ver" data-app-version hidden></div>
</div>
<!-- layar hitam transisi keluar: splash.js go() menambah kelas .on (gaya di styles/common.css). Wajib ada, jika tidak TAP TO START macet. -->
<div id="fade"></div>
</body></html>
