<!doctype html>
<html lang="id"><head><script src="assets/js/frame-guard.js"></script><script src="assets/js/session.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DRAGON ROLL</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ng/css/common.css"><link rel="stylesheet" href="assets/ng/css/splash.css">
<style>
/* tambahan data asli: mode cepat (guard mengalihkan di tengah sesi), tombol sibuk */
body.quick #loadbox,body.quick #spin{visibility:hidden}
.btn[disabled]{opacity:.6;pointer-events:none}
</style>
</head>
<body class="splash">
<div id="scene">
  <div id="cave"><i id="beam"></i><i id="floor"></i></div>
  <canvas id="splashfx" aria-hidden="true"></canvas>
  <img id="spin" src="assets/ng/komponen/hud/efek-titik-berputar.webp" alt="">
  <div id="vig"></div>

  <div id="loadbox">
    <img class="frm" src="assets/ng/komponen/logo/bar-loading-bingkai-kosong.webp" alt="">
    <div id="bar"><i id="fill"></i></div>
    <div id="lbl">Loading… 0%</div>
  </div>
  <!-- TAP TO START: muncul setelah loading selesai & sudah login -->
  <div id="intro">
    <div id="lg"><div class="rb"><img src="assets/ng/komponen/logo/pita-merah-kosong.webp" alt=""><b>DRAGON ROLL</b></div></div>
    <button id="tapbox" aria-label="Tap to start"><span>TAP TO START</span></button>
    <div id="hi"></div>
  </div>
  <button class="btn" id="loginbtn" hidden><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-biru-polos.webp" alt=""><span>Login</span></button>

  <!-- LOGIN (username + password; akun asli lewat UT.Auth) -->
  <div class="amodal" id="m-login"><div class="dlg">
    <div class="dh"><span>Login</span><button class="x" data-close aria-label="Tutup"><img src="assets/ng/komponen/glyph-putih/silang.webp" alt=""></button></div>
    <div class="df">
      <label class="inp"><img src="assets/ng/komponen/glyph-putih/pengguna.webp" alt=""><input id="li-id" maxlength="16" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="inp"><img src="assets/ng/komponen/glyph-putih/gembok.webp" alt=""><input id="li-pw" type="password" placeholder="Password" autocomplete="current-password"></label>
      <div class="err" id="li-err"></div>
      <button class="btn blue" id="li-ok"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-biru-polos.webp" alt=""><span>Login</span></button>
      <div class="foot c">Belum punya akun? <a id="to-signup" href="#">Sign up</a></div>
    </div>
  </div></div>

  <!-- SIGN UP -->
  <div class="amodal" id="m-signup"><div class="dlg">
    <div class="dh"><span>Sign up</span><button class="x" data-close aria-label="Tutup"><img src="assets/ng/komponen/glyph-putih/silang.webp" alt=""></button></div>
    <div class="df">
      <label class="inp"><img src="assets/ng/komponen/glyph-putih/pengguna.webp" alt=""><input id="su-us" maxlength="16" placeholder="Username (3–16: huruf, angka, _)" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="inp"><img src="assets/ng/komponen/glyph-putih/gembok.webp" alt=""><input id="su-pw" type="password" placeholder="Password (min. 6 karakter)" autocomplete="new-password"></label>
      <div class="err" id="su-err"></div>
      <button class="btn blue" id="su-ok"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-biru-polos.webp" alt=""><span>Sign up</span></button>
      <div class="foot c">Sudah punya akun? <a id="to-login" href="#">Log in</a></div>
    </div>
  </div></div>
</div>
<div id="fade"></div>
<script src="assets/js/splash-fx.js"></script><script>UT.SplashFX&&UT.SplashFX.mount()</script>
<script src="assets/js/item-catalog.js"></script>
<script src="assets/js/player-data.js"></script>
<script src="assets/js/preloader.js"></script>
<script type="module" src="assets/js/auth.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const q=new URLSearchParams(location.search);
/* tujuan: halaman yang sedang dibuka (guard) atau lobby; hanya file .html lokal */
const nx=q.get("next")||"lobby.html";
const dest=/^[a-z0-9_-]+\.html(\?[^#]*)?$/i.test(nx)&&!/^(splash|loading)\.html/i.test(nx)?nx:"lobby.html";
let booted=false;try{booted=sessionStorage.getItem("ut:booted")==="1"}catch(e){}
const quick=!!q.get("next")&&booted; /* dialihkan guard di tengah sesi: tanpa bar, langsung masuk bila sudah login */
const ASSETS=[
  'assets/css/base.css',
  'assets/css/shared-ui.css',
  'assets/css/scene-bg.css',
  'assets/js/scene-bg.js',
  'assets/js/floating-island.js',
  'assets/js/character-data.js',
  'assets/js/character-view.js',
  'assets/js/mob-view.js',
  'assets/js/landscape.js',
  'assets/js/boot-guard.js',
  'assets/js/item-catalog.js',
  'assets/js/item-art.js',
  'assets/js/player-data.js',
  'assets/js/app.js',
  'assets/js/game-integration.js',
  'hud/ui-core.js',
  'hud/components/button.css',
  'hud/components/button.js',
  'assets/sfx/ui/button-click.mp3',
  'assets/sfx/ui/chest-reward.mp3',
  'assets/sfx/ui/game-lose.mp3',
  'assets/sfx/ui/power-claim.mp3',
  'shop.html',
  'karakter.html',
  'frame.html',
  'dadu.html',
  'efek.html',
  'powerup.html',
  'hadiah-misi.html',
  'profile.html',
  'lobby.html',
  'mode.html',
  'room.html',
  'gameplay.html',
  'settings.html',
  'leaderboard.html',
  'misi.html',
  'friendship.html',
  'tambang.html',
  'dailyreward.html',
  'promosi/placeholder.webp',
  'data/power/3d/sword.png',
  'data/power/3d/feather.png',
  'data/power/3d/tnt.png',
  'data/power/3d/totem.png',
  'data/power/3d/potion_odd.png',
  'data/power/3d/potion_even.png',
  'data/power/3d/grass.png',
  'assets/js/vendor/three.min.js',
  'https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap'
];
ASSETS.unshift(dest.split("?")[0]);
let pct=0;
function setPct(p){pct=p;$("#fill").style.width=p+"%";$("#lbl").textContent="Loading… "+Math.round(p)+"%"}
let leaving=false;
function go(){
  if(leaving)return;leaving=true;
  try{sessionStorage.setItem("ut:booted","1");sessionStorage.setItem("ut:fadein","1")}catch(e){}
  $("#fade").classList.add("on");
  const rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(()=>location.replace(dest),rm?150:700);
}
/* TAP TO START: muncul setelah loading selesai & sudah login; sentuh layar -> tujuan */
let tapped=false;
function showTap(username){
  if(quick){go();return}
  document.body.classList.add("ready");$("#hi").textContent=username?"Halo, "+username:"";
  const t0=Date.now(),start=()=>{if(tapped||Date.now()-t0<600)return;tapped=true;go()};
  $("#intro").onclick=start;
  addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")start()});
}
/* tunggu modul akun (ES module) siap, lalu cek sesi tersimpan */
function authReady(){return new Promise(res=>{if(window.UT&&UT.Auth)return res(true);addEventListener("ut:auth-module-ready",()=>res(true),{once:true});setTimeout(()=>res(false),8000)})}
function afterLoad(){
  authReady().then(ok=>ok?UT.Auth.check():null).then(user=>{
    if(user)showTap(user.username);else openLogin();
  }).catch(()=>openLogin());
}
try{window.PlayerData&&PlayerData.snapshot()}catch(e){} /* jalankan migrasi/muat state sekali sebelum halaman tampil */
if(quick){document.body.classList.add("quick");afterLoad()}
else UT_Preload.runAuto(ASSETS,p=>{setPct(p)}).then(()=>{setPct(100);setTimeout(afterLoad,300)});

/* ---- dialog login / sign up ---- */
const ML=$("#m-login"),MS=$("#m-signup");
function show(m){ML.classList.toggle("on",m===ML);MS.classList.toggle("on",m===MS);$("#loginbtn").hidden=!!m||document.body.classList.contains("ready")}
function setErr(id,t,info){const e=$(id);e.textContent=t||"";e.classList.toggle("info",!!info)}
function openLogin(prefill){show(ML);setErr("#li-err","");$("#li-pw").value="";if(prefill)$("#li-id").value=prefill;setTimeout(()=>(prefill?$("#li-pw"):$("#li-id")).focus(),60)}
function openSignup(){show(MS);setErr("#su-err","");setTimeout(()=>$("#su-us").focus(),60)}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>show(null));
$("#loginbtn").onclick=()=>openLogin();
$("#to-signup").onclick=e=>{e.preventDefault();openSignup()};
$("#to-login").onclick=e=>{e.preventDefault();openLogin()};
document.querySelectorAll(".inp input").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter"){(i.closest("#m-login")?$("#li-ok"):$("#su-ok")).click()}}));

/* aksi akun asli: validasi & pesan galat dari UT.Auth (username 3–16, password min. 6) */
async function submit(btn,errId,fn){
  setErr(errId,"");btn.disabled=true;const lbl=btn.querySelector("span"),t=lbl.textContent;lbl.textContent="Tunggu...";
  try{
    if(!(window.UT&&UT.Auth))throw new Error("Modul akun belum siap. Muat ulang halaman.");
    const user=await fn();show(null);showTap(user.username);
  }catch(e){setErr(errId,(e&&e.message)||"Gagal. Coba lagi.")}
  btn.disabled=false;lbl.textContent=t;
}
$("#li-ok").onclick=()=>submit($("#li-ok"),"#li-err",()=>UT.Auth.signIn($("#li-id").value,$("#li-pw").value));
$("#su-ok").onclick=()=>submit($("#su-ok"),"#su-err",()=>UT.Auth.signUp($("#su-us").value,$("#su-pw").value));
document.documentElement.classList.add("ut-ready");
})();
</script>
</body></html>
