<!doctype html>
<html lang="id"><head><script src="assets/js/frame-guard.js"></script><script src="assets/js/session.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DRAGON ROLL</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/ng/css/common.css"><link rel="stylesheet" href="assets/ng/css/splash.css"><link rel="stylesheet" href="assets/css/night-fog.css"><script src="assets/js/pwa.js"></script><script src="assets/js/prefs.js"></script><script src="assets/js/ambience.js"></script>
<style>
/* tambahan data asli: mode cepat (guard mengalihkan di tengah sesi), tombol sibuk */
body.quick #loadbox,body.quick #spin{visibility:hidden}
.btn[disabled]{opacity:.6;pointer-events:none}
</style>

</head>
<body class="splash">
<div id="scene">
  <div id="cave"><i id="beam"></i><i id="floor"></i></div>
  <canvas id="splashfx" aria-hidden="true"></canvas>
  <img id="spin" src="assets/ng/komponen/hud/efek-titik-berputar.webp" alt="">
  <div id="vig"></div>

  <div id="loadbox">
    <img class="frm" src="assets/ng/komponen/logo/bar-loading-bingkai-kosong.webp" alt="">
    <div id="bar"><i id="fill"></i></div>
    <div id="lbl">Loading… 0%</div>
  </div>
  <!-- TAP TO START: muncul setelah loading selesai & sudah login -->
  <div id="intro">
    <div id="lg"><div class="rb"><img src="assets/ng/komponen/logo/pita-merah-kosong.webp" alt=""><b>DRAGON ROLL</b></div></div>
    <button id="tapbox" aria-label="Tap to start"><span>TAP TO START</span></button>
    <div id="hi"></div>
  </div>
  <button class="btn" id="loginbtn" hidden><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-biru-polos.webp" alt=""><span>Login</span></button>

  <!-- LOGIN (username + password; akun asli lewat UT.Auth) -->
  <div class="amodal" id="m-login"><div class="dlg">
    <div class="dh"><span>Login</span><button class="x" data-close aria-label="Tutup"><img src="assets/ng/komponen/glyph-putih/silang.webp" alt=""></button></div>
    <div class="df">
      <label class="inp"><img src="assets/ng/komponen/glyph-putih/pengguna.webp" alt=""><input id="li-id" maxlength="16" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="inp"><img src="assets/ng/komponen/glyph-putih/gembok.webp" alt=""><input id="li-pw" type="password" placeholder="Password" autocomplete="current-password"></label>
      <div class="err" id="li-err"></div>
      <button class="btn blue" id="li-ok"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-biru-polos.webp" alt=""><span>Login</span></button>
      <div class="foot c">Belum punya akun? <a id="to-signup" href="#">Sign up</a></div>
    </div>
  </div></div>

  <!-- SIGN UP -->
  <div class="amodal" id="m-signup"><div class="dlg">
    <div class="dh"><span>Sign up</span><button class="x" data-close aria-label="Tutup"><img src="assets/ng/komponen/glyph-putih/silang.webp" alt=""></button></div>
    <div class="df">
      <label class="inp"><img src="assets/ng/komponen/glyph-putih/pengguna.webp" alt=""><input id="su-us" maxlength="16" placeholder="Username (3–16: huruf, angka, _)" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="inp"><img src="assets/ng/komponen/glyph-putih/gembok.webp" alt=""><input id="su-pw" type="password" placeholder="Password (min. 6 karakter)" autocomplete="new-password"></label>
      <div class="err" id="su-err"></div>
      <button class="btn blue" id="su-ok"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-biru-polos.webp" alt=""><span>Sign up</span></button>
      <div class="foot c">Sudah punya akun? <a id="to-login" href="#">Log in</a></div>
    </div>
  </div></div>
</div>
<div id="fade"></div>
<script src="assets/js/splash-fx.js"></script><script>UT.SplashFX&&UT.SplashFX.mount()</script>
<script src="assets/js/night-fog.js"></script><script>/* TAP TO START malam: kabut tipis di dasar layar (di atas latar & vinyet, di bawah tombol/UI) */
(function(){var h=document.getElementById("scene");if(h&&UT.NightFog)UT.NightFog.mount(h,{variant:"bottom",after:document.getElementById("vig")})})();</script>
<script src="assets/js/item-catalog.js"></script>
<script src="assets/js/player-data.js"></script>
<script src="assets/js/preloader.js"></script>
<script type="module" src="assets/js/auth.js"></script>
<script src="assets/js/pages/splash.js"></script>
</body></html>
