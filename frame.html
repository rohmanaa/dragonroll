<style id="inventory-fluid-layout">
/* LANDSCAPE: stage dasar 100rem x 56.25rem menempel di kiri-atas. Panel kanan (#bot) sekarang
   ditarik sampai tepi kanan layar, dan kolom kiri ditambatkan ke bawah layar, jadi tidak ada
   ruang kosong di rasio layar apa pun (4:3, 16:9, 21:9). Portrait memakai aturan mobile di atas. */
@media (min-aspect-ratio:1/1){
  #show{height:auto;bottom:17.7rem}
  #info{top:auto;bottom:10.6rem}
  #rec{top:auto;bottom:1.6rem}
  #bot{
    left:45.1rem;right:1.4rem;top:8rem;bottom:1.6rem;
    width:auto;height:auto;
    container-type:inline-size;
  }
  /* grid: jumlah kolom menyesuaikan lebar panel, kartu tetap proporsional, scroll bila item banyak */
  #gwrap{overflow:hidden}
  #grid{
    height:100%;padding:.6rem;
    overflow-x:hidden;overflow-y:auto;
    grid-template-columns:repeat(auto-fill,minmax(11.4rem,1fr));
    grid-template-rows:none;grid-auto-rows:16.4rem;align-content:start;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.5) transparent;
  }
  .card{min-width:0}
  .card .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis}
}
/* PORTRAIT: thumbnail "terbaru" menyusut agar panah kanan tidak terpotong */
@media (max-aspect-ratio:1/1){
  #rlist{min-width:0;gap:.6rem}
  .rt{flex:1 1 0;min-width:0;max-width:5.3rem;height:auto;aspect-ratio:1}
}
</style>
<style id="inventory-pixel">

<script>
(()=>{
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString('id-ID');
// ---- data: inventory BUKAN database sendiri. Item & kepemilikan dibaca dari ItemCatalog + PlayerData.
const PD=window.PlayerData,IC=window.ItemCatalog,AR=window.ItemArt;
const SV=()=>PD.serverMode(),WS=()=>window.UT&&UT.WalletService&&UT.WalletService.get();   /* B5: akun login + flag = dompet server */
const WMSG={'saldo-kurang':'Coin tidak cukup.','gem-kurang':'Gem tidak cukup.','jaringan':'Tidak dapat terhubung ke server.','belum-login':'Silakan login ulang.','sedang-diproses':'Sedang diproses...'};
const RN={common:'COMMON',rare:'RARE',epic:'EPIC',legendary:'LEGENDARY'},RC={common:'var(--r0)',rare:'var(--r1)',epic:'var(--r2)',legendary:'var(--r3)'};
const BG={common:['#5a8aa8','#2f5f80'],rare:['#3a8ff0','#1b55c0'],epic:['#8a4ae0','#4a2aa8'],legendary:['#f0c040','#b98020']};
const KINDS=['skin','frame','dice','powerup'];   /* Map bukan item inventory */
const CI={};KINDS.forEach(k=>CI[k]=IC.items.filter(i=>i.kind===k));
const SOON={effect:'Efek'}; /* Efek: belum ada item di katalog (kerangka kosong) */
const NAV=[['skin','Karakter','karakter.html'],['frame','Frame','frame.html'],['dice','Dadu','dadu.html'],['effect','Efek','efek.html'],['powerup','Power-up','powerup.html']];
const CATS=NAV;
const catImg=k=>k==='frame'?'<img class="ci" src="'+IC.FRAME_TAB_ICON+'" alt="" draggable="false">':'<img class="ci" src="assets/Images/icon/items/'+({skin:'skin',dice:'dadu',powerup:'power',effect:'efek',emote:'emote'}[k]||'skin')+'.webp" alt="" draggable="false">';
const icon=p=>`<svg viewBox="0 0 24 24"><path d="${p}" fill="#fff" stroke="#fff" stroke-width="1.800" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
const DM='<svg viewBox="0 0 24 24"><path d="M3.34 7L12 2l0 4.3-4.94 2.85z" fill="#62e178"/><path d="M12 2l8.66 5-3.72 2.15L12 6.3z" fill="#47d85f"/><path d="M20.66 7v10l-3.72-2.15v-5.7z" fill="#3dcb55"/><path d="M20.66 17L12 22v-4.3l4.94-2.85z" fill="#32a643"/><path d="M12 22l-8.66-5 3.72-2.15L12 17.7z" fill="#2a8d3a"/><path d="M3.34 17V7l3.72 2.15v5.7z" fill="#37b44c"/><path d="M12 6.3l4.94 2.85v5.7L12 17.7l-4.94-2.85v-5.7z" fill="#a7e6b1"/><path d="M12 6.3l4.94 2.85L12 12 7.06 9.15z" fill="#c4f2cc" opacity=".7"/></svg>';
const CM='<svg viewBox="0 0 24 24"><path d="M12 12V.24A11.76 11.76 0 0 0 .24 12z" fill="#ffd12b"/><path d="M12 12h11.76A11.76 11.76 0 0 0 12 .24z" fill="#ffb800"/><path d="M12 12v11.76A11.76 11.76 0 0 0 23.76 12z" fill="#ffd12b"/><path d="M12 12H.24A11.76 11.76 0 0 0 12 23.76z" fill="#ffb800"/><circle cx="12" cy="12" r="8.75" fill="#ff8a00"/><g fill="#ffb901"><circle cx="18.90" cy="12.00" r=".6"/><circle cx="16.88" cy="16.88" r=".6"/><circle cx="12.00" cy="18.90" r=".6"/><circle cx="7.12" cy="16.88" r=".6"/><circle cx="5.10" cy="12.00" r=".6"/><circle cx="7.12" cy="7.12" r=".6"/><circle cx="12.00" cy="5.10" r=".6"/><circle cx="16.88" cy="7.12" r=".6"/></g><path d="M12 7.2l3.9 4.8-3.9 4.8-3.9-4.8z" fill="#ffd12b" stroke="#ffd12b" stroke-width="1" stroke-linejoin="round"/></svg>';
// ---- state: tidak ada let coins/gems/own/eq permanen. Key legacy 'inv' tidak ditulis lagi.
/* Efek visual Power (data/power/power-fx.js): partikel keluar saat Power dipilih/dilihat; catatan efek ikut tampil di deskripsi. Modul tak termuat -> dilewati. */
const PFX={at(i,el){try{if(i&&i.kind==='powerup'&&window.UT&&UT.PowerFX)UT.PowerFX.playAtElement(i.gameKey,el||document.getElementById('show'))}catch(e){}},
 note(i){try{const d=i&&i.kind==='powerup'&&window.UT&&UT.PowerFX&&UT.PowerFX.DATA[i.gameKey];return d?' Efek: '+d.note+'.':''}catch(e){return''}}};
const PAGE='frame';let cat=PAGE,sel=null;
const SET=()=>PD.settings();
/* Item yang dimiliki utk kategori: [{item, equipped}] — langsung dari PlayerData */
const isPU=i=>i&&i.kind==='powerup';
const isOwned=i=>isPU(i)?PD.qty(i.id)>0:PD.owns(i.id);
const canSell=i=>!!i&&!isPU(i)&&typeof i.price==='number'&&i.price>0&&!i.starter;
const COIN='<img src="assets/Images/icon/currency/coin.webp" alt="" draggable="false">';
/* semua item kategori: yang belum dimiliki tetap tampil (terkunci) dan bisa di-preview */
const ownedList=c=>(CI[c]||[]).map(i=>({item:i,owned:isOwned(i),equipped:!isPU(i)&&PD.isEquipped(i.id)}));
const equippedItem=c=>{const it=IC.byId(PD.equippedId(c));return it&&it.kind===c?it:null};
const SFX={click:'button',select:'button',open:'button',error:'button',coin:'button',purchase:'power',chest:'chest'};
function playSound(n){if(!SET().sound)return;try{UT.Audio.play(SFX[n]||'button')}catch(e){}}
const buzz=()=>{if(SET().vibration&&navigator.vibrate)navigator.vibrate(15)};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
function sparkle(el,n=12){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;for(let i=0;i<n;i++){const s=document.createElement('i');s.className='sp';s.style.left=cx+'px';s.style.top=cy+'px';const a=Math.random()*6.28,d=30+Math.random()*60;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}
// ---- sky
(()=>{const sk=$('#sky');[[5,60,6],[18,30,4],[30,70,5],[62,16,5],[86,48,7],[92,12,4],[2,20,5],[75,75,6],[45,85,4]].forEach((p,i)=>{const e=document.createElement('div');e.className='isl';e.style.cssText=`left:${p[0]}%;top:${p[1]}%;animation-delay:${-i}s;filter:blur(${i%3}px)`;e.innerHTML=`<i style="width:${p[2]}rem;height:${p[2]*.4}rem"></i><b style="width:${p[2]*.7}rem;height:${p[2]*.6}rem"></b>`;sk.appendChild(e)})})();
// ---- thumbs (ItemArt = satu sistem art)
function thumb(c,it){
 if(c==='skin')return AR.face(it.id);
 if(c==='dice')return AR.dice(it.id);
 if(c==='theme')return AR.theme(it.id);
 if(c==='powerup')return AR.powerup(it.id);
 if(c==='frame')return AR.frame(it.id);
 return `<svg viewBox="0 0 40 40"><rect x="5" y="5" width="30" height="30" rx="7" fill="rgba(255,255,255,.25)"/><path d="M12 21l6 6 11-13" fill="none" stroke="#fff" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
// ---- UI render
const CK='<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>',SH=icon(CATS[0][2]);
const RB={common:['#4ad04a','#2a9a2a'],rare:['#4aa8ff','#2a78e0'],epic:['#b45cf0','#7a2ad0'],legendary:['#ffb02e','#e07a10']},POSES=['idle','wave','dance','victory','laugh'];
let off=0,pose='idle';
const bg=r=>`linear-gradient(${RB[r][0]},${RB[r][1]})`,badge=r=>`<span class="badge" style="background:${bg(r)}">${RN[r]}</span>`;
function renderCats(){
 $('#rlt').textContent=(NAV.find(c=>c[0]===cat)||[0,''])[1]+' Terbaru';
}
function setCat(c){cat=c;const l=ownedList(c);sel=(sel&&l.some(o=>o.item===sel))?sel:((l.find(o=>o.equipped)||l.find(o=>o.owned)||l[0]||{}).item||null);off=0;pose='idle';renderCats();renderGrid();renderInfo();renderRecent();buildModels();playSound('select')}
function pick(i){sel=i;renderGrid();renderInfo();renderRecent();buildModels();playSound('select');PFX.at(i)}
function renderGrid(){const g=$('#grid');g.innerHTML='';
 if(!CI[cat]){g.innerHTML=`<div style="grid-column:1/-1;grid-row:1/-1;display:grid;place-items:center;font-size:2.4rem;text-align:center;line-height:1.3">${SOON[cat]||''}<br><small style="font-size:1.5rem;opacity:.8">Segera hadir</small></div>`;return}
 ownedList(cat).forEach((o,n)=>{const i=o.item,eq=o.equipped,own=o.owned,pw=isPU(i),lock=!own&&!pw,b=document.createElement('div');
  const btn=pw?`<button class="bt ${own?'own':'no'}">${own?'Dimiliki ×'+PD.qty(i.id):'×0'}</button>`
    :lock?`<button class="bt ${canSell(i)?'gd':'no'}">${canSell(i)?COIN+fmt(i.price):'Tidak dijual'}</button>`
    :`<button class="bt ${eq?'own':i.rarity==='legendary'?'gd':''}">${eq?'Digunakan':'Gunakan'}</button>`;
  b.className='card '+(i.rarity==='legendary'&&!lock?'lg':'')+(lock?' lk':'')+(i===sel?' sel':'');b.tabIndex=0;b.setAttribute('role','button');b.setAttribute('aria-label',i.name+(pw?' ×'+PD.qty(i.id):lock?' (terkunci)':''));b.style.animationDelay=n*25+'ms';
  b.innerHTML=`${eq?`<span class="ck">${CK}</span>`:''}${lock?`<span class="lkb"><img src="assets/Images/icon/ui/lock.webp" alt="" draggable="false" style="width:2.2rem;height:2.2rem"></span>`:''}<div class="th">${thumb(cat,i)}</div><span class="nm">${i.name}</span>${badge(i.rarity)}${btn}`;
  b.addEventListener('click',e=>{pick(i);if(e.target.closest('.bt')&&own&&!pw)act(i);else if(e.target.closest('.bt')&&lock&&canSell(i))act(i)});b.addEventListener('keydown',e=>{if(e.key==='Enter')b.click()});g.appendChild(b)})}
function renderRecent(){const l=ownedList(cat).filter(o=>o.owned).map(o=>o.item);off=Math.max(0,Math.min(off,Math.max(0,l.length-5)));$('#rlist').innerHTML=l.length?l.slice(off,off+5).map(i=>`<button class="rt ${i===sel?'on':''}" data-id="${i.id}" aria-label="${i.name}">${thumb(cat,i)}</button>`).join(''):'<div style="align-self:center;font-size:1.4rem;width:100%;text-align:center">'+(CI[cat]?'Belum ada item dimiliki':'Segera hadir')+'</div>';
 document.querySelectorAll('.rt').forEach(b=>b.addEventListener('click',()=>pick(l.find(i=>i.id===b.dataset.id))))}
/* Equip lewat PlayerData; UI langsung di-refresh dan event inventory/skin/dice ikut dipancarkan oleh bridge.
   Power-Up = consumable (slot null): tidak di-equip; PlayerData.equip menolak dengan 'bukan-equipment'. */
function act(i){if(i.kind==='powerup'){toast(canSellInfo(i));playSound('select');return}
 if(!isOwned(i)){if(!canSell(i)){toast('Item ini tidak dijual.');playSound('error');return}confirmBuy(i);return}
 const r=PD.equip(i.id);
 if(r.ok){toast('Berhasil digunakan!');playSound('select');buzz()}else{toast('Gagal memakai item.');playSound('error')}
 renderGrid();renderInfo();renderRecent();buildModels()}
function canSellInfo(i){return PD.qty(i.id)>0?'Power tersimpan — dipakai saat bermain.':'Power-up belum dijual. Dapatkan dari gameplay/hadiah.'}
function renderInfo(){const i=sel,u=$('#use');
 if(!i){$('#irar').textContent='SOON';$('#irar').style.background=bg('common');$('#iname').textContent=SOON[cat];$('#idesc').textContent='Belum ada item efek di game ini. Halaman ini disiapkan untuk nanti.';u.className='use no';u.innerHTML='Segera hadir';renderCurrency();return}
 if(i.kind==='powerup'){const r=$('#irar');r.textContent=RN[i.rarity];r.style.background=bg(i.rarity);$('#iname').textContent=i.name;$('#idesc').textContent=i.desc+PFX.note(i)+(PD.qty(i.id)>0?' (Dimiliki ×'+PD.qty(i.id)+')':' (Belum dimiliki)');u.className='use no';u.innerHTML=PD.qty(i.id)>0?'Dimiliki ×'+PD.qty(i.id):'Belum dijual';$('#info').animate([{transform:'translateY(.8rem)',opacity:.4},{transform:'none',opacity:1}],{duration:260,easing:'ease-out'});renderCurrency();return}
 if(!isOwned(i)){const r=$('#irar'),ok=canSell(i);r.textContent=RN[i.rarity];r.style.background=bg(i.rarity);$('#iname').textContent=i.name;$('#idesc').textContent=i.desc+(ok?' Belum dimiliki — ini hanya preview, beli untuk memakainya.':' Belum dimiliki dan tidak dijual. Hanya preview.');
  u.className='use'+(ok?'':' no');u.innerHTML=ok?COIN+fmt(i.price):'Tidak dijual';$('#info').animate([{transform:'translateY(.8rem)',opacity:.4},{transform:'none',opacity:1}],{duration:260,easing:'ease-out'});renderCurrency();return}
 const eq=PD.isEquipped(i.id),r=$('#irar');r.textContent=RN[i.rarity];r.style.background=bg(i.rarity);$('#iname').textContent=i.name;$('#idesc').textContent=i.desc;
 u.className='use'+(eq?' own':'');u.innerHTML=eq?CK+'Digunakan':SH+'Gunakan';
 $('#info').animate([{transform:'translateY(.8rem)',opacity:.4},{transform:'none',opacity:1}],{duration:260,easing:'ease-out'});
 renderCurrency()}
function renderCurrency(){$('#gemV').textContent=fmt(PD.gems());$('#coinV').textContent=fmt(PD.coins())}
function pulse(id){const e=$(id);e.classList.remove('pulse');void e.offsetWidth;e.classList.add('pulse')}
$('#use').addEventListener('click',e=>{if(sel){const w=isOwned(sel);act(sel);if(w)sparkle(e.currentTarget)}});
$('#rp').addEventListener('click',()=>{off--;renderRecent()});$('#rn').addEventListener('click',()=>{off++;renderRecent()});
// ---- event: ikut memperbarui UI saat state berubah (tanpa reload halaman)
UT.Events.on('currencyChanged',renderCurrency);
UT.Events.on('inventoryChanged',()=>{setCat(cat)});
UT.Events.on('skinChanged',()=>setCat(cat));
UT.Events.on('diceChanged',()=>setCat(cat));
UT.Events.on('frameChanged',()=>setCat(cat));
// ---- modal
const modal=$('#modal');let mOpen=false,onClose=null;
function openModal(html,init,big){$('#mb').innerHTML=html;$('#box').classList.toggle('big',!!big);modal.style.display='grid';requestAnimationFrame(()=>modal.classList.add('show'));mOpen=true;playSound('open');init&&init();$('#mx').focus()}
function closeModal(){if(!mOpen)return;mOpen=false;modal.classList.add('closing');modal.classList.remove('show');onClose&&onClose();onClose=null;setTimeout(()=>{modal.style.display='none';modal.classList.remove('closing')},250)}
$('#mx').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
/* ---- Beli dengan coin langsung di halaman (menggantikan Toko untuk item) ---- */
const WMSG2={'saldo-kurang':'Coin tidak cukup.','sudah-dimiliki':'Item sudah dimiliki.','tidak-tersedia':'Item tidak tersedia.','jaringan':'Tidak dapat terhubung ke server.','belum-login':'Silakan login ulang.','sedang-diproses':'Sedang diproses...'};
function confirmBuy(i){
  const coins=PD.coins(),ok=coins>=i.price;
  openModal(ok
    ?`<h2>Konfirmasi</h2><p>Beli ${i.name}?</p><div class="row" style="justify-content:center;gap:.8rem;color:#ffe36a;font-size:2.8rem"><span style="width:2.8rem;display:grid">${COIN}</span>${fmt(i.price)}</div><button class="mb no" id="no">Batal</button><button class="mb" id="yes">Beli</button>`
    :`<h2>Coin tidak cukup</h2><p>Kamu butuh ${fmt(i.price-coins)} coin lagi.</p><button class="mb no" id="no">Batal</button><button class="mb" id="more">Dapatkan Coin</button>`,
  ()=>{
    $('#no').addEventListener('click',closeModal);
    if(!ok){$('#more').addEventListener('click',()=>{location.href='shop.html'});return}
    $('#yes').addEventListener('click',async()=>{
      const r=SV()?await WS().buy(i.id):PD.purchase(i.id);
      closeModal();
      if(!r||!r.ok){toast(WMSG2[r&&r.reason]||'Pembelian gagal.');playSound('error');return}
      playSound('purchase');buzz();toast('Pembelian berhasil!');
      const e=PD.equip&&!isPU(i)?PD.equip(i.id):null; /* langsung dipakai, sama seperti halaman Karakter */
      renderCurrency();setCat(cat);
    });
  });
}
/* Top-up lewat PlayerData.addCurrency — tidak ada currency state kedua. */
function buy(type){if(type==='gem'){location.href='shop.html?emerald=1';return}const g=false,packs=g?[[10,'Rp 15.000'],[50,'Rp 59.000'],[120,'Rp 129.000']]:[[500,'10 Gem'],[2500,'40 Gem'],[10000,'120 Gem']];
 openModal(`<h2>Tambah ${g?'Gem':'Coin'}</h2>`+packs.map((p,i)=>`<button class="pack" data-i="${i}"><span>+${fmt(p[0])}</span><span>${p[1]}</span></button>`).join(''),()=>{
  document.querySelectorAll('.pack').forEach(b=>b.addEventListener('click',async()=>{const i=+b.dataset.i,p=packs[i];const r=g?(SV()?{ok:false,reason:'tidak-tersedia'}:PD.addCurrency(0,p[0])):(SV()?await WS().exchange(i):PD.addCurrency(p[0],-[10,40,120][i]));
   if(!r.ok){toast(WMSG[r.reason]||'Transaksi gagal.');playSound('error');return}
   renderInfo();pulse(g?'#gem':'#coin');playSound('coin');toast(g?'Berhasil (mock)':'Berhasil');closeModal()}))})}
document.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>buy(b.dataset.buy)));
$('#back').addEventListener('click',()=>{playSound('click');location.href='lobby.html'});
window.openShop=()=>{$('#ui').style.display=''};window.closeShop=()=>{$('#ui').style.display='none'};
// ---- 3D
const M=(c,r=.7)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const bx=(w,h,d,m,x=0,y=0,z=0,p)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p&&p.add(o);return o};
function character(sk,emote){return UT.CharacterView.make(THREE,sk,emote)} /* model = UT.CharacterData (sama dengan gameplay), bukan rig lama */
function diceTex(c,p){const cv=document.createElement('canvas');cv.width=cv.height=128;const x=cv.getContext('2d');x.fillStyle=c;x.fillRect(0,0,128,128);x.fillStyle=p;[[32,32],[96,32],[64,64],[32,96],[96,96]].forEach(a=>{x.beginPath();x.arc(a[0],a[1],12,0,6.3);x.fill()});return new THREE.CanvasTexture(cv)}
/* model hanya skin/dice canonical; tema memakai ItemArt overlay */
function model(c,it){let g;
 if(c==='skin')g=character(AR.palette(it.id)||{hood:'#00a8a8',hair:'#4a2e13',pants:'#3b4fd8'},pose);
 else if(c==='dice'){g=new THREE.Group();const m=new THREE.MeshStandardMaterial({map:diceTex(it.art.bg,it.art.pip),roughness:.35});const d=bx(2.6,2.6,2.6,m,0,3,0,g);g.userData.anim=t=>{d.rotation.y=t*.8;d.rotation.x=.5+Math.sin(t)*.2;d.position.y=3+Math.sin(t*1.6)*.2}}
 return g}
function island(){return UT.FloatingIsland.create(THREE,{seed:5,bob:0,scale:.92})} /* komponen bersama: assets/js/floating-island.js */
let ok=true;const rigs=[];
function rig(cv,withIsland,cy,dist,fov){if(!ok)return null;try{const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
 const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(fov,1,.1,100);scene.add(new THREE.AmbientLight(0xffffff,.6),new THREE.HemisphereLight(0xcfeaff,0x6a9a50,.6));
 const sun=new THREE.DirectionalLight(0xfff2d8,.9);sun.position.set(6,12,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-8,right:8,top:10,bottom:-6});scene.add(sun);
 const holder=new THREE.Group();scene.add(holder);if(withIsland)holder.add(island());
 const R={r,scene,cam,holder,cv,cy,dist,rot:0,vel:0,cur:null,drag:false,fov};
 cv.addEventListener('pointerdown',e=>{R.drag=true;R.lx=e.clientX;cv.setPointerCapture(e.pointerId)});
 cv.addEventListener('pointermove',e=>{if(R.drag){R.vel=(e.clientX-R.lx)*.012;R.rot+=R.vel;R.lx=e.clientX}});
 const up=()=>R.drag=false;cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.style.touchAction='pan-y';
 rigs.push(R);return R}catch(e){ok=false;console.warn('WebGL unavailable',e);return null}}
let main,pv,spin=0;
function setModel(R,c,it,y){if(!R)return;if(R.cur)R.holder.remove(R.cur);const m=model(c,it);R.holder.add(m);R.cur=m;R.mc=c}
function showThemeArt(on){const s=$('#show');const sv=on&&sel?AR.forItem(sel.id):'';s.classList.toggle('art',!!sv);const a=$('#art');if(a)a.innerHTML=sv}
function buildModels(){if(!CI[cat]||!sel){showThemeArt(false);return}
 if(cat==='theme'||cat==='powerup'||cat==='frame'||(cat==='skin'&&sel&&sel.renderer==='png')){showThemeArt(true);return} /* skin PNG: preview texture (pixel-art), bukan model 3D baru */
 showThemeArt(false);setModel(main,cat,sel);spin=1}
function fit(){const hi=SET().graphics==='high';rigs.forEach(R=>{const w=R.cv.clientWidth,h=R.cv.clientHeight;if(!w||!h)return;R.r.setPixelRatio(hi?Math.min(devicePixelRatio,1.5):1);R.r.setSize(w,h,false);R.cam.aspect=w/h;R.cam.fov=R.fov*(w/h<.8?1.15:1);R.cam.updateProjectionMatrix()})}
const clock=typeof THREE!=='undefined'?new THREE.Clock():null;
function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();
 rigs.forEach(R=>{if(!R.cur||!R.cv.offsetParent)return;const el=R.cv.getBoundingClientRect();if(!el.width)return;
  if(!R.drag){R.vel*=.95;R.rot+=R.vel+.004}if(spin>0&&R===main){}R.holder.rotation.y=R.rot+(spin>0?(1-spin)*6.28:0);
  R.cur.userData.anim&&R.cur.userData.anim(t);R.cam.position.set(0,R.cy+1,R.dist);R.cam.lookAt(0,R.cy,0);R.r.render(R.scene,R.cam)});
 if(spin>0)spin=Math.max(0,spin-.012)}
if(typeof THREE==='undefined')ok=false;
setCat(PAGE); /* mengisi sel dari PlayerData + render grid/info/recent */
if(ok){main=rig($('#gl'),true,1.8,19,36);if(ok){buildModels();new ResizeObserver(fit).observe(document.body);new ResizeObserver(fit).observe($('#show'));fit();requestAnimationFrame(loop)}}
if(!ok){$('#show').innerHTML='<div style="height:100%;display:grid;place-items:center;font-size:3rem">3D tidak tersedia</div>'}
document.documentElement.classList.add('ut-ready'); /* 4.1.17B: render awal selesai -> tampilkan halaman */
if(SV()&&WS())WS().refresh().then(r=>{if(r.ok){renderGrid();renderInfo();renderRecent()}}); /* B5: saldo & inventory dari server */
})();
</script>
