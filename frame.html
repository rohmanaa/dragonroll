<!doctype html>
<html lang="id"><head><script src="assets/js/frame-guard.js"></script><script src="assets/js/session.js"></script><script src="assets/js/boot-guard.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragon Roll — Frame</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ng/css/common.css"><link rel="stylesheet" href="assets/ng/css/page.css"><link rel="stylesheet" href="assets/ng/css/karakter.css"><link rel="stylesheet" href="assets/ng/css/frame.css"><link rel="stylesheet" href="assets/ng/css/bg.css">
<script src="assets/js/prefs.js"></script><script src="assets/js/prefs-sync.js"></script><script src="assets/js/ambience.js"></script>
</head>
<body class="fm notabs">
<div id="wrap"><div id="stage">
  <button id="back" aria-label="Kembali"><img src="assets/ng/komponen/ikon-navigasi/panah-kembali.webp" alt=""></button>
  <div id="title" class="ttl">Frame</div>
  <div class="cur" id="cur-em"><img src="assets/ng/komponen/ikon-gem-medali/berlian-hijau.webp" alt=""><div class="v" id="v-em">—</div><div class="plus">+</div></div>
  <div class="cur" id="cur-co"><img src="assets/ng/komponen/hud/ikon-koin-emas.webp" alt=""><div class="v" id="v-co">—</div><div class="plus">+</div></div>

  <section id="left">
    <div id="fpv"></div>
    <div id="nm" class="ttl"></div>
    <div id="rar"></div>
    <p id="ds"></p>
  </section>

  <section id="right">
    <div id="grid"></div>
  </section>

  <!-- modal konfirmasi beli / coin kurang -->
  <div id="md"><div class="panel" id="box">
    <h3 id="mt"></h3><p id="mx"></p>
    <div id="mbtns">
      <button class="btn" id="m-no"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-merah-polos.webp" alt=""><span></span></button>
      <button class="btn" id="m-ok"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-hijau-polos.webp" alt=""><span></span></button>
    </div>
  </div></div>

  <div id="toast"></div>
</div></div>
<div id="fade"></div>
<script src="assets/js/item-catalog.js"></script>
<script src="assets/js/character-data.js"></script>
<script src="assets/js/item-art.js"></script>
<script src="assets/js/frame-fx.js"></script>
<script src="assets/js/player-data.js"></script>
<script src="assets/js/wallet-service.js"></script>
<script src="assets/js/app.js"></script>
<script src="hud/ui-core.js"></script>
<script src="assets/js/live-sync.js"></script>
<script>UT.App.init({page:'frame'});</script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const PD=window.PlayerData,IC=window.ItemCatalog,AR=window.ItemArt;
const SV=()=>PD.serverMode(),WS=()=>window.UT&&UT.WalletService&&UT.WalletService.get();
const SET=()=>PD.settings();
const fmt=n=>Number(n).toLocaleString('id-ID');
const fmtPrice=n=>n>=100000?Math.round(n/1000)+'k':n>=1000?(n/1000).toLocaleString('id-ID',{maximumFractionDigits:1})+'k':fmt(n);
const KOIN='assets/ng/komponen/hud/ikon-koin-emas.webp',LOCK='assets/ng/komponen/glyph-putih/gembok.webp';
const RAR={common:['Biasa','#cfc8ea'],rare:['Langka','#4db3e6'],epic:['Epik','#b07cff'],legendary:['Legendaris','#ffd45a']};
const WMSG={'saldo-kurang':'Coin tidak cukup.','sudah-dimiliki':'Item sudah dimiliki.','tidak-tersedia':'Item tidak tersedia.','jaringan':'Tidak dapat terhubung ke server.','belum-login':'Silakan login ulang.','sedang-diproses':'Sedang diproses...'};
/* data dari ItemCatalog + PlayerData (bukan data sendiri); off:true = takedown sementara */
const FR=IC.items.filter(i=>i.kind==='frame'&&!i.off);
const isOwned=i=>PD.owns(i.id),isUsed=i=>PD.isEquipped(i.id);
const canSell=i=>!!i&&typeof i.price==='number'&&i.price>0&&!i.starter;
const art=i=>AR.frame(i.id);
let sel=null;
const buzz=()=>{try{if(SET().vibration&&navigator.vibrate)navigator.vibrate(15)}catch(e){}};
const snd=n=>{try{if(SET().sound)UT.Audio.play(n||'button')}catch(e){}};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1900)}
const nav=u=>{$('#fade').classList.add('on');setTimeout(()=>{location.href=u},330)};

/* ---- dompet ---- */
function showWallet(bump){
  const ok=PD.walletReady();
  $('#v-em').textContent=ok?fmt(PD.gems()):'—';$('#v-co').textContent=ok?fmt(PD.coins()):'—';
  if(bump){const e=$('#cur-co');e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}
}

/* ---- gambar ulang ---- */
function pickDefault(){
  if(sel&&FR.includes(sel))return;
  sel=FR.find(isUsed)||FR.find(isOwned)||FR[0]||null;
}
function draw(){
  pickDefault();
  let html=FR.map(x=>{
    const m=isOwned(x),sell=canSell(x);
    const on=isUsed(x),state=m?`<span class="pr ${on?'used':'owned'}"${on?'':' data-action="equip"'}>${on?'DIPAKAI':'DIMILIKI'}</span>`
      :sell?`<span class="pr buy" data-action="buy"><img src="${KOIN}" alt="">${fmtPrice(x.price)}</span>`:`<span class="pr no"><img src="${LOCK}" alt="">TIDAK DIJUAL</span>`;
    return `<button class="fslot${x===sel?' sel':''}${m?'':' lk'}" data-id="${x.id}" aria-label="${x.name} — ${on?'dipakai':m?'dimiliki':sell?'beli '+fmtPrice(x.price):'tidak dijual'}"><div class="th">${art(x)}</div>${state}</button>`}).join('');
  for(let i=FR.length;i<18;i++)html+='<div class="slot empty"></div>';
  $('#grid').innerHTML=html;
  if(!sel){$('#fpv').innerHTML='';$('#nm').textContent='Frame';$('#rar').textContent='';$('#ds').textContent='Belum ada frame di game ini.';showWallet();return}
  const f=sel,mine=isOwned(f),on=isUsed(f),r=RAR[f.rarity]||RAR.common;
  $('#fpv').innerHTML=art(f);
  $('#nm').textContent=f.name;
  $('#rar').textContent=r[0];$('#rar').style.color=r[1];
  $('#ds').textContent=f.desc+(mine?'':(canSell(f)?' Belum dimiliki — ini hanya preview, beli untuk memakainya.':' Belum dimiliki dan tidak dijual. Hanya preview.'));
  showWallet();
}
function buySelected(f){
  if(!PD.walletReady()){toast('Menunggu saldo dari server...');return}
  const coins=PD.coins();
  if(coins<f.price)modal('Coin tidak cukup',`Kamu butuh ${fmt(f.price-coins)} Coin lagi.<br>Saldo kamu ${fmt(coins)} Coin.`,'TUTUP','DAPATKAN COIN',()=>nav('shop.html?coin=1'));
  else modal('Konfirmasi',`Beli ${f.name}<br>seharga ${fmt(f.price)} Coin?`,'BATAL','BELI',()=>buy(f));
}
$('#grid').onclick=e=>{
  const c=e.target.closest('.fslot');if(!c)return;
  const f=FR.find(x=>x.id===c.dataset.id);if(!f)return;
  const action=e.target.closest('[data-action]'),act=action&&action.dataset.action;
  sel=f;
  if(act==='buy'){draw();buySelected(f);return}
  if(act==='equip'){equip(f);return}
  snd('button');draw();
};

/* ---- modal ---- */
let okFn=null;
function modal(t,x,noL,okL,ok){
  $('#mt').textContent=t;$('#mx').innerHTML=x;
  $('#m-no span').textContent=noL;$('#m-ok span').textContent=okL;
  okFn=ok;$('#md').classList.add('on');
}
const closeM=()=>$('#md').classList.remove('on');
$('#m-no').onclick=closeM;
$('#m-ok').onclick=()=>{closeM();if(okFn)okFn()};
$('#md').onclick=e=>{if(e.target.id==='md')closeM()};
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#md').classList.contains('on'))closeM();else nav('lobby.html')});

/* ---- aksi: pakai / beli (beli lewat WalletService/PlayerData; klien tidak mengubah saldo sendiri) ---- */
function equip(f){
  const r=PD.equip(f.id);
  if(r&&r.ok){toast(f.name+' dipakai');snd('button');buzz()}else{toast('Gagal memakai item.');snd('button')}
  draw();
}
async function buy(f){
  const r=SV()?await WS().buy(f.id):PD.purchase(f.id);
  if(!r||!r.ok){toast(WMSG[r&&r.reason]||'Pembelian gagal.');return}
  snd('power');buzz();toast('Pembelian berhasil!');
  try{PD.equip(f.id)}catch(e){} /* langsung dipakai, sama seperti halaman Karakter */
  showWallet(true);draw();
}
/* ---- navigasi ---- */
$('#back').onclick=()=>{snd('button');nav('lobby.html')};
$('#cur-co').onclick=()=>nav('shop.html?coin=1');
$('#cur-em').onclick=()=>nav('tambang.html?from=frame.html');

/* ---- sinkron: event + live-sync (saldo/inventory dari server) ---- */
UT.Events.on('currencyChanged',()=>showWallet());
['inventoryChanged','skinChanged','frameChanged'].forEach(n=>UT.Events.on(n,draw));
try{PD.subscribe(r=>{if(r==='server-wallet'||r==='storage'||r==='pageshow')showWallet()})}catch(e){}
if(UT.LiveSync){UT.LiveSync.add('wallet',()=>UT.WalletService.get().refresh());UT.LiveSync.start({interval:20000})}
if(SV()&&WS())WS().refresh().then(r=>{if(r&&r.ok){showWallet();draw()}});

/* skala kanvas 1920x1080 */
function fit(){$('#stage').style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}
addEventListener('resize',fit);fit();
draw();
document.documentElement.classList.add('ut-ready');
})();
</script>
</body></html>
