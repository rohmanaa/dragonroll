<!DOCTYPE html>
<html lang="id" class="stage16"><head><script src="assets/js/frame-guard.js"></script><script src="assets/js/session.js"></script><script src="assets/js/boot-guard.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misi Harian</title><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/base.css"><script src="assets/js/prefs.js"></script><script src="assets/js/prefs-sync.js"></script><script src="assets/js/ambience.js"></script><link rel="stylesheet" href="assets/css/scene-bg.css"><script src="assets/js/scene-bg.js" data-auto data-preset="soft" data-image="assets/Images/background/misi-bg.webp"></script><style>
:root{--ol:#0b1838;--rb1:#3f7ce8;--rb2:#2a5bc8;--rb-hi:#74a4f7;--nv1:#2a4478;--nv2:#1b305f;--pn1:#27489a;--pn2:#1c3678;--row1:#2c5bc0;--row2:#2349a3;--gold:#ffd23e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{font-size:min(1vw,2vh)}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2','Fredoka','Nunito',system-ui,sans-serif;font-weight:800;color:#fff;background:#5db4f5}
/* stage selalu selebar layar; tinggi 50rem (rasio referensi 2:1) */
#stage{position:absolute;left:0;top:50%;width:100%;height:50rem;translate:0 -50%}
.ab{position:absolute}
button{font:inherit;color:inherit;border:0;cursor:pointer;transition:transform .15s cubic-bezier(.3,1.6,.5,1),filter .15s}
button:hover:not(:disabled){transform:scale(1.04);filter:brightness(1.08)}button:active:not(:disabled){transform:scale(.95)}button:focus-visible{outline:.3rem solid #fff}
button:disabled{cursor:default}
img.ic{display:block;object-fit:contain;pointer-events:none;-webkit-user-drag:none;user-select:none}
.txo{text-shadow:-.2rem 0 var(--ol),.2rem 0 var(--ol),0 -.2rem var(--ol),0 .2rem var(--ol),-.2rem -.2rem var(--ol),.2rem -.2rem var(--ol),-.2rem .2rem var(--ol),.2rem .2rem var(--ol),0 .35rem 0 var(--ol)}

/* tombol biru (kembali) + panel gaya pixel */
.blue{background:linear-gradient(var(--rb1),var(--rb2));border:.3rem solid var(--ol);border-radius:.9rem;box-shadow:inset 0 0 0 .15rem var(--rb-hi),inset 0 -.3rem 0 rgba(8,25,90,.45),0 .35rem 0 var(--ol)}
#back{left:2.7rem;top:2rem;width:5.2rem;height:5.2rem;padding:0;display:grid;place-items:center}
#back>.ic{width:3.4rem;height:3.4rem}
.pix{background:linear-gradient(var(--pn1),var(--pn2));border:.35rem solid var(--ol);border-radius:1.1rem;box-shadow:inset 0 0 0 .2rem var(--rb-hi),inset 0 -.35rem 0 rgba(8,25,90,.45),0 .45rem 0 var(--ol),0 1rem 1.6rem rgba(10,30,90,.35)}

/* judul */
#title{left:10.4rem;top:1.8rem;width:36rem;height:5.8rem;white-space:nowrap;border-radius:.9rem;padding:0 2rem 0 11rem;display:flex;align-items:center;background:linear-gradient(var(--nv1),var(--nv2));border:.3rem solid var(--ol);box-shadow:inset 0 0 0 .15rem var(--rb-hi),inset 0 -.3rem 0 rgba(8,25,90,.45),0 .35rem 0 var(--ol)}
#title h1{margin:0;font-size:3.9rem;white-space:nowrap;line-height:1;font-style:italic;color:var(--gold);text-shadow:-.2rem 0 #3a2200,.2rem 0 #3a2200,0 -.2rem #3a2200,0 .2rem #3a2200,0 .35rem 0 #3a2200}
#tic{position:absolute;left:1.2rem;top:-2rem;width:8.4rem;height:8.4rem;filter:drop-shadow(0 .4rem 0 rgba(8,24,56,.55));rotate:-6deg}
#tic .ic{width:100%;height:100%}
#cnt{left:48.6rem;top:2.4rem;width:13rem;height:4.6rem;white-space:nowrap;display:grid;place-items:center;font-size:2.2rem;border-radius:2.3rem;background:#0f2250;border:.3rem solid var(--ol);box-shadow:inset 0 0 0 .15rem #3a5aa8,0 .3rem 0 var(--ol)}

/* panel misi (kiri) */
#ql{left:5.2rem;top:10.2rem;width:63.4rem;height:38rem;padding:0}
#sub{position:absolute;left:0;right:0;top:-2.5rem;text-align:center;font-size:1.7rem;font-weight:700;white-space:nowrap;text-shadow:-.15rem 0 var(--ol),.15rem 0 var(--ol),0 -.15rem var(--ol),0 .15rem var(--ol),0 .25rem 0 var(--ol)}
#list{position:absolute;left:1rem;right:1rem;top:1rem;height:29.6rem;display:grid;grid-template-rows:repeat(3,1fr);gap:.8rem;padding:.7rem;border-radius:.9rem;background:#162d6e;box-shadow:inset 0 .3rem 0 rgba(0,0,0,.35),inset 0 0 0 .2rem #0f1f52}
.row{position:relative;display:grid;grid-template-columns:11rem minmax(0,1fr) 20rem;align-items:center;border-radius:.8rem;background:linear-gradient(var(--row1),var(--row2));box-shadow:inset 0 0 0 .15rem #5f8ae0,inset 0 -.3rem 0 rgba(8,25,90,.4),0 .2rem 0 #0b1c52;min-height:0}
.row .ri{display:grid;place-items:center;height:100%}
.row .ri .ic{width:7.4rem;height:7.4rem;filter:drop-shadow(0 .3rem 0 rgba(8,24,56,.45))}
.row .tx{padding-right:1.6rem;min-width:0}
.row .tx b{display:block;white-space:nowrap;font-size:2.6rem;line-height:1;text-shadow:0 .2rem 0 var(--ol)}
.row .tx small{display:block;white-space:nowrap;font-size:1.6rem;font-weight:700;line-height:1.15;margin:.2rem 0 .7rem;text-shadow:0 .15rem 0 var(--ol)}
.bar{position:relative;height:2.6rem;border-radius:.6rem;background:#0f2250;box-shadow:inset 0 .25rem 0 rgba(0,0,0,.45),0 0 0 .2rem var(--ol);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#86f04f,#38c22d 55%,#239a25);box-shadow:inset 0 .25rem 0 rgba(255,255,255,.4);transition:width .4s}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:1.7rem;line-height:1;text-shadow:0 .15rem 0 var(--ol)}
.row .rw{height:calc(100% - 2rem);border-left:.2rem solid rgba(8,25,90,.55);box-shadow:-.15rem 0 0 rgba(120,160,235,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem}
.row .rw small{white-space:nowrap;font-size:1.9rem;line-height:1;text-shadow:0 .2rem 0 var(--ol)}
.amt{display:flex;align-items:center;gap:.8rem;font-size:4rem;line-height:1;color:var(--gold)}
.amt .ic{width:5rem;height:5rem}
.amt b{text-shadow:-.2rem 0 #3a2200,.2rem 0 #3a2200,0 -.2rem #3a2200,0 .2rem #3a2200,0 .3rem 0 #3a2200}
.row .rw .amt{font-size:3.6rem;white-space:nowrap}.row .rw .amt .ic{width:4.4rem;height:4.4rem}
.cbtn{height:3rem;padding:0 1.8rem;margin-top:.1rem;white-space:nowrap;border-radius:.6rem;font-size:1.9rem;line-height:1;color:#fff;background:linear-gradient(#58d85a,#25a22c);border:.25rem solid var(--ol);box-shadow:inset 0 0 0 .12rem #9bf59c,0 .25rem 0 var(--ol);text-shadow:0 .15rem 0 #145a14;animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.07)}}
.done-tag{margin-top:.1rem;height:3rem;white-space:nowrap;padding:0 1.6rem;display:flex;align-items:center;gap:.6rem;font-size:1.8rem;border-radius:.6rem;background:#0f2250;color:#9fe08f;box-shadow:0 0 0 .2rem var(--ol)}
.row.claimed{filter:saturate(.7) brightness(.9)}
.row.ready{box-shadow:inset 0 0 0 .2rem #ffe36a,inset 0 -.3rem 0 rgba(8,25,90,.4),0 .2rem 0 #0b1c52,0 0 1.6rem rgba(255,210,77,.6)}

/* total reward */
#tot{position:absolute;left:1rem;right:1rem;bottom:1rem;height:5.6rem;display:flex;align-items:center;gap:1.6rem;padding:0 1.2rem 0 2rem;border-radius:.9rem;background:#162d6e;box-shadow:inset 0 .3rem 0 rgba(0,0,0,.35),inset 0 0 0 .2rem #0f1f52}
#tot>span{white-space:nowrap;font-size:2.8rem;line-height:1;text-shadow:0 .25rem 0 var(--ol)}
#tot .amt{font-size:4rem;margin-right:auto;min-width:0}#tot .amt .ic{width:4.8rem;height:4.8rem}
#claimAll{height:4.4rem;width:21rem;flex:none;white-space:nowrap;border-radius:.7rem;display:flex;align-items:center;justify-content:center;gap:.8rem;font-size:2.4rem;background:linear-gradient(#58d85a,#25a22c);border:.3rem solid var(--ol);box-shadow:inset 0 0 0 .15rem #9bf59c,inset 0 -.3rem 0 rgba(8,90,20,.45),0 .35rem 0 var(--ol);text-shadow:0 .2rem 0 #145a14}
#claimAll svg{width:3rem;height:3rem}
.off{background:linear-gradient(#8f939c,#6a6e78)!important;box-shadow:inset 0 0 0 .15rem #b4b8c0,inset 0 -.3rem 0 rgba(0,0,0,.3),0 .35rem 0 var(--ol)!important;color:#c6c9d0!important;text-shadow:0 .2rem 0 #3d4048!important;animation:none!important}

/* panel bonus (kanan) */
#qr{left:70.6rem;top:10.2rem;width:24.4rem;height:38rem;padding:0}
#rh{position:absolute;left:1rem;right:1rem;top:1rem;height:7.6rem;display:flex;align-items:center;gap:.4rem;padding:0 1rem 0 .6rem;border-radius:.8rem;background:linear-gradient(var(--nv1),var(--nv2));box-shadow:inset 0 0 0 .15rem var(--rb-hi),inset 0 -.25rem 0 rgba(8,25,90,.45)}
#rh .ic{width:6.6rem;height:6.6rem;flex:none;margin-top:-1.2rem;margin-left:-1.4rem;filter:drop-shadow(0 .3rem 0 rgba(8,24,56,.5))}
#rh b{white-space:nowrap;font-size:2.1rem;line-height:1.05;text-align:center;flex:1;text-shadow:0 .2rem 0 var(--ol)}
#rtx{position:absolute;left:.4rem;right:.4rem;top:9.2rem;text-align:center;white-space:nowrap;font-size:1.5rem;font-weight:700;line-height:1.2;text-shadow:0 .15rem 0 var(--ol)}
#chest{position:absolute;left:4rem;right:4rem;top:13.4rem;height:10rem}
#chest .ic{width:100%;height:100%;filter:drop-shadow(0 .4rem 0 rgba(8,24,56,.45))}
#chest.glow .ic{animation:chestg 1.4s ease-in-out infinite}
@keyframes chestg{50%{transform:translateY(-.5rem) scale(1.05);filter:drop-shadow(0 0 1.4rem #ffe36a)}}
#bn{position:absolute;left:1rem;right:1rem;top:24.2rem;height:5.8rem;border-radius:.7rem;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#ffd24d,#f0a722);color:#3a2200;box-shadow:inset 0 0 0 .15rem #fff0a8,inset 0 -.3rem 0 rgba(160,90,0,.45),0 .3rem 0 var(--ol);border:.3rem solid var(--ol)}
#bn small{white-space:nowrap;font-size:1.7rem;line-height:1;color:#3a2200}
#bn .amt{font-size:3.2rem}#bn .amt .ic{width:3.6rem;height:3.6rem}
#bn .amt b{text-shadow:-.15rem 0 #fff3b0,.15rem 0 #fff3b0,0 -.15rem #fff3b0,0 .15rem #fff3b0;color:#3a2200}
#claimBonus{position:absolute;left:1rem;right:1rem;bottom:1.2rem;height:5rem;white-space:nowrap;border-radius:.7rem;font-size:2.4rem;background:linear-gradient(#58d85a,#25a22c);border:.3rem solid var(--ol);box-shadow:inset 0 0 0 .15rem #9bf59c,inset 0 -.3rem 0 rgba(8,90,20,.45),0 .35rem 0 var(--ol);text-shadow:0 .2rem 0 #145a14}
#rst{position:absolute;right:1.4rem;top:-3.3rem;font-size:1.6rem;white-space:nowrap;text-shadow:-.15rem 0 var(--ol),.15rem 0 var(--ol),0 -.15rem var(--ol),0 .15rem var(--ol),0 .25rem 0 var(--ol)}
#rst b{color:var(--gold);font-variant-numeric:tabular-nums}

#toast{position:fixed;left:50%;bottom:3rem;translate:-50% 2rem;background:var(--ol);padding:.8rem 2.4rem;border-radius:.9rem;font-size:2.2rem;opacity:0;transition:opacity .3s,translate .35s cubic-bezier(.3,1.8,.5,1);z-index:99;pointer-events:none;white-space:nowrap;box-shadow:inset 0 0 0 .15rem var(--rb-hi)}
#toast.on{opacity:1;translate:-50% 0}
.pulse{animation:pu .4s}@keyframes pu{50%{transform:scale(1.15)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style><style>:root{--curbar-right:2.2rem;--curbar-top:2.2rem;--cur-h:4.2rem;--cur-icon:5rem;--cur-plus:2.8rem;--cur-fs:2.4rem;--cur-minw:14.6rem;--cur-gap:1.2rem}

<body>
<div id="stage">
 <button class="ab blue" id="back" aria-label="Kembali"><img class="ic" src="assets/Images/icon/ui/back.webp" alt="" draggable="false"></button>
 <div class="ab" id="title"><span id="tic"><img class="ic" src="assets/Images/icon/mode/calndar.webp" alt="" draggable="false" decoding="async"></span><h1>Misi Harian</h1></div>
 <div class="ab" id="cnt"><span id="cntT">3 Misi</span></div>
 <div class="ut-curbar"><div class="ab cur" id="gem"><span id="gemI"><img class="ci" src="assets/Images/icon/currency/emerald.webp" alt="" draggable="false"></span><span id="gemV"></span><button class="plus" data-buy="gem" aria-label="Tambah gem"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg></button></div><div class="ab cur" id="coin"><span id="coinI"><img class="ci" src="assets/Images/icon/currency/coin.webp" alt="" draggable="false"></span><span id="coinV"></span><button class="plus" data-buy="coin" aria-label="Tambah coin"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg></button></div></div>

 <section class="ab pix" id="ql" aria-label="Daftar misi harian">
  <div id="sub">Selesaikan semua misi untuk mendapatkan bonus tambahan.</div>
  <div id="list"></div>
  <div id="tot"><span class="txo">Total Reward</span><div class="amt"><img class="ic" src="assets/Images/icon/currency/coin.webp" alt="" draggable="false"><b id="totV">0</b></div><button id="claimAll"><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>Klaim Semua</button></div>
 </section>

 <section class="ab pix" id="qr" aria-label="Bonus misi harian">
  <div id="rst">Reset dalam: <b id="cd">--:--:--</b></div>
  <div id="rh"><img class="ic" src="assets/Images/icon/lobby/gift.webp" alt="" draggable="false" decoding="async"><b>Daily Quest<br>Rewards</b></div>
  <div id="rtx">Bonus tambahan<br>setelah menyelesaikan<br>semua misi harian!</div>

  <div id="bn"><small>Reward Bonus:</small><div class="amt"><img class="ic" src="assets/Images/icon/currency/coin.webp" alt="" draggable="false"><b id="bnV">0</b></div></div>

 </section>

<script>UT.App.init({page:'misi'});</script>
<script>
(()=>{
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString('id-ID'),PD=window.PlayerData,Q=UT.Quest;
/* B5: akun login + flag -> misi dari SERVER (hari WIB). QS = hasil quest_get; progres login dilaporkan ke server, hadiah dihitung server. */
const SV=()=>PD.serverMode(),WS=()=>window.UT&&UT.WalletService&&UT.WalletService.get();
let QS=null,RESET_AT=0,busy=false;
const SRV=()=>SV()&&!!QS;
function applyQ(r){if(!r||!Array.isArray(r.quests))return false;QS=r;RESET_AT=Date.now()+(+r.seconds_to_reset||0)*1000;return true}
const qList=()=>SRV()?QS.quests.map(q=>{const d=Q.DEFS.find(x=>x.id===q.id)||{};return{id:q.id,title:d.title||q.id,desc:d.desc||'',goal:q.goal,reward:q.reward,icon:d.icon||'items/dadu',progress:Math.min(q.goal,q.progress),status:q.status}}):[];
const qBonusState=()=>SRV()?QS.bonus.status:'locked';
const qBonus=()=>SRV()?QS.bonus.reward:Q.BONUS;
const WM={'jaringan':'Tidak dapat terhubung ke server.','belum-login':'Silakan login ulang.','sedang-diproses':'Sedang diproses...','sudah-klaim':'Sudah diklaim.','belum-selesai':'Misi belum selesai.','terkunci':'Selesaikan semua misi dulu.'};
async function reloadQ(){const w=WS();if(!w)return;if(applyQ(await w.questGet())){await w.refresh();render()}}
/* Jalankan klaim server lalu muat ulang misi + saldo; fn dipanggil dengan hasil RPC. */
async function srvClaim(call,onOk){if(busy)return;busy=true;try{const r=await call(WS());if(r&&r.ok)onOk(r);else toast(WM[r&&r.reason]||'Gagal klaim, coba lagi');await reloadQ()}finally{busy=false}render()}
const IMG=p=>'<img class="ic" src="assets/Images/icon/'+p+'.webp" alt="" draggable="false" decoding="async">';
const COIN=IMG('currency/coin');
const SFX={click:'button',claim:'power',chest:'chest'};
function playSound(n){try{if(!PD.settings().sound)return;UT.Audio.play(SFX[n]||'button')}catch(e){}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
function pulse(sel){const e=$(sel);if(!e)return;e.classList.remove('pulse');void e.offsetWidth;e.classList.add('pulse')}

function renderCurrency(){try{$('#gemV').textContent=(PD.walletReady()?fmt(PD.gems()):'—');$('#coinV').textContent=(PD.walletReady()?fmt(PD.coins()):'—')}catch(e){}}
function render(){
 const L=qList();
 $('#cntT').textContent=L.length+' Misi';
 $('#list').innerHTML=L.map(q=>{
  const pct=Math.round(q.progress/q.goal*100);
  const act=q.status==='ready'?'<button class="cbtn" data-claim="'+q.id+'">Klaim</button>'
          :q.status==='claimed'?'<div class="done-tag"><svg width="20" height="20" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10" fill="none" stroke="#9fe08f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>Diklaim</div>':'';
  return '<div class="row '+q.status+'"><div class="ri">'+IMG(q.icon)+'</div><div class="tx"><b>'+q.title+'</b><small>'+q.desc+'</small><div class="bar"><i style="width:'+pct+'%"></i><span>'+q.progress+'/'+q.goal+'</span></div></div><div class="rw">'+(q.status==='todo'?'<small>Reward:</small>':'')+'<div class="amt">'+COIN+'<b>'+q.reward+'</b></div>'+act+'</div></div>';
 }).join('');
 $('#totV').textContent=fmt(L.reduce((a,q)=>a+q.reward,0));
 const can=L.some(q=>q.status==='ready'),ca=$('#claimAll');
 ca.disabled=!can;ca.classList.toggle('off',!can);
 $('#bnV').textContent=fmt(qBonus());
 const bs=qBonusState(),cb=$('#claimBonus');
 cb.disabled=bs!=='ready';cb.classList.toggle('off',bs!=='ready');
 cb.textContent=bs==='claimed'?'Sudah Diklaim':'Klaim Bonus';
 $('#chest').classList.toggle('glow',bs==='ready');
 renderCurrency();
}
function tick(){const s=SRV()?Math.max(0,Math.ceil((RESET_AT-Date.now())/1000)):0;
 if(SRV()&&s===0&&!tick.rf){tick.rf=1;reloadQ().finally(()=>setTimeout(()=>{tick.rf=0},3000))}
 $('#cd').textContent=[s/3600|0,(s%3600)/60|0,s%60].map(v=>String(v).padStart(2,'0')).join(':');
 if(tick.d!==undefined&&s>tick.last+5){render()} /* lewat tengah malam: misi baru */
 tick.last=s;tick.d=1}
function bumpMis(n){n=Math.min(20,Math.max(0,n|0));if(!n)return;import('./assets/js/multiplayer/progress-service.js').then(()=>UT.Multiplayer.Progress.bumpCounter('missions_done',n)).catch(()=>{})}
$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-claim]');if(!b)return;
 if(!SV()){toast('Silakan login untuk klaim misi.');return}
 srvClaim(w=>w.questClaim(b.dataset.claim),r=>{bumpMis(1);playSound('claim');pulse('#coin');toast('+'+fmt(r.coins)+' Coin diterima!')});});
