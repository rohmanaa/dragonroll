<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="src/core/hub-redirect.js"></script>
<script src="src/core/page-shell.js"></script>
<script>UT.PageShell.renderBase();</script>
<title>Dragon Roll â€” Pengaturan</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any">

<link rel="stylesheet" href="src/styles/page.css"><link rel="stylesheet" href="src/components/button/button.css"><link rel="stylesheet" href="src/components/tabs/tabs.css"><link rel="stylesheet" href="src/styles/settings.css"><link rel="stylesheet" href="src/styles/bg.css">
<script src="src/systems/ambience.js"></script>
</head>
<body class="sub">
<div id="wrap"><div id="stage">
  <button id="back" class="ut-gl ut-c-r" aria-label="Kembali"><img class="bg" src="assets/images/ui/navigation-icons/panah-kembali.webp" alt=""></button>
  <div id="title" class="ttl">PENGATURAN</div>

  <!-- kolom kiri: suara & getar -->
  <section id="rows">
    <div class="row"><img class="ic" id="ic-sfx" src="assets/images/ui/settings-icons/ikon-speaker.webp" alt=""><em>Efek suara</em>
      <input type="range" id="sfxVol" min="0" max="100" step="5" aria-label="Volume efek suara"><span class="val" id="sfxVolV"></span><button class="tg" data-tg="sound" aria-label="Efek suara"></button></div>
    <div class="row"><img class="ic" id="ic-music" src="assets/images/ui/settings-icons/ikon-musik-mati.webp" alt=""><em>Musik</em>
      <input type="range" id="musicVol" min="0" max="100" step="5" aria-label="Volume musik"><span class="val" id="musicVolV"></span><button class="tg" data-tg="music" aria-label="Musik"></button></div>
    <div class="row"><img class="ic" src="assets/images/ui/settings-icons/ikon-getar.webp" alt=""><em>Getar</em>
      <span class="sp"></span><button class="tg" data-tg="vibration" aria-label="Getar"></button></div>
    <div class="row"><img class="ic" src="assets/images/ui/white-glyphs/kristal-heksagon.webp" alt=""><em class="sm">Transparansi panel</em>
      <input type="range" id="panelTr" min="0" max="70" step="5" aria-label="Transparansi panel"><span class="val" id="panelTrV"></span><span class="tgsp" aria-hidden="true"></span></div>
  </section>


  <!-- kolom kanan: pilihan -->
  <section id="opts">
    <div class="grp"><div class="cap">GRAFIK</div>
      <div class="ut-seg" id="seg-gfx"><button class="ut-seg-i" data-gfx="auto">Auto</button><button class="ut-seg-i" data-gfx="low">Rendah</button><button class="ut-seg-i" data-gfx="normal">Normal</button><button class="ut-seg-i" data-gfx="high">Tinggi</button><button class="ut-seg-i" data-gfx="ultra">Ultra</button></div>
      <div id="gfxn" class="note"></div></div>
    <div class="grp"><div class="cap">BAHASA</div>
      <button class="btn ut-gl ut-c-b" id="langBtn" aria-haspopup="dialog"><img class="bgb" src="assets/images/buttons/tombol-ungu-polos.webp" alt=""><img class="fl" id="langFlag" src="" alt=""><span id="langName"></span></button></div>
    <div class="grp"><div class="cap">TAMPILAN</div>
      <div class="ut-seg" id="seg-display"><button type="button" class="ut-seg-i" data-display="fullscreen">Fullscreen</button><button type="button" class="ut-seg-i" data-display="normal">Normal</button></div></div>
  </section>

  <div id="line"></div>
  <button class="btn ut-gl ut-c-r" id="logout"><img src="assets/images/buttons/tombol-abu-polos.webp" alt=""><span>KELUAR AKUN</span></button>

  <!-- konfirmasi keluar -->
  <div id="confirm" role="dialog" aria-modal="true" aria-labelledby="cf-t"><div id="cbox" class="ut-mk">
    <div id="cf-t" class="ut-mk-t">KELUAR AKUN?</div>
    <div id="cf-s">Koin, item, dan progres tetap tersimpan dan kembali saat kamu login lagi.</div>
    <div class="cbtns">
      <button class="btn ut-gl ut-c-d" id="cf-no"><img src="assets/images/buttons/tombol-abu-polos.webp" alt=""><span>BATAL</span></button>
      <button class="btn ut-gl ut-c-r" id="cf-ok"><img src="assets/images/ui/buttons-and-controls/tombol-merah-polos.webp" alt=""><span>KELUAR</span></button>
    </div>
  </div></div>
  <!-- pilih bahasa -->
  <div id="lang" role="dialog" aria-modal="true" aria-labelledby="lg-t"><div id="lbox" class="ut-mk">
    <div id="lg-t" class="ut-mk-t">PILIH BAHASA</div>
    <button id="lg-x" class="ut-mk-x ut-gl ut-c-r" aria-label="Tutup"></button>
    <div id="lgrid"></div>
  </div></div>
  <div id="appver" data-app-version hidden></div>
  <div id="toast"></div>
</div></div>
<div id="fade"></div>
<script src="src/stores/item-catalog.js"></script>
<script src="src/stores/player-data.js"></script>
<script src="src/services/wallet-service.js"></script>
<script src="src/core/app.js"></script>
<script src="src/components/ui-core.js"></script>
<script>UT.App.init({page:'settings'});</script>
<script src="src/core/app-version.js"></script>
<script src="src/core/display-mode.js"></script>
<script src="src/core/page-module.js"></script>
<script src="src/systems/graphics-auto.js"></script>
<script src="src/views/settings.js"></script>
</body></html>
