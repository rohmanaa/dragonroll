<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="assets/js/core/page-shell.js"></script>
<script>UT.PageShell.renderBase();</script>
<title>Dragon Roll — Pengaturan</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any">

<link rel="stylesheet" href="assets/css/page.css"><link rel="stylesheet" href="assets/css/settings.css"><link rel="stylesheet" href="assets/css/bg.css">
<script src="assets/js/systems/ambience.js"></script>
<link rel="stylesheet" href="assets/css/profile-tabs.css">
</head>
<body class="sub">
<div id="wrap"><div id="stage">
  <button id="back" aria-label="Kembali"><img src="assets/images/buttons/tombol-rumah-abu.webp" alt=""></button>
  <div id="title" class="ttl">PENGATURAN</div>

  <!-- kolom kiri: suara & getar -->
  <section id="rows">
    <div class="row"><img class="ic" id="ic-sfx" src="assets/images/ui/settings-icons/ikon-speaker.webp" alt=""><em>Efek suara</em>
      <input type="range" id="sfxVol" min="0" max="100" step="5" aria-label="Volume efek suara"><span class="val" id="sfxVolV"></span><button class="tg" data-tg="sound" aria-label="Efek suara"></button></div>
    <div class="row"><img class="ic" id="ic-music" src="assets/images/ui/settings-icons/ikon-musik-mati.webp" alt=""><em>Musik</em>
      <input type="range" id="musicVol" min="0" max="100" step="5" aria-label="Volume musik"><span class="val" id="musicVolV"></span><button class="tg" data-tg="music" aria-label="Musik"></button></div>
    <div class="row"><img class="ic" src="assets/images/ui/settings-icons/ikon-getar.webp" alt=""><em>Getar</em>
      <span class="sp"></span><button class="tg" data-tg="vibration" aria-label="Getar"></button></div>
  </section>


  <!-- kolom kanan: pilihan -->
  <section id="opts">
    <div class="grp"><div class="cap">GRAFIK</div>
      <div class="seg" id="seg-gfx"><button data-gfx="low">Rendah</button><button data-gfx="normal">Normal</button><button data-gfx="high">Tinggi</button><button data-gfx="ultra">Ultra</button></div>
      <div id="gfxn" class="note"></div></div>
    <div class="grp"><div class="cap">BAHASA</div>
      <button class="btn" id="langBtn" aria-haspopup="dialog"><img class="bgb" src="assets/images/buttons/tombol-ungu-polos.webp" alt=""><img class="fl" id="langFlag" src="" alt=""><span id="langName"></span></button></div>
    <div class="grp"><div class="cap">TAMPILAN</div>
      <div class="seg" id="seg-display"><button type="button" data-display="fullscreen">Fullscreen</button><button type="button" data-display="normal">Normal</button></div></div>
  </section>

  <div id="line"></div>
  <button class="btn" id="logout"><img src="assets/images/buttons/tombol-abu-polos.webp" alt=""><span>KELUAR AKUN</span></button>

  <!-- konfirmasi keluar -->
  <div id="confirm" role="dialog" aria-modal="true" aria-labelledby="cf-t"><div id="cbox">
    <div id="cf-t" class="ttl">KELUAR AKUN?</div>
    <div id="cf-s">Koin, item, dan progres tetap tersimpan dan kembali saat kamu login lagi.</div>
    <div class="cbtns">
      <button class="btn" id="cf-no"><img src="assets/images/buttons/tombol-abu-polos.webp" alt=""><span>BATAL</span></button>
      <button class="btn" id="cf-ok"><img src="assets/images/ui/buttons-and-controls/tombol-merah-polos.webp" alt=""><span>KELUAR</span></button>
    </div>
  </div></div>
  <!-- pilih bahasa -->
  <div id="lang" role="dialog" aria-modal="true" aria-labelledby="lg-t"><div id="lbox">
    <div id="lg-t" class="ttl">PILIH BAHASA</div>
    <button id="lg-x" aria-label="Tutup"><img src="assets/images/ui/buttons-and-controls/tombol-tutup-bulat.webp" alt=""></button>
    <div id="lgrid"></div>
  </div></div>
  <div id="appver" data-app-version hidden></div>
  <div id="toast"></div>
</div></div>
<div id="fade"></div>
<script src="assets/js/item-catalog.js"></script>
<script src="assets/js/player-data.js"></script>
<script src="assets/js/services/wallet-service.js"></script>
<script src="assets/js/core/app.js"></script>
<script src="assets/components/ui-core.js"></script>
<script>UT.App.init({page:'settings'});</script>
<script src="assets/js/core/app-version.js"></script>
<script src="assets/js/core/display-mode.js"></script>
<script src="assets/js/core/profile-tabs.js"></script>
<script src="assets/js/core/page-module.js"></script>
<script src="assets/js/pages/settings.js"></script>
</body></html>
