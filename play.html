<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a62b8">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<title>DRAGON ROLL</title><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<style>
/* Pembungkus game (Stage 4.1.19). Landscape / desktop: iframe memenuhi layar.
   HP portrait (pointer kasar): iframe berukuran 100dvh x 100dvw lalu diputar 90° searah jarum jam, sehingga isi game tampil landscape
   memenuhi tinggi layar tanpa pemain memutar HP. Bila HP diputar ke landscape, otomatis kembali normal.
   #ov (layar "Memuat...") memakai geometri yang sama persis dengan #f supaya ikut berputar. */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a62b8;overscroll-behavior:none}
#f,#ov{position:fixed;left:0;top:0;width:100vw;height:100vh;width:100dvw;height:100dvh;border:0;display:block}
#f{background:#1a62b8}
@media (orientation:portrait) and (pointer:coarse){
  #f,#ov{width:100vh;height:100vw;width:100dvh;height:100dvw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);transform:translateX(100dvw) rotate(90deg)}
}
/* Layar memuat (tirai awan): muncul seketika saat halaman akan berpindah (tanpa transisi), hilang halus setelah halaman baru benar-benar siap. */
#ov{z-index:10;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Lilita One',system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#000}
#ov.hide{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility 0s linear .25s}
#ov .clouds{position:absolute;inset:0;overflow:hidden}
#ov .c0{position:absolute;inset:0;background:#e9f5ff;z-index:1}
#ov .cl{position:absolute;width:64%;aspect-ratio:2/1;will-change:transform;z-index:2;transition:none}
#ov .cl::before{content:"";position:absolute;inset:0;background:var(--img) no-repeat;background-size:100% 100%;will-change:transform}
#ov .cl.a{--img:url(assets/Images/clouds/cloud-1.svg)}
#ov .cl.b{--img:url(assets/Images/clouds/cloud-2.svg)}
#ov .cl.c{--img:url(assets/Images/clouds/cloud-3.svg)}
#ov .cl.l{left:-10%}
#ov .cl.r{right:-10%}
#ov .cl.l.k1{top:-14%;z-index:3}#ov .cl.r.k1{top:-6%;z-index:3}
#ov .cl.l.k2{top:16%;z-index:4}#ov .cl.r.k2{top:22%;z-index:4}
#ov .cl.l.k3{top:42%;z-index:5}#ov .cl.r.k3{top:46%;z-index:5}
#ov .cl.l.k4{top:64%;z-index:6}#ov .cl.r.k4{top:68%;z-index:6}
#ov .cl.k1{--d:1.25s;--w:0s;--s:2.4s;--o:0s}#ov .cl.k2{--d:1.3s;--w:.06s;--s:2.9s;--o:-1.1s}#ov .cl.k3{--d:1.35s;--w:.12s;--s:2.6s;--o:-2.2s}#ov .cl.k4{--d:1.4s;--w:.04s;--s:3.1s;--o:-.6s}
/* menunggu: awan melayang halus (geser + naik-turun sedikit), tiap awan beda tempo */
#ov:not(.hide) .cl::before{animation:cfloat var(--s) ease-in-out var(--o) infinite alternate}
#ov:not(.hide) .cl.r::before{animation-direction:alternate-reverse}
@keyframes cfloat{from{transform:translate3d(-3.6%,-2.4%,0)}to{transform:translate3d(3.6%,2.4%,0)}}
/* halaman siap: awan menyibak mulus ke kiri/kanan dari posisi melayangnya, putih memudar, halaman baru terlihat */
#ov:not(.quiet).hide{opacity:1;background:transparent;transition:visibility 0s linear 1.6s}
#ov:not(.quiet).hide .c0{opacity:0;transition:opacity 1.2s cubic-bezier(.4,0,.6,1) .1s}
#ov:not(.quiet).hide .cl.l{transform:translate3d(-140%,0,0);transition:transform var(--d) cubic-bezier(.45,.05,.3,1) var(--w)}
#ov:not(.quiet).hide .cl.r{transform:translate3d(140%,0,0);transition:transform var(--d) cubic-bezier(.45,.05,.3,1) var(--w)}
/* indikator progres: bar terisi bertahap (tahap muat halaman nyata + merayap pelan agar tidak terasa macet) */
#ov .ld{position:absolute;left:50%;bottom:9%;z-index:20;width:min(46%,320px);text-align:center;pointer-events:none;transform:translateX(-50%);font:800 15px/1 -apple-system,BlinkMacSystemFont,sans-serif;color:#2a5f93;text-shadow:0 1px 0 #fff;animation:ldin .35s ease-out .3s both}
#ov .ldt{margin-bottom:8px;white-space:nowrap}
#ov .ldt i{display:inline-block;width:5px;height:5px;margin-left:4px;border-radius:1px;background:#2a5f93;animation:ldd 1s ease-in-out infinite}
#ov .ldt i:nth-child(2){animation-delay:.15s}#ov .ldt i:nth-child(3){animation-delay:.3s}
#ov .ldb{height:14px;border-radius:7px;background:rgba(255,255,255,.7);border:2px solid #fff;box-shadow:0 2px 0 rgba(42,95,147,.28),inset 0 2px 3px rgba(42,95,147,.18);overflow:hidden}
#ov .ldb b{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(#9be15a,#4fb83a);transition:width .35s ease-out;position:relative;overflow:hidden}
#ov .ldb b::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-100%);animation:ldsh 1.1s linear infinite}
@keyframes ldsh{to{transform:translateX(100%)}}
@keyframes ldd{0%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-4px);opacity:1}}
@keyframes ldin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
#ov.quiet .ld{display:none}
#ov.hide .ld{animation:none;opacity:0;transition:opacity .25s ease}
#ov.quiet .clouds{visibility:hidden}
@media (prefers-reduced-motion:reduce){#ov .ldb b::after,#ov .ldt i{animation:none!important}#ov .cl::before{animation:none!important}#ov:not(.quiet).hide{opacity:0;transition:opacity .25s ease,visibility 0s linear .25s}#ov:not(.quiet).hide .cl{transform:none;transition:none}#ov:not(.quiet).hide .c0{opacity:1;transition:none}}
</style>
</head>
<body>
<iframe id="f" title="DRAGON ROLL" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
<div id="ov" role="status" aria-live="polite" aria-label="Memuat"><div class="clouds" aria-hidden="true"><div class="c0"></div><div class="cl a k1 l"></div><div class="cl b k1 r"></div><div class="cl c k2 l"></div><div class="cl a k2 r"></div><div class="cl b k3 l"></div><div class="cl c k3 r"></div><div class="cl a k4 l"></div><div class="cl b k4 r"></div></div><div class="ld" aria-hidden="true"><div class="ldt"><span>Memuat halaman</span><i></i><i></i><i></i></div><div class="ldb"><b></b></div></div></div>
<noscript>Game ini memerlukan JavaScript.</noscript>
<script src="assets/js/session.js"></script>
<script src="assets/js/prefs.js"></script>
<script src="assets/js/item-catalog.js"></script>
<script src="assets/js/player-data.js"></script>
<script>
(function () {
  var f = document.getElementById('f'), ov = document.getElementById('ov'), go = 'splash.html';
  try {
    var q = new URLSearchParams(location.search).get('go');
    // hanya halaman .html di folder yang sama (bukan play.html/index.html) agar tidak jadi open redirect
    if (q && /^[A-Za-z0-9_-]+\.html(\?[^#]*)?(#.*)?$/.test(q) && !/^(play|index)\.html/.test(q)) go = q;
  } catch (e) {}

  /* ================= Layar memuat (kondisional, bukan timer) =================
     Halaman akan pergi (pagehide/beforeunload)  -> layar memuat tampil seketika, menutup jeda kosong.
     Halaman baru selesai (load + font + gambar) -> layar memuat dihilangkan.
     splash.html punya layar muat sendiri (pulau melayang), jadi layar dadu ini tidak ditampilkan di atasnya. */
  var SELF_LOADING = /^splash\.html$/;
  function pageName(w) { try { return (w.location.pathname.split('/').pop() || 'index.html'); } catch (e) { return ''; } }
  /* Overlay antar-halaman: tirai awan (tanpa persen palsu; progres asli dihitung di splash).
     Setelah splash (yang sudah memuat dan menyimpan aset di cache) overlay hanya latar polos, agar tidak tampak memuat dua kali. */
  var hideT = 0, shown = true, shownAt = 0, MIN_SHOW = 700;   // awan minimal tampil 0,7 dtk (sempat melayang) sebelum menyibak
  /* progres: tahap nyata (halaman dimuat -> font/latar/gambar siap) + merayap pelan menuju batas tahap, tidak pernah terlihat diam */
  var bar = ov.querySelector('.ldb b'), lbl = ov.querySelector('.ldt span'), pct = 0, cap = 60, creepRaf = 0;
  function setP(v) { if (v > pct) { pct = v; bar.style.width = pct + '%'; } }
  function stage(c, text) { if (c > cap) cap = c; if (text && lbl) lbl.textContent = text; }
  function resetP() { pct = 0; cap = 60; bar.style.transition = 'none'; bar.style.width = '0%'; void bar.offsetWidth; bar.style.transition = ''; if (lbl) lbl.textContent = 'Memuat halaman'; setP(6); }
  function creep() { cancelAnimationFrame(creepRaf); (function tick() { if (!shown) return; var room = cap - pct; if (room > 0.2) setP(pct + room * 0.03); creepRaf = requestAnimationFrame(tick); })(); }
  function showOv(quiet) {
    clearTimeout(hideT);
    if (shown && !ov.classList.contains('hide')) return;   // pagehide + beforeunload bisa datang berurutan
    shown = true; shownAt = Date.now(); ov.classList.toggle('quiet', !!quiet);
    ov.classList.remove('hide'); resetP(); creep();
  }
  function hideOv() {
    if (!shown) return;
    shown = false; clearTimeout(hideT);
    setP(100);   // bar penuh dulu, baru awan menyibak
    var wait = ov.classList.contains('quiet') ? 120 : Math.max(380, MIN_SHOW - (Date.now() - shownAt));
    hideT = setTimeout(function () { ov.classList.add('hide'); }, wait);
  }
  ov.classList.add('quiet');   // pembukaan pertama: splash langsung tampil di bawahnya, jangan ada dadu/teks lebih dulu

  function whenReady(w, cb) {
    var d; try { d = w.document; } catch (e) { cb(); return; }
    var fonts = (d && d.fonts && d.fonts.ready) ? d.fonts.ready.catch(function () {}) : Promise.resolve();
    var imgs = [];
    try { imgs = Array.prototype.filter.call(d.images || [], function (im) { return !im.complete && im.src; }); } catch (e) {}
    var waits = imgs.map(function (im) { return new Promise(function (r) { im.addEventListener('load', r); im.addEventListener('error', r); }); });
    /* latar harus sudah ter-decode, kalau tidak frame pertama tampil polos */
    var bg = Promise.resolve();
    try { var bi = d.querySelector('.sbg-img'); if (bi && bi.decode) bg = bi.decode().catch(function () {}); } catch (e) {}
    /* halaman yang menyembunyikan body sampai render awal selesai (html:not(.ut-ready) body{visibility:hidden}):
       jangan buka overlay sebelum body benar-benar terlihat (maks 2 dtk agar tidak macet). */
    var shownBody = new Promise(function (r) {
      var t0 = Date.now();
      (function poll() {
        var hidden = false;
        try { hidden = w.getComputedStyle(d.body).visibility === 'hidden'; } catch (e) {}
        if (!hidden || Date.now() - t0 > 2000) r(); else setTimeout(poll, 30);
      })();
    });
    var all = [fonts, bg, shownBody].concat(waits), n = all.length;
    all.forEach(function (pr) { pr.then(function () { stage(Math.min(96, cap + 24 / n)); setP(Math.min(94, pct + 24 / n)); }); });
    Promise.all(all).then(function () {
      /* dua frame: beri kesempatan halaman menggambar frame pertamanya sebelum layar memuat dibuka */
      requestAnimationFrame(function () { requestAnimationFrame(cb); });
    });
  }

  /* ================= Suara & musik (dimiliki pembungkus agar tidak putus antar halaman) ================= */
  function settings() {
    try { var s = (f.contentWindow.PlayerData || window.PlayerData).settings(); return { music: s.music !== false, sound: s.sound !== false }; } catch (e) {}
    return { music: true, sound: true };
  }
  function musicVol() { try { return Math.max(0, Math.min(100, parseInt(UT.Prefs.get('musicVol', 60), 10) || 60)) / 100; } catch (e) { return 0.6; } }

  /* Musik latar untuk semua halaman selain gameplay (gameplay punya musiknya sendiri).
     Empat lagu di assets/music diputar bergantian. */
  var TRACKS = ['assets/music/sunset_plains.mp3', 'assets/music/community.mp3', 'assets/music/first_light_particles.mp3', 'assets/music/rainy.mp3'], ti = 0, bgm = null, fadeRaf = 0;
  var wantMusic = false;                     // halaman saat ini boleh bermusik (bukan gameplay)
  function ensureBgm() {
    if (bgm) return bgm;
    try {
      bgm = new Audio(); bgm.preload = 'auto'; bgm.src = TRACKS[ti]; bgm.volume = 0;
      bgm.addEventListener('ended', function () { ti = (ti + 1) % TRACKS.length; bgm.src = TRACKS[ti]; syncMusic(); });
    } catch (e) { bgm = null; }
    return bgm;
  }
  function fadeTo(v, ms, done) {
    cancelAnimationFrame(fadeRaf);
    if (!bgm) { if (done) done(); return; }
    var from = bgm.volume, t0 = performance.now();
    (function step(now) {
      var k = Math.min(1, (now - t0) / ms);
      try { bgm.volume = Math.max(0, Math.min(1, from + (v - from) * k)); } catch (e) {}
      if (k < 1) fadeRaf = requestAnimationFrame(step); else if (done) done();
    })(t0);
  }
  var needGesture = false;
  function syncMusic() {
    var on = wantMusic && settings().music && !document.hidden;
    if (on) {
      if (!ensureBgm()) return;
      if (bgm.paused) {
        var p; try { p = bgm.play(); } catch (e) {}
        if (p && p.catch) p.catch(function () { needGesture = true; });   // diblokir browser: coba lagi pada gesture pertama
        else if (!p) needGesture = true;
      }
      fadeTo(musicVol(), 400);
    } else if (bgm && !bgm.paused) {
      fadeTo(0, 300, function () { if (!(wantMusic && settings().music && !document.hidden)) { try { bgm.pause(); } catch (e) {} } });
    }
  }
  function onGesture() { if (needGesture) { needGesture = false; syncMusic(); } }
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(function (ev) { window.addEventListener(ev, onGesture, true); });
  document.addEventListener('visibilitychange', syncMusic);

  /* Suara ketukan tombol: kolam kecil agar ketukan beruntun tidak saling memotong; tetap bunyi walau halaman langsung berpindah. */
  var clickPool = [], clickI = 0;
  function playClick() {
    if (!settings().sound) return;
    try {
      if (!clickPool.length) for (var i = 0; i < 4; i++) { var a = new Audio('assets/sfx/ui/button-click.mp3'); a.preload = 'auto'; a.volume = 0.7; clickPool.push(a); }
      var el = clickPool[clickI++ % clickPool.length]; el.currentTime = 0;
      var p = el.play(); if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }
  window.UTShell = { click: playClick, syncMusic: syncMusic };   // dipakai UT.Audio di halaman (app.js)

  /* Setelah setiap ketukan di halaman, baca ulang pengaturan (toggle Musik/Suara di Pengaturan berlaku seketika). */
  function afterTap() { setTimeout(syncMusic, 0); setTimeout(syncMusic, 120); }

  /* ================= Pasang pada setiap halaman yang dimuat di iframe ================= */
  f.addEventListener('load', function () {
    var w; try { w = f.contentWindow; w.document; } catch (e) { hideOv(); return; }
    var name = pageName(w);

    // layar memuat
    stage(84, 'Menyiapkan tampilan'); setP(70);   // dokumen sudah dimuat
    if (SELF_LOADING.test(name)) hideOv(); else whenReady(w, hideOv);
    var leave = function () { showOv(SELF_LOADING.test(name)); };
    try {
      w.addEventListener('beforeunload', leave);
      w.addEventListener('pagehide', leave);
      w.addEventListener('pageshow', function (e) { if (e.persisted) hideOv(); });
    } catch (e) {}

    // musik: gameplay = berhenti; splash/loading = biarkan apa adanya; selain itu = bermusik
    if (name === 'gameplay.html') { wantMusic = false; syncMusic(); }
    else if (!SELF_LOADING.test(name)) { wantMusic = true; syncMusic(); }
    try { w.focus(); } catch (e) {}
    try { w.document.addEventListener('click', afterTap, true); } catch (e) {}
  });
  f.src = go;
})();
</script>
</body>
</html>
