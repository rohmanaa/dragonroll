  <div id="title" class="ttl">Dadu</div>
  <div id="cur-em" data-rbar="gem" data-value-id="v-em"></div>
  <div id="cur-co" data-rbar="coin" data-value-id="v-co"></div>

  <!-- kiri: info (atas) + pratinjau 3D & tombol (bawah); kanan: tab + grid slot kotak -->
  <section id="dl" aria-label="Detail dadu">
    <div id="dinfo" class="dpanel card-panel-new">
      <div id="nm" class="ttl"></div>
      <div id="rar"></div>
      <p id="ds"></p>
      <div id="dstats" aria-label="Kelebihan dadu">
        <div class="dst"><span>Bonus dadu</span><i></i><em>segera hadir</em></div>
        <div class="dst"><span>Kelebihan</span><i></i><em>segera hadir</em></div>
        <div class="dst"><span>Efek max level</span><i></i><em>segera hadir</em></div>
      </div>
    </div>
    <div id="dprev" class="dpanel card-panel-new"><div id="fpv" title="Ketuk untuk melempar dadu"></div></div>
    <div id="dbtns">
      <button class="btn ut-gl ut-c-r" id="b-sell" type="button"><img src="assets/images/ui/buttons-and-controls/tombol-merah-polos.webp" alt=""><span>JUAL</span></button>

    </div>
  </section>

  <section id="dr" class="dpanel card-panel-new" aria-label="Koleksi dadu">
    <div id="dtabs" class="ut-seg" role="tablist">
      <button type="button" role="tab" class="ut-seg-i on" data-tab="all" aria-selected="true">Lihat Semua</button>
      <button type="button" role="tab" class="ut-seg-i" data-tab="own" aria-selected="false">Memiliki</button>
    </div>
    <div id="dgrid"></div>
  </section>

  <!-- modal konfirmasi beli / coin kurang -->
  <div id="md"><div class="panel ut-mk" id="box" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h3 id="mt" class="ut-mk-t"></h3><p id="mx"></p>
    <div id="mbtns">
      <button class="btn ut-gl ut-c-r" id="m-no" type="button"><span></span></button>
      <button class="btn ut-gl ut-c-g" id="m-ok" type="button"><span></span></button>
    </div>
  </div></div>
