<style>/* Gaya bersama halaman game/ (kanvas 1920x1080 yang diskalakan) */

#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s;z-index:99}
#fade.on{opacity:1;pointer-events:all}
/* Penengah kanvas: tetap di tengah walau layar lebih kecil dari 1920x1080 (grid "safe" align membuatnya bergeser) */
#wrap{display:block!important}
#stage{position:absolute!important;left:50%!important;top:50%!important;margin:-540px 0 0 -960px!important;transform-origin:center center!important}

/* overlay transisi: di luar #stage (yang di-scale) supaya menutupi SELURUH layar, bukan hanya kontainer */
#fade{position:fixed!important;left:0!important;top:0!important;right:0!important;bottom:0!important;width:auto!important;height:auto!important;z-index:9999!important;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}

/* Latar modal PENUH layar: overlay modal hanya menutupi #stage (1920x1080 yang diskalakan), sehingga di layar dengan rasio lain

#wrap{z-index:1}
body:has(.modal.on,#modal.on,#confirm.on,#lang.on,#dlg.on,#authmodal.on,#md.on)::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:rgba(10,8,30,.93)}

.xbtn{position:absolute;right:40px;top:40px;width:90px}
.dlg{position:relative;width:900px;height:457px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}.dlg>img.bg{position:absolute;inset:0;width:100%;height:100%}.dlg>*:not(.bg){position:relative}.dlg h3{margin:0;font:56px var(--font-title)}.dlg .t{font-size:30px;font-weight:700;color:#efe6cf;margin:0}
.warn{position:absolute;left:0;right:0;font:900 italic 72px var(--font-body);color:#ff2a3a;white-space:nowrap;overflow:hidden;z-index:21;letter-spacing:4px}

.boss{position:relative;width:900px;height:360px;display:grid;place-items:center;background:linear-gradient(90deg,transparent,#000c 25%,#000c 75%,transparent)}.boss img.o{position:absolute;top:60px;height:140px}.boss .sk{width:110px;position:relative;margin-bottom:-10px}.boss b{font:170px/1 var(--font-title);color:#ff2a3a;letter-spacing:10px;text-shadow:0 0 40px #f00}
.bhp{width:700px;text-align:center;font:800 30px var(--font-body)}
.rdy{display:flex;gap:24px}.rdy .panel{padding:20px 30px;font:800 30px var(--font-body)}.rdy img{width:100px}

/* simulasi boss */
#sim{inset:0;z-index:8;pointer-events:none}
.startsim .gb.xl{width:560px;white-space:nowrap}.startsim{position:absolute;left:50%;top:400px;transform:translateX(-50%);pointer-events:auto;cursor:pointer;animation:pu2 1.2s infinite alternate}@keyframes pu2{to{transform:translateX(-50%) scale(1.06)}}
.bosshud{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:760px;text-align:center}
.bosshud .lbl{position:relative;width:300px;height:70px;margin:0 auto}.bosshud .lbl img{width:100%;height:100%}.bosshud .lbl b{position:absolute;inset:0;font:40px/66px var(--font-title);color:#ffe9d0}
.bosshud .bn2{font:44px var(--font-title);color:#ffe9a0;margin:4px 0 -6px}.bosshud .hpb{width:100%}
.bossfig{position:absolute;left:1060px;top:300px;width:300px;height:300px;display:grid;place-items:center}.bossfig img{width:260px;filter:drop-shadow(0 0 40px #f00)}
.bossfig::after{content:"";position:absolute;bottom:10px;width:260px;height:40px;background:radial-gradient(#000a,transparent 70%)}
.bossfig.hit img{animation:shk .35s,fl3 .35s}.bossfig.die{animation:die 1.6s forwards}
@keyframes shk{20%{transform:translateX(-18px)}50%{transform:translateX(16px)}80%{transform:translateX(-8px)}}@keyframes fl3{50%{filter:drop-shadow(0 0 40px #fff) brightness(2.4)}}@keyframes die{to{opacity:0;transform:scale(.7) translateY(60px)}}
.dmg{position:absolute;display:flex;flex-direction:column;align-items:center;font:64px var(--font-title);color:#fff;animation:up 1.3s forwards;-webkit-text-stroke:2px #1b1430;paint-order:stroke fill}.dmg.crit{color:#ffd45a;font-size:84px}.dmg img{width:200px}
@keyframes up{to{transform:translateY(-120px);opacity:0}}
.combo{position:absolute;left:1390px;top:330px;display:flex;align-items:center;gap:10px;font:80px var(--font-title);color:#7be05a;-webkit-text-stroke:2px #1b3a10;paint-order:stroke fill}.combo img{width:180px}

const A='assets/komponen/';
const $=s=>document.querySelector(s);
const im=(p,c='',st='')=>`<img class="im ${c}" src="${D[A+p+'.webp']||''}" alt="" style="${st}">`;
const G=n=>im('glyph-putih/'+n);
const BTN={g:'tombol-dan-kontrol/tombol-hijau-polos',b:'tombol-dan-kontrol/tombol-biru-polos',y:'tombol-dan-kontrol/tombol-kuning-polos',r:'tombol-dan-kontrol/tombol-merah-polos',d:'tombol-dan-kontrol/tombol-gelap-polos',a:'tombol-dan-kontrol/tombol-abu-polos'};
const btn=(c,t,s='',off='')=>`<div class="gb ${s} ${off}">${im(BTN[c])}<span>${t}</span></div>`;
const AV=['pejuang-terpilih','pemanah','penyihir','paladin'].map(n=>'ikon-kelas-hero/ikon-kelas-'+n);
const TAG={aku:'banner-label/label-biru-polos',host:null,AUTO:'banner-label/label-hijau-polos'};
const ICB={sepatu:'ikon-item/sepatu-sayap',bulu:'glyph-putih/bulu',ganjil:'ikon-item/ramuan-hijau',genap:'ikon-item/ramuan-ungu',lucky:'ikon-gem-medali/semanggi',kebal:'ikon-item/batu-rune',perisai:'ikon-item/perisai-kayu',beku:'glyph-putih/kepingan-salju'};
const P=[
 {n:'Kamu',c:'blu',pos:'42',t:['aku'],b:[['sepatu','+2'],['perisai']]},
 {n:'Budi',c:'red',pos:'Crystal 2/6',t:['host'],b:[['lucky']]},
 {n:'CPU Alex',c:'grn',pos:'Naga 80',t:['AUTO'],b:[['ganjil'],['beku']],hp:70},
 {n:'Sari',c:'pur',pos:'Mulai',t:[],b:[['kebal']],off:1}];
const HEX=['hud/lencana-hex-hijau','hud/lencana-hex-merah','hud/lencana-hex-hijau','hud/lencana-hex-merah'];
function players(act,boss){LP=[act,boss];$('#players').innerHTML=P.map((p,i)=>{const card=`<div class="pl ${i==act?'act':''}">
 <div class="av">${im(AV[i])}<div class="tn">${im(HEX[i])}<b>${i+1}</b></div></div>
 <div class="mid">${TM&&i==act?'<div class="tmr"><u></u></div>':''}<div class="r1"><span class="nm">${p.t.includes('host')?im('ikon-item/mahkota','cr'):''}${p.n}</span>${p.t.filter(t=>TAG[t]).map(t=>`<span class="tag">${im(TAG[t])}<span>${t==='aku'?'AKU':t}</span></span>`).join('')}</div>
 <div class="r2"><span class="ps">${p.off?im('glyph-putih/wifi-mati','wf')+'Terputus':p.pos}</span><span class="bf">${p.b.map(b=>`<span class="bi">${im(ICB[b[0]])}${b[1]?`<em>${b[1]}</em>`:''}</span>`).join('')}</span></div>
 </div></div>`;const ex=`<div class="px">${cryRow(i)}${p.hp&&boss?hpbar(p.hp):''}</div>`;return `<div class="pg p${i} ${p.off?'off':''}">${i==1||i==2?card+ex:ex+card}</div>`}).join('');popNext=false}
function turn(m){const o=m.opp;
 $('#turn').innerHTML=`${m.msg?`<div class="tinfo"><p>${m.msg}</p></div>`:''}
 <div class="dw"><div class="dice">${im('new-icon/dadu')}${m.d?`<b>${m.d}</b>`:''}</div></div>`;
 $('#rollbox').innerHTML=o?'':`${m.meter?`<div class="meter">${[1,2,3,4,5,6].map(i=>`<i class="${i<=m.meter?'f':''}" style="--c:${CC[i-1]}"></i>`).join('')}</div>`:''}
 <div class="rrow">${btn(m.rb||'g',m.rt||'ROLL','xl',m.roff)}</div>`}
const PW=[['sepatu-sayap','ikon-item','Langkah',3],['bulu','glyph-putih','Ekstra',1],['ramuan-hijau','ikon-item','Ganjil',1],['ramuan-ungu','ikon-item','Genap',0],['semanggi','ikon-gem-medali','Pasti 6',1],['batu-rune','ikon-item','Kebal',1],['perisai-kayu','ikon-item','Perisai',2],['kepingan-salju','glyph-putih','Beku',1],['bom','ikon-item','TNT',2],['busur-panah','ikon-item','Panah',1],['petir-emas','ikon-gem-medali','Petir',1],['acak','glyph-putih','Tukar',1],['putar-bulat','glyph-putih','Teleport',1],['mundur-cepat','glyph-putih','Mundur',2],['peti-kayu-emas','ikon-gem-medali','Peti',1],['gem-heksagon-ungu','ikon-gem-medali','Crystal',1],['helm-sayap','ikon-item','Totem',1]];

 ${p[3]>0?`<div class="ct">${im('misi/lencana-notifikasi-merah-segi-delapan')}<b>${p[3]}</b></div>`:''}<span class="lb">${p[2]}</span></div>`}).join('')}

{t:'3 Setelah lempar',d:'Dadu → banner Tangga / Ular / Pantul (maks 3 menumpuk). Roll mode tahan-lepas.',f:()=>bn('tl','Naik Tangga! +18 langkah','Petak 24 → 42')+bn('ul','Kena Ular! Turun ke 4')+bn('pl','Kelebihan 3! Memantul ke 97'),pl:0,tn:{d:'5',rt:'Tahan & lepas',roff:'off',aoff:'off',msg:'Dadu dilempar…',meter:5}},
{t:'4 Peti terbuka',d:'Kartu reward peti. Hasil lain: Maju/Mundur 1-3 · Add Roll · Bonus +2 · Luncur Tangga/Ular · Kosong.',f:()=>bn('pt','Budi membuka peti'),card:`<h3 class="ttl">Budi membuka peti</h3><div class="big">${im('ikon-gem-medali/semanggi')}Pasti 6</div>`,pl:1,tn:{opp:1,name:'Budi',d:'3'},lock:1},
{t:'5 Serangan → Totem',d:'Kartu serangan lalu modal Totem dengan hitung mundur.',f:()=>`<div class="bn c-r">${G('seru-bulat')}<div>Budi → Kamu<small>Panah · Kena! mundur 2 petak</small></div></div>`,pl:0,tn:{opp:1,name:'Budi'},lock:1,
 ov:()=>`<div class="ov">${frame(`<div style="width:110px">${im('ikon-item/helm-sayap')}</div><h3 class="ttl">Kamu kena Ular!</h3><p class="t">Totem bisa menahannya (sisa 1)</p><p class="t" style="color:#ffd45a">Otomatis dipakai dalam 12 detik</p><div class="rowb">${btn('g','Pakai Totem','s')}${btn('a','Tidak','s')}</div>`)}</div>`},
{t:'6 Pasang jebakan',d:'Bar pasang + pratinjau jebakan di petak hijau.',f:()=>bn('i','Pilih petak untuk jebakan'),trap:`${im('ikon-item/bom')}<div>TNT → petak 14 (3 di depan)<small>Tap petak hijau untuk memilih</small></div>${btn('a','Batal','s')}${btn('g','Pasang','s')}`,cell:1,pl:0,tn:{rb:'d',roff:'off',msg:'Memasang jebakan…'},sel:8},

 ov:()=>`<div class="vg"></div><div class="warn" style="top:0">WARNING! WARNING! WARNING! WARNING! WARNING!</div><div class="warn" style="bottom:0">WARNING! WARNING! WARNING! WARNING! WARNING!</div><div class="ov" style="background:transparent"><div class="boss">${im('hud/ornamen-sirip-kiri','o','left:20px')}${im('hud/ornamen-sirip-kanan','o','right:20px')}${im('ikon-gem-medali/tengkorak','sk')}<b>BOSS</b></div><div class="bhp">Ender Dragon · 62%${hpbar(62)}</div></div>`},
{t:'7b ▶ Simulasi Boss',cry:4,d:'Urutan boss: Crystal 6/6 hancur → WARNING → HUD boss + bar HP → serang (klik SERANG juga bisa) → boss kalah → hadiah.',pl:0,boss:1,sim:1,tn:{msg:'Siap bertarung',rb:'d',roff:'off',rt:'SERANG',aoff:'off'}},

 ov:()=>`<div class="ov"><div class="ban">${im('banner-label/banner-judul-ungu-polos')}<span class="ttl">KAMU MENANG!</span></div><div class="stars">${im('stage-chapter/bintang-stage-emas')}${im('stage-chapter/bintang-stage-emas')}${im('stage-chapter/bintang-stage-emas','x')}</div><div class="sep">HADIAH</div><div class="rw" style="margin-bottom:30px">${rwd('slot-equipment/slot-hijau','hud/ikon-koin-emas','1500')}${rwd('slot-equipment/slot-biru','hud/ikon-gem-biru','3')}${rwd('slot-equipment/slot-ungu','hud/ikon-buku-sihir-ungu','+120 XP')}${rwd('slot-equipment/slot-coklat','ikon-item/mahkota','Dragon')}${rwd('slot-equipment/slot-terpilih','hud/ikon-kado-merah','1')}</div><div class="xp">${im('misi/bar-progres-kosong','tr')}${im('misi/isi-bar-progres-oranye','fl2')}${im('hud/lencana-lvl-biru','bd')}<span class="ttl">183/400 XP</span></div><div class="rowb">${btn('g','Main lagi')}${btn('b','Menu')}</div></div>`},
{t:'8b Kalah',d:'Referensi ZSP46C: judul merah, teks hiburan, dua tombol.',nofs:1,nohud:1,
 ov:()=>`<div class="ov red"><div class="dead">${im('hud/ornamen-sirip-kiri')}LEVEL GAGAL${im('hud/ornamen-sirip-kanan')}</div><div class="ttl" style="font-size:64px">Kamu kalah</div><p>Jangan menyerah! Kumpulkan power, atur langkah, dan coba lagi. Setiap permainan membuat kamu lebih jago.</p><div class="sep">+20 XP · +50 KOIN</div><div class="rowb">${btn('b','Main lagi')}${btn('y','Menu')}</div></div>`},

{t:'10 AUTO / AFK',d:'Pemain AUTO/terputus + hitung mundur AFK. Host menjeda (untuk pemain online).',f:()=>bn('i','Sari terputus','Digantikan AUTO')+bn('i','Budi (host) menjeda permainan'),pl:3,tn:{opp:1,name:'Sari',msg:'Offline · diganti AUTO'},lock:1,cd:1},
{t:'11 Ready / Error',d:'Layar Ready sebelum mulai dan error WebGL.',nofs:1,nohud:1,
 ov:()=>`<div class="ov"><div class="ban" style="height:200px;width:880px">${im('banner-label/banner-judul-hijau-polos')}<span class="ttl">SIAP?</span></div><div class="rdy">${P.slice(0,3).map((p,i)=>`<div class="panel">${im(AV[i])}<br>${p.n}<br><span style="color:#7be05a">READY</span></div>`).join('')}</div>${btn('g','MULAI')}<div class="dlg" style="height:300px;width:700px">${im('panel-dialog/bingkai-dialog','bg')}<h3 class="ttl" style="color:#ff5a6c;font-size:44px">3D gagal dimuat</h3><p class="t" style="font-size:24px">Browser tidak mendukung WebGL.</p>${btn('r','Coba lagi','s')}</div></div>`},
{t:'12 Acak Giliran',d:'Modal acak giliran: kartu diacak, lalu tiap pemain memilih satu kartu tertutup. Angka di baliknya = urutan giliran. Murni hoki, host tidak diuntungkan. Ketuk satu kartu saat giliranmu memilih.',nofs:1,nohud:1,init:()=>shfInit(),
 ov:()=>`<div class="ov"><div class="ban" style="height:170px;width:760px">${im('banner-label/banner-judul-ungu-polos')}<span class="ttl" style="font-size:64px">ACAK GILIRAN</span></div><p class="shf-t" id="shfmsg"></p><div class="shfrow shuf" id="shfrow">${[0,1,2,3].map(i=>`<div class="sc" onclick="shfTap(${i})" style="--x:${(1.5-i)*224}px;--y:${-i*5}px;--s:${i%2?-70:70}px;--r:${i%2?-7:7}deg"><div class="in"><div class="bk"><span>?</span></div><div class="fr"></div></div></div>`).join('')}</div><div class="shfchips" id="shfchips"></div><div class="sep" style="letter-spacing:2px">Host tidak mendapat keuntungan — urutan murni keberuntungan</div><div id="shfbtn"></div></div>`}
];
const PERM=[2,4,1,3];let SH={};
const shfSort=()=>[0,1,2,3].sort((a,b)=>SH.res[a]-SH.res[b]);
function shfDraw(){const done=SH.ph=='done';const ord=done?shfSort():[0,1,2,3];
 $('#shfchips').innerHTML=ord.map(i=>{const p=P[i],r=SH.res[i];return `<div class="shp ${SH.ph=='pick'&&SH.cur===i?'act':''}">${im(AV[i])}<div><div class="nm2">${p.t.includes('host')?im('ikon-item/mahkota'):''}${p.n}</div><div class="rs ${r?'ok':''}">${r?'Giliran '+r:(SH.ph=='pick'&&SH.cur===i?'Memilih…':'Menunggu')}</div></div></div>`}).join('');
 const m=$('#shfmsg');if(!m)return;
 m.innerHTML=SH.ph=='shuffle'?'Kartu diacak…':done?'Urutan giliran sudah ditentukan!':(SH.cur===0?'Giliran kamu memilih — ketuk satu kartu':P[SH.cur].n+' sedang memilih…')+(SH.ph=='pick'&&SH.cur===0?'<div class="tmr shfbar" style="margin:10px auto 0"><u></u></div>':'');
 $('#shfbtn').innerHTML=done?`<div class="rowb"><div onclick="show(S.findIndex(x=>x.t.startsWith('12 ')))">${btn('y','↻ Ulangi demo','s')}</div></div>`:''}
function shfDo(ci){if(SH.ph!='pick'||SH.used.includes(ci))return;SH.used.push(ci);SH.res[SH.cur]=PERM[ci];
 const c=document.querySelectorAll('.sc')[ci];c.classList.add('flip','used');c.querySelector('.fr').innerHTML=im(AV[SH.cur])+'<b>'+PERM[ci]+'</b>';
 SH.cur++;if(SH.cur>3){SH.ph='done';shfDraw();return}shfDraw();later(shfCpu,1100)}
function shfCpu(){const f=[0,1,2,3].filter(i=>!SH.used.includes(i));shfDo(f[Math.floor(Math.random()*f.length)])}
function shfTap(ci){if(SH.ph=='pick'&&SH.cur===0)shfDo(ci)}
function shfInit(){SH={ph:'shuffle',cur:0,res:{},used:[]};shfDraw();later(()=>{$('#shfrow').classList.remove('shuf');SH.ph='pick';shfDraw();later(()=>{if(SH.ph=='pick'&&SH.cur===0)shfCpu()},5000)},3100)}
function show(i){const s=S[i];clearSim();document.querySelectorAll('#dev button:not(.simb)').forEach((b,j)=>b.classList.toggle('on',j==i));$('#note').textContent=s.d;
 CR[0]=s.cry??3;TM=(i==0||s.cd)?1:0;players(s.pl??0,s.boss);turn(s.tn||{});powers(s.sel,s.lock);
 $('#fs').innerHTML=s.f?s.f():'';$('#fs').classList.toggle('hide',!!s.nofs);
 $('#toast').innerHTML=i==0?bn('g','Giliran kamu'):'';$('#fs').innerHTML=i==0?'':$('#fs').innerHTML;
 $('#cd').classList.add('hide');
 $('#card').classList.toggle('hide',!s.card);if(s.card)$('#card').innerHTML=s.card;
 $('#trap').classList.toggle('hide',!s.trap);$('#cell').classList.toggle('hide',!s.cell);if(s.trap)$('#trap').innerHTML=s.trap;if(s.cell)$('#cell').innerHTML=im('ikon-item/bom');
 $('#why').classList.toggle('hide',!s.why);if(s.why)$('#why').innerHTML=G('gembok')+'Power terkunci: '+LK[4]+' / tidak ada target / beda map / stok 0';
 ['#players','#rg','#pw','#tb','#emo','#fl'].forEach(q=>$(q).classList.toggle('hide',!!s.nohud));
 $('#ov').innerHTML=s.ov?s.ov():'';if(s.init)s.init();
 if(s.sim)$('#sim').innerHTML=`<div class="startsim" onclick="runSim()">${btn('g','▶ SIMULASI BOSS','xl')}</div>`;}

/* ===== simulasi boss (hanya demo tampilan) ===== */
const SIM=S.findIndex(s=>s.sim);let T=[],phase='',hp=100,hi=0,st=[],combo=0;
const later=(f,ms)=>{const t=setTimeout(f,ms);T.push(t);return t};
function clearSim(){T.forEach(clearTimeout);T=[];phase='';hp=100;hi=0;st=[];combo=0;$('#sim').innerHTML='';$('#rollbox').onclick=null;$('#fs').style.cssText='';$('#fs').classList.remove('hide','low')}
const push=h=>{st.push(h);if(st.length>3)st.shift();$('#fs').innerHTML=st.join('')};
const HITS=[{p:25,n:458,c:1},{p:15,n:120},{p:20,n:260},{p:25,n:430,c:1},{p:15,n:150}];
function runSim(){show(SIM);const sm=$('#sim');sm.innerHTML='';$('#fs').classList.add('low');
 phase='intro';crystal(5);push(bn('nc','Crystal hancur! 5/6'));
 later(()=>{crystal(6);push(bn('nc','Crystal 6/6 hancur · READY!','Boss akan muncul'))},900);
 later(()=>{$('#ov').innerHTML=S[7].ov().replace('Ender Dragon · 62%','Ender Dragon · 100%').replace('width:62%','width:100%')},2000);
 later(()=>{$('#ov').innerHTML='';st=[];
  sm.innerHTML=`<div class="bosshud"><div class="lbl">${im('banner-label/label-merah-polos')}<b class="ttl">BOSS</b></div><div class="bn2 ttl">Ender Dragon</div>${hpbar(100)}</div><div class="bossfig" id="bf">${im('ikon-gem-medali/tengkorak')}</div><div class="combo hide" id="cb"></div>`;
  push(bn('mob','Ender Dragon muncul!','Fase serang dimulai'));
  turn({msg:'Fase Naga: serang!',rb:'r',rt:'SERANG',ab:'a',at:'MATI'});$('#rollbox').onclick=()=>hit(true);phase='fight';later(autoHit,1300)},4800)}
function autoHit(){if(phase=='fight')hit()}
function hit(manual){if(phase!='fight')return;T=T.filter(t=>(clearTimeout(t),false));
 const h=HITS[hi++%HITS.length];hp=Math.max(0,hp-h.p);combo++;
 $('#sim .hpb u').style.width=hp+'%';
 const bf=$('#bf');bf.classList.remove('hit');void bf.offsetWidth;bf.classList.add('hit');
 const d=document.createElement('div');d.className='dmg '+(h.c?'crit':'');d.style.left=(1090+Math.random()*140)+'px';d.style.top=(330+Math.random()*60)+'px';
 d.innerHTML=(h.c?im('hud/teks-critical-merah'):'')+`<b>${h.n}</b>`;$('#sim').appendChild(d);setTimeout(()=>d.remove(),1300);
 const cb=$('#cb');cb.classList.remove('hide');cb.innerHTML=im('hud/teks-combo-hijau')+`<b class="ttl">${combo}</b>`;
 push(bn('mob',(manual?'Kamu':'AUTO')+' → Ender Dragon',`-${h.n} · HP boss ${hp}%`));
 if(hp<=0){phase='end';$('#bf').classList.add('die');$('#rollbox').onclick=null;
  later(()=>push(bn('ok','Ender Dragon dikalahkan!','Hadiah Dragon menanti')),500);
  later(()=>{let o=S[9].ov().replace('KAMU MENANG!','BOSS DIKALAHKAN!');const k=o.lastIndexOf('</div>');$('#ov').innerHTML=o.slice(0,k)+`<div onclick="runSim()">${btn('y','↻ Ulangi simulasi','s')}</div>`+o.slice(k)},2300)}
 else later(autoHit,1200)}
$('#dev').innerHTML=`<button class="simb" onclick="runSim()">▶ Simulasi Boss</button>`+S.map((s,i)=>`<button onclick="show(${i})">${s.t}</button>`).join('');
function fit(){const k=Math.min(innerWidth/1920,(innerHeight-78)/1080);$('#stage').style.transform=`scale(${k})`}
addEventListener('resize',fit);fit();show(0);
</script>
