<style>
  :root { --bg:#0b0c11; --panel:#151822; --line:#262b3a; --text:#e8eaf2; --dim:#8b92a8; --accent:#ffa31a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family: system-ui, sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-rows: 1fr auto; height:100%; }
  #stage { position:relative; min-height:0; }
  #hud { position:absolute; left:0; right:0; top:0; padding:12px 14px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
  #info .name { font-size:18px; font-weight:700; }
  #info .meta { font-size:12px; color:var(--dim); margin-top:2px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; color:#111; margin-right:6px; }
  #result { font-size:56px; font-weight:800; text-shadow:0 2px 12px rgba(0,0,0,.7); opacity:0; transform:scale(.7); transition:all .25s ease; }
  #result.show { opacity:1; transform:scale(1); }
  #panel { background:var(--panel); border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; }
  #tabs { display:flex; gap:6px; overflow-x:auto; }
  .tab { flex:none; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--dim); font-size:12px; }
  .tab.on { color:var(--text); border-color:var(--accent); }
  #list { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .die { flex:none; width:84px; padding:8px 6px; border-radius:10px; border:2px solid var(--line); background:#0f1119; color:var(--text); font-size:11px; text-align:center; }
  .die .sw { width:34px; height:34px; border-radius:9px; margin:0 auto 6px; border:1px solid rgba(255,255,255,.2); }
  .die.on { border-color:var(--c, var(--accent)); }
  .die small { display:block; color:var(--dim); font-size:10px; margin-top:2px; }
  #bar { display:flex; gap:8px; align-items:center; }
  #roll { flex:1; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#1a1000; font-size:16px; font-weight:800; }
  #roll:disabled { opacity:.55; }
  select, .tog { padding:12px 10px; border-radius:10px; border:1px solid var(--line); background:#0f1119; color:var(--text); font-size:13px; }
  .tog.on { border-color:var(--accent); }
</style>
</head>

<div id="app">
  <div id="stage">
    <div id="hud">
      <div id="info"><div class="name"></div><div class="meta"></div></div>

    </div>
  </div>
  <div id="panel">
    <div id="tabs"></div>
    <div id="list"></div>
    <div id="bar">

        <option value="auto">Auto</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <button id="snd" class="tog on" aria-label="Suara">🔊</button>
      <button id="roll">ROLL</button>
    </div>
  </div>
</div>

<div id="err" style="display:none;position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#400;color:#fff;font:12px monospace;padding:10px;border-radius:8px;white-space:pre-wrap;max-height:50%;overflow:auto"></div>

(function(){var b=document.getElementById('err');function s(t){b.style.display='block';b.textContent+=t+'\n';}

function build(raw, index) {
  const rarity = RARITY[raw.rarity];
  const tier = rarity.tier;
  const effect = Object.freeze({ ...TIER_PRESETS[tier], ...raw.effect, effectTier: tier });
  const material = Object.freeze({ ...raw.material, pip: Object.freeze({ ...raw.material.pip }) });
  return Object.freeze({
    id: raw.id,
    order: index + 1,
    name: raw.name,
    collection: raw.collection,
    rarity: raw.rarity,
    materialName: raw.materialName,
    faces: 6, // semua dadu D6
    material,
    effect,
  });
}

const DICE_CATALOG = Object.freeze(RAW.map(build));
const BY_ID = new Map(DICE_CATALOG.map((d) => [d.id, d]));

const getDice = (id) => BY_ID.get(id) || null;
const getDiceByCollection = (collectionId) => DICE_CATALOG.filter((d) => d.collection === collectionId);

/** Field efek wajib dari spesifikasi. */
const EFFECT_FIELDS = Object.freeze([
  'effectTier', 'particleType', 'particleCount', 'particleSize', 'particleSpeed', 'particleLifetime',
  'glowIntensity', 'emissiveIntensity', 'trailEnabled', 'auraEnabled', 'impactIntensity',
  'landingEffect', 'idleEffect', 'rollEffect', 'resultEffect', 'soundEffect',
]);

/** Dipakai oleh test: memastikan katalog valid dan tidak ada field yang memengaruhi peluang angka. */
function validateCatalog() {
  const errors = [];
  if (DICE_CATALOG.length !== 20) errors.push(`Harus 20 dadu, ada ${DICE_CATALOG.length}`);
  const ids = new Set();
  for (const d of DICE_CATALOG) {
    if (ids.has(d.id)) errors.push(`ID ganda: ${d.id}`);
    ids.add(d.id);
    if (d.faces !== 6) errors.push(`${d.id}: bukan D6`);
    for (const f of EFFECT_FIELDS) if (!(f in d.effect)) errors.push(`${d.id}: field efek hilang ${f}`);
    if (d.effect.effectTier !== RARITY[d.rarity].tier) errors.push(`${d.id}: tier tidak sesuai rarity`);
    for (const k of Object.keys(d)) if (/luck|bonus|weight|chance|price/i.test(k)) errors.push(`${d.id}: field terlarang ${k}`);
  }
  return errors;
}

/** Peluang adil 1–6. Pakai crypto bila ada, dengan rejection sampling agar tanpa bias. */
function rollFairD6(rng) {
  if (rng) return 1 + Math.floor(rng() * 6);
  const c = typeof globalThis !== 'undefined' ? globalThis.crypto : null;
  if (c && c.getRandomValues) {
    const a = new Uint8Array(1);
    do { c.getRandomValues(a); } while (a[0] >= 252); // 252 = 6 * 42
    return 1 + (a[0] % 6);
  }
  return 1 + Math.floor(Math.random() * 6);
}

// ===== DicePhysics.js =====
/**
 * DicePhysics.js — simulasi rigid body kubus (D6) tanpa dependensi.
 *
 * Kubus homogen punya tensor inersia isotropik (I = m·s²/6), jadi solver impuls
 * bisa memakai skalar. Kolisi: 8 sudut kubus vs lantai dan 4 dinding arena.
 * Timestep tetap (1/120 s) dengan akumulator => hasil konsisten di berbagai FPS.
 * Modul ini murni matematika (tanpa THREE) sehingga bisa diuji di Node.
 *
 * Quaternion berformat [x, y, z, w].
 */

const FIXED_DT = 1 / 120;
const MAX_SUBSTEPS = 10;

const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const len = (a) => Math.hypot(a[0], a[1], a[2]);

function qmul(a, b) {
  return [
    a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
    a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
    a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
    a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
  ];
}
function qrot(q, v) {
  const [x, y, z, w] = q;
  const tx = 2 * (y * v[2] - z * v[1]);
  const ty = 2 * (z * v[0] - x * v[2]);
  const tz = 2 * (x * v[1] - y * v[0]);
  return [
    v[0] + w * tx + (y * tz - z * ty),
    v[1] + w * ty + (z * tx - x * tz),
    v[2] + w * tz + (x * ty - y * tx),
  ];
}
function qnorm(q) {
  const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
  return [q[0] / l, q[1] / l, q[2] / l, q[3] / l];
}
function qaxis(axis, angle) {
  const s = Math.sin(angle / 2);
  return [axis[0] * s, axis[1] * s, axis[2] * s, Math.cos(angle / 2)];
}
/** Rotasi busur terpendek yang memutar vektor a ke vektor b (keduanya unit). */
function qarc(a, b) {
  const d = dot(a, b);
  if (d > 0.999999) return [0, 0, 0, 1];
  if (d < -0.999999) return qaxis([1, 0, 0], Math.PI);
  const ax = cross(a, b);
  return qnorm([ax[0], ax[1], ax[2], 1 + d]);
}
function randomQuat(rng) {
  const u1 = rng(), u2 = rng(), u3 = rng();
  const a = Math.sqrt(1 - u1), b = Math.sqrt(u1);
  return [a * Math.sin(2 * Math.PI * u2), a * Math.cos(2 * Math.PI * u2), b * Math.sin(2 * Math.PI * u3), b * Math.cos(2 * Math.PI * u3)];
}

class DicePhysics {
  constructor(o = {}) {
    this.h = o.halfSize ?? 0.5;
    this.bx = o.boundsX ?? 3.3;
    this.bz = o.boundsZ ?? 2.6;
    this.rng = o.rng || Math.random;
    this.restitution = o.restitution ?? 0.42;
    this.friction = o.friction ?? 0.5;
    this.gravity = o.gravity ?? 30;
    this.mass = 1;
    this.invI = 1.5 / (this.mass * this.h * this.h);
    const h = this.h;
    this.corners = [];
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) this.corners.push([sx * h, sy * h, sz * h]);
    // Bidang: [normal, d] dengan jarak = n·p − d (≥0 berarti di dalam arena).
    this.planes = [
      { n: [0, 1, 0], d: 0, kind: 'floor' },
      { n: [-1, 0, 0], d: -this.bx, kind: 'wall' },
      { n: [1, 0, 0], d: -this.bx, kind: 'wall' },
      { n: [0, 0, -1], d: -this.bz, kind: 'wall' },
      { n: [0, 0, 1], d: -this.bz, kind: 'wall' },
    ];
    this.reset([0, h, 0], [0, 0, 0, 1]);
  }

  reset(pos, q) {
    this.pos = [...pos];
    this.q = [...q];
    this.v = [0, 0, 0];
    this.w = [0, 0, 0];
    this.asleep = true;
    this.sleepT = 0;
    this.time = 0;
    this.bounceCount = 0;
    this.lastImpactT = -1;
    this.acc = 0;
  }

  /** Lemparan: arah menjauhi kamera (−z) dengan variasi acak. Hasil angka murni dari fisika. */
  throwDie(pos, q, spinAxisHint) {
    const r = this.rng;
    this.reset(pos, q);
    this.asleep = false;
    const speed = 4.4 + r() * 2.4;
    const yaw = (r() - 0.5) * 1.1;
    this.v = [Math.sin(yaw) * speed, 2.2 + r() * 2.6, -Math.cos(yaw) * speed];
    let ax = [r() * 2 - 1, r() * 2 - 1, r() * 2 - 1];
    if (spinAxisHint) ax = [ax[0] + spinAxisHint[0] * 1.5, ax[1] + spinAxisHint[1] * 1.5, ax[2] + spinAxisHint[2] * 1.5];
    const l = len(ax) || 1;
    const mag = 14 + r() * 10;
    this.w = [(ax[0] / l) * mag, (ax[1] / l) * mag, (ax[2] / l) * mag];
  }

  /** Maju sebesar dt detik. Mengembalikan daftar event: impact / wall / settled. */
  step(dt) {
    const events = [];
    if (this.asleep) return events;
    this.acc += Math.min(dt, 0.1);
    let n = 0;
    while (this.acc >= FIXED_DT && n < MAX_SUBSTEPS) {
      this._sub(FIXED_DT, events);
      this.acc -= FIXED_DT;
      n++;
      if (this.asleep) break;
    }
    if (n === MAX_SUBSTEPS) this.acc = 0;
    return events;
  }

  _sub(dt, events) {
    const { v, w } = this;
    this.time += dt;
    v[1] -= this.gravity * dt;
    for (let i = 0; i < 3; i++) this.pos[i] += v[i] * dt;

    // Integrasi orientasi: q += ½·dt·(ω⊗q)
    const q = this.q;
    const dq = [
      w[0] * q[3] + w[1] * q[2] - w[2] * q[1],
      w[1] * q[3] + w[2] * q[0] - w[0] * q[2],
      w[2] * q[3] + w[0] * q[1] - w[1] * q[0],
      -(w[0] * q[0] + w[1] * q[1] + w[2] * q[2]),
    ];
    this.q = qnorm([q[0] + 0.5 * dt * dq[0], q[1] + 0.5 * dt * dq[1], q[2] + 0.5 * dt * dq[2], q[3] + 0.5 * dt * dq[3]]);

    const rs = this.corners.map((c) => qrot(this.q, c));
    let floorContacts = 0;
    let impact = null;

    for (let iter = 0; iter < 4; iter++) {
      for (const pl of this.planes) {
        for (let k = 0; k < 8; k++) {
          const r = rs[k];
          const p = [this.pos[0] + r[0], this.pos[1] + r[1], this.pos[2] + r[2]];
          if (dot(pl.n, p) - pl.d >= 0) continue;
          if (iter === 0 && pl.kind === 'floor') floorContacts++;
          const wr = cross(this.w, r);
          const vp = [v[0] + wr[0], v[1] + wr[1], v[2] + wr[2]];
          const vn = dot(vp, pl.n);
          if (vn >= 0) continue;
          const e = vn < -1.2 ? this.restitution : 0;
          const rn = cross(r, pl.n);
          const jn = (-(1 + e) * vn) / (1 / this.mass + this.invI * dot(rn, rn));
          this._apply(r, [pl.n[0] * jn, pl.n[1] * jn, pl.n[2] * jn]);
          if (iter === 0 && vn < -1.2 && (!impact || -vn > impact.speed)) impact = { speed: -vn, point: p, kind: pl.kind };
          // Gesekan Coulomb
          const wr2 = cross(this.w, r);
          const vp2 = [v[0] + wr2[0], v[1] + wr2[1], v[2] + wr2[2]];
          const vn2 = dot(vp2, pl.n);
          const vt = [vp2[0] - vn2 * pl.n[0], vp2[1] - vn2 * pl.n[1], vp2[2] - vn2 * pl.n[2]];
          const vtl = len(vt);
          if (vtl > 1e-6) {
            const t = [vt[0] / vtl, vt[1] / vtl, vt[2] / vtl];
            const rt = cross(r, t);
            let jt = vtl / (1 / this.mass + this.invI * dot(rt, rt));
            jt = Math.min(jt, this.friction * jn);
            this._apply(r, [-t[0] * jt, -t[1] * jt, -t[2] * jt]);
          }
        }
      }
    }

    // Koreksi penetrasi posisi
    for (const pl of this.planes) {
      let deepest = 0;
      for (let k = 0; k < 8; k++) {
        const d = dot(pl.n, [this.pos[0] + rs[k][0], this.pos[1] + rs[k][1], this.pos[2] + rs[k][2]]) - pl.d;
        if (d < deepest) deepest = d;
      }
      if (deepest < -0.0005) {
        const push = (-deepest - 0.0005) * 0.9;
        for (let i = 0; i < 3; i++) this.pos[i] += pl.n[i] * push;
      }
    }

    // Peredaman saat menyentuh lantai (rolling resistance)
    if (floorContacts > 0) {
      const wd = Math.max(0, 1 - 2.2 * dt), vd = Math.max(0, 1 - 0.7 * dt);
      for (let i = 0; i < 3; i++) { this.w[i] *= wd; if (i !== 1) this.v[i] *= vd; }
    }

    if (impact && this.time - this.lastImpactT > 0.06) {
      this.lastImpactT = this.time;
      events.push({ type: impact.kind === 'floor' ? 'impact' : 'wall', speed: impact.speed, point: impact.point, index: impact.kind === 'floor' ? this.bounceCount++ : -1 });
    }

    const lin = len(this.v), ang = len(this.w);
    if (floorContacts > 0 && lin < 0.15 && ang < 0.45) this.sleepT += dt; else this.sleepT = 0;
    if (this.sleepT > 0.3 || this.time > 8) {
      this._snapFlat();
      events.push({ type: 'settled', value: this.topFace().value, point: [...this.pos] });
    }
  }

  _apply(r, J) {
    this.v[0] += J[0] / this.mass; this.v[1] += J[1] / this.mass; this.v[2] += J[2] / this.mass;
    const t = cross(r, J);
    this.w[0] += this.invI * t[0]; this.w[1] += this.invI * t[1]; this.w[2] += this.invI * t[2];
  }

  /** Face yang sedang menghadap ke atas. */
  topFace() {
    let best = null, bd = -2;
    for (let i = 0; i < 6; i++) {
      const n = qrot(this.q, D6_FACES[i].normal);
      if (n[1] > bd) { bd = n[1]; best = { value: D6_FACES[i].value, index: i, dot: n[1] }; }
    }
    return best;
  }

  _snapFlat() {
    const top = this.topFace();
    const n = qrot(this.q, D6_FACES[top.index].normal);
    this.q = qnorm(qmul(qarc(n, [0, 1, 0]), this.q));
    this.pos[1] = this.h;
    this.v = [0, 0, 0];
    this.w = [0, 0, 0];
    this.asleep = true;
  }

  /**
   * Quaternion target agar face `value` menghadap atas (busur terpendek dari orientasi sekarang).
   * Dipakai untuk menyelaraskan tampilan dengan hasil RNG game yang sudah ada.
   */
  quatForValue(value, fromQ = this.q) {
    const f = D6_FACES.find((x) => x.value === value);
    const n = qrot(fromQ, f.normal);
    return qnorm(qmul(qarc(n, [0, 1, 0]), fromQ));
  }
}

// ---------- pip ----------
const PIPS = {
  1: [[0.5, 0.5]],
  2: [[0.28, 0.28], [0.72, 0.72]],
  3: [[0.25, 0.25], [0.5, 0.5], [0.75, 0.75]],
  4: [[0.28, 0.28], [0.72, 0.28], [0.28, 0.72], [0.72, 0.72]],
  5: [[0.27, 0.27], [0.73, 0.27], [0.5, 0.5], [0.27, 0.73], [0.73, 0.73]],
  6: [[0.3, 0.25], [0.3, 0.5], [0.3, 0.75], [0.7, 0.25], [0.7, 0.5], [0.7, 0.75]],
};
const PIP_LAYOUTS = PIPS;

function drawPips(c, g, S, value, pip) {
  const R = S * 0.085;
  for (const [px, py] of PIPS[value]) {
    const x = px * S, y = py * S;
    c.fillStyle = 'rgba(0,0,0,0.35)'; c.beginPath(); c.arc(x, y, R * 1.18, 0, 6.28); c.fill(); // cekungan pip
    c.fillStyle = pip.color; c.beginPath(); c.arc(x, y, R, 0, 6.28); c.fill();
    const hl = c.createRadialGradient(x - R * 0.3, y - R * 0.3, 0, x, y, R);
    hl.addColorStop(0, 'rgba(255,255,255,0.28)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = hl; c.beginPath(); c.arc(x, y, R, 0, 6.28); c.fill();
    if (g && pip.glow) { const gg = g.createRadialGradient(x, y, 0, x, y, R * 1.3); gg.addColorStop(0, 'rgba(255,255,255,1)'); gg.addColorStop(0.75, 'rgba(255,255,255,0.9)'); gg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gg; g.beginPath(); g.arc(x, y, R * 1.3, 0, 6.28); g.fill(); }
  }
}

function makeCanvas(S) {
  const cv = document.createElement('canvas'); cv.width = cv.height = S; return cv;
}

/**
 * Bangun 6 material untuk satu dadu.
 * @returns {{materials: THREE.MeshPhysicalMaterial[], dispose: Function, baseEmissive: number}}
 */
function createDiceMaterials(die, quality) {
  const m = die.material, e = die.effect, S = quality.texture;
  const textures = [];
  const materials = D6_FACES.map((face, i) => {
    const r = mulberry32(hashStr(die.id) + i * 7919);
    const cv = makeCanvas(S), c = cv.getContext('2d');
    let gcv = null, g = null;
    if (m.glowMap) { gcv = makeCanvas(S); g = gcv.getContext('2d'); }
    PATTERNS[m.pattern](c, g, S, r, m);
    drawPips(c, g, S, face.value, m.pip);

    const map = new THREE.CanvasTexture(cv);
    map.colorSpace = THREE.SRGBColorSpace;
    map.anisotropy = quality.texture >= 256 ? 4 : 1;
    textures.push(map);
    let emissiveMap = map;
    if (gcv) { emissiveMap = new THREE.CanvasTexture(gcv); emissiveMap.colorSpace = THREE.SRGBColorSpace; textures.push(emissiveMap); }

    return new THREE.MeshPhysicalMaterial({
      map,
      color: 0xffffff,
      roughness: m.roughness,
      metalness: m.metalness,
      emissive: new THREE.Color(m.emissive || e.glowColor || '#ffffff'),
      emissiveMap,
      emissiveIntensity: e.emissiveIntensity,
      clearcoat: quality.clearcoat ? (m.clearcoat ?? 0) : 0,
      clearcoatRoughness: m.clearcoatRoughness ?? 0.15,
      envMapIntensity: m.envMapIntensity ?? 1,
    });
  });
  return {
    materials,
    baseEmissive: e.emissiveIntensity,
    dispose() { materials.forEach((mt) => mt.dispose()); textures.forEach((t) => t.dispose()); },
  };
}

/** Cache kecil (LRU) agar berpindah dadu cepat tetapi memori GPU tidak membengkak. */
class MaterialCache {
  constructor(max = 3) { this.max = max; this.map = new Map(); }
  get(die, quality) {
    const key = die.id + ':' + quality.texture + ':' + quality.clearcoat;
    if (this.map.has(key)) { const v = this.map.get(key); this.map.delete(key); this.map.set(key, v); return v; }
    const v = createDiceMaterials(die, quality);
    this.map.set(key, v);
    while (this.map.size > this.max) { const [k, old] = this.map.entries().next().value; old.dispose(); this.map.delete(k); }
    return v;
  }
  /** Lindungi entry yang sedang dipakai agar tidak ter-dispose saat render. */
  clear() { this.map.forEach((v) => v.dispose()); this.map.clear(); }
}

/**
 * DiceEffects.js — sistem efek reusable berbasis konfigurasi (die.effect).
 *
 *  - ParticlePool : satu draw call per pool (normal + additive), ring-buffer pooling, tanpa alokasi per frame.
 *    (Setara instancing untuk ratusan partikel; shader point-sprite jauh lebih ringan di GPU mobile.)
 *  - Ring / Pillar pool : gelombang kejut, portal, pilar energi (mesh di-reuse).
 *  - Aura : fresnel hanya di tepi dadu, jadi angka di permukaan tidak tertutup.
 *  - 1 PointLight yang di-reuse untuk flash (tidak ada dynamic light per dadu).

 *
 * Resep landing/idle/roll/result dipetakan lewat nama di katalog, jadi dadu baru tidak butuh kode baru.

const POINT_VS = `
attribute float aSize; attribute float aAlpha; attribute float aShape; attribute vec3 aColor;
uniform float uScale;
varying float vAlpha; varying float vShape; varying vec3 vColor;
void main(){
  vAlpha = aAlpha; vShape = aShape; vColor = aColor;
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  gl_Position = projectionMatrix * mv;
  gl_PointSize = clamp(aSize * uScale / max(0.1, -mv.z), 0.0, 96.0);
}`;
const POINT_FS = `
varying float vAlpha; varying float vShape; varying vec3 vColor;
void main(){
  vec2 p = gl_PointCoord - 0.5; float d = length(p); float a;
  if (vShape < 0.5) a = smoothstep(0.5, 0.05, d);
  else if (vShape < 1.5) a = 1.0 - smoothstep(0.28, 0.5, abs(p.x) + abs(p.y));
  else a = smoothstep(0.5, 0.42, d) * smoothstep(0.22, 0.4, d) + 0.12 * (1.0 - d * 2.0);
  if (a * vAlpha < 0.01) discard;
  gl_FragColor = vec4(vColor, a * vAlpha);
  #include <colorspace_fragment>
}`;

class ParticlePool {
  constructor(capacity, additive) {
    this.cap = capacity;
    this.next = 0;
    this.active = 0;
    this.pos = new Float32Array(capacity * 3);
    this.vel = new Float32Array(capacity * 3);
    this.col = new Float32Array(capacity * 3);
    this.size = new Float32Array(capacity);
    this.alpha = new Float32Array(capacity);
    this.shape = new Float32Array(capacity);
    this.age = new Float32Array(capacity);
    this.life = new Float32Array(capacity); // 0 = slot bebas
    this.size0 = new Float32Array(capacity);
    this.grav = new Float32Array(capacity);
    this.drag = new Float32Array(capacity);
    this.grow = new Float32Array(capacity);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aColor', new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aAlpha', new THREE.BufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aShape', new THREE.BufferAttribute(this.shape, 1).setUsage(THREE.DynamicDrawUsage));
    this.uniforms = { uScale: { value: 600 } };
    this.material = new THREE.ShaderMaterial({
      vertexShader: POINT_VS, fragmentShader: POINT_FS, uniforms: this.uniforms,
      transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    });
    this.points = new THREE.Points(geo, this.material);
    this.points.frustumCulled = false;
    this.points.renderOrder = 10;
    this.geo = geo;
  }

  spawn(x, y, z, vx, vy, vz, color, size, life, st, shape) {
    const i = this.next; this.next = (this.next + 1) % this.cap;
    if (this.life[i] === 0) this.active++;
    const i3 = i * 3;
    this.pos[i3] = x; this.pos[i3 + 1] = y; this.pos[i3 + 2] = z;
    this.vel[i3] = vx; this.vel[i3 + 1] = vy; this.vel[i3 + 2] = vz;
    this.col[i3] = color.r; this.col[i3 + 1] = color.g; this.col[i3 + 2] = color.b;
    this.size0[i] = size; this.size[i] = size; this.life[i] = life; this.age[i] = 0; this.alpha[i] = 1;
    this.grav[i] = st.gravity; this.drag[i] = st.drag; this.grow[i] = st.grow; this.shape[i] = shape;
    this.dirty = true;
  }

  update(dt) {
    if (this.active === 0) return;
    let alive = 0;
    for (let i = 0; i < this.cap; i++) {
      const life = this.life[i];
      if (life === 0) continue;
      const age = (this.age[i] += dt);
      if (age >= life) { this.life[i] = 0; this.size[i] = 0; this.alpha[i] = 0; continue; }
      alive++;
      const i3 = i * 3, k = Math.exp(-this.drag[i] * dt);
      this.vel[i3] *= k; this.vel[i3 + 1] = this.vel[i3 + 1] * k - this.grav[i] * dt; this.vel[i3 + 2] *= k;
      this.pos[i3] += this.vel[i3] * dt; this.pos[i3 + 1] += this.vel[i3 + 1] * dt; this.pos[i3 + 2] += this.vel[i3 + 2] * dt;
      if (this.pos[i3 + 1] < 0.02 && this.grav[i] > 0) { this.pos[i3 + 1] = 0.02; this.vel[i3 + 1] *= -0.3; this.vel[i3] *= 0.7; this.vel[i3 + 2] *= 0.7; }
      const t = age / life;
      this.alpha[i] = Math.min(1, age * 14) * (1 - t) * (1 - t * 0.3);
      this.size[i] = this.size0[i] * (1 + (this.grow[i] - 1) * t);
    }
    this.active = alive;
    const a = this.geo.attributes;
    a.position.needsUpdate = a.aSize.needsUpdate = a.aAlpha.needsUpdate = true;
    if (this.dirty) { a.aColor.needsUpdate = a.aShape.needsUpdate = true; this.dirty = false; }
  }

  dispose() { this.geo.dispose(); this.material.dispose(); }
}

class DiceSound {
  constructor() { this.enabled = true; this.ctx = null; this.volume = 0.5; this._noise = null; }
  _ensure() {
    if (!this.enabled) return false;
    if (!this.ctx) {
      const AC = globalThis.AudioContext || globalThis.webkitAudioContext;
      if (!AC) return false;
      try { this.ctx = new AC(); } catch { return false; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return true;
  }
  _noiseBuf() {
    if (this._noise) return this._noise;
    const n = this.ctx.sampleRate * 0.6, b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return (this._noise = b);
  }
  _tone(f0, f1, dur, gain, type = 'sine', delay = 0) {
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain * this.volume, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  _noiseHit(freq, q, dur, gain, type = 'bandpass', delay = 0) {
    const c = this.ctx, t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this._noiseBuf(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(gain * this.volume, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(c.destination); s.start(t); s.stop(t + dur + 0.02);
  }
  /** kind = die.effect.soundEffect; intensity 0..2 */
  play(kind, intensity = 1) {
    if (!this._ensure()) return;
    const i = Math.min(2, Math.max(0.15, intensity)), G = 0.5 * i;
    switch (kind) {
      case 'wood':    this._noiseHit(500, 1.2, 0.09, G); this._tone(190, 90, 0.1, 0.5 * G, 'triangle'); break;
      case 'stone':   this._noiseHit(900, 0.9, 0.12, G); this._tone(120, 60, 0.12, 0.4 * G, 'triangle'); break;
      case 'metal':   this._tone(2200, null, 0.25, 0.25 * G, 'sine'); this._tone(3300, null, 0.18, 0.15 * G); this._noiseHit(5000, 1, 0.04, 0.5 * G, 'highpass'); break;
      case 'gold':    this._tone(1320, null, 0.5, 0.25 * G); this._tone(1980, null, 0.4, 0.15 * G, 'sine', 0.02); this._tone(2640, null, 0.3, 0.1 * G, 'sine', 0.04); break;
      case 'electric': this._noiseHit(4500, 2, 0.1, 0.8 * G, 'highpass'); this._tone(900, 200, 0.12, 0.2 * G, 'sawtooth'); break;
      case 'crystal': this._tone(1800, null, 0.6, 0.18 * G); this._tone(2700, null, 0.5, 0.14 * G, 'sine', 0.03); this._tone(3600, null, 0.4, 0.1 * G, 'sine', 0.06); break;
      case 'magic':   [660, 880, 1320].forEach((f, k) => this._tone(f, f * 1.02, 0.3, 0.16 * G, 'sine', k * 0.05)); break;
      case 'water':   [400, 600, 800].forEach((f, k) => this._tone(f, f * 1.8, 0.12, 0.2 * G, 'sine', k * 0.05)); this._noiseHit(1500, 0.7, 0.2, 0.3 * G, 'lowpass'); break;
      case 'ice':     this._noiseHit(6000, 1.5, 0.08, 0.8 * G, 'highpass'); this._tone(1500, 900, 0.2, 0.2 * G); break;
      case 'lava':    this._noiseHit(250, 0.7, 0.35, 0.9 * G, 'lowpass'); this._tone(80, 50, 0.3, 0.5 * G, 'sawtooth'); break;
      case 'void':    this._tone(320, 40, 0.7, 0.4 * G, 'triangle'); this._tone(160, 30, 0.8, 0.3 * G, 'sine'); break;
      case 'heavy':   this._tone(70, 35, 0.4, 0.8 * G, 'sine'); this._noiseHit(200, 0.8, 0.25, 0.8 * G, 'lowpass'); break;
      case 'sonic':   [0, 0.12, 0.24].forEach((d) => this._tone(150, 90, 0.2, 0.4 * G, 'sine', d)); break;
      case 'ender':   this._tone(300, 1800, 0.25, 0.2 * G, 'sine'); this._tone(1800, 200, 0.3, 0.15 * G, 'triangle', 0.15); break;
      case 'dragon':  this._tone(55, 40, 0.9, 0.7 * G, 'sawtooth'); this._noiseHit(300, 0.6, 0.6, 0.8 * G, 'lowpass'); this._tone(880, 440, 0.5, 0.15 * G, 'sine', 0.1); break;
      default:        this._noiseHit(700, 1, 0.08, G);
    }
  }
}

const easeOut = (t) => 1 - (1 - t) * (1 - t);

// ---------------------------------------------------------------------------
class DiceEffects {
  /**
   * @param {THREE.Scene} scene
   * @param {object} quality  salah satu QUALITY_PRESETS
   * @param {THREE.PointLight} light  satu light bersama untuk flash
   */
  constructor(scene, quality, light) {
    this.scene = scene;
    this.light = light;
    this.sound = new DiceSound();
    this.timers = [];
    this.flashI = 0; this.flashDecay = 6; this.flashBase = 0;
    this.shake = 0; this.slowmo = { scale: 1, t: 0 };
    this.auraFlare = 0;
    this.fxPos = [0, 0, 0];
    this.faceFlash = 0;
    this._tmp = new THREE.Color();
    this._colors = [];
    this.setQuality(quality);
  }

  setQuality(q) {
    this._disposePools();
    this.q = q;
    this.normal = new ParticlePool(Math.max(40, Math.floor(q.particleCap * 0.55)), false);
    this.additive = new ParticlePool(Math.max(60, q.particleCap), true);
    this.scene.add(this.normal.points, this.additive.points);

    // ring & pilar
    const rg = new THREE.RingGeometry(0.88, 1, 56); rg.rotateX(-Math.PI / 2);
    this.ringGeo = rg;
    this.rings = [];
    for (let i = 0; i < q.rings; i++) {
      const mat = new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, opacity: 0 });
      const mesh = new THREE.Mesh(rg, mat); mesh.visible = false; mesh.position.y = 0.03; mesh.renderOrder = 5;
      this.scene.add(mesh);
      this.rings.push({ mesh, t: 1, dur: 1, r0: 0.3, r1: 2, op: 1, delay: 0, active: false });
    }
    this.ringNext = 0;
    const pg = new THREE.CylinderGeometry(0.5, 0.5, 1, 20, 1, true); pg.translate(0, 0.5, 0);
    this.pillarGeo = pg;
    const pm = new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, opacity: 0 });
    this.pillar = { mesh: new THREE.Mesh(pg, pm), t: 1, dur: 1, h: 3, r: 0.8, op: 1, active: false };
    this.pillar.mesh.visible = false; this.scene.add(this.pillar.mesh);

    this._buildAura();
    if (this.light) { this.light.visible = !!q.light; }
  }

  _buildAura() {
    if (this.aura) { this.scene.remove(this.aura); this.aura.geometry.dispose(); this.aura.material.dispose(); }
    const geo = new THREE.SphereGeometry(1, 24, 16);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uColor: { value: new THREE.Color('#ffffff') }, uI: { value: 0 } },
      vertexShader: 'varying vec3 vN;\nvarying vec3 vV;\nvoid main(){\n vec4 mv = modelViewMatrix * vec4(position,1.0);\n vN = normalize(normalMatrix * normal);\n vV = normalize(-mv.xyz);\n gl_Position = projectionMatrix * mv;\n}',
      fragmentShader: 'uniform vec3 uColor;\nuniform float uI;\nvarying vec3 vN;\nvarying vec3 vV;\nvoid main(){\n float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.6);\n gl_FragColor = vec4(uColor, f * uI);\n #include <colorspace_fragment>\n}',
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    this.aura = new THREE.Mesh(geo, mat);
    this.aura.visible = false; this.aura.renderOrder = 6;
    this.scene.add(this.aura);
  }

  /** Dipanggil saat dadu diganti. */
  setDie(die) {
    this.die = die;
    const e = die.effect;
    this._colors = e.colors.map((c) => new THREE.Color(c));
    this.glowColor = new THREE.Color(e.glowColor);
    this.aura.material.uniforms.uColor.value.copy(this.glowColor);
    this.aura.visible = false;
    this.flashI = 0;
    if (this.light) { this.light.color.copy(this.glowColor); this.light.intensity = 0; }
  }

  setScale(renderer, camera) {
    const size = renderer.getDrawingBufferSize(new THREE.Vector2());
    const s = size.y / (2 * Math.tan((camera.fov * Math.PI) / 360));
    this.normal.uniforms.uScale.value = s;
    this.additive.uniforms.uScale.value = s;
  }

  // ---------- primitif ----------
  _col() { return this._colors[(Math.random() * this._colors.length) | 0]; }

  /**
   * @param style nama gaya (STYLES)
   * @param o {mode:'sphere'|'cone'|'ring'|'fountain'|'inward', dir, speed, spread, size, life, up, radius}
   */
  emit(style, origin, count, o = {}) {
    const st = STYLES[style] || STYLES.dust, e = this.die.effect;
    const n = Math.max(count > 0 ? 1 : 0, Math.round(count * this.q.particleMul));
    const pool = st.add ? this.additive : this.normal;
    const speed = (o.speed ?? e.particleSpeed), sz = (o.size ?? e.particleSize) * st.size, life = o.life ?? e.particleLifetime;
    const mode = o.mode || 'sphere';
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.2832, sp = speed * (0.4 + Math.random() * 0.8);
      let x = origin[0], y = origin[1], z = origin[2], vx, vy, vz;
      if (mode === 'ring') { vx = Math.cos(a) * sp; vz = Math.sin(a) * sp; vy = (o.up ?? 0.5) * sp * Math.random(); }
      else if (mode === 'fountain') { const s = o.spread ?? 0.5; vx = Math.cos(a) * sp * s * Math.random(); vz = Math.sin(a) * sp * s * Math.random(); vy = sp * (0.8 + Math.random() * 0.6); }
      else if (mode === 'inward') { const R = o.radius ?? 1.2; x += Math.cos(a) * R; z += Math.sin(a) * R; vx = -Math.cos(a) * sp * 0.6; vz = -Math.sin(a) * sp * 0.6; vy = Math.random() * sp * 0.5; }
      else if (mode === 'cone') { const d = o.dir || [0, 1, 0], s = o.spread ?? 0.5; vx = d[0] * sp + (Math.random() - 0.5) * sp * s; vy = d[1] * sp + (Math.random() - 0.5) * sp * s; vz = d[2] * sp + (Math.random() - 0.5) * sp * s; }
      else { const u = Math.random() * 2 - 1, r = Math.sqrt(1 - u * u); vx = Math.cos(a) * r * sp; vz = Math.sin(a) * r * sp; vy = Math.abs(u) * sp * (o.up ?? 1) ; }
      const c = this._tmp.copy(this._col()); const br = 0.8 + Math.random() * 0.4; c.r *= br; c.g *= br; c.b *= br;
      pool.spawn(x, y, z, vx, vy, vz, c, sz * (0.6 + Math.random() * 0.8), life * (0.6 + Math.random() * 0.7), st, st.shape);
    }
  }

  ring(color, r0, r1, dur, op = 0.9, delay = 0) {
    const R = this.rings[this.ringNext]; this.ringNext = (this.ringNext + 1) % this.rings.length;
    R.mesh.material.color.set(color || this.glowColor); R.r0 = r0; R.r1 = r1; R.dur = dur; R.op = op; R.delay = delay; R.t = 0; R.active = true; R.mesh.visible = false; R.mesh.position.set(this.fxPos[0], 0.03, this.fxPos[2]);
  }
  pillarFx(color, h, r, dur, op = 0.7) {
    const P = this.pillar; P.mesh.material.color.set(color || this.glowColor); P.h = h; P.r = r; P.dur = dur; P.op = op; P.t = 0; P.active = true; P.mesh.visible = true;
  }
  flash(intensity, decay = 6) { if (this.q.light) { this.flashI = intensity; this.flashDecay = decay; } this.auraFlare = Math.min(2, this.auraFlare + intensity * 0.25); }
  shakeCam(a) { this.shake = Math.max(this.shake, a); }
  slow(scale, dur) { this.slowmo.scale = scale; this.slowmo.t = dur; }
  later(delay, fn) { this.timers.push({ t: delay, fn }); }
  setLightAt(p) { if (this.light) this.light.position.set(p[0], p[1] + 1.2, p[2] + 0.4); }

  // ---------- hooks dari DiceAnimator ----------
  onRollStart(pos) {
    const e = this.die.effect, c = Math.round(e.particleCount * 0.25);
    this.emit(e.effectTier >= 4 ? STYLE_OF(e) : 'dust', pos, c, { mode: 'ring', speed: 1.4, up: 0.8, life: 0.5 });
    this.sound.play(e.soundEffect, 0.35);
  }

  onRollFrame(dt, pos, speed) {
    const e = this.die.effect;
    if (!e.trailEnabled || !this.q.trail || e.rollEffect === 'none') return;
    this._trailAcc = (this._trailAcc || 0) + dt * Math.min(1, speed / 6) * (14 + e.effectTier * 5) * this.q.particleMul;
    const style = ROLL_STYLE[e.rollEffect] || e.particleType;
    while (this._trailAcc >= 1) {
      this._trailAcc -= 1;
      this.emit(style, [pos[0] + (Math.random() - 0.5) * 0.4, pos[1] + (Math.random() - 0.5) * 0.4, pos[2] + (Math.random() - 0.5) * 0.4], 1, { mode: 'sphere', speed: 0.5, up: 0.4, life: 0.5, size: e.particleSize * 0.8 });
    }
  }

  /** Setiap pantulan. index 0 = benturan pertama => resep landing penuh. */
  onImpact(point, speed, index) {
    const e = this.die.effect, p = [point[0], 0.05, point[2]];
    this.fxPos = p;
    const k = Math.min(1.6, speed / 9) * e.impactIntensity;
    this.sound.play(e.soundEffect, Math.min(2, k));
    this.auraFlare = Math.min(2, this.auraFlare + 0.3 * k);
    if (index === 0) {
      (RECIPES[e.landingEffect] || RECIPES.puff)(this, p, e, k);
      this.shakeCam(0.012 * e.impactIntensity);
    } else {
      this.emit(e.effectTier <= 2 ? e.particleType : 'dust', p, Math.round(e.particleCount * 0.22 * Math.min(1, k)), { mode: 'ring', speed: e.particleSpeed * 0.5, up: 0.6, life: e.particleLifetime * 0.6, size: e.particleSize * 0.8 });
    }
  }

  /** Dadu berhenti. Efek kecil saja agar angka terbaca jelas. */
  onLand(pos) {
    const e = this.die.effect, p = [pos[0], 0.05, pos[2]];
    this.fxPos = p;
    this.emit('dust', p, 8, { mode: 'ring', speed: 0.8, up: 0.2, life: 0.5, size: e.particleSize });
    this.auraFlare = Math.min(2, this.auraFlare + 0.6);
    if (e.effectTier >= 6) this.ring(this.glowColor, 0.6, 2.2, 0.9, 0.5);
  }

  onResult(pos) {
    const e = this.die.effect, p = [pos[0], 0.05, pos[2]];
    this.fxPos = p;
    this.faceFlash = 1;
    const r = e.resultEffect;
    if (r === 'sparkle' || r === 'pulse' || r === 'burst' || r === 'halo') this.emit(STYLE_OF(e), [p[0], 0.15, p[2]], Math.round(e.particleCount * 0.3), { mode: 'ring', speed: 1.4, up: 1.2, life: e.particleLifetime });
    if (r === 'pulse' || r === 'burst' || r === 'halo') this.ring(this.glowColor, 0.7, r === 'pulse' ? 1.8 : 2.6, 0.8, 0.7);
    if (r === 'burst' || r === 'halo') { this.ring(this.glowColor, 0.5, 3.2, 1.1, 0.5, 0.1); this.flash(1.2 * e.glowIntensity, 3); }
    if (r === 'halo') { this.pillarPos = p; this.pillarFx(this.glowColor, 2.2, 0.7, 1.1, 0.35); this.later(0.15, () => this.emit('flame', [p[0], 0.1, p[2]], 40, { mode: 'fountain', speed: 2.4, spread: 0.4, life: 1 })); }
    this.sound.play(e.soundEffect, 0.4 + e.effectTier * 0.12);
  }

  // ---------- per frame ----------
  update(dt, dieObj) {
    this.normal.update(dt); this.additive.update(dt);

    for (let i = this.timers.length - 1; i >= 0; i--) { const T = this.timers[i]; T.t -= dt; if (T.t <= 0) { this.timers.splice(i, 1); T.fn(); } }
    if (this.slowmo.t > 0) { this.slowmo.t -= dt; if (this.slowmo.t <= 0) this.slowmo.scale = 1; }

    for (const R of this.rings) {
      if (!R.active) continue;
      if (R.delay > 0) { R.delay -= dt; continue; }
      R.t += dt / R.dur;
      if (R.t >= 1) { R.active = false; R.mesh.visible = false; continue; }
      const s = R.r0 + (R.r1 - R.r0) * easeOut(R.t);
      R.mesh.visible = true; R.mesh.scale.set(s, 1, s); R.mesh.material.opacity = R.op * Math.pow(1 - R.t, 1.6);
    }
    const P = this.pillar;
    if (P.active) {
      P.t += dt / P.dur;
      if (P.t >= 1) { P.active = false; P.mesh.visible = false; }
      else { const k = easeOut(P.t); P.mesh.scale.set(P.r * (1 + k * 0.6), P.h * (0.4 + k * 0.6), P.r * (1 + k * 0.6)); P.mesh.position.set(this.pillarPos?.[0] ?? 0, 0, this.pillarPos?.[2] ?? 0); P.mesh.material.opacity = P.op * (1 - P.t); }
    }

    // flash light
    if (this.light && this.q.light) { this.flashI = Math.max(0, this.flashI - this.flashDecay * dt * Math.max(0.3, this.flashI)); this.light.intensity = this.flashI * 14 + (dieObj?.glow || 0) * 3; }

    // aura (hanya tepi => angka tetap terlihat)
    const e = this.die.effect;
    const on = e.auraEnabled && this.q.aura && dieObj;
    this.aura.visible = !!on;
    if (on) {
      this.auraFlare = Math.max(0, this.auraFlare - dt * 1.4);
      const t = performance.now() * 0.001;
      const base = 0.22 + 0.06 * Math.sin(t * 2.2);
      this.aura.material.uniforms.uI.value = Math.min(1.6, (base + this.auraFlare * 0.5) * (0.5 + e.glowIntensity * 0.5));
      this.aura.position.copy(dieObj.position);
      this.aura.scale.setScalar(0.92 * (e.effectTier >= 7 ? 1.18 : 1) * (dieObj.scaleMul || 1) + this.auraFlare * 0.05);
    }
    this.faceFlash = Math.max(0, this.faceFlash - dt * 1.1);
    this.shake = Math.max(0, this.shake - dt * 0.06);
  }

  /** Efek ambient saat idle (tier yang mendukung & kualitas medium ke atas). */
  idle(dt, pos) {
    const e = this.die.effect, rec = IDLE[e.idleEffect];
    if (!rec || this.q.ambientMul === 0) return;
    this._idleAcc = (this._idleAcc || 0) + dt * rec.rate * this.q.ambientMul;
    while (this._idleAcc >= 1) {
      this._idleAcc -= 1;
      const a = Math.random() * 6.28, R = 0.62 + Math.random() * 0.25;
      let o = [pos[0] + Math.cos(a) * R, pos[1] + (Math.random() - 0.5) * 0.8, pos[2] + Math.sin(a) * R], opt = { life: 1.1, speed: 0.25 };
      if (rec.mode === 'rise') opt = { mode: 'fountain', speed: 0.7, spread: 0.2, life: 1.3, size: e.particleSize * 0.8 };
      else if (rec.mode === 'low') { o[1] = 0.1; opt = { mode: 'ring', speed: 0.3, up: 0.3, life: 1.6 }; }
      else if (rec.mode === 'orbit') opt = { mode: 'sphere', speed: 0.35, life: 1.2 };
      this.emit(rec.style, o, 1, { size: e.particleSize * 0.8, ...opt });
    }
  }

  dispose() {
    this._disposePools();
    this.ringGeo?.dispose(); this.pillarGeo?.dispose(); this.pillar?.mesh.material.dispose();
    this.rings?.forEach((r) => r.mesh.material.dispose());
    if (this.aura) { this.scene.remove(this.aura); this.aura.geometry.dispose(); this.aura.material.dispose(); }
    this.sound.ctx?.close?.();
  }
  _disposePools() {
    for (const p of [this.normal, this.additive]) if (p) { this.scene.remove(p.points); p.dispose(); }
    this.rings?.forEach((r) => { this.scene.remove(r.mesh); r.mesh.material.dispose(); });
    this.ringGeo?.dispose();
    if (this.pillar) { this.scene.remove(this.pillar.mesh); this.pillar.mesh.material.dispose(); this.pillarGeo.dispose(); }
  }
}

const STYLE_OF = (e) => e.particleType;

// ---------------------------------------------------------------------------
// Resep landing — komposisi dari primitif di atas. k = intensitas benturan.
// ---------------------------------------------------------------------------
const N = (e, m = 1) => Math.round(e.particleCount * m);
const RECIPES = {
  puff:        (fx, p, e) => { fx.emit('dust', p, N(e), { mode: 'ring', speed: e.particleSpeed, up: 0.5 }); },
  debrisBurst: (fx, p, e) => { fx.emit('debris', p, N(e), { mode: 'fountain', speed: e.particleSpeed * 1.8, spread: 0.9 }); fx.emit('dust', p, N(e, 0.4), { mode: 'ring', speed: 1, up: 0.3 }); },
  sparkBurst:  (fx, p, e) => { fx.emit(e.particleType, p, N(e), { mode: 'fountain', speed: e.particleSpeed * 2, spread: 1.1 }); fx.flash(0.8 * (e.glowIntensity + 0.3), 9); },
  glintBurst:  (fx, p, e) => { fx.emit('glint', p, N(e), { mode: 'sphere', speed: e.particleSpeed, up: 1 }); fx.ring(fx.glowColor, 0.4, 1.7, 0.6, 0.7); fx.flash(1.4, 7); },
  shatter:     (fx, p, e) => { fx.emit('shard', p, N(e), { mode: 'fountain', speed: e.particleSpeed * 2.2, spread: 1.0 }); fx.emit('glint', p, N(e, 0.5), { mode: 'sphere', speed: 2 }); fx.ring(fx.glowColor, 0.4, 2, 0.6, 0.8); fx.flash(1.6, 6); },
  pulseRing:   (fx, p, e) => { fx.ring(fx.glowColor, 0.4, 2.3, 0.8, 0.9); fx.emit(e.particleType, p, N(e), { mode: 'ring', speed: e.particleSpeed, up: 0.4 }); fx.flash(1.0, 7); },
  shockwave:   (fx, p, e) => { fx.ring(fx.glowColor, 0.3, 3.2, 0.7, 0.9); fx.ring('#ffffff', 0.2, 2.2, 0.5, 0.5, 0.04); fx.emit(e.particleType, p, N(e), { mode: 'ring', speed: e.particleSpeed * 1.5, up: 0.6 }); fx.flash(1.8, 6); },
  resonance:   (fx, p, e) => { [0, 0.18, 0.36].forEach((d, i) => fx.ring(fx.glowColor, 0.4, 1.8 + i * 0.5, 0.9, 0.7, d)); fx.emit('shard', p, N(e), { mode: 'fountain', speed: e.particleSpeed * 1.6, spread: 0.8 }); fx.flash(1.4, 6); },
  electricPulse: (fx, p, e) => { fx.ring(fx.glowColor, 0.3, 2.6, 0.55, 0.9); fx.emit('bolt', p, N(e), { mode: 'sphere', speed: e.particleSpeed * 1.8, up: 1 }); [0.12, 0.24].forEach((d) => fx.later(d, () => { fx.ring(fx.glowColor, 0.3, 2 + d * 3, 0.45, 0.6); fx.flash(1.2, 12); })); fx.flash(2, 10); },
  cracks:      (fx, p, e) => { fx.ring(fx.glowColor, 0.2, 2.4, 0.9, 0.8); fx.ring('#2a0a60', 0.3, 1.6, 1.1, 0.7, 0.08); fx.emit('smoke', p, N(e, 0.6), { mode: 'ring', speed: 0.8, up: 0.8, life: 1.4, size: e.particleSize * 1.4 }); fx.emit('bolt', p, N(e, 0.5), { mode: 'sphere', speed: e.particleSpeed * 1.5 }); fx.flash(1.0, 6); },
  lavaSplash:  (fx, p, e) => { fx.emit('lava', p, N(e, 0.7), { mode: 'fountain', speed: e.particleSpeed * 2.4, spread: 1.0 }); fx.emit('ember', p, N(e, 0.5), { mode: 'sphere', speed: 2, up: 1.2, life: 1.4 }); fx.ring('#ff5a10', 0.3, 2.4, 0.7, 0.9); fx.flash(2.4, 5); },
  iceBlast:    (fx, p, e) => { fx.emit('frost', p, N(e, 0.7), { mode: 'sphere', speed: e.particleSpeed * 1.6, up: 1.2 }); fx.emit('smoke', p, N(e, 0.4), { mode: 'ring', speed: 1.1, up: 0.3, life: 1.6, size: e.particleSize * 1.5 }); fx.ring('#bff0ff', 0.3, 2.8, 0.7, 0.9); fx.ring('#ffffff', 0.2, 1.8, 0.45, 0.6, 0.05); fx.flash(1.8, 6); },
  splash:      (fx, p, e) => { fx.emit('bubble', p, N(e, 0.6), { mode: 'fountain', speed: e.particleSpeed * 1.4, spread: 0.7 }); fx.emit('glint', p, N(e, 0.3), { mode: 'sphere', speed: 2 }); [0, 0.15].forEach((d, i) => fx.ring('#7affe8', 0.3, 2.2 + i * 0.6, 0.8, 0.7, d)); fx.flash(1.2, 6); },
  radiant:     (fx, p, e) => { fx.emit('glint', p, N(e, 0.8), { mode: 'sphere', speed: e.particleSpeed * 1.5, up: 1.2 }); fx.ring('#ffffff', 0.3, 2.8, 0.7, 0.9); fx.ring(fx.glowColor, 0.2, 2, 0.5, 0.7, 0.05); fx.flash(2.6, 5); },

// ===== DiceAnimation.js =====
/**
 * DiceAnimation.js — state machine animasi satu dadu:
 *   idle → windup (roll start) → rolling (+bounce) → settle → landed → result → rest
 *
 * Semua gerak memakai delta time. Fisika memakai timestep tetap (lihat DicePhysics), sehingga
 * hasil konsisten di 30/60/120 FPS. Hasil angka berasal dari fisika (adil), atau dari RNG game
 * yang sudah ada bila `roll(forcedValue)` dipakai (tampilan lalu diselaraskan dengan hop singkat).
 */



const ease = {
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  inQuad: (t) => t * t,
  inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};

const IDLE_POS = [0, 1.25, 1.2];
const tq = new THREE.Quaternion(), tq2 = new THREE.Quaternion();

class DiceAnimator {
  /**
   * @param {{mesh: THREE.Mesh, effects: import('./DiceEffects.js').DiceEffects, rng?: Function}} o
   */
  constructor({ mesh, effects, rng }) {
    this.mesh = mesh;
    this.effects = effects;
    this.rng = rng || Math.random;
    this.physics = new DicePhysics({ rng: this.rng });
    this.state = 'idle';
    this.t = 0;
    this.pos = [...IDLE_POS];
    this.q = [0, 0, 0, 1];
    this.view = { position: mesh.position, glow: 0, scaleMul: 1 }; // dibaca oleh DiceEffects (aura, light)
    this.faceIndex = 2;
    this.pending = null;
    this.onResult = null;
    this.onState = null;
    this._idleQ();
  }

  setDie(die, mats) {
    this.die = die;
    this.mats = mats;
    this.mesh.material = mats.materials;
    this.effects.setDie(die);
    this.toIdle(true);
  }

  get busy() { return this.state !== 'idle' && this.state !== 'rest'; }

  _set(state) { this.state = state; this.t = 0; this.onState?.(state); }

  _idleQ() {
    const t = this.idleT || 0;
    const yaw = t * 0.45, tilt = 0.5 + Math.sin(t * 0.9) * 0.07, roll = Math.sin(t * 0.6) * 0.06;
    this.q = qnorm(qmul(qmul(qaxis([0, 1, 0], yaw), qaxis([1, 0, 0], tilt)), qaxis([0, 0, 1], roll)));
  }

  /** Lempar dadu. forcedValue (1–6) opsional: dari RNG game yang sudah ada. Mengembalikan Promise<{value}>. */
  roll(forcedValue = null) {
    if (['windup', 'rolling', 'settle', 'landed', 'result'].includes(this.state)) return this.pending?.promise ?? Promise.resolve(this.lastResult);
    if (this.queued) return this.pending.promise;
    if (forcedValue != null && !(forcedValue >= 1 && forcedValue <= 6)) forcedValue = null;
    this.forced = forcedValue;
    let resolve;
    const promise = new Promise((r) => { resolve = r; });
    this.pending = { promise, resolve };
    const r = this.rng;
    const a = [r() * 2 - 1, r() * 2 - 1, r() * 2 - 1], l = Math.hypot(...a) || 1;
    this.spinAxis = [a[0] / l, a[1] / l, a[2] / l];
    if (this.state === 'idle') this._set('windup');
    else { this.queued = true; if (this.state === 'rest') this.toIdle(); } // dari rest/return: kembali ke idle dulu, lalu lempar
    return promise;
  }

  /** Kembali ke pose melayang. instant=true untuk tanpa transisi. */
  toIdle(instant = false) {
    if (['windup', 'rolling', 'settle', 'landed'].includes(this.state)) return;
    this.faceBoost = 0;
    this.mats?.materials.forEach((m) => (m.emissiveIntensity = this.mats.baseEmissive));
    if (instant) { this._set('idle'); this.idleT = this.idleT || 0; this.mesh.scale.setScalar(1); return; }
    this.from = { pos: [...this.pos], q: [...this.q] };
    this._set('return');
  }

  _sync() {
    this.mesh.position.set(this.pos[0], this.pos[1], this.pos[2]);
    this.mesh.quaternion.set(this.q[0], this.q[1], this.q[2], this.q[3]);
  }

  update(dtReal) {
    const dt = dtReal * this.effects.slowmo.scale;
    const e = this.die?.effect;
    if (!e) return;

    switch (this.state) {
      case 'idle':
      case 'rest': {
        if (this.state === 'idle') {
          this.idleT = (this.idleT || 0) + dt;
          this._idleQ();
          this.pos = [IDLE_POS[0], IDLE_POS[1] + Math.sin(this.idleT * 1.5) * 0.07, IDLE_POS[2]];
          this.effects.idle(dt, this.pos);
        }
        break;
      }
      case 'return': {
        this.t += dt / 0.5;
        const k = ease.inOutCubic(Math.min(1, this.t));
        this._idleQ();
        tq.set(...this.from.q).slerp(tq2.set(...this.q), k);
        this.q = [tq.x, tq.y, tq.z, tq.w];
        const target = [IDLE_POS[0], IDLE_POS[1], IDLE_POS[2]];
        this.pos = this.from.pos.map((v, i) => v + (target[i] - v) * k);
        this.mesh.scale.setScalar(1);
        if (this.t >= 1) {
          this.idleT = this.idleT || 0;
          if (this.queued) { this.queued = false; this._set('windup'); } else this._set('idle');
        }
        break;
      }
      case 'windup': {
        // Naik sedikit + akselerasi putaran sebelum dilempar
        this.t += dt;
        const k = Math.min(1, this.t / 0.34);
        const omega = 3 + 22 * k * k;
        this.q = qnorm(qmul(qaxis(this.spinAxis, omega * dt), this.q));
        this.pos = [IDLE_POS[0], IDLE_POS[1] + 0.07 * Math.sin((this.idleT || 0) * 1.5) + 0.65 * ease.outCubic(k), IDLE_POS[2]];
        this.mesh.scale.setScalar(1 + 0.05 * Math.sin(k * Math.PI));
        if (k >= 1) {
          this.mesh.scale.setScalar(1);
          this.physics.throwDie(this.pos, this.q, this.spinAxis);
          this.effects.onRollStart(this.pos);
          this._set('rolling');
        }
        break;
      }
      case 'rolling': {
        const events = this.physics.step(dt);
        this.pos = this.physics.pos; this.q = this.physics.q;
        const sp = Math.hypot(...this.physics.v);
        this.effects.onRollFrame(dt, this.pos, sp);
        for (const ev of events) {
          if (ev.type === 'impact') this.effects.onImpact(ev.point, ev.speed, ev.index);
          else if (ev.type === 'wall') this.effects.sound.play(e.soundEffect, Math.min(1, ev.speed / 10) * 0.5);
          else if (ev.type === 'settled') { this._finishPhysics(); break; }
        }
        break;
      }
      case 'settle': {
        // Selaraskan dengan hasil RNG game: hop singkat ke orientasi target
        this.t += dt / 0.4;
        const k = ease.inOutCubic(Math.min(1, this.t));
        tq.set(...this.from.q).slerp(tq2.set(...this.target), k);
        this.q = [tq.x, tq.y, tq.z, tq.w];
        this.pos = [this.from.pos[0], this.from.pos[1] + Math.sin(k * Math.PI) * 0.32, this.from.pos[2]];
        if (this.t >= 1) { this.q = [...this.target]; this.pos = [...this.from.pos]; this._land(); }
        break;
      }
      case 'landed': {
        this.t += dt;
        if (this.t >= 0.12) this._showResult();
        break;
      }
      case 'result': {
        // Pop skala kecil + sorotan pada sisi atas (face emissive), lalu stabil
        this.t += dt / 0.5;
        const k = Math.min(1, this.t);
        const bump = Math.sin(k * Math.PI) * (1 - k * 0.4);
        this.mesh.scale.setScalar(1 + 0.12 * bump);
        this.pos[1] = this.restY + 0.1 * bump;
        this.view.scaleMul = 1 + 0.12 * bump;
        if (this.t >= 1) { this.mesh.scale.setScalar(1); this.pos[1] = this.restY; this.view.scaleMul = 1; this._set('rest'); }
        break;
      }
    }

    // emissive: denyut halus saat idle + sorotan face atas saat result
    if (this.mats) {
      const base = this.mats.baseEmissive;
      const pulse = this.state === 'idle' && e.effectTier >= 3 ? 1 + 0.18 * Math.sin((this.idleT || 0) * 2.2) : 1;
      const boost = e.resultEffect === 'none' ? 0 : this.effects.faceFlash * 0.9;
      const ms = this.mats.materials;
      for (let i = 0; i < 6; i++) ms[i].emissiveIntensity = base * pulse + (i === this.faceIndex ? boost : 0);
      this.view.glow = e.glowIntensity * (this.state === 'idle' ? 0.5 : 0.3);
    }
    this.effects.setLightAt(this.pos);
    this._sync();
  }

  _finishPhysics() {
    const natural = this.physics.topFace();
    this.pos = this.physics.pos; this.q = this.physics.q;
    this.restY = this.physics.h;
    if (this.forced != null && this.forced !== natural.value) {
      this.from = { pos: [...this.pos], q: [...this.q] };
      this.target = this.physics.quatForValue(this.forced);
      this.faceIndex = D6_FACES.findIndex((f) => f.value === this.forced);
      this._set('settle');
    } else {
      this.faceIndex = natural.index;
      this._land();
    }
  }

  _land() {
    this.restY = this.physics.h;
    this.effects.onLand(this.pos);
    this._set('landed');
  }

  _showResult() {
    const value = D6_FACES[this.faceIndex].value;
    this.effects.onResult(this.pos);
    this._set('result');
    const p = this.pending; this.pending = null;
    const out = { value, dice: this.die.id };
    this.lastResult = out;
    this.onResult?.(out);
    p?.resolve(out);
  }
}

// ===== DiceRenderer.js =====
/**
 * DiceRenderer.js — scene Three.js, satu geometri D6 untuk seluruh koleksi, integrasi API publik.
 *
 * Satu RoundedBoxGeometry dipakai bersama oleh 20 dadu; identitas dadu hanya dari material + efek.
 */







/** Pilih kualitas awal berdasarkan perangkat (Android/CPU lemah => lebih rendah). */
function detectQuality() {
  const nav = typeof navigator !== 'undefined' ? navigator : {};
  const mobile = /Android|iPhone|iPad|Mobile/i.test(nav.userAgent || '');
  const cores = nav.hardwareConcurrency || 4, mem = nav.deviceMemory || 4;
  if (mem <= 2 || cores <= 4 && mobile) return 'low';
  if (mobile || cores <= 4) return 'medium';
  return 'high';
}

class DiceRenderer {
  /**
   * @param {HTMLElement} container  elemen tempat canvas ditambahkan
   * @param {{diceId?: string, quality?: 'auto'|'low'|'medium'|'high', rng?: Function, onResult?: Function, sound?: boolean}} opts
   */
  constructor(container, opts = {}) {
    this.container = container;
    this.qName = !opts.quality || opts.quality === 'auto' ? detectQuality() : opts.quality;
    this.q = QUALITY_PRESETS[this.qName];
    this._pending = {};

    const renderer = new THREE.WebGLRenderer({ antialias: this.q.antialias, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(globalThis.devicePixelRatio || 1, this.q.pixelRatio));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.domElement.style.cssText = 'display:block;width:100%;height:100%;touch-action:none;';
    container.appendChild(renderer.domElement);
    this.renderer = renderer;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0b0c11');
    scene.fog = new THREE.Fog('#0b0c11', 16, 36);
    this.scene = scene;
    this.camera = new THREE.PerspectiveCamera(40, 1, 0.1, 80);

    // Environment map untuk pantulan (dibuat sekali, lalu sumbernya dibuang)
    const pmrem = new THREE.PMREMGenerator(renderer);
    const room = new RoomEnvironment();
    this.envTex = pmrem.fromScene(room, 0.04).texture;
    scene.environment = this.envTex;
    scene.environmentIntensity = 0.85;
    room.traverse((o) => { o.geometry?.dispose?.(); o.material?.dispose?.(); });
    pmrem.dispose();

    // Pencahayaan: hemisphere + 1 directional (bayangan lembut) + 1 PointLight bersama untuk flash/glow
    scene.add(new THREE.HemisphereLight('#c8d4ff', '#14101c', 0.45));
    const key = new THREE.DirectionalLight('#fff3e0', 2.4);
    key.position.set(3.5, 8, 4.5);
    key.castShadow = true;
    key.shadow.camera.left = -6; key.shadow.camera.right = 6; key.shadow.camera.top = 6; key.shadow.camera.bottom = -6;
    key.shadow.camera.near = 1; key.shadow.camera.far = 22;
    key.shadow.bias = -0.0005; key.shadow.normalBias = 0.03; key.shadow.radius = 4;
    scene.add(key);
    this.key = key;
    this.point = new THREE.PointLight('#ffffff', 0, 9, 2);
    scene.add(this.point);

    this._buildArena();

    // Satu geometri untuk semua dadu
    this.geometry = new RoundedBoxGeometry(1, 1, 1, 4, 0.13);
    this.mesh = new THREE.Mesh(this.geometry, []);
    this.mesh.castShadow = true;
    scene.add(this.mesh);

    this.materials = new MaterialCache(3);
    this.effects = new DiceEffects(scene, this.q, this.point);
    this.effects.sound.enabled = opts.sound !== false;
    this.animator = new DiceAnimator({ mesh: this.mesh, effects: this.effects, rng: opts.rng });
    this.animator.onResult = (r) => opts.onResult?.(r);

    this._applyShadowSize();
    this.resize();
    this.equip(opts.diceId || DICE_CATALOG[0].id);

    this._onResize = () => this.resize();
    this._onVis = () => (document.hidden ? this.stop() : this.start());
    globalThis.addEventListener('resize', this._onResize);
    document.addEventListener('visibilitychange', this._onVis);
    if (typeof ResizeObserver !== 'undefined') { this._ro = new ResizeObserver(() => this.resize()); this._ro.observe(container); }
    this.start();
  }

  _buildArena() {
    const floorMat = new THREE.MeshStandardMaterial({ color: '#171a22', roughness: 0.82, metalness: 0.05 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), floorMat);
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
    const padMat = new THREE.MeshStandardMaterial({ color: '#20242f', roughness: 0.7, metalness: 0.08 });
    const pad = new THREE.Mesh(new THREE.BoxGeometry(7.2, 0.06, 5.8), padMat);
    pad.position.y = -0.03; pad.receiveShadow = true;
    const railMat = new THREE.MeshStandardMaterial({ color: '#2b2f3c', roughness: 0.6, metalness: 0.2 });
    const rails = [[0, -2.95, 7.6, 0.3], [0, 2.95, 7.6, 0.3], [-3.65, 0, 0.3, 6.2], [3.65, 0, 0.3, 6.2]].map(([x, z, w, d]) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.3, d), railMat); m.position.set(x, 0.12, z); m.castShadow = true; m.receiveShadow = true; return m;
    });
    this.arena = [floor, pad, ...rails];
    this.arena.forEach((m) => this.scene.add(m));
    this._arenaMats = [floorMat, padMat, railMat];
  }

  _applyShadowSize() {
    const n = this.q.shadowMap;
    this.key.shadow.mapSize.set(n, n);
    if (this.key.shadow.map) { this.key.shadow.map.dispose(); this.key.shadow.map = null; }
  }

  resize() {
    const w = Math.max(1, this.container.clientWidth), h = Math.max(1, this.container.clientHeight);
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / h;
    const f = this.camera.aspect < 1.25 ? Math.min(1.9, 1.25 / this.camera.aspect) : 1; // layar potret: mundur agar arena muat
    this.camBase = new THREE.Vector3(0, 7.4 * f, 8.6 * f);
    this.camera.position.copy(this.camBase);
    this.camera.lookAt(0, 0.2, -0.2);
    this.camera.updateProjectionMatrix();
    this.effects?.setScale(this.renderer, this.camera);
  }

  /** Pasang dadu (dipanggil dari sistem equipped dice Dragon Roll). */
  equip(id) {
    const die = getDice(id);
    if (!die) return false;
    if (this.animator.busy) { this._pending.dice = id; return true; }
    this.die = die;
    const mats = this.materials.get(die, this.q);
    this.animator.setDie(die, mats);
    this.effects.setScale(this.renderer, this.camera);
    return true;
  }

  /** Lempar dadu. forcedValue (1–6) = hasil dari RNG game yang sudah ada; kosong = hasil murni fisika. */
  roll(forcedValue = null) { return this.animator.roll(forcedValue); }
  toIdle() { this.animator.toIdle(); }

  setQuality(name) {
    if (!QUALITY_PRESETS[name]) return;
    if (this.animator.busy) { this._pending.quality = name; return; }
    this.qName = name; this.q = QUALITY_PRESETS[name];
    this.renderer.setPixelRatio(Math.min(globalThis.devicePixelRatio || 1, this.q.pixelRatio));
    this._applyShadowSize();
    this.effects.setQuality(this.q);
    this.materials.clear();
    this.resize();
    this.equip(this.die.id);
  }

  setSound(on) { this.effects.sound.enabled = !!on; }

  start() {
    if (this._running) return;
    this._running = true; this._last = performance.now();
    this.renderer.setAnimationLoop(() => this._frame());
  }
  stop() { this._running = false; this.renderer.setAnimationLoop(null); }

  _frame() {
    const now = performance.now();
    const dt = Math.min(0.05, (now - this._last) / 1000); // batasi lonjakan saat tab lambat
    this._last = now;

    this.animator.update(dt);
    this.effects.update(dt * this.effects.slowmo.scale, this.animator.view);

    // camera shake ringan (benturan berat / ledakan)
    const s = this.effects.shake;
    this.camera.position.set(this.camBase.x + (Math.random() - 0.5) * s * 6, this.camBase.y + (Math.random() - 0.5) * s * 6, this.camBase.z);
    this.renderer.render(this.scene, this.camera);

    if (!this.animator.busy) {
      if (this._pending.quality) { const q = this._pending.quality; this._pending.quality = null; this.setQuality(q); }
      if (this._pending.dice) { const d = this._pending.dice; this._pending.dice = null; this.equip(d); }
    }
  }

  dispose() {
    this.stop();
    globalThis.removeEventListener('resize', this._onResize);
    document.removeEventListener('visibilitychange', this._onVis);
    this._ro?.disconnect();
    this.effects.dispose();
    this.materials.clear();
    this.geometry.dispose();
    this._arenaMats.forEach((m) => m.dispose());
    this.arena.forEach((m) => m.geometry.dispose());
    this.envTex.dispose();
    this.renderer.dispose();
    this.renderer.domElement.remove();
  }
}

});

function updateInfo() {
  const d = getDice(currentId), r = RARITY[d.rarity];
  nameEl.textContent = d.name;
  metaEl.innerHTML = `<span class="badge" style="background:${r.color}">${r.label}</span>${d.materialName} · Tier ${d.effect.effectTier}`;
}

function renderTabs() {
  tabsEl.innerHTML = '';
  for (const c of COLLECTIONS) {
    const b = document.createElement('button');
    b.className = 'tab' + (c.id === collection ? ' on' : '');
    b.textContent = c.name;
    b.onclick = () => { collection = c.id; renderTabs(); renderList(); };
    tabsEl.appendChild(b);
  }
}

function renderList() {
  listEl.innerHTML = '';
  for (const d of getDiceByCollection(collection)) {
    const r = RARITY[d.rarity];
    const b = document.createElement('button');
    b.className = 'die' + (d.id === currentId ? ' on' : '');
    b.style.setProperty('--c', r.color);
    b.innerHTML = `<div class="sw" style="background:linear-gradient(135deg, ${d.material.accent}, ${d.material.base})"></div>${d.name.replace(' Dice', '')}<small style="color:${r.color}">${r.label}</small>`;
    b.onclick = () => {
      currentId = d.id;
      renderer.equip(d.id);
      resEl.classList.remove('show');
      updateInfo(); renderList();
    };
    listEl.appendChild(b);
  }
}

rollBtn.onclick = () => {
  rollBtn.disabled = true;
  resEl.classList.remove('show');
  // Tanpa forcedValue: hasil murni dari fisika (adil).
  renderer.roll();
};

$('#quality').onchange = (e) => {
  const v = e.target.value;
  if (v !== 'auto') renderer.setQuality(v);
};

const snd = $('#snd');
snd.onclick = () => {
  const on = !snd.classList.contains('on');
  snd.classList.toggle('on', on);
  snd.textContent = on ? '🔊' : '🔇';
  renderer.setSound(on);
};

renderTabs(); renderList(); updateInfo();
window.diceRenderer = renderer; // untuk debugging di console

</script></html>
