<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dragon Roll FX Lab</title>
<style>
:root{--bg:#0b0a14;--panel:#15132a;--line:#2b2750;--ink:#ece8ff;--mut:#9b94c9;--acc:#a855f7;--acc2:#22d3ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#stageWrap{position:relative;flex:0 0 46%;min-height:250px;border-bottom:2px solid var(--line);background:#0b0820}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#hudL{position:absolute;left:8px;top:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;flex-wrap:wrap}
#chips{display:flex;gap:3px;flex-wrap:wrap}
.chip{font:600 10px ui-monospace,Menlo,monospace;padding:2px 5px;border:1px solid #3b3566;color:#6f68a3;background:rgba(11,10,20,.6);border-radius:3px}
.chip.done{color:#a78bfa;border-color:#5b4aa5}
.chip.on{color:#0b0a14;background:#fde047;border-color:#fde047}
#cnt{font:10px ui-monospace,Menlo,monospace;color:var(--mut);background:rgba(11,10,20,.6);padding:2px 6px;border-radius:3px}
#nameTag{position:absolute;left:8px;bottom:8px;right:8px;font:600 12px ui-monospace,Menlo,monospace;color:#e9d5ff;background:rgba(11,10,20,.65);padding:4px 8px;border-radius:4px;pointer-events:none}
#panel{flex:1;overflow:auto;padding:0 10px 24px;background:var(--panel);scroll-behavior:smooth}
.top{position:sticky;top:0;background:var(--panel);padding:10px 0 6px;z-index:2;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--mut);padding:6px 9px;font:600 12px inherit;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
button{font-family:inherit}
.tg,.stop{border:1px solid var(--line);background:#1d1a3a;color:var(--ink);border-radius:6px;padding:6px 9px;font:600 12px inherit;cursor:pointer}
.tg.on{border-color:var(--acc2);color:var(--acc2)}
.stop{border-color:#7f1d1d;color:#fca5a5}
input[type=range]{width:70px;accent-color:var(--acc)}
#qdesc{font-size:11px;color:var(--mut);margin-bottom:6px}
#tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;min-width:30px;border:1px solid var(--line);background:#1d1a3a;color:var(--ink);border-radius:5px;padding:4px 8px;font:700 12px ui-monospace,monospace;cursor:pointer}
section{padding-top:12px;scroll-margin-top:110px}
h3{margin:0 0 6px;font-size:12px;letter-spacing:.04em;color:var(--acc2);text-transform:uppercase}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.fx{border:1px solid var(--line);background:#1d1a3a;color:var(--ink);border-radius:7px;padding:10px 8px;font:600 13px inherit;text-align:left;cursor:pointer;min-height:42px}
.fx:active,.fx.cur{background:#3b1d6e;border-color:var(--acc)}
</style>
</head>
<body>
<div id="stageWrap">
  <canvas id="c"></canvas>
  <div id="hudL"><div id="chips"></div><span id="cnt"></span></div>
  <div id="nameTag">Pilih efek di bawah ▼</div>
</div>
<div id="panel">
  <div class="top">
    <div class="row">
      <div class="seg" id="qseg"></div>
      <button id="rm" class="tg">Reduce Motion: OFF</button>
      <button id="snd" class="tg on">Suara: ON</button>
      <input type="range" id="vol" min="0" max="100" value="60" aria-label="Volume">
      <button id="stop" class="stop">■ Stop</button>
    </div>
    <div id="qdesc"></div>
    <div id="tabs"></div>
  </div>
  <div id="grid"></div>
</div>

<script>
'use strict';
/* ===== Dragon Roll — FX Lab (Voxel + Fantasy RPG) =====
   Satu engine partikel + layer + timer. Semua efek punya lifecycle:
   play() -> update() -> stop()/dispose() (stopAll membersihkan semuanya). */
const $=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d');
const S={q:3,reduce:(typeof matchMedia!=='undefined'&&matchMedia('(prefers-reduced-motion: reduce)').matches),sound:true,vol:.6,shk:0,fl:null,bd:null,zoom:1,zx:0,zy:0,ts:1};
let W=0,H=0,DPR=1,U=6,GY=0,bg=null,gen=0;
let parts=[],layers=[],timers=[],tickers=[],texts=[],pawns=[];
let now=performance.now(),last=now,playing=false,loopFx=false,curName='';
const QM=[.4,.8,1.3,2],QMAX=[260,520,900,1500];
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=p=>1-Math.pow(1-cl(p),3);
const eio=p=>{p=cl(p);return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;};
const N=n=>Math.max(1,Math.round(n*QM[S.q-1]*(S.reduce?.4:1)));
const T=()=>performance.now();
const safe=f=>{try{f()}catch(e){console.warn('FX error (gameplay tetap jalan):',e)}};
const A=()=>pawns[0],B=()=>pawns[1];
const ctr=p=>({x:p.x+p.ox,y:p.y+p.oy-U*6});

/* ---------- AUDIO (sintetis, mengikuti volume & tidak ada loop) ---------- */
let AC=null,MG=null;
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(!MG){MG=AC.createGain();MG.connect(AC.destination);}MG.gain.value=S.vol;if(AC.state==='suspended')AC.resume();}
function tone(f1,f2,d,type='square',v=.06,delay=0){if(!S.sound)return;try{ac();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.03);}catch(e){}}
function noise(d,v,f=1200,type='lowpass'){if(!S.sound)return;try{ac();const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;g.gain.value=v;s.buffer=b;s.connect(fl);fl.connect(g);g.connect(MG);s.start();}catch(e){}}
const vr=()=>.9+Math.random()*.2;
const SFX={
 whoosh:()=>noise(.28,.09,2500,'bandpass'),
 hit:()=>{tone(220*vr(),50,.14,'square',.1);noise(.1,.08,3000)},
 magic:()=>{tone(300*vr(),900,.3,'sine',.07);tone(450*vr(),1350,.3,'triangle',.04,.05)},
 charge:()=>tone(110,700,.45,'sawtooth',.035),
 boom:()=>{tone(90*vr(),30,.35,'sawtooth',.12);noise(.4,.12,500)},
 zap:()=>{tone(1200*vr(),120,.18,'sawtooth',.07);noise(.15,.07,6000,'highpass')},
 coin:()=>{tone(988*vr(),1318*vr(),.07,'square',.05);tone(1318,1318,.12,'square',.05,.06)},
 chest:()=>{tone(130,90,.2,'square',.06);noise(.15,.05,900)},
 fanfare:()=>[523,659,784,1046].forEach((f,i)=>tone(f,f,.2,'square',.05,i*.12)),
 fail:()=>[392,330,262,196].forEach((f,i)=>tone(f,f*.97,.25,'triangle',.07,i*.18)),
 tick:()=>tone(700*vr(),500,.05,'square',.05),
 shatter:()=>{noise(.3,.1,5000,'highpass');tone(1500,300,.15,'triangle',.05)},
 fire:()=>noise(.5,.1,900),
 wind:()=>noise(.6,.07,1800,'bandpass'),
 poison:()=>{tone(200,120,.4,'sawtooth',.04);noise(.3,.05,600)}
};
function sfx(n){safe(()=>SFX[n]&&SFX[n]())}

/* ---------- ENGINE: timer, layer, particle ---------- */
function at(ms,fn){const g=gen;timers.push({at:T()+ms,fn:()=>{if(g===gen)fn();}});}
function rep(from,to,every,fn){for(let t=from;t<=to;t+=every)at(t,fn);}
function tick(fn){tickers.push(fn);}
function layer(dur,draw,o={}){const l={t0:T()+(o.delay||0),dur,draw,under:!!o.under,end:o.end};layers.push(l);return l;}
function emit(x,y,o){
  const n=o.raw?(o.n||1):N(o.n||10),out=[];
  for(let i=0;i<n&&parts.length<QMAX[S.q-1];i++){
    const sp=o.spd||[40,160],a=(o.ang??rnd(0,6.283))+rnd(-1,1)*(o.spread??Math.PI),v=rnd(sp[0],sp[1]),lf=o.life||[400,900],sz=o.size||[3,7];
    const p={x:x+rnd(-1,1)*(o.jit||0),y:y+rnd(-1,1)*(o.jit||0),vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:rnd(lf[0],lf[1]),size:rnd(sz[0],sz[1]),
      col:Array.isArray(o.col)?pick(o.col):(o.col||'#fff'),g:o.g||0,drag:o.drag??.985,shape:o.shape||'cube',rot:rnd(0,6.28),vr:o.spin??rnd(-5,5),
      grow:o.grow||0,a:o.a??1,add:o.add,tx:o.tx,ty:o.ty,pull:o.pull||0,floor:o.floor,kill:o.kill,onArr:o.onArr};
    parts.push(p);out.push(p);
  }
  return out;
}
function stepParts(dt){
  const dr=dt*60;
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life+=dt*1000;
    if(p.pull){const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy)||1;p.vx+=dx/d*p.pull*dt;p.vy+=dy/d*p.pull*dt;if(d<10){p.life=p.max;if(p.onArr)safe(()=>p.onArr(p));}}
    p.vy+=p.g*dt;const k=Math.pow(p.drag,dr);p.vx*=k;p.vy*=k;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    if(p.floor!==undefined&&p.y>p.floor){
      if(p.kill){p.life=p.max;if(S.q>=2&&p.kill===2)emit(p.x,p.floor,{n:2,raw:1,col:'#93c5fd',spd:[20,70],ang:-1.57,spread:.9,g:300,life:[150,300],size:[2,3]});}
      else{p.y=p.floor;p.vy*=-.45;p.vx*=.75;if(Math.abs(p.vy)<30)p.vy=0;}
    }
    if(p.life>=p.max){parts[i]=parts[parts.length-1];parts.pop();}
  }
}
function cube(x,y,s,c,rot){
  const h=s/2,r=rot&&s>=6;
  if(r){ctx.save();ctx.translate(x,y);ctx.rotate(rot);x=0;y=0;}
  ctx.fillStyle=c;ctx.fillRect(x-h,y-h,s,s);
  if(s>=5){ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x-h,y-h,s,s*.3);ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(x-h,y+s*.2,s,s*.3);}
  if(r)ctx.restore();
}
function drawParts(){
  for(const p of parts){
    const k=p.life/p.max,a=(k<.6?1:(1-k)/.4)*p.a;if(a<=0)continue;
    const s=Math.max(1,p.size*(p.shape==='soft'?1:1-k*.3)+p.grow*p.life/1000);
    ctx.globalAlpha=cl(a);ctx.globalCompositeOperation=p.add?'lighter':'source-over';
    switch(p.shape){
      case 'spark':ctx.strokeStyle=p.col;ctx.lineWidth=Math.max(1,s/2);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.04,p.y-p.vy*.04);ctx.stroke();break;
      case 'soft':ctx.fillStyle=p.col;ctx.fillRect(p.x-s/2,p.y-s/2,s,s);break;
      case 'hollow':ctx.strokeStyle=p.col;ctx.lineWidth=1.5;ctx.strokeRect(p.x-s/2,p.y-s/2,s,s);break;
      case 'coin':{const w=Math.max(1.5,Math.abs(Math.cos(p.rot*2))*s);ctx.fillStyle=p.col;ctx.fillRect(p.x-w/2,p.y-s/2,w,s);ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(p.x-w/2,p.y-s/2,w,s*.25);break;}
      case 'plus':ctx.fillStyle=p.col;ctx.fillRect(p.x-s/2,p.y-1,s,2);ctx.fillRect(p.x-1,p.y-s/2,2,s);break;
      default:cube(p.x,p.y,s,p.col,p.rot);
    }
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function drawLayers(under){
  const tn=now;
  for(const l of layers){
    if(l.under!==under||tn<l.t0)continue;
    const el=(tn-l.t0)/1000,p=l.dur>1e8?0:cl((tn-l.t0)/l.dur);
    ctx.save();safe(()=>l.draw(p,el));ctx.restore();
  }
}
function pruneLayers(){
  const keep=[],ended=[];
  for(const l of layers){if(now>=l.t0+l.dur)ended.push(l);else keep.push(l);}
  layers=keep;
  ended.forEach(l=>{if(l.end)safe(l.end);});
}
function pop(x,y,txt,col,size=22,dur=900,o={}){texts.push(Object.assign({x,y,txt,col,size,dur,t0:T()},o));}
function drawTexts(){
  texts=texts.filter(t=>now<t.t0+t.dur);
  for(const t of texts){
    const p=cl((now-t.t0)/t.dur),s=t.size*(p<.15?.6+p/.15*.6:1.2-.2*p),y=t.y-(t.rise??40)*ease(p);
    ctx.save();ctx.globalAlpha=p>.7?1-(p-.7)/.3:1;ctx.font='900 '+s+'px ui-monospace,Menlo,Consolas,monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=Math.max(3,s/5);ctx.strokeStyle='#0b0820';ctx.lineJoin='round';ctx.strokeText(t.txt,t.x,y);ctx.fillStyle=t.col;ctx.fillText(t.txt,t.x,y);ctx.restore();
  }
}
function shake(m){if(!S.reduce)S.shk=Math.max(S.shk,m);}
function flash(col,a=.2){if(S.reduce)S.bd={col,t0:T()};else S.fl={col,a:Math.min(a,.28),t0:T()};} /* 1x flash lembut; reduce-motion = border statis */
function mv(p,k,to,dur,delay=0,f=ease){let from;layer(dur,pr=>{if(from===undefined)from=p[k];p[k]=from+(to-from)*f(pr);},{delay,end:()=>{p[k]=to;}});}

/* ---------- Helper visual ---------- */
function ring(x,y,r0,r1,dur,col,lw=3,o={}){layer(dur,p=>{const r=r0+(r1-r0)*ease(p);ctx.globalAlpha=(1-p)*(o.a??1);ctx.strokeStyle=col;ctx.lineWidth=lw*(1-p*.5);ctx.beginPath();ctx.ellipse(x,y,r,r*(o.sq??1),0,0,6.283);ctx.stroke();},{delay:o.delay,under:o.under});}
function sqRing(x,y,r0,r1,dur,col,lw=3,delay=0){layer(dur,(p,el)=>{const r=r0+(r1-r0)*ease(p);ctx.translate(x,y);ctx.rotate(el*2);ctx.globalAlpha=1-p;ctx.strokeStyle=col;ctx.lineWidth=lw*(1-p*.5);ctx.strokeRect(-r,-r,r*2,r*2);},{delay});}
function shock(x,y,r,col,dur=420){ring(x,y,r*.2,r,dur,col,5,{sq:.45});}
function chargeFx(c,col,ms,r=U*9){rep(0,ms,60,()=>{const a=rnd(0,6.28),d=r*rnd(.8,1.4);emit(c.x+Math.cos(a)*d,c.y+Math.sin(a)*d,{n:2,col,spd:[0,5],life:[250,400],size:[3,5],tx:c.x,ty:c.y,pull:1400,drag:.99});});}
function impact(x,y,cols,o={}){emit(x,y,{n:o.n||16,col:cols,spd:[90,340],g:700,life:[300,700],size:[4,9],ang:o.ang,spread:o.spread});emit(x,y,{n:10,col:'#fff',spd:[160,440],life:[110,240],size:[3,4],shape:'spark',add:1});}
function shot(from,to,col,dur,onHit,o={}){
  const a=ctr(from),b=ctr(to),sz=o.size||U*1.4;
  layer(dur,p=>{const x=a.x+(b.x-a.x)*p,y=a.y+(b.y-a.y)*p-Math.sin(p*Math.PI)*(o.arc||0);ctx.globalAlpha=.55;cube(x,y,sz*1.7,Array.isArray(col)?col[0]:col,-p*8);ctx.globalAlpha=1;cube(x,y,sz,'#fff',p*12);emit(x,y,{n:2,col:o.trail||col,spd:[10,60],life:[200,400],size:[3,6]});},{end:onHit});
}
function slashFx(x,y,rot,L,col,dur,delay=0,wd=U*2.2){
  layer(dur,p=>{
    const rev=cl(p*2.4),fade=cl((p-.3)/.7);ctx.translate(x,y);ctx.rotate(rot);if(S.q>=2)ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
    const S0=[-L,-L*.7],C0=[L*.9,-L*.95],E0=[L*.9,L*.8],n=20;let px=0,py=0;
    for(let k=0;k<=n;k++){const t=k/n;if(t>rev)break;const q=1-t,X=q*q*S0[0]+2*q*t*C0[0]+t*t*E0[0],Y=q*q*S0[1]+2*q*t*C0[1]+t*t*E0[1];
      if(k){const tail=cl(1-(rev-t)*1.8),w=wd*Math.pow(Math.sin(Math.PI*t),.7)*tail*(1-fade);
        if(w>.3){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(X,Y);ctx.stroke();if(S.q>=2){ctx.strokeStyle='#fff';ctx.lineWidth=w*.35;ctx.stroke();}}}
      px=X;py=Y;}
  },{delay});
}
function portal(x,y,dur){
  layer(dur,(p,el)=>{
    const s=p<.14?ease(p/.14):p>.82?Math.max(0,1-(p-.82)/.18):1,R=U*8*s;if(R<1)return;
    ctx.translate(x,y);
    const g=ctx.createRadialGradient(0,0,0,0,0,R*1.3);g.addColorStop(0,'#000');g.addColorStop(.55,'#14002b');g.addColorStop(1,'rgba(168,85,247,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R*1.3,0,6.283);ctx.fill();
    for(let i=0;i<3;i++){ctx.save();ctx.rotate(el*(1.4+i*.8)*(i%2?-1:1));const r=R*(1-i*.2);ctx.strokeStyle=['#7c3aed','#d8b4fe','#a855f7'][i];ctx.lineWidth=3;ctx.strokeRect(-r*.75,-r*.75,r*1.5,r*1.5);ctx.restore();}
    if(S.q>=2)for(let k=0;k<14;k++){const an=el*3.2+k*.45,r=R*(.2+((k*37)%10)/13);cube(Math.cos(an)*r,Math.sin(an)*r,4,k%3?'#6d28d9':'#0a0a0a',an);}
    if(S.q>=3)for(let i=0;i<3;i++){const f=(el*.9+i/3)%1;ctx.globalAlpha=(1-f)*.6;ctx.strokeStyle='#c084fc';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,R*(1.9-f*1.3),0,6.283);ctx.stroke();}
    if(Math.random()<(S.reduce?.1:.55)){const an=rnd(0,6.283),d=R*1.8;emit(x+Math.cos(an)*d,y+Math.sin(an)*d,{n:1,raw:1,col:['#a855f7','#111','#7c3aed'],spd:[0,5],tx:x,ty:y,pull:1500,life:[250,450],size:[3,6],drag:.99});}
  });
}
function hitReact(p,dmg,dir,o={}){
  const c=ctr(p);p.flash=1;layer(240,pr=>{p.flash=1-pr;},{end:()=>{p.flash=0;}});
  mv(p,'ox',dir*U*(1.5+dmg/14),90,0,ease);mv(p,'ox',0,300,100,eio);
  emit(c.x,c.y,{n:6+dmg/3,col:['#ef4444','#fca5a5','#fff'],spd:[60,200],g:500,ang:dir>0?0:Math.PI,spread:1.1,life:[300,600]});
  pop(c.x,c.y-U*7,(o.crit?'CRIT ':'')+'-'+dmg,o.crit?'#fde047':'#fecaca',16+Math.min(14,dmg/3),900);
  shake(Math.min(9,dmg/5));
  layer(520,pr=>{ctx.globalAlpha=1-pr;ctx.strokeStyle='#fecaca';ctx.lineWidth=4;const x=c.x-dir*(U*9+pr*U*2),y=c.y;ctx.beginPath();ctx.moveTo(x-dir*U,y-U*1.4);ctx.lineTo(x+dir*U*.2,y);ctx.lineTo(x-dir*U,y+U*1.4);ctx.stroke();});
  if(o.status)pop(c.x,c.y-U*11,o.status,'#fde047',13,1100);
  if(S.reduce)S.bd={col:'#ef4444',t0:T()};
}

/* ---------- Dunia: pawn voxel, latar ---------- */
function mkPawn(name,col,col2){return{name,col,col2,skin:'#e8b88a',x:0,y:0,hx:0,ox:0,oy:0,scale:1,alpha:1,flash:0,lean:0,outline:null};}
function layoutPawns(){pawns=[mkPawn('KAMU','#3b82f6','#60a5fa'),mkPawn('LAWAN','#ef4444','#f87171')];resetPawns();}
function resetPawns(){pawns.forEach((p,i)=>{p.x=p.hx=W*(i?.76:.24);p.y=GY+U*2.5;p.ox=p.oy=0;p.scale=p.alpha=1;p.flash=p.lean=0;p.outline=null;});}
function drawPawn(p){
  if(p.alpha<=.01||p.scale<=.01)return;
  const x=p.x+p.ox,y=p.y+p.oy;

function summon(x,scale,cols,hold,label){
  const cs=U*2.2*scale,gy=GY+U*2.5,cells=[],rows=['11111','11111','11111','11111','11111','11011'],eyes=new Set(['1,1','3,1','2,2']);
  rows.forEach((r,ry)=>{for(let gx=0;gx<r.length;gx++)if(r[gx]==='1')cells.push({gx,gy:ry,col:eyes.has(gx+','+ry)?'#052e16':pick(cols),sx:rnd(-U*16,U*16),sy:-rnd(U*10,U*24),d:rnd(0,600)});});
  const cx=c=>x+(c.gx-2)*cs,cy=c=>gy-(6-c.gy)*cs+cs/2,tot=1500+hold;
  phase('Anticipation');sfx('charge');
  /* summoning circle */
  layer(tot,(p,el)=>{const R=U*10*scale,al=ease(cl(p*6))*(1-cl((p-.9)/.1));ctx.globalAlpha=al;ctx.translate(x,gy);ctx.scale(1,.34);ctx.rotate(el*.8);
    ctx.strokeStyle=cols[0];ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,R,0,6.283);ctx.stroke();ctx.rotate(-el*1.6);ctx.lineWidth=2;ctx.strokeRect(-R*.7,-R*.7,R*1.4,R*1.4);ctx.rotate(el*2.4);ctx.strokeRect(-R*.45,-R*.45,R*.9,R*.9);},{under:true});
  /* ground cracks */
  const cr=[];for(let i=0;i<7;i++){const an=i/7*6.283+rnd(-.2,.2);let px=0,py=0;const pts=[[0,0]];for(let k=0;k<4;k++){px+=Math.cos(an+rnd(-.5,.5))*U*3*scale;py+=Math.sin(an+rnd(-.5,.5))*U*3*scale*.34;pts.push([px,py]);}cr.push(pts);}
  layer(tot,p=>{const rv=ease(cl(p*3)),al=1-cl((p-.85)/.15);ctx.globalAlpha=al;ctx.translate(x,gy);ctx.lineWidth=3;
    for(const pts of cr){const n=Math.max(1,Math.floor((pts.length-1)*rv));ctx.strokeStyle='#0b0820';ctx.beginPath();ctx.moveTo(0,0);for(let i=1;i<=n;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();ctx.strokeStyle=cols[0];ctx.lineWidth=1;ctx.stroke();ctx.lineWidth=3;}},{under:true});
  at(350,()=>{phase('Charge');chargeFx({x,y:gy-U*5},cols[0],750,U*13*scale);});
  /* voxel construction */
  layer(1150+hold,(p,el)=>{const ms=el*1000,pop2=1+.12*Math.max(0,1-(el-1.15)*6);ctx.translate(x,gy);ctx.scale(pop2,pop2);ctx.translate(-x,-gy);
    for(const c of cells){const q=ease(cl((ms-c.d)/500));cube(cx(c)+c.sx*(1-q),cy(c)+c.sy*(1-q),cs*.96,c.col,(1-q)*6);}},
    {delay:350,end:()=>{phase('Dissolve');sfx('shatter');cells.forEach(c=>emit(cx(c),cy(c),{n:1,raw:1,col:c.col,spd:[40,200],ang:-1.57,spread:1.3,g:-50,life:[500,1000],size:[cs*.5,cs*.9]}));sqRing(x,gy-U*5*scale,5,U*10*scale,500,cols[0],3);}});
  at(1100,()=>phase('Release'));
  at(1500,()=>{phase('Impact');sfx('boom');emit(x,gy-U*6*scale,{n:30,col:cols,spd:[100,300],g:400,life:[400,800]});sqRing(x,gy-U*6*scale,8,U*13*scale,520,cols[0],4);if(S.q>=3)shock(x,gy+U*2,U*14*scale,cols[0]);pop(x,gy-U*18*scale,label,cols[0],18,1100);shake(3);});
}

  const a=A(),c=ctr(a);phase('Charge');sfx('charge');a.outline='#fde047';chargeFx(c,['#fde047','#fff'],400);
  at(420,()=>{phase('Release');sfx('fanfare');mv(a,'oy',-U*4,200,0,ease);mv(a,'oy',0,260,220,ease);
    layer(1200,p=>{const bw=U*6*(1-p*.3),g=ctx.createLinearGradient(0,GY,0,0);g.addColorStop(0,'rgba(253,224,71,.7)');g.addColorStop(1,'rgba(253,224,71,0)');ctx.globalCompositeOperation='lighter';ctx.globalAlpha=(1-p)*.9;ctx.fillStyle=g;ctx.fillRect(a.x-bw/2,0,bw,GY+U*2.5);},{under:true});
    for(let i=0;i<4;i++)ring(c.x,a.y+U*2-i*U*5,U*3,U*7,500,'#fde047',3,{sq:.35,delay:i*120});
    emit(c.x,c.y,{n:26,col:['#fde047','#fff'],shape:'plus',size:[5,9],spd:[40,200],ang:-1.57,spread:.9,g:-70,life:[800,1400],add:1});
    pop(c.x,c.y-U*12,'LEVEL UP!','#fde047',30,1500);phase('Impact');});
  at(1500,()=>{a.outline=null;phase('Dissolve');});
});
reg('I','victory','Victory',()=>{
  const a=A();phase('Release');sfx('fanfare');
  layer(3600,(p,el)=>{const c=ctr(a);ctx.translate(c.x,c.y);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.22*Math.sin(Math.PI*cl(p*1.05));ctx.rotate(el*.5);
    for(let i=0;i<14;i++){ctx.rotate(Math.PI/7);ctx.fillStyle='#fde68a';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(U*60,-U*3.5);ctx.lineTo(U*60,U*3.5);ctx.fill();}},{under:true});
  if(S.reduce)emit(W/2,H*.3,{n:20,col:['#fde047','#fff'],spd:[30,100],g:60,life:[900,1500]});
  else rep(0,1800,90,()=>emit(rnd(0,W),-10,{n:3,col:['#ef4444','#fde047','#22d3ee','#a855f7','#4ade80'],ang:1.57,spread:.4,spd:[80,180],g:240,life:[2000,2800],size:[4,8],floor:GY+U*4,kill:1,drag:.99}));
  mv(a,'oy',-U*3,220);mv(a,'oy',0,260,230,eio);mv(a,'oy',-U*3,220,700);mv(a,'oy',0,260,930,eio);
  pop(W*.5,H*.28,'VICTORY!','#fde047',38,2200,{rise:10});
  at(700,()=>phase('Impact'));at(1800,()=>phase('Aftermath'));at(3000,()=>phase('Dissolve'));
});
reg('I','defeat','Defeat',()=>{
  const a=A(),c=ctr(a);phase('Impact');sfx('fail');
  layer(3000,p=>{ctx.globalAlpha=Math.min(.5,p*3)*(1-cl((p-.85)/.15));ctx.fillStyle='#0f172a';ctx.fillRect(-30,-30,W+60,H+60);});
  mv(a,'lean',-1.35,700,0,ease);mv(a,'oy',U*1.2,700);mv(a,'alpha',.55,1200);
  emit(c.x,c.y,{n:24,col:['#94a3b8','#64748b','#cbd5e1'],spd:[40,180],g:500,life:[900,1500]});
  pop(W*.5,H*.3,'DEFEAT','#94a3b8',36,2200,{rise:-14});
  at(700,()=>phase('Reaction'));at(1500,()=>phase('Aftermath'));at(2400,()=>phase('Dissolve'));
});
reg('I','quest','Quest Complete',()=>{
  const cx=W*.5,cy=H*.3,bw=Math.min(W*.82,340),bh=U*7;phase('Impact');sfx('fanfare');
  layer(2400,(p,el)=>{const sx=ease(cl(el/.35)),al=1-cl((el-2)/.4);ctx.globalAlpha=al;ctx.translate(cx,cy);ctx.scale(sx,1);
    ctx.fillStyle='#1e1b4b';ctx.fillRect(-bw/2,-bh/2,bw,bh);ctx.strokeStyle='#fbbf24';ctx.lineWidth=3;ctx.strokeRect(-bw/2,-bh/2,bw,bh);
    ctx.strokeStyle='#4ade80';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-bw/2+U*1.5,0);ctx.lineTo(-bw/2+U*2.6,U*1.2);ctx.lineTo(-bw/2+U*4.4,-U*1.4);ctx.stroke();
    ctx.fillStyle='#fde68a';ctx.font='900 '+Math.min(U*2.6,22)+'px ui-monospace,Menlo,monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('QUEST COMPLETE',U*1.5,0);});
  rep(100,1500,90,()=>emit(cx+rnd(-bw/2,bw/2),cy+rnd(-bh/2,bh/2),{n:1,col:['#fde047','#fff'],shape:'plus',size:[4,8],spd:[10,40],life:[400,800],add:1}));
  at(500,()=>{phase('Aftermath');sfx('coin');});at(1800,()=>phase('Dissolve'));
});

/* ================= LOOP UTAMA ================= */
function frame(){
  now=performance.now();const dt=Math.min(.05,(now-last)/1000);last=now;
  const due=[];timers=timers.filter(x=>{if(x.at<=now){due.push(x);return false;}return true;});
  due.sort((a,b)=>a.at-b.at).forEach(x=>safe(x.fn));
  tickers.slice().forEach(f=>safe(()=>f(dt)));
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  ctx.save();
  S.shk*=Math.exp(-dt*9);S.zoom+=(1-S.zoom)*Math.min(1,dt*6);
  if(S.shk>.2)ctx.translate(rnd(-1,1)*S.shk,rnd(-1,1)*S.shk);
  if(S.zoom>1.002){ctx.translate(S.zx,S.zy);ctx.scale(S.zoom,S.zoom);ctx.translate(-S.zx,-S.zy);}
  ctx.drawImage(bg,0,0,W,H);
  drawLayers(true);
  pawns.slice().sort((a,b)=>a.y-b.y).forEach(p=>safe(()=>drawPawn(p)));
  drawLayers(false);
  stepParts(dt*S.ts);drawParts();drawTexts();
  ctx.restore();
  if(S.fl){const p=cl((now-S.fl.t0)/260);ctx.globalAlpha=S.fl.a*(1-p);ctx.fillStyle=S.fl.col;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;if(p>=1)S.fl=null;}
  if(S.bd){const p=cl((now-S.bd.t0)/500);ctx.globalAlpha=1-p;ctx.strokeStyle=S.bd.col;ctx.lineWidth=6;ctx.strokeRect(3,3,W-6,H-6);ctx.globalAlpha=1;if(p>=1)S.bd=null;}
  pruneLayers();
  if(playing&&!loopFx&&!layers.length&&!parts.length&&!timers.length&&!tickers.length&&!texts.length){playing=false;setTag('✔ '+curName+' — selesai, 0 objek FX tersisa');}
  requestAnimationFrame(frame);
}

/* ================= UI ================= */
const CATS=[['A','A · Teleport & Spatial'],['B','B · Combat & Attack'],['C','C · Damage & Hit Reaction'],['D','D · Aura & Buff'],['E','E · Elemental'],['F','F · Summon & Mob'],['G','G · Reward & Loot'],['H','H · Environment & World'],['I','I · UI & Gameplay Feedback']];
const QD=['L1 Basic — partikel sederhana, animasi singkat','L2 Enhanced — multi-layer particles + trail','L3 Advanced — energy ring, shockwave, distorsi','L4 Legendary — cinematic multi-phase (hit-stop, zoom, flash terbatas)'];
function buildUI(){
  const ch=$('#chips');PH.forEach(n=>{const s=document.createElement('span');s.className='chip';s.textContent=n;ch.appendChild(s);chips.push(s);});
  const tabs=$('#tabs'),grid=$('#grid');
  CATS.forEach(([k,label])=>{
    const t=document.createElement('button');t.className='tab';t.textContent=k;t.title=label;t.onclick=()=>{const e=document.getElementById('sec'+k);if(e)e.scrollIntoView({behavior:'smooth',block:'start'});};tabs.appendChild(t);
    const sec=document.createElement('section');sec.id='sec'+k;const h=document.createElement('h3');h.textContent=label;sec.appendChild(h);
    const g=document.createElement('div');g.className='g';
    Object.values(FX).filter(f=>f.cat===k).forEach(f=>{const b=document.createElement('button');b.className='fx';b.dataset.id=f.id;b.textContent=f.name+(f.loop?' ∞':'');b.onclick=()=>play(f.id);g.appendChild(b);});
    sec.appendChild(g);grid.appendChild(sec);
  });
  const qs=$('#qseg');
  for(let i=1;i<=4;i++){const b=document.createElement('button');b.textContent='L'+i;b.className=i===S.q?'on':'';b.onclick=()=>{S.q=i;[...qs.children].forEach((c,k)=>c.className=k+1===i?'on':'');$('#qdesc').textContent=QD[i-1];};qs.appendChild(b);}
  $('#qdesc').textContent=QD[S.q-1];
  const rm=$('#rm');const upd=()=>{rm.textContent='Reduce Motion: '+(S.reduce?'ON':'OFF');rm.classList.toggle('on',S.reduce);};upd();rm.onclick=()=>{S.reduce=!S.reduce;upd();};
  const sn=$('#snd');sn.onclick=()=>{S.sound=!S.sound;sn.textContent='Suara: '+(S.sound?'ON':'OFF');sn.classList.toggle('on',S.sound);};
  $('#vol').oninput=e=>{S.vol=e.target.value/100;if(MG)MG.gain.value=S.vol;};
  $('#stop').onclick=()=>{stopAll();setTag('■ Dihentikan — semua partikel, layer, timer dibersihkan');};
}
buildUI();
resize();
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>resize()).observe($('#stageWrap'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll();});
setInterval(()=>{$('#cnt').textContent='partikel '+parts.length+' · layer '+layers.length+' · timer '+timers.length;},250);
requestAnimationFrame(frame);
</script>
