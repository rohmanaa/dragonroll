<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview — Button &amp; Tabs Glossy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<link rel="stylesheet" href="../button/button.css"><link rel="stylesheet" href="tabs.css">
<style>body{margin:0;padding:24px;background:#241f3d;color:#fff;font:600 16px Nunito,sans-serif}h2{font:400 22px 'Lilita One';margin:28px 0 12px;color:#ffe8a3}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}.ut-btn{font-size:20px;font-family:'Lilita One',sans-serif;padding:0 28px}</style>
<h2>Button — .ut-btn .ut-gl .ut-c-*</h2>
<div class="row">
<button class="ut-btn ut-gl ut-c-y">Kuning</button><button class="ut-btn ut-gl ut-c-g">Hijau</button><button class="ut-btn ut-gl ut-c-b">Biru</button>
<button class="ut-btn ut-gl ut-c-r">Merah</button><button class="ut-btn ut-gl ut-c-p">Ungu</button><button class="ut-btn ut-gl ut-c-t">Teal</button>
<button class="ut-btn ut-gl ut-c-n">Cokelat</button><button class="ut-btn ut-gl ut-c-d">Gelap</button><button class="ut-btn ut-gl ut-c-g" disabled>Nonaktif</button></div>
<h2>Tab atas — .ut-tabs .ut-tab</h2>
<nav class="ut-tabs"><button class="ut-tab on">Guild</button><button class="ut-tab">Anggota</button><button class="ut-tab">Perang</button></nav>
<h2>Segmented — .ut-seg .ut-seg-i</h2>
<div class="ut-seg"><button class="ut-seg-i on">Semua</button><button class="ut-seg-i">Publik</button><button class="ut-seg-i">Privat</button></div>
<h2>Underline — .ut-ul .ut-ul-i</h2>
<div class="ut-ul"><button class="ut-ul-i on">Misi<small>3</small></button><button class="ut-ul-i">Hadiah<i class="bd">2</i></button></div>
<script>document.querySelectorAll('.ut-tabs,.ut-seg,.ut-ul').forEach(function(g){g.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)})})})</script>
