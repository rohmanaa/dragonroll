<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>collapse-button — preview</title>
<link rel="stylesheet" href="collapse-button.css">
<style>body{margin:0;padding:24px;background:#5a9a2c;color:#fff;font:700 18px Arial,sans-serif}.row{display:flex;flex-wrap:wrap;gap:24px;margin-bottom:24px}</style></head>
<body><h2>collapse-button — bawaan · .flip</h2>
<div class="row">
<div class="ut-collapse"><div class="ut-collapse-body"><button class="ut-collapse-item" type="button" aria-label="Acara"><svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true"><polygon points="12,2 15,9 22,9.5 17,14.5 18.5,22 12,18 5.5,22 7,14.5 2,9.5 9,9" fill="#ffd45a" stroke="#000" stroke-width="1.5"/></svg></button></div><span class="ut-collapse-div"></span><button class="ut-collapse-toggle" type="button" aria-expanded="true" aria-label="Tutup menu"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="8,3 17,12 8,21"/><polyline points="8,3 17,12 8,21"/></svg></button></div>
<div class="ut-collapse flip" style="--cb-h:100px"><div class="ut-collapse-body"><button class="ut-collapse-item" type="button" aria-label="Satu"><svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true"><polygon points="12,2 15,9 22,9.5 17,14.5 18.5,22 12,18 5.5,22 7,14.5 2,9.5 9,9" fill="#ffd45a" stroke="#000" stroke-width="1.5"/></svg></button><button class="ut-collapse-item" type="button" aria-label="Dua"><svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true"><polygon points="12,2 15,9 22,9.5 17,14.5 18.5,22 12,18 5.5,22 7,14.5 2,9.5 9,9" fill="#ffd45a" stroke="#000" stroke-width="1.5"/></svg></button><button class="ut-collapse-item" type="button" aria-label="Tiga"><svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true"><polygon points="12,2 15,9 22,9.5 17,14.5 18.5,22 12,18 5.5,22 7,14.5 2,9.5 9,9" fill="#ffd45a" stroke="#000" stroke-width="1.5"/></svg></button></div><span class="ut-collapse-div"></span><button class="ut-collapse-toggle" type="button" aria-expanded="true" aria-label="Tutup menu"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="8,3 17,12 8,21"/><polyline points="8,3 17,12 8,21"/></svg></button></div>
</div>
<script>document.querySelectorAll('.ut-collapse-toggle').forEach(function(t){t.addEventListener('click',function(){var shut=t.parentNode.classList.toggle('collapsed');t.setAttribute('aria-expanded',String(!shut));t.setAttribute('aria-label',shut?'Buka menu':'Tutup menu')})})</script>
</body></html>
