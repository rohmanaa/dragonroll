<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview — card-slot-kotak</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">

<style>body{margin:0;padding:24px;background:#241f3d;color:#fff;font:600 16px Nunito,sans-serif}h2{font:400 22px 'Lilita One';margin:28px 0 12px;color:#ffe8a3}
.row{display:flex;flex-wrap:wrap;gap:18px}.card-slot-kotak{font-size:30px;width:6em;height:4.4em;padding:.5em;text-align:center;font-family:'Lilita One',sans-serif;display:grid;place-items:center}
.card-slot-kotak small{display:block;font:800 .45em Nunito,sans-serif}</style>
<h2>card-slot-kotak — .krem (bawaan) · .gold · .hijau · .abu · .abu-dark · .off</h2>
<div class="row">
<div class="card-slot-kotak"><span>Krem<small>bawaan</small></span></div>
<div class="card-slot-kotak gold"><span>Gold</span></div>
<div class="card-slot-kotak hijau"><span>Hijau</span></div>
<div class="card-slot-kotak abu"><span>Abu</span></div>
<div class="card-slot-kotak abu-dark"><span>Abu dark</span></div>
<div class="card-slot-kotak gold off"><span>Gold .off</span></div>
</div>
<h2>Skala mengikuti font-size induk (20px)</h2>
<div class="row" style="font-size:20px"><div class="card-slot-kotak hijau" style="font-size:inherit"><span>Kecil</span></div></div>
