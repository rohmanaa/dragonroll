<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Data Preview</title>
<style>body{margin:0;padding:16px;background:#8fd0ff;font-family:system-ui,sans-serif;color:#0b1838}h2{margin:18px 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.c{background:rgba(255,255,255,.55);border-radius:10px;padding:8px;text-align:center}
.c svg{display:block;margin:0 auto;max-width:100%;height:130px}.c b{display:block;font-size:13px;margin-top:4px}.c small{opacity:.7}</style></head>
<body><h1>UT.CharacterData — preview</h1><p>Sumber: <code>assets/js/character-data.js</code>. Tiap kartu: tampak iso dan depan (skin PNG memakai model Steve sebagai cadangan).</p><div id="app"></div>
<script src="../assets/js/character-data.js"></script>
<script>
var C=UT.CharacterData,app=document.getElementById('app'),T={player:'Karakter pemain (skin palette + PNG)',mob:'Mob di petak papan',wild:'Mob liar di luar papan'};
C.groups.forEach(function(g){var h=document.createElement('h2');h.textContent=T[g]||g;app.appendChild(h);var w=document.createElement('div');w.className='g';
 C.list(g).forEach(function(k){var d=C.get(g,k),c=document.createElement('div');c.className='c';
  c.innerHTML=C.svg(g,k,{view:'iso'})+C.svg(g,k,{view:'front'})+'<b>'+d.name+'</b><small>'+g+':'+k+(d.png?' (PNG→Steve)':'')+'</small>';w.appendChild(c);});
 app.appendChild(w);});
</script></body></html>
