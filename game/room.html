<script>
(()=>{
const $=s=>document.querySelector(s),PD=window.PlayerData,IC=window.ItemCatalog,RF=UT.RoomFlow;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1900)}
/* ---------- URL -> konfigurasi room (URL tidak valid -> Mode Selection) ---------- */
const q=new URLSearchParams(location.search),MODE=q.get('mode');
if(RF.MODES.indexOf(MODE)<0){location.replace('mode.html');return}
const ONLINE=MODE==='online',FORMAT=(ONLINE&&q.get('format')==='team')?'team':'solo',TEAM=ONLINE&&FORMAT==='team';
const COUNT=ONLINE?4:Math.min(4,Math.max(2,parseInt(q.get('count'),10)||2));
let HOST=!(ONLINE&&q.get('role')==='guest');
const jc=(q.get('code')||'').toUpperCase(),JOIN=(!HOST&&/^[A-Z0-9]{6,8}$/.test(jc))?jc:null;
const MAP=RF.getMap(),TILES=100;
const MODE_LABEL={vsc:'VS Computer',local:'Multi Player',online:TEAM?'Create Room • Team':'Create Room • Solo'};
/* DATA DEMO (ganti dengan API/server): stok Power per pertandingan & daftar teman belum punya backend */
const POWER_STOCK={sword:2,feather:2,tnt:1,totem:1,potion_odd:2,potion_even:2,grass:2};
const FRIENDS=[{id:'l1',name:'Mike',online:true,level:21},{id:'l2',name:'Lisa',online:true,level:18},{id:'g1',name:'RakaPlay',online:true,level:28},{id:'g2',name:'NayaCraft',online:true,level:24},{id:'g3',name:'AlyaVoxel',online:true,level:19},
 {id:'l3',name:'Dodi',online:false,level:9},{id:'g4',name:'DinoRush',online:false,level:35}];
const myName=()=>PD.profile().name||'Kamu',myLevel=()=>1+Math.floor(PD.xp()/100);
const eqItem=slot=>IC.byId(PD.equippedId(slot));
const S={invTab:'online',invites:{},timers:[],room:{privacy:'private',code:'',players:[]},hostT:null,invTeam:0,mpIdentity:null,mpRoomId:null,mpUnsub:null,gameLaunched:false};
const art=it=>it.kind==='skin'?ItemArt.character(it.id):it.kind==='frame'?`<img src="${it.image}" alt="" draggable="false">`:ItemArt.dice(it.id);
function clearT(){S.timers.forEach(clearTimeout);S.timers=[];clearTimeout(S.hostT);S.hostT=null;Object.values(S.invites).forEach(v=>clearTimeout(v.timer))}
/* ---------- navigasi ---------- */
const leave=async to=>{clearT();if(ONLINE&&S.mpRoomId&&S.mpIdentity&&UT.Multiplayer.RoomService){try{await UT.Multiplayer.RoomService.leaveRoom(S.mpRoomId)}catch(e){if(String(e.message||'').includes('GAME_IN_PROGRESS')){toast('Selesaikan permainan sebelum meninggalkan room.');return}console.warn('[multiplayer] leave failed',e)}}if(S.mpUnsub)S.mpUnsub();try{sessionStorage.removeItem('ut-multiplayer-room')}catch(_){}RF.navigate(to)};
$('#back').onclick=()=>leave('mode');$('#cls').onclick=()=>leave('home');
/* ---------- setup room ---------- */
function setup(){
 if(ONLINE){renderRoomHeader();return;}
 const P=[{id:'me',name:myName(),level:myLevel(),ready:true,team:0,kind:'host'}];
 if(MODE==='vsc')for(let i=1;i<COUNT;i++)P.push({id:'b'+i,name:'Bot '+i,level:rand(4,20),ready:true,team:0,kind:'bot'});
 if(MODE==='local')for(let i=1;i<COUNT;i++)P.push({id:'p'+i,name:'Pemain '+(i+1),level:1,ready:true,team:0,kind:'local'});
 S.room={privacy:'private',code:'',players:P}; renderRoomHeader();
}
function randomRoomCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',bytes=new Uint8Array(6);crypto.getRandomValues(bytes);return Array.from(bytes,b=>chars[b%chars.length]).join('')}
function renderRoomHeader(){
 document.documentElement.classList.toggle('mp-online',ONLINE);
 $('#rt_t').textContent=MODE==='vsc'?'VS COMPUTER':MODE==='local'?'MULTI PLAYER':(TEAM?'ROOM TEAM':'ROOM SOLO');
 $('#rs').textContent=(MAP?MAP.name.replace(/^Map /,''):'-')+' • '+COUNT+' pemain';$('#invB').hidden=!(ONLINE&&HOST);$('#invB').textContent='ROOM ACCESS';
 $('#cCode').textContent='KODE '+(S.room.code||'------');
}
function applyRemoteRoom(row){
 if(!row)return;S.mpRoomId=row.id;HOST=!!(S.mpIdentity&&row.host_id===S.mpIdentity.id);
 S.room={id:row.id,status:row.status,privacy:row.is_public?'public':'private',code:row.code,players:(row.players||[]).map(p=>({id:p.id,name:p.name,level:1,ready:!!p.ready,team:Number(p.team)||0,kind:p.id===row.host_id?'host':'player'}))};
 renderRoomHeader();$('#cCode').textContent='KODE '+row.code;
 $('#rdy').hidden=HOST||row.status!=='waiting';$('#start').hidden=!HOST||row.status!=='waiting';
 $('#sPriv').classList.toggle('on',!row.is_public);$('#sPub').classList.toggle('on',!!row.is_public);
 renderPlayers();renderBottom();
 if((row.status==='playing'||row.status==='finished')&&row.game_state&&row.game_state.roomConfig&&!S.gameLaunched&&!(sessionStorage.getItem('ut-mp-exited')===String(row.id))){S.gameLaunched=true;const gameCfg=Object.assign({},row.game_state.roomConfig,{host:HOST,code:row.code,roomId:row.id,roomRevision:row.revision,initialSnapshot:row.game_state.snapshot||null});RF.launch(gameCfg)}
}
async function setupOnline(){
 try{
  const MP=UT.Multiplayer.RoomService;if(!MP)throw new Error('Modul multiplayer belum siap');
  S.mpIdentity=await MP.ensurePlayer();let row;
  if(HOST){
   let saved=null;try{saved=JSON.parse(sessionStorage.getItem('ut-multiplayer-room')||'null')}catch(_){}
   if(saved&&saved.id){try{row=await MP.getRoom(saved.id)}catch(_){} }
   if(!row)row=await MP.createRoom({code:randomRoomCode(),name:S.mpIdentity.name,isPublic:false,format:FORMAT,maxPlayers:COUNT,config:{mode:MODE,format:FORMAT,map:MAP&&MAP.gameKey}});
  }else{if(!JOIN)throw new Error('Kode room tidak valid atau tidak tersedia');row=await MP.joinRoom({code:JOIN,name:S.mpIdentity.name})}
  try{sessionStorage.setItem('ut-multiplayer-room',JSON.stringify({id:row.id,code:row.code}))}catch(_){}
  applyRemoteRoom(row);S.mpUnsub=MP.subscribe(row.id,applyRemoteRoom);
 }catch(e){console.error('[multiplayer] room setup failed',e);toast('Gagal masuk room: '+(e.message||'Periksa koneksi'));$('#sttx').textContent='Tidak dapat terhubung ke room. Kembali dan coba lagi.';$('#rdy').disabled=true;$('#start').disabled=true}
}
/* ---------- EQUIPMENT (Dice / Skin / Frame milik pemain; CHANGE -> daftar item yang dimiliki) ---------- */
const EQ=[['dice','DICE','DADU'],['skin','SKIN','SKIN'],['frame','FRAME','FRAME'],['effect','EFEK','EFEK']];
/* Efek: belum ada item efek di katalog (Shop/Inventory masih "segera"), jadi slot ini baru placeholder */
const EFFECT_ICON='assets/Images/icon/items/efek.webp';
function renderEq(){
 $('#eqn').textContent=EQ.length+' ITEMS';
 $('#eq').innerHTML=EQ.map(([k,l])=>{const it=k==='effect'?null:eqItem(k);const ar=k==='effect'?`<img src="${EFFECT_ICON}" alt="" draggable="false">`:(it?art(it):'');return `<div class="eqi" data-k="${k}" role="button" aria-label="Ganti ${l}"><span class="art">${ar}</span><b>${l}</b><small>${k==='effect'?'Segera':(it?esc(it.name.replace(/^(Frame|Dadu) /,'')):'-')}</small><button class="chg gold" data-k="${k}">CHANGE</button></div>`}).join('');
}
$('#eq').onclick=e=>{const b=e.target.closest('[data-k]');if(b)openChoice(b.dataset.k)};
let CK=null;
function openChoice(k){if(k==='effect')return toast('Efek segera hadir');CK=k;renderChoice();$('#cm').classList.add('show')}
const closeChoice=()=>$('#cm').classList.remove('show');
function renderChoice(){
 const cur=PD.equippedId(CK),own=IC.items.filter(i=>i.kind===CK&&PD.owns(i.id));
 $('#cmT').textContent='🎒 PILIH '+EQ.find(x=>x[0]===CK)[2];
 $('#cmL').innerHTML=own.map(it=>`<div class="co"><span class="cp">${art(it)}</span><div class="pi"><b>${esc(it.name)}</b><small>${esc(it.desc||'')}</small></div><button class="bt ${cur===it.id?'sent':''}" data-id="${it.id}" ${cur===it.id?'disabled':''}>${cur===it.id?'✓ DIPAKAI':'PAKAI'}</button></div>`).join('')||'<div class="emp">Belum ada item.</div>';
}
$('#cmL').onclick=e=>{const b=e.target.closest('[data-id]');if(!b||b.disabled)return;const r=PD.equip(b.dataset.id);if(!r.ok)return toast('Tidak bisa dipakai');renderEq();closeChoice();toast(IC.byId(b.dataset.id).name+' dipakai')};
$('#cmX').onclick=closeChoice;$('#cm').onclick=e=>{if(e.target.id==='cm')closeChoice()};
/* ---------- POWER LOADOUT (koleksi permanen, pilih maks. 5 jenis) ---------- */
const POWERS=IC.items.filter(i=>i.kind==='powerup'),PK='ut-room-powers:v1';
function loadP(){try{const d=JSON.parse(localStorage.getItem(PK)||'{}');return{equipped:(d.equipped||[]).filter(id=>POWERS.some(p=>p.id===id)).slice(0,5)}}catch(e){return{equipped:[]}}}
const PW=loadP();const saveP=()=>{try{localStorage.setItem(PK,JSON.stringify(PW))}catch(e){}};
function renderPower(){
 $('#pcnt').textContent=PW.equipped.length+' / 5 DIPILIH';$('#psc').style.setProperty('--pn',POWERS.length);
 $('#psc').innerHTML=POWERS.map(p=>{const on=PW.equipped.includes(p.id);return `<div class="pc ${on?'sel':''}" data-id="${p.id}" role="checkbox" aria-checked="${on}" aria-label="${esc(p.name)}" title="${esc(p.name+' — '+p.desc+((UT.PowerFX&&UT.PowerFX.DATA[p.gameKey])?' Efek: '+UT.PowerFX.DATA[p.gameKey].note+'.':''))}"><span class="ck">✓</span><img src="${p.icon}" alt="" draggable="false"><div class="pwn">${esc(p.name)}</div></div>`}).join('');
}
$('#psc').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const id=b.dataset.id;
 if(PW.equipped.includes(id))PW.equipped=PW.equipped.filter(x=>x!==id);
 else{if(PW.equipped.length>=5)return toast('Maksimal 5 jenis Power untuk satu pertandingan');PW.equipped.push(id);try{const pi=POWERS.find(x=>x.id===id);if(pi&&window.UT&&UT.PowerFX)UT.PowerFX.playAtElement(pi.gameKey,b)}catch(er){}}
 saveP();renderPower()};
/* ---------- MAP INFORMATION ---------- */
/* banner gambar map (gameplay/maps/banner-maps) memakai gameKey; map tanpa banner tetap pakai SVG ItemArt */
const BANNER={minecraft:'gameplay/maps/banner-maps/world.webp',nether:'gameplay/maps/banner-maps/nether.webp'};
function renderMap(){
 $('#mArt').innerHTML=MAP?(BANNER[MAP.gameKey]?`<img src="${BANNER[MAP.gameKey]}" alt="" draggable="false">`:ItemArt.theme(MAP.id)):'';
 $('#mTxt').innerHTML=`Game Mode: ${MODE_LABEL[MODE]}<br>Map: ${MAP?esc(MAP.name.replace(/^Map /,'')):'-'}<br>Number of Tiles: ${TILES}`;
}
/* ---------- PLAYER ROOM ---------- */
const pending=()=>Object.keys(S.invites).length,slotsLeft=()=>COUNT-S.room.players.length-pending();
const me=()=>S.room.players.find(p=>p.id===(S.mpIdentity&&S.mpIdentity.id||'me'));
function avatar(p){return p.kind==='bot'?'<span class="av"><img src="assets/Images/icon/mode/robot.webp" alt="" draggable="false"></span>':`<span class="av">${esc(p.name[0]||'?').toUpperCase()}</span>`}
function prow(p){const kind={host:'Host',friend:'Teman',bot:'Computer',local:'Lokal'}[p.kind],
 tags=(p.kind==='host'?'<span class="tg">HOST</span>':'')+(p.id===(S.mpIdentity&&S.mpIdentity.id||'me')&&p.kind!=='host'?'<span class="tg me">KAMU</span>':''),
 mv=(TEAM&&HOST&&!ONLINE)?`<button class="mv" data-mv="${p.id}" aria-label="Pindah tim">⇄</button>`:'';
 return `<div class="plr ${TEAM?'t'+p.team:''} ${p.id===(S.mpIdentity&&S.mpIdentity.id||'me')?'me':''}">${avatar(p)}<div class="pi"><b>${esc(p.name)}${tags}</b><small>Lv ${p.level} • ${kind}</small></div>${mv}<span class="st ${p.ready?'rd':'wt'}">${p.ready?'✓ READY':'WAITING'}</span></div>`}
function srow(team){if(!ONLINE)return'';const lock=S.room.privacy==='private',c=TEAM?'t'+team:'';
 if(!HOST)return `<div class="slot static ${c}"><span>${lock?'🔒':'🔓'}</span><span>Slot kosong</span></div>`;
 return `<button class="slot ${c}" data-share="1"><span class="plus">↗</span><span>Bagikan Room<small>Salin kode atau tautan undangan</small></span></button>`}
/* slot terkunci (warna kayu + ikon gembok) untuk sisa slot sampai 4, mis. main berdua -> 2 slot bawah terkunci */
function lrow(){return `<div class="slot lk" aria-label="Slot terkunci"><img src="assets/Images/icon/ui/lock.webp" alt="" draggable="false"><span>Terkunci</span></div>`}
function renderPlayers(){
 const r=S.room,P=r.players;$('#cnt').textContent=P.length+'/'+COUNT;
 let h='';
 if(TEAM)[1,2].forEach(t=>{const tp=P.filter(p=>p.team===t);h+=`<div class="th t${t}"><span>TEAM ${t}</span><span>${tp.length}/2</span></div>`+tp.map(prow).join('');for(let i=tp.length;i<2;i++)h+=srow(t)});
 else{h=P.map(prow).join('');for(let i=P.length;i<COUNT;i++)h+=srow(0);for(let i=COUNT;i<4;i++)h+=lrow()}
 $('#plrs').innerHTML=h;if($('#inv').classList.contains('show'))renderInvite();
}
$('#plrs').onclick=e=>{const m=e.target.closest('[data-mv]'),s=e.target.closest('[data-share]');if(m)moveTeam(m.dataset.mv);else if(s)copy('link')};
function copy(t){const v=t==='code'?S.room.code:`${location.origin}${location.pathname}?mode=online&format=${FORMAT}&count=${COUNT}&role=guest&code=${S.room.code}`;
 try{navigator.clipboard.writeText(v).then(()=>toast(t==='code'?'Kode disalin':'Link disalin'),()=>toast('Kode: '+S.room.code))}catch(e){toast('Kode: '+S.room.code)}}
$('#cCode').onclick=()=>HOST&&copy('code');$('#cLink').onclick=()=>HOST&&copy('link');
$('#sPriv').onclick=async()=>{if(HOST&&ONLINE){try{applyRemoteRoom(await UT.Multiplayer.RoomService.setVisibility(S.mpRoomId,false));renderInvite()}catch(e){toast('Gagal mengubah akses room')}}};$('#sPub').onclick=async()=>{if(HOST&&ONLINE){try{applyRemoteRoom(await UT.Multiplayer.RoomService.setVisibility(S.mpRoomId,true));renderInvite()}catch(e){toast('Gagal mengubah akses room')}}};
function moveTeam(id){if(!HOST)return;const p=S.room.players.find(x=>x.id===id),t=p.team===1?2:1;if(S.room.players.filter(x=>x.team===t).length>=2)return toast('Team '+t+' sudah penuh');p.team=t;renderPlayers();renderBottom()}
/* ---------- READY / START (START hanya host) ---------- */
function check(){const P=S.room.players,h=me();
 if(!h)return{ok:false,msg:ONLINE?'Menghubungkan ke room...':'Menyiapkan pemain'};
 if(ONLINE){if(TEAM){if(P.length<4)return{ok:false,msg:`Butuh ${4-P.length} pemain lagi untuk 2 vs 2`};if(P.filter(p=>p.team===1).length!==2)return{ok:false,msg:'Atur tim menjadi 2 vs 2'}}else if(P.length<2)return{ok:false,msg:'Butuh minimal 2 pemain'}}
 if(!h.ready)return{ok:false,msg:'Tekan READY untuk bersiap'};
 const n=P.filter(p=>!p.ready).length;if(n)return{ok:false,msg:`Menunggu ${n} pemain Ready`};
 return{ok:true,msg:HOST?'Semua siap — tekan START GAME!':'Menunggu host memulai'}}
function renderBottom(){const c=check(),h=me()||{ready:false};$('#sttx').textContent=(c.ok?'✅ ':'⏳ ')+c.msg+(ONLINE&&pending()?` • ${pending()} undangan menunggu`:'');
 const rb=$('#rdy');rb.textContent=h.ready?'✕ BATAL READY':'✓ READY';rb.classList.toggle('wait',h.ready);
 const locked=ONLINE&&S.room.status!=='waiting';$('#rdy').hidden=HOST||locked;$('#start').hidden=!HOST||locked;$('#start').disabled=!c.ok;
 if(!HOST&&S.hostT){clearTimeout(S.hostT);S.hostT=null}}
$('#rdy').onclick=async()=>{const h=me();if(!h)return;if(ONLINE){try{const row=await UT.Multiplayer.RoomService.setReady(S.mpRoomId,!h.ready);applyRemoteRoom(row)}catch(e){toast('Gagal mengubah status Ready')}}else{h.ready=!h.ready;renderPlayers();renderBottom()}};
function cfg(){const online=ONLINE,sk=online?null:eqItem('skin'),fr=online?null:eqItem('frame'),di=online?null:eqItem('dice');
 return{type:'room',mode:MODE,format:FORMAT,privacy:S.room.privacy,host:HOST,code:S.room.code,map:MAP&&MAP.gameKey,
  players:S.room.players.map(p=>({id:p.id,name:p.name,team:p.team,kind:p.kind})),powers:PW.equipped.slice(),
  skin:online?'steve':(sk&&sk.gameKey),frame:online?null:(fr&&fr.gameKey),dice:online?'klasik':(di&&di.gameKey)}}
function launch(){clearT();RF.launch(cfg())}
async function startGame(){if(!HOST||!check().ok)return;if(!ONLINE){launch();return}try{const row=await UT.Multiplayer.RoomService.startRoom(S.mpRoomId,{roomConfig:cfg()});applyRemoteRoom(row)}catch(e){toast('Tidak dapat memulai game: '+(e.message||'Periksa status pemain'))}}
$('#start').onclick=startGame;
/* Online room membership/readiness comes from Supabase; no demo guest simulation. */
/* ---------- INVITE (hanya Create Room, host) ---------- */
function openInvite(team){if(!ONLINE||!HOST)return;S.invTeam=team||0;S.invTab='online';$('#srch').value='';renderInvite();$('#inv').classList.add('show')}
const closeInvite=()=>$('#inv').classList.remove('show');
$('#invB').onclick=()=>openInvite(0);$('#invX').onclick=closeInvite;$('#inv').onclick=e=>{if(e.target.id==='inv')closeInvite()};
$('#tOn').onclick=()=>{S.invTab='online';renderInvite()};$('#tOff').onclick=()=>{S.invTab='offline';renderInvite()};$('#srch').oninput=renderInvite;
function renderInvite(){
 const r=S.room;
 $('#sPriv').classList.toggle('on',r.privacy==='private');$('#sPub').classList.toggle('on',r.privacy==='public');
 $('#slotInfo').textContent=r.players.length+'/'+COUNT+' pemain';
 $('#fl').innerHTML='<div class="emp">Bagikan kode atau tautan undangan kepada pemain lain. '+(r.privacy==='public'?'Room ini juga tersedia melalui Quick Join.':'Room privat hanya dapat dimasuki menggunakan kode undangan.')+'</div>';
}
$('#fl').onclick=e=>{const i=e.target.closest('[data-i]'),c=e.target.closest('[data-c]');if(i)invite(i.dataset.i);else if(c)cancelInv(c.dataset.c)};
/* SIMULASI undangan: ganti dengan server (kirim invite, terima respons, sinkron slot/tim) */
function invite(id){const f=FRIENDS.find(x=>x.id===id),r=S.room;if(!HOST||!f.online||S.invites[id]||r.players.some(p=>p.fid===id)||slotsLeft()<=0)return;
 const team=S.invTeam||0;S.invites[id]={team,timer:setTimeout(()=>{delete S.invites[id];accept(f,team)},rand(1800,4000))};renderPlayers();renderBottom();toast('Undangan dikirim ke '+f.name)}
function cancelInv(id){const v=S.invites[id];if(!v)return;clearTimeout(v.timer);delete S.invites[id];renderPlayers();renderBottom()}
function accept(f,pref){const r=S.room;if(r.players.length>=COUNT)return;let team=0;
 if(TEAM){const c=t=>r.players.filter(p=>p.team===t).length;team=[pref,1,2].find(t=>t&&c(t)<2)||1}
 const p={id:'f_'+f.id,fid:f.id,name:f.name,level:f.level,ready:false,team,kind:'friend'};r.players.push(p);toast(f.name+' bergabung');
 S.timers.push(setTimeout(()=>{if(r.players.includes(p)){p.ready=true;renderPlayers();renderBottom()}},rand(2000,4000)));renderPlayers();renderBottom()}
addEventListener('keydown',e=>{if(e.key==='Escape'){closeInvite();closeChoice()}});
addEventListener('pagehide',clearT);
/* ---------- init ---------- */
setup();renderEq();renderPower();renderMap();renderPlayers();renderBottom();
if(ONLINE){addEventListener('ut:multiplayer-ready',()=>setupOnline(),{once:true});if(UT.Multiplayer&&UT.Multiplayer.RoomService)setupOnline();}
document.documentElement.classList.add('ut-ready');
})();
</script>
<script type="module">
import './assets/js/multiplayer/room-service.js';
window.dispatchEvent(new Event('ut:multiplayer-ready'));
</script>
</body></html>
