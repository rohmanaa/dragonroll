<script>
(()=>{

/* ---------- URL -> konfigurasi room (URL tidak valid -> Mode Selection) ---------- */

const MAP=RF.getMap(),TILES=100;
const MODE_LABEL={vsc:'VS Computer',local:'Multi Player',online:TEAM?'Create Room • Team':'Create Room • Solo'};
const cap=()=>ONLINE?((S.room&&S.room.max)||(TEAM?4:2)):COUNT;
const myName=()=>PD.profile().name||'Kamu',myLevel=()=>PD.levelInfo().level; /* satu rumus dengan profil (PlayerData.levelInfo) */
const eqItem=slot=>IC.byId(PD.equippedId(slot));
const S={invTab:'online',timers:[],room:{privacy:'private',code:'',players:[]},hostT:null,mpIdentity:null,mpRoomId:null,drTab:'friends',sent:{},friends:[],reqSent:{},mpUnsub:null,gameLaunched:false};
const art=it=>it.kind==='skin'?ItemArt.character(it.id):it.kind==='frame'?`<img src="${it.image}" alt="" draggable="false">`:ItemArt.dice(it.id);

/* ---------- setup room ---------- */
function setup(){
 if(ONLINE){renderRoomHeader();return;}
 const P=[{id:'me',name:myName(),level:myLevel(),ready:true,team:0,kind:'host'}];
 if(MODE==='vsc')for(let i=1;i<COUNT;i++)P.push({id:'b'+i,name:'Bot '+i,level:rand(4,20),ready:true,team:0,kind:'bot'});

function randomRoomCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',bytes=new Uint8Array(6);crypto.getRandomValues(bytes);return Array.from(bytes,b=>chars[b%chars.length]).join('')}

function applyRemoteRoom(row){
 if(!row)return;S.mpRoomId=row.id;HOST=!!(S.mpIdentity&&row.host_id===S.mpIdentity.id);
 S.room={id:row.id,max:Number(row.max_players)||0,status:row.status,privacy:row.is_public?'public':'private',code:row.code,players:(row.players||[]).map(p=>({id:p.id,name:p.name,level:1,ready:!!p.ready,team:Number(p.team)||0,kind:p.id===row.host_id?'host':'player'}))};
 renderRoomHeader();$('#cCode').textContent='KODE '+row.code;
 $('#rdy').hidden=HOST||row.status!=='waiting';$('#start').hidden=!HOST||row.status!=='waiting';
 $('#sPriv').classList.toggle('on',!row.is_public);$('#sPub').classList.toggle('on',!!row.is_public);
 renderPlayers();renderBottom();
 if(row.status==='playing'&&row.game_state&&row.game_state.roomConfig&&!S.gameLaunched&&!(sessionStorage.getItem('ut-mp-exited')===String(row.id))){S.gameLaunched=true;const gameCfg=Object.assign({},row.game_state.roomConfig,{host:HOST,code:row.code,roomId:row.id,roomRevision:row.revision,initialSnapshot:row.game_state.snapshot||null});RF.launch(gameCfg)}
}
async function setupOnline(){
 try{
  const MP=UT.Multiplayer.RoomService;if(!MP)throw new Error('Modul multiplayer belum siap');
  S.mpIdentity=await MP.ensurePlayer();loadFriends();let row;
  if(HOST){
   let saved=null;try{saved=JSON.parse(sessionStorage.getItem('ut-multiplayer-room')||'null')}catch(_){}
   if(saved&&saved.id){try{row=await MP.getRoom(saved.id);if(!row||row.status!=='waiting'||row.host_id!==S.mpIdentity.id)row=null}catch(_){row=null} }
   if(!row)row=await MP.createRoom({code:randomRoomCode(),name:S.mpIdentity.name,isPublic:false,format:FORMAT,maxPlayers:TEAM?4:2,config:{mode:MODE,format:FORMAT,map:MAP&&MAP.gameKey}});
  }else{if(!JOIN)throw new Error('Kode room tidak valid atau tidak tersedia');row=await MP.joinRoom({code:JOIN,name:S.mpIdentity.name})}
  try{sessionStorage.setItem('ut-multiplayer-room',JSON.stringify({id:row.id,code:row.code}))}catch(_){}
  applyRemoteRoom(row);S.mpUnsub=MP.subscribe(row.id,applyRemoteRoom);
  try{const PR=UT.Multiplayer.Presence;if(PR){const INV=HOST?q.get('invite'):null;PR.start({status:'room'}).then(()=>{if(INV&&/^[0-9a-f-]{36}$/i.test(INV)&&row.code)return PR.invite(INV,{code:row.code,format:FORMAT}).then(()=>toast('Undangan terkirim'))}).catch(()=>{});PR.onChange(()=>{if(root.classList.contains('dro'))renderDrawer()})}}catch(_){}
 }catch(e){console.error('[multiplayer] room setup failed',e);toast('Gagal masuk room: '+(e.message||'Periksa koneksi'));$('#sttx').textContent='Tidak dapat terhubung ke room. Kembali dan coba lagi.';$('#rdy').disabled=true;$('#start').disabled=true}
}
/* ---------- EQUIPMENT (Dice / Skin / Frame milik pemain; CHANGE -> daftar item yang dimiliki) ---------- */
const EQ=[['dice','DICE','DADU'],['skin','SKIN','SKIN'],['frame','FRAME','FRAME'],['effect','EFEK','EFEK']];

const EFFECT_ICON='assets/Images/icon/items/efek.webp';
function renderEq(){

 $('#eq').innerHTML=EQ.map(([k,l])=>{const it=k==='effect'?null:eqItem(k);const ar=k==='effect'?`<img src="${EFFECT_ICON}" alt="" draggable="false">`:(it?art(it):'');return `<div class="eqi" data-k="${k}" role="button" aria-label="Ganti ${l}"><span class="art">${ar}</span><b>${l}</b><small>${k==='effect'?'Segera':(it?esc(it.name.replace(/^(Frame|Dadu) /,'')):'-')}</small><button class="chg gold" data-k="${k}">CHANGE</button></div>`}).join('');
}
$('#eq').onclick=e=>{const b=e.target.closest('[data-k]');if(b)openChoice(b.dataset.k)};

 $('#cmT').textContent='🎒 PILIH '+EQ.find(x=>x[0]===CK)[2];
 $('#cmL').innerHTML=own.map(it=>`<div class="co"><span class="cp">${art(it)}</span><div class="pi"><b>${esc(it.name)}</b><small>${esc(it.desc||'')}</small></div><button class="bt ${cur===it.id?'sent':''}" data-id="${it.id}" ${cur===it.id?'disabled':''}>${cur===it.id?'✓ DIPAKAI':'PAKAI'}</button></div>`).join('')||'<div class="emp">Belum ada item.</div>';
}
$('#cmL').onclick=e=>{const b=e.target.closest('[data-id]');if(!b||b.disabled)return;const r=PD.equip(b.dataset.id);if(!r.ok)return toast('Tidak bisa dipakai');renderEq();closeChoice();toast(IC.byId(b.dataset.id).name+' dipakai')};
$('#cmX').onclick=closeChoice;$('#cm').onclick=e=>{if(e.target.id==='cm')closeChoice()};
/* ---------- POWER LOADOUT (koleksi permanen, pilih maks. 5 jenis) ---------- */
const POWERS=IC.items.filter(i=>i.kind==='powerup'),PK='ut-room-powers:v1';
function loadP(){try{const d=JSON.parse(localStorage.getItem(PK)||'{}');return{equipped:(d.equipped||[]).filter(id=>POWERS.some(p=>p.id===id)).slice(0,5)}}catch(e){return{equipped:[]}}}
const PW=loadP();const saveP=()=>{try{localStorage.setItem(PK,JSON.stringify(PW))}catch(e){}};
function renderPower(){
 $('#pcnt').textContent=PW.equipped.length+' / 5 DIPILIH';$('#psc').style.setProperty('--pn',POWERS.length);
 $('#psc').innerHTML=POWERS.map(p=>{const on=PW.equipped.includes(p.id);return `<div class="pc ${on?'sel':''}" data-id="${p.id}" role="checkbox" aria-checked="${on}" aria-label="${esc(p.name)}" title="${esc(p.name+' — '+p.desc+((UT.PowerFX&&UT.PowerFX.DATA[p.gameKey])?' Efek: '+UT.PowerFX.DATA[p.gameKey].note+'.':''))}"><span class="ck">✓</span><img src="${p.icon}" alt="" draggable="false"><div class="pwn">${esc(p.name)}</div></div>`}).join('');

$('#psc').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const id=b.dataset.id;
 if(PW.equipped.includes(id))PW.equipped=PW.equipped.filter(x=>x!==id);
 else{if(PW.equipped.length>=5)return toast('Maksimal 5 jenis Power untuk satu pertandingan');PW.equipped.push(id);try{const pi=POWERS.find(x=>x.id===id);if(pi&&window.UT&&UT.PowerFX)UT.PowerFX.playAtElement(pi.gameKey,b)}catch(er){}}
 saveP();renderPower()};
/* ---------- MAP INFORMATION ---------- */
/* banner gambar map (gameplay/maps/banner-maps) memakai gameKey; map tanpa banner tetap pakai SVG ItemArt */
const BANNER={minecraft:'gameplay/maps/banner-maps/world.webp',nether:'gameplay/maps/banner-maps/nether.webp'};
function renderMap(){
 $('#mArt').innerHTML=MAP?(BANNER[MAP.gameKey]?`<img src="${BANNER[MAP.gameKey]}" alt="" draggable="false">`:ItemArt.theme(MAP.id)):'';
 $('#mTxt').innerHTML=`Game Mode: ${MODE_LABEL[MODE]}<br>Map: ${MAP?esc(MAP.name.replace(/^Map /,'')):'-'}<br>Number of Tiles: ${TILES}`;
}
/* ---------- PLAYER ROOM ---------- */
const me=()=>S.room.players.find(p=>p.id===(S.mpIdentity&&S.mpIdentity.id||'me'));
function avatar(p){return p.kind==='bot'?'<span class="av"><img src="assets/Images/icon/mode/robot.webp" alt="" draggable="false"></span>':`<span class="av">${esc(p.name[0]||'?').toUpperCase()}</span>`}
const CROWN='<svg viewBox="0 0 24 24" aria-label="Host"><path d="M3 18.5h18l1-11.5-5.2 4.2L12 4 7.2 11.2 2 7z" fill="#ffe14d" stroke="#7a4a00" stroke-width="1.4" stroke-linejoin="round"/><rect x="3" y="18.5" width="18" height="2.6" rx="1" fill="#f0a010" stroke="#7a4a00" stroke-width="1.2"/></svg>';
function prow(p,i){const meId=S.mpIdentity&&S.mpIdentity.id||'me',isMe=p.id===meId,isHost=p.kind==='host',
 col=TEAM?(p.team===2?'c0':'c1'):'c'+((i||0)%4),blk=isHost?CROWN:(p.ready?'Ready':'Waiting'),
 fr=new Set((S.friends||[]).map(f=>f.friend_id)),showAdd=ONLINE&&!isMe&&p.kind!=='bot'&&!fr.has(p.id),sent=!!S.reqSent[p.id],
 kind={host:'Host',friend:'Teman',bot:'Computer',local:'Lokal'}[p.kind],
 sub=ONLINE?'':`<small>Lv ${p.level} • ${kind}</small>`,
 mv=(TEAM&&HOST&&!ONLINE)?`<button class="mv" data-mv="${p.id}" aria-label="Pindah tim">⇄</button>`:'',
 add=showAdd?`<button class="af ${sent?'sent':''}" data-af="${esc(p.id)}" data-nm="${esc(p.name)}" ${sent?'disabled':''} aria-label="Add Friend"><b>${sent?'✓':'＋'}</b><span>${sent?'Terkirim':'Add Friend'}</span></button>`:'';
 return `<div class="plr ${col} ${isMe?'me':''}"><span class="blk">${blk}</span>${avatar(p)}<div class="pi"><b>${esc(p.name)}</b>${sub}</div>${mv}${add}</div>`}
function srow(team){if(!ONLINE)return'';const c=TEAM?'t'+team:'';
 if(!HOST)return `<div class="slot op static ${c}"><i class="mk"></i><span class="em">Slot kosong</span></div>`;
 return `<div class="slot op ${c}"><i class="mk"></i><button class="ub" data-share="1">＋ Undang Teman</button></div>`}
/* slot terkunci: online -> sentuh untuk membuka (host); offline -> hanya penanda terkunci */
function lrow(){if(ONLINE)return `<button class="slot lk tap" data-open="1" aria-label="Sentuh untuk membuka"><i class="mk"></i><img src="assets/Images/icon/ui/lock.webp" alt="" draggable="false"><span>Sentuh untuk Membuka</span></button>`;
 return `<div class="slot lk" aria-label="Slot terkunci"><img src="assets/Images/icon/ui/lock.webp" alt="" draggable="false"><span>Terkunci</span></div>`}
function renderPlayers(){
 const r=S.room,P=r.players;$('#cnt').textContent=P.length+'/'+cap();
 let h='';
 if(TEAM)[1,2].forEach(t=>{const tp=P.filter(p=>p.team===t);h+=`<div class="th t${t}"><span>TEAM ${t}</span><span>${tp.length}/2</span></div>`+tp.map(prow).join('');for(let i=tp.length;i<2;i++)h+=srow(t)});

}
$('#plrs').onclick=e=>{const m=e.target.closest('[data-mv]'),s=e.target.closest('[data-share]'),o=e.target.closest('[data-open]'),af=e.target.closest('[data-af]');if(m)moveTeam(m.dataset.mv);else if(s)openDrawer('friends');else if(o)openSlot();else if(af)addFriendReq(af)};
async function addFriendReq(b){const id=b.dataset.af,nm=b.dataset.nm;if(S.reqSent[id])return;
 try{const res=await UT.Multiplayer.RoomService.sendFriendRequest({id:id,name:nm,myName:S.mpIdentity.name});S.reqSent[id]=true;toast(res==='accepted'?'Kalian sekarang berteman':'Permintaan teman dikirim ke '+nm);if(res==='accepted')loadFriends();else renderPlayers()}

 try{navigator.clipboard.writeText(v).then(()=>toast(t==='code'?'Kode disalin':'Link disalin'),()=>toast('Kode: '+S.room.code))}catch(e){toast('Kode: '+S.room.code)}}
$('#cCode').onclick=()=>HOST&&copy('code');$('#cLink').onclick=()=>HOST&&copy('link');
$('#sPriv').onclick=async()=>{if(HOST&&ONLINE){try{applyRemoteRoom(await UT.Multiplayer.RoomService.setVisibility(S.mpRoomId,false));renderInvite()}catch(e){toast('Gagal mengubah akses room')}}};$('#sPub').onclick=async()=>{if(HOST&&ONLINE){try{applyRemoteRoom(await UT.Multiplayer.RoomService.setVisibility(S.mpRoomId,true));renderInvite()}catch(e){toast('Gagal mengubah akses room')}}};
function moveTeam(id){if(!HOST)return;const p=S.room.players.find(x=>x.id===id),t=p.team===1?2:1;if(S.room.players.filter(x=>x.team===t).length>=2)return toast('Team '+t+' sudah penuh');p.team=t;renderPlayers();renderBottom()}
/* ---------- READY / START (START hanya host) ---------- */
function check(){const P=S.room.players,h=me();
 if(!h)return{ok:false,msg:ONLINE?'Menghubungkan ke room...':'Menyiapkan pemain'};
 if(ONLINE&&S.room.status==='finished')return{ok:false,msg:'Permainan di room ini sudah selesai. Kembali dan buat room baru.'};
 if(ONLINE&&S.room.status==='playing')return{ok:false,msg:'Permainan di room ini sedang berlangsung.'};
 if(ONLINE){if(TEAM){if(P.length<4)return{ok:false,msg:`Butuh ${4-P.length} pemain lagi untuk 2 vs 2`};if(P.filter(p=>p.team===1).length!==2)return{ok:false,msg:'Atur tim menjadi 2 vs 2'}}else if(P.length<2)return{ok:false,msg:'Butuh minimal 2 pemain'}}
 if(!h.ready)return{ok:false,msg:'Tekan READY untuk bersiap'};
 const n=P.filter(p=>!p.ready).length;if(n)return{ok:false,msg:`Menunggu ${n} pemain Ready`};
 return{ok:true,msg:HOST?'Semua siap — tekan START GAME!':'Menunggu host memulai'}}
function renderBottom(){const c=check(),h=me()||{ready:false};$('#sttx').textContent=(c.ok?'✅ ':'⏳ ')+c.msg;

 const locked=ONLINE&&S.room.status!=='waiting';$('#rdy').hidden=HOST||locked;$('#start').hidden=!HOST||locked;$('#start').disabled=!c.ok;
 if(!HOST&&S.hostT){clearTimeout(S.hostT);S.hostT=null}}
$('#rdy').onclick=async()=>{const h=me();if(!h)return;if(ONLINE){try{const row=await UT.Multiplayer.RoomService.setReady(S.mpRoomId,!h.ready);applyRemoteRoom(row)}catch(e){toast('Gagal mengubah status Ready')}}else{h.ready=!h.ready;renderPlayers();renderBottom()}};
function cfg(){const online=ONLINE,sk=online?null:eqItem('skin'),fr=online?null:eqItem('frame'),di=online?null:eqItem('dice');

  players:S.room.players.map(p=>({id:p.id,name:p.name,team:p.team,kind:p.kind})),powers:ONLINE?[]:PW.equipped.slice(),
  skin:online?'steve':(sk&&sk.gameKey),frame:online?null:(fr&&fr.gameKey),dice:online?'klasik':(di&&di.gameKey)}}

/* Online room membership/readiness comes from Supabase; no demo guest simulation. */

function renderInvite(){
 const r=S.room;
 $('#sPriv').classList.toggle('on',r.privacy==='private');$('#sPub').classList.toggle('on',r.privacy==='public');
 $('#slotInfo').textContent=r.players.length+'/'+cap()+' pemain';
 $('#fl').innerHTML='<div class="emp">Bagikan kode atau tautan undangan kepada pemain lain. '+(r.privacy==='public'?'Room ini juga tersedia melalui Quick Join.':'Room privat hanya dapat dimasuki menggunakan kode undangan.')+'</div>';
}
/* ---------- DRAWER UNDANG TEMAN (dari kiri; tab Teman & Publik) ---------- */
const root=document.documentElement;
function openDrawer(tab){if(!ONLINE||!HOST)return;S.drTab=tab||'friends';loadFriends();renderDrawer();root.classList.add('dro');$('#dr').setAttribute('aria-hidden','false')}
function closeDrawer(){root.classList.remove('dro');$('#dr').setAttribute('aria-hidden','true')}
function inviteLink(){return `${location.origin}${location.pathname}?mode=online&format=${FORMAT}&count=4&role=guest&code=${S.room.code}`}
const STL={lobby:'Di lobi',room:'Di room',game:'Sedang bermain'};
async function loadFriends(){try{S.friends=await UT.Multiplayer.RoomService.listFriends()}catch(e){S.friends=S.friends||[]}renderPlayers();if(root.classList.contains('dro'))renderDrawer()}
function drow(id,name,status,isFriend,left){const can=status==='lobby'&&left>0,sent=!!S.sent[id];
 return `<div class="fr"><span class="av">${esc(name[0]||'?').toUpperCase()}</span><div class="pi"><b>${esc(name)}</b><small class="${status==='lobby'?'on_':'wt_'}">${STL[status]||''}</small></div>${isFriend?'':`<button class="sm" data-add="${esc(id)}" data-nm="${esc(name)}">＋ TEMAN</button>`}<button class="bt ${sent?'sent':''}" data-pinv="${esc(id)}" ${can?'':'disabled'}>${status!=='lobby'?'SIBUK':sent?'KIRIM LAGI':'UNDANG'}</button></div>`}
function renderDrawer(){
 const r=S.room,left=cap()-r.players.length,P=UT.Multiplayer.Presence,on=P?P.list():[],fr=S.friends||[],fids=new Set(fr.map(f=>f.friend_id));
 $('#drCnt').textContent=r.players.length+'/'+cap()+' pemain';
 $('#dTf').classList.toggle('on',S.drTab==='friends');$('#dTp').classList.toggle('on',S.drTab==='public');
 const full=left<=0?'<div class="emp">Slot penuh. Buka slot terkunci untuk mengundang lebih banyak pemain.</div>':'';
 if(S.drTab==='friends'){
  const list=on.filter(p=>fids.has(p.id));
  $('#drL').innerHTML=(list.map(p=>drow(p.id,(fr.find(f=>f.friend_id===p.id)||{}).friend_name||p.name,p.status,true,left)).join('')||`<div class="emp">${fr.length?'Tidak ada teman yang sedang online.':'Belum ada teman. Tambahkan dari tab Pemain Online.'}</div>`)+full;
 }else{
  $('#drL').innerHTML=(on.map(p=>drow(p.id,p.name,p.status,fids.has(p.id),left)).join('')||'<div class="emp">Belum ada pemain lain yang online.</div>')+full;
 }
}
async function invitePlayer(id){if(!HOST||!S.room.code)return;try{await UT.Multiplayer.Presence.invite(id,{code:S.room.code,format:FORMAT});S.sent[id]=true;toast('Undangan terkirim');renderDrawer()}catch(e){toast(e.message==='TUNGGU_SEBENTAR'?'Tunggu sebentar sebelum mengundang lagi':'Gagal mengirim undangan')}}
$('#dr').onclick=async e=>{const p=e.target.closest('[data-pinv]'),a=e.target.closest('[data-add]');if(p&&!p.disabled)invitePlayer(p.dataset.pinv);else if(a){try{const res=await UT.Multiplayer.RoomService.sendFriendRequest({id:a.dataset.add,name:a.dataset.nm,myName:S.mpIdentity.name});toast(res==='accepted'?'Kalian sekarang berteman':'Permintaan teman dikirim ke '+a.dataset.nm);loadFriends()}catch(er){toast(er.message==='ALREADY_FRIENDS'?'Sudah berteman':'Gagal mengirim permintaan teman')}}};
$('#dTf').onclick=()=>{S.drTab='friends';renderDrawer()};$('#dTp').onclick=()=>{S.drTab='public';renderDrawer()};
$('#invD').onclick=()=>openDrawer('friends');$('#drX').onclick=closeDrawer;$('#drB').onclick=closeDrawer;
addEventListener('keydown',e=>{if(e.key==='Escape'){closeInvite();closeChoice();closeDrawer()}});
addEventListener('pagehide',clearT);
/* ---------- init ---------- */
setup();renderEq();renderPower();renderMap();renderPlayers();renderBottom();
if(ONLINE){addEventListener('ut:multiplayer-ready',()=>setupOnline(),{once:true});if(UT.Multiplayer&&UT.Multiplayer.RoomService)setupOnline();}
document.documentElement.classList.add('ut-ready');
})();
</script>
<script type="module">
import './assets/js/multiplayer/room-service.js';
import './assets/js/multiplayer/presence.js';
window.dispatchEvent(new Event('ut:multiplayer-ready'));
</script>
