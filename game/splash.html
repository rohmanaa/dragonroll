<title>DRAGON ROLL</title><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any">

<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--lime:#7dff2e;--navy:#09152b;--blue:#1763b9}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#1a62b8;color:#fff}


.splash{position:relative;width:100%;height:100%;min-height:560px;overflow:hidden;isolation:isolate;background:none}




.brand{position:absolute;top:5%;left:50%;transform:translateX(-50%);text-align:center;z-index:6;text-shadow:0 4px 12px rgba(5,29,67,.28);white-space:nowrap}
.brand .small{font-size:12px;font-weight:800;letter-spacing:.28em;color:#e5f7ff}
.brand h1{font:400 clamp(32px,4vw,54px)/.9 'Lilita One',sans-serif;margin:9px 0 0;letter-spacing:.03em}
.brand h1 span{color:var(--lime)}

.bottom-ui{position:absolute;z-index:7;left:50%;bottom:5.5%;transform:translateX(-50%);width:min(420px,88vw);text-align:center}
.status{font:400 23px 'Lilita One',sans-serif;letter-spacing:.04em;text-shadow:0 3px 8px rgba(6,36,74,.25);margin-bottom:14px}
.loading-track{height:13px;padding:3px;border-radius:99px;background:rgba(7,35,75,.28);border:1px solid rgba(255,255,255,.5);box-shadow:0 5px 16px rgba(8,37,76,.16);overflow:hidden}
.loading-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#b8ff63,#65ed26);box-shadow:0 0 14px rgba(125,255,46,.7);transition:width .15s linear}
.load-meta{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;font-weight:800;letter-spacing:.12em;color:#eaf7ff;text-shadow:0 2px 5px rgba(6,36,74,.3)}

@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(35deg)}}


@media(max-width:700px){
  .brand{top:7%}
  .bottom-ui{bottom:6%}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0.01ms!important;animation-iteration-count:1!important}}
/* Stage 1.85:1 (Stage 4.1.19): di landscape konten jadi kotak 1.85:1 di tengah; min-height portrait dilepas agar tidak terpotong di HP landscape */
@media (min-aspect-ratio:1/1){
  .splash{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(100vw,185vh);height:min(100vh,54.054vw);min-height:0;background:none;overflow:visible;container-type:size}
  .brand{top:4cqh}
  .brand h1{font-size:clamp(22px,7cqh,54px)}
  .bottom-ui{bottom:3cqh;width:min(420px,60cqw)}
  .status{font-size:18px;margin-bottom:8px}
}
</style>
<style id="progress-pixel">
/* Progres loading: gaya piksel mengikuti redesign-hud/progres.webp (bar hijau bersegmen, outline hitam tebal, teks emas).
   HANYA tampilan; id/markup/JS tidak berubah. Dimuat paling akhir. */
.track,.loading-track{height:30px;padding:4px;border-radius:0;background:#0b140b;border:0;overflow:hidden;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.65),0 -4px 0 0 #000,0 4px 0 0 #000,-4px 0 0 0 #000,4px 0 0 0 #000,0 8px 0 0 #000}
.fill,.loading-fill{border-radius:0;
  background:repeating-linear-gradient(90deg,transparent 0 27px,#0b2a0b 27px 30px),linear-gradient(#86f04f,#38c22d 55%,#239a25);
  box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.22)}
.meta,.load-meta{margin-top:20px;font:400 18px 'Lilita One',sans-serif;letter-spacing:.04em;color:#ffd23e;
  text-shadow:-2px 0 #3a2200,2px 0 #3a2200,0 -2px #3a2200,0 2px #3a2200,-2px -2px #3a2200,2px -2px #3a2200,-2px 2px #3a2200,2px 2px #3a2200,0 4px 0 #3a2200}
.status{text-shadow:-2px 0 #0b1838,2px 0 #0b1838,0 -2px #0b1838,0 2px #0b1838,-2px -2px #0b1838,2px -2px #0b1838,-2px 2px #0b1838,2px 2px #0b1838,0 4px 0 #0b1838}
@media(max-width:700px){.meta,.load-meta{font-size:15px}}
</style>
<style id="hero-dice">
/* Dadu besar berputar di tengah (pengganti pulau melayang). Ukuran lewat --sz; semua bagian dadu mengikuti. */
.hero-dice{--sz:56px;position:relative;width:var(--sz);height:var(--sz);margin:0 auto 26px}
.hero-dice .bob{position:absolute;inset:0;perspective:1000px;animation:diceBob 5s ease-in-out infinite;filter:drop-shadow(0 24px 22px rgba(8,35,74,.28))}
@keyframes diceBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
.hero-dice .dice{position:absolute;inset:0;transform-style:preserve-3d;animation:diceSpin 8s linear infinite}
@keyframes diceSpin{0%{transform:rotateX(-26deg) rotateY(-30deg) rotateZ(0)}100%{transform:rotateX(-26deg) rotateY(330deg) rotateZ(0)}}
.hero-dice .face{position:absolute;inset:0;border:calc(var(--sz)*.06) solid #1b2a3b;border-radius:0;background:#fff;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--sz)*.12);box-shadow:inset 0 calc(var(--sz)*.06) 0 rgba(255,255,255,.28),inset 0 calc(var(--sz)*-.06) 0 rgba(0,0,0,.18);backface-visibility:hidden}
.hero-dice .face i{width:calc(var(--sz)*.17);height:calc(var(--sz)*.17);border-radius:0;background:#1b2a3b;place-self:center}
.hero-dice .face i.o{visibility:hidden}
.hero-dice .f1 i:nth-child(5){background:#1b2a3b}
.hero-dice .f1{transform:translateZ(calc(var(--sz)/2))}
.hero-dice .f6{transform:rotateY(180deg) translateZ(calc(var(--sz)/2))}
.hero-dice .f2{transform:rotateY(90deg) translateZ(calc(var(--sz)/2))}
.hero-dice .f5{transform:rotateY(-90deg) translateZ(calc(var(--sz)/2))}
.hero-dice .f3{transform:rotateX(90deg) translateZ(calc(var(--sz)/2))}
.hero-dice .f4{transform:rotateX(-90deg) translateZ(calc(var(--sz)/2))}
.hero-dice .shadow{position:absolute;left:12%;right:12%;bottom:-14%;height:9%;border-radius:50%;background:rgba(8,35,74,.28);filter:blur(10px);animation:diceShadow 5s ease-in-out infinite}
@keyframes diceShadow{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.86);opacity:.6}}
.hero-dice .spark{position:absolute;color:#edffb0;font-size:calc(var(--sz)*.1);animation:twinkle 2.4s ease-in-out infinite}
.hero-dice .sp1{left:-14%;top:4%}.hero-dice .sp2{right:-16%;top:30%;animation-delay:.8s}
@media (min-aspect-ratio:1/1){.hero-dice{--sz:44px;margin-bottom:20px}}
@media(prefers-reduced-motion:reduce){.hero-dice .dice{animation:none;transform:rotateX(-26deg) rotateY(-30deg)}}
</style>
<style id="progress-small">
/* Bar loading splash diperkecil (tetap di bawah). HANYA tampilan. */
.bottom-ui{width:min(260px,60vw)}
.track,.loading-track{height:18px;padding:3px;box-shadow:inset 0 2px 0 rgba(0,0,0,.65),0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000,0 6px 0 0 #000}
.fill,.loading-fill{background:repeating-linear-gradient(90deg,transparent 0 17px,#0b2a0b 17px 19px),linear-gradient(#86f04f,#38c22d 55%,#239a25)}
.meta,.load-meta{margin-top:14px;font-size:13px}
@media (min-aspect-ratio:1/1){.bottom-ui{width:min(260px,34cqw)}}
</style>
<style id="auth-ui">
/* Gerbang login: tombol LOGIN setelah loading + modal Daftar/Masuk (gaya navy + hijau neon) */
.login-btn{display:none;margin:18px auto 0;min-width:180px;padding:12px 28px;font:400 22px 'Lilita One',sans-serif;letter-spacing:.06em;color:#0b2a0b;background:linear-gradient(#b8ff63,#65ed26 60%,#3fbf1c);border:3px solid #0b1838;border-radius:10px;box-shadow:0 5px 0 #0b1838,inset 0 3px 0 rgba(255,255,255,.45);cursor:pointer}
.login-btn.show{display:block}
body.login-ready .loading-track,body.login-ready .load-meta{display:none} /* loading disembunyikan setelah tombol LOGIN muncul */
.login-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0b1838,inset 0 3px 0 rgba(255,255,255,.45)}
.auth-ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(9,21,43,.72);backdrop-filter:blur(4px);padding:16px}
.auth-ov.show{display:flex}
.auth-card{width:min(380px,100%);max-height:100%;overflow:auto;background:#0f1f3d;border:3px solid #7dff2e;border-radius:16px;box-shadow:0 8px 0 #050c1c,0 0 30px rgba(125,255,46,.25);padding:20px 20px 18px;color:#fff}
.auth-card h2{margin:0 0 4px;font:400 28px 'Lilita One',sans-serif;letter-spacing:.04em;text-align:center}
.auth-card h2 span{color:#7dff2e}
.auth-sub{margin:0 0 14px;text-align:center;font-size:12px;font-weight:600;color:#9fb6d9}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.auth-tab{padding:9px 0;font:400 16px 'Lilita One',sans-serif;letter-spacing:.05em;color:#9fb6d9;background:#16294f;border:2px solid #223a6b;border-radius:8px;cursor:pointer}
.auth-tab[aria-selected=true]{color:#0b2a0b;background:#7dff2e;border-color:#7dff2e}
.auth-card label{display:block;margin:10px 0 4px;font-size:12px;font-weight:800;letter-spacing:.08em;color:#cfe0ff}
.auth-card input{width:100%;padding:11px 12px;font:700 16px 'Plus Jakarta Sans',sans-serif;color:#fff;background:#09152b;border:2px solid #29437a;border-radius:8px;outline:none}
.auth-card input:focus{border-color:#7dff2e}
.auth-hint{margin-top:4px;font-size:11px;font-weight:600;color:#7f96bd}
.auth-err{min-height:18px;margin:10px 0 0;font-size:13px;font-weight:700;color:#ff8a8a;text-align:center}
.auth-go{width:100%;margin-top:10px;padding:12px;font:400 20px 'Lilita One',sans-serif;letter-spacing:.06em;color:#0b2a0b;background:linear-gradient(#b8ff63,#65ed26 60%,#3fbf1c);border:3px solid #050c1c;border-radius:10px;box-shadow:0 4px 0 #050c1c;cursor:pointer}
.auth-go:disabled{opacity:.6;cursor:wait}
.auth-sw{margin:12px 0 0;text-align:center;font-size:12px;font-weight:600;color:#9fb6d9}
.auth-sw button{background:none;border:0;padding:0;font:800 12px 'Plus Jakarta Sans',sans-serif;color:#7dff2e;text-decoration:underline;cursor:pointer}
</style>

<body>

<main class="splash" aria-label="Layar memuat DRAGON ROLL">
  <section class="bottom-ui">
    <!-- dadu berputar kecil di atas bar -->
    <div class="hero-dice" aria-hidden="true">
      <span class="spark sp1">✦</span><span class="spark sp2">✧</span>
      <div class="bob"><div class="dice"><div class="face f1"><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i></div><div class="face f2"><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i></div><div class="face f3"><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i></div><div class="face f4"><i></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i></i></div><div class="face f5"><i></i><i class="o"></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i></div><div class="face f6"><i></i><i class="o"></i><i></i><i></i><i class="o"></i><i></i><i></i><i class="o"></i><i></i></div></div><div class="shadow"></div></div>
    </div>

    <div class="loading-track"><div class="loading-fill" id="fill"></div></div>
    <div class="load-meta"><span id="label">MENYIAPKAN DUNIA</span><span id="percent">0%</span></div>
    <button type="button" class="login-btn" id="loginBtn">LOGIN</button>
  </section>
</main>


<div class="auth-ov" id="authOv" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <form class="auth-card" id="authForm" autocomplete="on" novalidate>
    <h2 id="authTitle">DRAGON <span>ROLL</span></h2>
    <p class="auth-sub" id="authSub">Buat akun untuk mulai bermain</p>
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab" id="tabReg" role="tab" aria-selected="true">DAFTAR</button>
      <button type="button" class="auth-tab" id="tabLog" role="tab" aria-selected="false">MASUK</button>
    </div>
    <label for="auUser">USERNAME</label>
    <input id="auUser" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="16" placeholder="contoh: oman_bogel">
    <div class="auth-hint" id="auUserHint">3-16 karakter: huruf, angka, underscore</div>
    <label for="auPass">PASSWORD</label>
    <input id="auPass" name="password" type="password" autocomplete="new-password" placeholder="minimal 6 karakter">
    <div class="auth-err" id="authErr" role="alert"></div>
    <button type="submit" class="auth-go" id="authGo">DAFTAR</button>
    <p class="auth-sw" id="authSw">Sudah punya akun? <button type="button" id="swBtn">Masuk</button></p>
  </form>
</div>
<script>
/* Gerbang login (dipanggil setelah loading selesai) */
window.UT_afterLoad = function (go) {
  const lab = document.getElementById('label'), btn = document.getElementById('loginBtn');
  const ready = new Promise(res => { if (window.UT && UT.Auth) return res(true); addEventListener('ut:auth-module-ready', () => res(true), { once: true }); setTimeout(() => res(false), 8000); });
  lab.textContent = 'MEMERIKSA AKUN';
  ready.then(ok => ok ? UT.Auth.check() : null).then(user => {
    if (user) { lab.textContent = 'HALO, ' + String(user.username).toUpperCase(); go(); return; }
    lab.textContent = 'SIAP!'; document.body.classList.add('login-ready'); btn.classList.add('show'); btn.focus();
    btn.onclick = () => openAuth(go);
  });
};
function openAuth(go) {
  const $ = id => document.getElementById(id), ov = $('authOv'), f = $('authForm'), err = $('authErr'), goB = $('authGo');
  let mode = 'reg';
  function setMode(m) {
    mode = m; err.textContent = '';
    $('tabReg').setAttribute('aria-selected', String(m === 'reg')); $('tabLog').setAttribute('aria-selected', String(m === 'log'));
    $('authSub').textContent = m === 'reg' ? 'Buat akun untuk mulai bermain' : 'Masuk dengan akun kamu';
    goB.textContent = m === 'reg' ? 'DAFTAR' : 'MASUK';
    $('auPass').autocomplete = m === 'reg' ? 'new-password' : 'current-password';
    $('auUserHint').style.display = m === 'reg' ? '' : 'none';
    $('authSw').innerHTML = m === 'reg' ? 'Sudah punya akun? <button type="button" id="swBtn">Masuk</button>' : 'Belum punya akun? <button type="button" id="swBtn">Daftar</button>';
    $('swBtn').onclick = () => setMode(m === 'reg' ? 'log' : 'reg');
  }
  $('tabReg').onclick = () => setMode('reg'); $('tabLog').onclick = () => setMode('log');
  setMode('reg'); ov.classList.add('show'); setTimeout(() => $('auUser').focus(), 50);
  f.onsubmit = async e => {
    e.preventDefault(); err.textContent = ''; goB.disabled = true; const t = goB.textContent; goB.textContent = 'TUNGGU...';
    try {
      if (!(window.UT && UT.Auth)) throw new Error('Modul akun belum siap. Muat ulang halaman.');
      const u = $('auUser').value, p = $('auPass').value;
      const user = mode === 'reg' ? await UT.Auth.signUp(u, p) : await UT.Auth.signIn(u, p);
      ov.classList.remove('show'); document.getElementById('label').textContent = 'HALO, ' + String(user.username).toUpperCase(); go();
    } catch (e2) { err.textContent = e2.message || 'Gagal. Coba lagi.'; goB.disabled = false; goB.textContent = t; }
  };
}
</script>
<script src="assets/js/preloader.js"></script>
<script src="assets/js/item-catalog.js"></script>

<script>
(() => {
  /* ---------- preload data & aset, lalu masuk ke lobby ---------- */
  const out = document.getElementById('percent'), fill = document.getElementById('fill'), lab = document.getElementById('label');
  const LABELS = { kode: 'MEMUAT GAME', gambar: 'MEMUAT GAMBAR', audio: 'MEMUAT MUSIK & SUARA', data: 'MENYIAPKAN DUNIA' };
  const ASSETS=[
    'assets/css/base.css','assets/css/shared-ui.css','assets/css/scene-bg.css','assets/js/scene-bg.js','assets/js/floating-island.js','assets/js/character-data.js','assets/js/character-view.js','assets/js/mob-view.js','assets/Images/background/bg.webp','assets/js/landscape.js','assets/js/boot-guard.js','assets/js/item-catalog.js','assets/js/item-art.js','assets/js/player-data.js','assets/js/app.js','assets/js/game-integration.js','hud/ui-core.js','hud/components/button.css','hud/components/button.js',
    'assets/sfx/ui/button-click.mp3','assets/sfx/ui/chest-reward.mp3','assets/sfx/ui/game-lose.mp3','assets/sfx/ui/power-claim.mp3',
    'data/dice/8301a59a-c606-46bb-bf0c-50203a8a407d.webp',
    'shop.html','inventory.html','profile.html','promosi/placeholder.webp','data/power/sm/pedang.webp','data/power/sm/feather.webp','data/power/sm/dinamit.webp','data/power/sm/totem.webp','data/power/sm/ramuan-merah.webp','data/power/sm/ramuan-biru.webp','data/power/sm/block.webp',
    'assets/js/vendor/three.min.js',
    'https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap'
  ];
  /* tujuan: halaman yang sedang dibuka (guard) atau lobby; hanya file .html lokal yang diizinkan */
  const nx = new URLSearchParams(location.search).get('next') || 'lobby.html';
  const dest = /^[a-z0-9_-]+\.html(\?[^#]*)?$/i.test(nx) && !/^(splash|loading)\.html/i.test(nx) ? nx : 'lobby.html';
  ASSETS.unshift(dest.split('?')[0]);
  try { window.PlayerData && PlayerData.snapshot(); } catch (e) {} /* jalankan migrasi/muat state sekali sebelum halaman tampil */
  UT_Preload.runAuto(ASSETS, (p, kind) => { out.textContent = p + '%'; fill.style.width = p + '%'; if (p < 100 && lab && LABELS[kind]) lab.textContent = LABELS[kind]; else if (lab && p >= 100) lab.textContent = 'SIAP!'; }).then(() => {
    const go = () => { try { sessionStorage.setItem('ut:booted', '1'); } catch (e) {} setTimeout(() => location.replace(dest), 350); };
    window.UT_afterLoad(go); /* cek login dulu; belum login -> tombol LOGIN + modal */
  });
})();
</script>
<script type="module" src="assets/js/auth.js"></script>
