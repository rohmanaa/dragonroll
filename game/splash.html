<style>
:root{--lime:#7dff2e;--navy:#09152b;--blue:#1763b9}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#1a62b8;color:#fff}


.splash{position:relative;width:100%;height:100%;min-height:560px;overflow:hidden;isolation:isolate;background:none}




.brand{position:absolute;top:5%;left:50%;transform:translateX(-50%);text-align:center;z-index:6;text-shadow:0 4px 12px rgba(5,29,67,.28);white-space:nowrap}
.brand .small{font-size:12px;font-weight:800;letter-spacing:.28em;color:#e5f7ff}
.brand h1{font:400 clamp(32px,4vw,54px)/.9 'Lilita One',sans-serif;margin:9px 0 0;letter-spacing:.03em}
.brand h1 span{color:var(--lime)}

.bottom-ui{position:absolute;z-index:7;left:50%;bottom:5.5%;transform:translateX(-50%);width:min(420px,88vw);text-align:center}
.status{font:400 23px 'Lilita One',sans-serif;letter-spacing:.04em;text-shadow:0 3px 8px rgba(6,36,74,.25);margin-bottom:14px}
.loading-track{height:13px;padding:3px;border-radius:99px;background:rgba(7,35,75,.28);border:1px solid rgba(255,255,255,.5);box-shadow:0 5px 16px rgba(8,37,76,.16);overflow:hidden}
.loading-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#b8ff63,#65ed26);box-shadow:0 0 14px rgba(125,255,46,.7);transition:width .15s linear}
.load-meta{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;font-weight:800;letter-spacing:.12em;color:#eaf7ff;text-shadow:0 2px 5px rgba(6,36,74,.3)}

@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(35deg)}}


@media(max-width:700px){
  .brand{top:7%}
  .bottom-ui{bottom:6%}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0.01ms!important;animation-iteration-count:1!important}}
/* Stage 1.85:1 (Stage 4.1.19): di landscape konten jadi kotak 1.85:1 di tengah; min-height portrait dilepas agar tidak terpotong di HP landscape */
@media (min-aspect-ratio:1/1){
  .splash{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(100vw,185vh);height:min(100vh,54.054vw);min-height:0;background:none;overflow:visible;container-type:size}
  .brand{top:4cqh}
  .brand h1{font-size:clamp(22px,7cqh,54px)}
  .bottom-ui{bottom:3cqh;width:min(420px,60cqw)}
  .status{font-size:18px;margin-bottom:8px}
}

  text-shadow:-2px 0 #3a2200,2px 0 #3a2200,0 -2px #3a2200,0 2px #3a2200,-2px -2px #3a2200,2px -2px #3a2200,-2px 2px #3a2200,2px 2px #3a2200,0 4px 0 #3a2200}
.status{text-shadow:-2px 0 #0b1838,2px 0 #0b1838,0 -2px #0b1838,0 2px #0b1838,-2px -2px #0b1838,2px -2px #0b1838,-2px 2px #0b1838,2px 2px #0b1838,0 4px 0 #0b1838}

<style id="hero-dice">
/* Dadu besar berputar di tengah (pengganti pulau melayang). Ukuran lewat --sz; semua bagian dadu mengikuti. */
.hero-dice{--sz:56px;position:relative;width:var(--sz);height:var(--sz);margin:0 auto 26px}
.hero-dice .bob{position:absolute;inset:0;perspective:1000px;animation:diceBob 5s ease-in-out infinite;filter:drop-shadow(0 24px 22px rgba(8,35,74,.28))}
@keyframes diceBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
.hero-dice .dice{position:absolute;inset:0;transform-style:preserve-3d;animation:diceSpin 8s linear infinite}
@keyframes diceSpin{0%{transform:rotateX(-26deg) rotateY(-30deg) rotateZ(0)}100%{transform:rotateX(-26deg) rotateY(330deg) rotateZ(0)}}
.hero-dice .face{position:absolute;inset:0;border:calc(var(--sz)*.06) solid #1b2a3b;border-radius:0;background:#fff;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--sz)*.12);box-shadow:inset 0 calc(var(--sz)*.06) 0 rgba(255,255,255,.28),inset 0 calc(var(--sz)*-.06) 0 rgba(0,0,0,.18);backface-visibility:hidden}
.hero-dice .face i{width:calc(var(--sz)*.17);height:calc(var(--sz)*.17);border-radius:0;background:#1b2a3b;place-self:center}
.hero-dice .face i.o{visibility:hidden}
.hero-dice .f1 i:nth-child(5){background:#1b2a3b}
.hero-dice .f1{transform:translateZ(calc(var(--sz)/2))}
.hero-dice .f6{transform:rotateY(180deg) translateZ(calc(var(--sz)/2))}
.hero-dice .f2{transform:rotateY(90deg) translateZ(calc(var(--sz)/2))}
.hero-dice .f5{transform:rotateY(-90deg) translateZ(calc(var(--sz)/2))}
.hero-dice .f3{transform:rotateX(90deg) translateZ(calc(var(--sz)/2))}
.hero-dice .f4{transform:rotateX(-90deg) translateZ(calc(var(--sz)/2))}
.hero-dice .shadow{position:absolute;left:12%;right:12%;bottom:-14%;height:9%;border-radius:50%;background:rgba(8,35,74,.28);filter:blur(10px);animation:diceShadow 5s ease-in-out infinite}
@keyframes diceShadow{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.86);opacity:.6}}
.hero-dice .spark{position:absolute;color:#edffb0;font-size:calc(var(--sz)*.1);animation:twinkle 2.4s ease-in-out infinite}
.hero-dice .sp1{left:-14%;top:4%}.hero-dice .sp2{right:-16%;top:30%;animation-delay:.8s}
@media (min-aspect-ratio:1/1){.hero-dice{--sz:44px;margin-bottom:20px}}
@media(prefers-reduced-motion:reduce){.hero-dice .dice{animation:none;transform:rotateX(-26deg) rotateY(-30deg)}}
</style>

<div class="intro" id="intro" aria-hidden="true"><img src="assets/Images/logo/dragon-roll-logo.webp" alt="DRAGON ROLL" decoding="async"></div>
<script>
/* Intro logo: hanya saat start dingin (tanpa ?next). Loading baru jalan setelah intro selesai (window.UT_introDone). */
(function(){
  var DUR=2400, intro=document.getElementById('intro'), done;
  window.UT_introDone=new Promise(function(r){done=r;});
  var hasNext=!!new URLSearchParams(location.search).get('next'), booted=false;
  try{ booted=sessionStorage.getItem('ut:booted')==='1'; }catch(e){}
  /* Naga selalu tampil di awal sesi baru, walau game dibuka lewat halaman lain (boot-guard mengalihkan ke sini dengan ?next).
     Hanya bila sesi sudah berjalan (sudah lewat splash) dan dialihkan lagi -> layar hitam polos tanpa bar. */
  if(hasNext && booted){
    intro.remove(); document.documentElement.classList.add('quick');
    done(); return;
  }
  intro.classList.add('on'); document.documentElement.classList.add('introfade');
  var a; try{ a=new Audio('assets/sfx/dragon/naga-bumper.mp3'); a.preload='auto'; a.volume=1; }catch(e){}
  var played=false;
  function play(){ if(played||!a) return; var p; try{ p=a.play(); }catch(e){ return; } played=true; if(p&&p.catch) p.catch(function(){ played=false; }); }
  play(); /* bila autoplay diblokir browser, ulang di sentuhan pertama */
  ['pointerdown','keydown','touchstart'].forEach(function(ev){ addEventListener(ev,play,{once:true,passive:true}); });
  setTimeout(function(){ intro.classList.add('off'); setTimeout(function(){ intro.remove(); done(); },450); },DUR);
})();
</script>

<script>
/* Gerbang login (dipanggil setelah loading selesai) */
window.UT_afterLoad = function (go) {
  const lab = document.getElementById('label'), btn = document.getElementById('loginBtn');
  const ready = new Promise(res => { if (window.UT && UT.Auth) return res(true); addEventListener('ut:auth-module-ready', () => res(true), { once: true }); setTimeout(() => res(false), 8000); });
  lab.textContent = 'Memeriksa akun';
  ready.then(ok => ok ? UT.Auth.check() : null).then(user => {
    if (user) { lab.textContent = 'Halo, ' + String(user.username); go(); return; }
    lab.textContent = 'Siap!'; document.body.classList.add('login-ready'); btn.classList.add('show'); btn.focus();
    btn.onclick = () => openAuth(go);
  });
};
function openAuth(go) {
  const $ = id => document.getElementById(id), ov = $('authOv'), f = $('authForm'), err = $('authErr'), goB = $('authGo');
  let mode = 'reg';
  function setMode(m) {
    mode = m; err.textContent = '';
    $('tabReg').setAttribute('aria-selected', String(m === 'reg')); $('tabLog').setAttribute('aria-selected', String(m === 'log'));
    $('authSub').textContent = m === 'reg' ? 'Buat akun untuk mulai bermain' : 'Masuk dengan akun kamu';
    goB.textContent = m === 'reg' ? 'DAFTAR' : 'MASUK';
    $('auPass').autocomplete = m === 'reg' ? 'new-password' : 'current-password';
    $('auUserHint').style.display = m === 'reg' ? '' : 'none';
    $('authSw').innerHTML = m === 'reg' ? 'Sudah punya akun? <button type="button" id="swBtn">Masuk</button>' : 'Belum punya akun? <button type="button" id="swBtn">Daftar</button>';
    $('swBtn').onclick = () => setMode(m === 'reg' ? 'log' : 'reg');
  }
  $('tabReg').onclick = () => setMode('reg'); $('tabLog').onclick = () => setMode('log');
  const eye = $('pwEye'), pw = $('auPass');
  eye.onclick = () => { const show = pw.type === 'password'; pw.type = show ? 'text' : 'password'; eye.classList.toggle('on', show); eye.setAttribute('aria-pressed', String(show)); eye.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password'); pw.focus(); };
  setMode('reg'); ov.classList.add('show'); setTimeout(() => $('auUser').focus(), 50);
  f.onsubmit = async e => {
    e.preventDefault(); err.textContent = ''; goB.disabled = true; const t = goB.textContent; goB.textContent = 'TUNGGU...';
    try {
      if (!(window.UT && UT.Auth)) throw new Error('Modul akun belum siap. Muat ulang halaman.');
      const u = $('auUser').value, p = $('auPass').value;
      const user = mode === 'reg' ? await UT.Auth.signUp(u, p) : await UT.Auth.signIn(u, p);
      ov.classList.remove('show'); document.getElementById('label').textContent = 'Halo, ' + String(user.username); go();
    } catch (e2) { err.textContent = e2.message || 'Gagal. Coba lagi.'; goB.disabled = false; goB.textContent = t; }
  };
}

    'assets/js/vendor/three.min.js',
    'https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap'
  ];
  /* tujuan: halaman yang sedang dibuka (guard) atau lobby; hanya file .html lokal yang diizinkan */
  const nx = new URLSearchParams(location.search).get('next') || 'lobby.html';
  const dest = /^[a-z0-9_-]+\.html(\?[^#]*)?$/i.test(nx) && !/^(splash|loading)\.html/i.test(nx) ? nx : 'lobby.html';
  ASSETS.unshift(dest.split('?')[0]);
  try { window.PlayerData && PlayerData.snapshot(); } catch (e) {} /* jalankan migrasi/muat state sekali sebelum halaman tampil */
  (window.UT_introDone||Promise.resolve()).then(() => UT_Preload.runAuto(ASSETS, (p, kind) => { out.textContent = p + '%'; fill.style.width = p + '%'; if (p < 100 && lab && LABELS[kind]) lab.textContent = LABELS[kind]; else if (lab && p >= 100) lab.textContent = 'Siap!'; }).then(() => {
    const go = () => {

  }));
})();
